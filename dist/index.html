se fire protection after Lake Mariner?\" Lake Mariner is live commissioning now (CB-3 delivered in July, later buildings energizing into early 2027)."},"hook":"A question, not a verdict — and it opens the door to 'factory or site?'","source":"Why Fluidstack › The Lake Mariner fire — know it, don't lead with it.","par":75,"confirmInEdition":false},{"id":"A4-scn-03","topicId":"A4","type":"scenario","prompt":"During construction-phase testing a permanent system has to come out of service for the day. What has to be in place before you start?","interviewerPhrasing":"You're taking the riser out of service for a test while the building is still under construction. What do you set up first?","answer":{"beats":["Prior level signed off and the AHJ notified","Central station on test","Impairment logged","Fire watch in place if the system goes out of service","Return to normal at the end — every isolation reversed and verified"],"requiresNumber":false,"codeRef":null,"explanation":"Prerequisites: prior level signed off, AHJ notified, central station on test, impairment logged, fire watch in place if the system goes out of service — and the script ends with every isolation reversed and verified."},"hook":"Signed, notified, on test, logged, watched — then put it all back.","source":"Data center commissioning language › Script development — what a good fire FPT script contains.","par":75,"confirmInEdition":false},{"id":"A5-num-01","topicId":"A5","type":"number","prompt":"Fire alarm secondary power: ___ h standby plus ___ min alarm (___ min for in-building voice evacuation), with the ___ % margin most manufacturers and AHJs require. Standard?","answer":{"fields":[{"label":"standby, h","value":24},{"label":"alarm, min","value":5},{"label":"in-building voice, min","value":15},{"label":"margin, %","value":20}],"codeRef":"NFPA 72","codeRefAliases":["72","NFPA72","nfpa 72"],"explanation":"NFPA 72: 24 h standby plus 5 min alarm (15 min for in-building voice evacuation); Ah = [I_standby × 24 h + I_alarm × 5/60 h] × 1.2 for the 20% margin most manufacturers and AHJs require."},"hook":"24 and 5 — 15 if it talks — then times 1.2.","source":"Fire alarm › Secondary power","par":30,"confirmInEdition":false},{"id":"A5-num-02","topicId":"A5","type":"number","prompt":"NAC voltage drop: start from end-of-life ___ V, which is ___ % of 24 V; the far device stays above ___ V. Copper Ω per 1,000 ft: 18 AWG ___, 12 AWG ___. Which table?","interviewerPhrasing":"Walk me through how you'd check a NAC circuit's voltage drop.","answer":{"fields":[{"label":"end-of-life battery, V","value":20.4,"tolerance":0.05},{"label":"…as % of 24 V","value":85},{"label":"far device minimum, V","value":16},{"label":"18 AWG, Ω per 1,000 ft","value":7.77,"tolerance":0.01},{"label":"12 AWG, Ω per 1,000 ft","value":1.93,"tolerance":0.01}],"codeRef":"NEC Chapter 9 Table 8","codeRefAliases":["NEC Ch 9 Table 8","Chapter 9 Table 8","Table 8","NEC Table 8","NEC Ch. 9 Table 8"],"explanation":"Start from end-of-life battery voltage (20.4 V = 85% of 24 V); the far device must stay above its listed minimum (16 V for most regulated-24 devices). V_drop = I × 2L × R_1000 / 1000. Copper, solid (NEC Ch. 9 Table 8): 18 AWG 7.77 · 16 AWG 4.89 · 14 AWG 3.07 · 12 AWG 1.93 Ω per 1,000 ft."},"hook":"20.4 in, 16 out, and 7.77 ohms a thousand feet of 18 gauge — two lengths, not one.","source":"Fire alarm › NAC voltage drop","par":40,"confirmInEdition":false},{"id":"A5-scn-01","topicId":"A5","type":"scenario","prompt":"The far strobe on a NAC is flickering at alarm. Walk through the voltage-drop check you'd do before blaming the device.","interviewerPhrasing":"How would you size or check a notification circuit?","answer":{"beats":["Start from end-of-life battery voltage: 20.4 V, 85% of 24 V","V_drop = I × 2L × R_1000 / 1000 — the current, both conductors' length, the wire's Ω per 1,000 ft","The far device must stay above its listed minimum, 16 V for most regulated-24 devices","Ω per 1,000 ft from NEC Ch. 9 Table 8: 18 AWG 7.77 · 16 AWG 4.89 · 14 AWG 3.07 · 12 AWG 1.93"],"requiresNumber":true,"codeRef":null,"explanation":"Start from end-of-life battery voltage (20.4 V = 85% of 24 V); V_drop = I × 2L × R_1000 / 1000; the far device must stay above its listed minimum (16 V for most regulated-24 devices); copper Ω per 1,000 ft from NEC Ch. 9 Table 8."},"hook":"Dead battery, both legs of wire, sixteen volts at the end — that's the whole check.","source":"Fire alarm › NAC voltage drop","par":90,"confirmInEdition":false},{"id":"I1-num-01","topicId":"I1","type":"number","prompt":"The intro's numbers: years in the work, NICET level, and how many seconds the intro runs.","interviewerPhrasing":"How long have you been doing this?","answer":{"fields":[{"label":"years","value":18},{"label":"NICET level (as a number)","value":4},{"label":"intro length, seconds","value":60}],"codeRef":null,"explanation":"PE, NICET IV fire alarm, 18 years from design through programming, installation and commissioning — the 60-second intro is the first answer you rehearse."},"hook":"18 years · NICET IV · 60 seconds.","source":"Your 60-second intro","par":20,"confirmInEdition":false},{"id":"I1-num-02","topicId":"I1","type":"number","prompt":"The one page beside the camera on interview day: how many impact numbers (low and high), how many story titles, how many questions.","answer":{"fields":[{"label":"impact numbers, at least","value":3},{"label":"impact numbers, at most","value":5},{"label":"story titles","value":5},{"label":"questions","value":4}],"codeRef":null,"explanation":"One page beside the camera: three to five impact numbers, five story titles, four questions. First answer rehearsed: your 60-second intro."},"hook":"3-to-5 numbers · 5 stories · 4 questions — one page, beside the camera.","source":"Day-of checklist","par":25,"confirmInEdition":false},{"id":"I1-ord-01","topicId":"I1","type":"order","prompt":"The 60-second intro — put its five moves in the order you say them.","answer":{"steps":["Who: fire protection engineer — PE, NICET IV fire alarm — 18 years taking systems from design through programming, installation and commissioning","The range: high-rises, campuses, labs, clean agent, BESS, ASRS, hangars, cold storage","Today: Everon's national technical team — performance-based design, PE-level review, liaison for the AI design tool","Software that takes the hours out of design and estimating — [one number]","Why here: reliability is the product, at a scale where it matters. That's why I'm here."],"codeRef":null,"explanation":"Who (PE, NICET IV, 18 years) → the range → what I do today at Everon → the software line with one number → why here: reliability is the product, at a scale where it matters."},"hook":"Who · where · today · one number · why here — 60 seconds, then stop.","source":"Your 60-second intro","par":45,"confirmInEdition":false},{"id":"I1-def-01","topicId":"I1","type":"defect","prompt":"One line in this intro breaks a rule of the playbook. Tap it.","answer":{"lines":["1. I'm a fire protection engineer — PE, NICET IV fire alarm — with 18 years taking fire alarm and special hazard systems from design through programming, installation and commissioning.","2. High-rises, campuses, labs, clean agent, BESS, ASRS, hangars, cold storage.","3. Today I'm on Everon's national technical team doing performance-based design and PE-level review, and I'm the liaison for our AI design tool.","4. I build software that takes the hours out of design and estimating.","5. I'll be honest: the R&D fire protection role is the one I really want, so I'm hoping this is a path there.","6. I want to do this where reliability is the product, at a scale where it matters.","7. That's why I'm here."],"defectIndex":4,"codeRef":null,"explanation":"Line 5 — win this role first; mention R&D once, at the close, in one line. Mid-process, anything more reads as hedging."},"hook":"R&D gets one line, at the close — never in the intro.","source":"Read this first › Win this role first; mention R&D once, at the close.","par":40,"confirmInEdition":false},{"id":"I1-scn-01","topicId":"I1","type":"scenario","prompt":"Give the 60-second intro out loud: who you are, the range, what you do today, the software line, why you're here.","interviewerPhrasing":"Tell me about yourself — the short version.","answer":{"beats":["Fire protection engineer — PE, NICET IV fire alarm — 18 years from design through programming, installation and commissioning","The range: high-rises, campuses, labs, clean agent, BESS, ASRS, hangars, cold storage","Today: Everon's national technical team — performance-based design, PE-level review, liaison for the AI design tool","Software that takes the hours out of design and estimating, with one number","Why here: reliability is the product, at a scale where it matters"],"requiresNumber":true,"codeRef":null,"explanation":"PE, NICET IV, 18 years design → programming → installation → commissioning; Everon's national technical team and the AI design tool liaison; software with one number; reliability is the product, at a scale where it matters. That's why I'm here."},"hook":"18 years, one number, 60 seconds — and \"That's why I'm here.\"","source":"Your 60-second intro","par":60,"confirmInEdition":false},{"id":"I1-scn-02","topicId":"I1","type":"scenario","prompt":"Interview morning. Run the day-of checklist from memory.","answer":{"beats":["Google Meet, camera and audio tested from the room you'll use","One page beside the camera: three to five impact numbers, five story titles, four questions","Glass of water; phone silenced; notifications off","First answer rehearsed: your 60-second intro","Close with your strongest question and a one-line restatement of why you fit"],"requiresNumber":true,"codeRef":null,"explanation":"Meet tested from the room; one page beside the camera (3–5 numbers, 5 story titles, 4 questions); water, phone silenced, notifications off; first answer rehearsed (the 60-second intro); close with your strongest question and a one-line restatement of why you fit."},"hook":"Camera · one page · water · intro · close strong — five lines, then go.","source":"Day-of checklist","par":60,"confirmInEdition":false},{"id":"I1-sty-01","topicId":"I1","type":"story","prompt":"The 60-second intro. Say it in 45–60 seconds: who you are, what you do today, why you're here.","interviewerPhrasing":"Give me the 60-second version of who you are.","answer":{"script":"\"I'm a fire protection engineer — PE, NICET IV fire alarm — with 18 years taking fire alarm and special hazard systems from design through programming, installation and commissioning: high-rises, campuses, labs, clean agent, BESS, ASRS, hangars, cold storage. Today I'm on Everon's national technical team doing performance-based design and PE-level review, and I'm the liaison for our AI design tool. I build software that takes the hours out of design and estimating — [one number]. I want to do this where reliability is the product, at a scale where it matters. That's why I'm here.\"","beats":[{"label":"Hook: PE, NICET IV, 18 years","kind":"hook","quote":"I'm a fire protection engineer — PE, NICET IV fire alarm — with 18 years taking fire alarm and special hazard systems from design through programming, installation and commissioning"},{"label":"The range: high-rises to cold storage","kind":"beat","quote":"high-rises, campuses, labs, clean agent, BESS, ASRS, hangars, cold storage"},{"label":"Today: Everon's national technical team, AI design tool liaison","kind":"beat","quote":"Today I'm on Everon's national technical team doing performance-based design and PE-level review, and I'm the liaison for our AI design tool."},{"label":"One number for the software line","kind":"number","fillIn":true},{"label":"Lesson: reliability is the product, at a scale where it matters","kind":"lesson","quote":"I want to do this where reliability is the product, at a scale where it matters. That's why I'm here."}],"timing":{"min":45,"max":60,"limit":75},"codeRef":null,"explanation":"PE, NICET IV, 18 years from design through programming, installation and commissioning; today Everon's national technical team and the AI design tool liaison; software that takes the hours out of design and estimating [one number]; here because reliability is the product, at a scale where it matters."},"hook":"18 years · PE · NICET IV · one number · 60 seconds — then \"That's why I'm here.\"","source":"Your 60-second intro","par":60,"confirmInEdition":false},{"id":"I2-def-01","topicId":"I2","type":"defect","prompt":"One line in this \"why Fluidstack\" answer cites something you shouldn't. Tap it.","answer":{"lines":["1. You build capacity in months and run what you build.","2. I've spent 18 years in that loop on fire systems — design, program, commission, then take the call when it misbehaves.","3. You're productizing the data center — modules built in a factory — which moves fire protection commissioning left: L1 scripts at the factory, so the site tests interfaces.","4. Your 1 GW campus in France is exactly the scale of build I want to commission.","5. I use frontier models every night to build fire protection tools, including a panel-capture app that checks devices off the points list during testing.","6. Fluidstack builds the infrastructure those models run on. I want to help make it reliable."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — the France 1 GW project was dropped in Mar 2026; don't cite it as current. The live sites are Lake Mariner (NY), Barber Lake and Cameron County (TX) and River Bend (LA)."},"hook":"France is gone since March — the gigawatts you cite are in Texas.","source":"Why Fluidstack › Facts to know cold › Dropped","par":40,"confirmInEdition":false},{"id":"I2-def-02","topicId":"I2","type":"defect","prompt":"One line of this research summary is wrong. Tap it.","answer":{"lines":["1. You build capacity in months and run what you build — I want to work where that loop is the whole business.","2. Founded at Oxford in 2017, and you moved the global headquarters to Austin last year, so the center of gravity is in Texas now.","3. Factory modules with robotic welding, and islanded power from engines, turbines, fuel cells, solar and BESS.","4. That's why gas detection, engine and turbine enclosure suppression and NFPA 855 all matter on your sites.","5. Productizing the data center moves fire protection commissioning left: L1 scripts at the factory, so the site tests interfaces.","6. I build fire protection tools with frontier models; you build the infrastructure those models run on. I want to help make it reliable."],"defectIndex":1,"codeRef":null,"explanation":"Line 2 — HQ moved to New York in Dec 2025 (founded at Oxford in 2017). CEO Gary Wu; co-founder and President César Maklary; co-founder Jamie Cox."},"hook":"Oxford 2017 → New York Dec 2025. Gary Wu is CEO.","source":"Why Fluidstack › Facts to know cold › Company","par":40,"confirmInEdition":false},{"id":"I2-num-01","topicId":"I2","type":"number","prompt":"Why Fluidstack: how many seconds, how many beats, and how many years you've spent in \"that loop\".","answer":{"fields":[{"label":"seconds","value":45},{"label":"beats","value":3},{"label":"years in the loop","value":18}],"codeRef":null,"explanation":"Say it in 45 seconds, in three beats — the loop (18 years: design, program, commission, take the call), the factory-built problem, the AI tools."},"hook":"45 seconds · 3 beats · 18 years.","source":"Why Fluidstack › Say it in 45 seconds","par":20,"confirmInEdition":false},{"id":"I2-scn-01","topicId":"I2","type":"scenario","prompt":"Why Fluidstack? Three beats, under 45 seconds.","interviewerPhrasing":"So — why Fluidstack?","answer":{"beats":["The loop: you build capacity in months and run what you build — 18 years in that loop on fire systems: design, program, commission, then take the call when it misbehaves","Productizing the data center moves fire protection commissioning left: L1 scripts at the factory, so the site tests interfaces instead of re-testing every device","I build fire protection tools with frontier models every night (a panel-capture app that checks devices off the points list); Fluidstack builds the infrastructure those models run on — I want to help make it reliable"],"requiresNumber":true,"codeRef":null,"explanation":"The loop you've always worked in (18 years), the fire protection problem their factory-built model creates (commissioning moves left to L1 at the factory), and the AI tools you build on the kind of infrastructure they deliver."},"hook":"Months to build, 18 years in the loop, L1 at the factory, models every night.","source":"Why Fluidstack › Say it in 45 seconds","par":60,"confirmInEdition":false},{"id":"I2-scn-02","topicId":"I2","type":"scenario","prompt":"Sell the bridge, not the switch: why a design engineer belongs in their commissioning seat.","interviewerPhrasing":"You're a design engineer today. Why move into commissioning?","answer":{"beats":["Sell the bridge, not the switch: their Extreme Ownership value is carrying a system from design intent through installation, commissioning and operation","You design it, program it and commission it — say that, with examples","Bring the playbooks up inside the answer: job walk → design → install → pre-test → commissioning","Go all-in on the Cx role — no hedging toward the FPE roles mid-process"],"requiresNumber":false,"codeRef":null,"explanation":"Sell the bridge, not the switch: you design it, program it and commission it — their Extreme Ownership value describes carrying a system from design intent through installation, commissioning and operation. Playbooks go inside the answers; go all-in on the Cx role."},"hook":"Bridge, not switch: design it, program it, commission it — with examples.","source":"Read this first › Win this role first; mention R&D once, at the close.","par":60,"confirmInEdition":false},{"id":"I2-sty-01","topicId":"I2","type":"story","prompt":"Why Fluidstack — say it in 45 seconds, three beats: the loop, the factory-built problem, the AI tools.","interviewerPhrasing":"Why Fluidstack?","answer":{"script":"\"You build capacity in months and run what you build. I've spent 18 years in that loop on fire systems — design, program, commission, then take the call when it misbehaves. I want to work where that loop is the whole business.\"\n\n\"You're productizing the data center — modules built in a factory. That moves fire protection commissioning left: L1 scripts at the factory, so the site tests interfaces instead of re-testing every device. That's a problem I want to solve.\"\n\n\"I use frontier models every night to build fire protection tools — including a panel-capture app that checks devices off the points list during testing. Fluidstack builds the infrastructure those models run on. I want to help make it reliable.\"","beats":[{"label":"Beat 1 · The loop you've always worked in (18 years)","kind":"hook","quote":"You build capacity in months and run what you build. I've spent 18 years in that loop on fire systems — design, program, commission, then take the call when it misbehaves."},{"label":"Beat 2 · Their factory-built model moves commissioning left","kind":"decision","quote":"That moves fire protection commissioning left: L1 scripts at the factory, so the site tests interfaces instead of re-testing every device."},{"label":"Beat 3 · The AI tools you build on their kind of infrastructure","kind":"lesson","quote":"Fluidstack builds the infrastructure those models run on. I want to help make it reliable."}],"timing":{"min":30,"max":45,"limit":60},"codeRef":null,"explanation":"Three beats: the loop you've always worked in (18 years: design, program, commission, take the call); their factory-built model moves commissioning left (L1 scripts at the factory, the site tests interfaces); the AI tools you build run on the infrastructure they deliver."},"hook":"Loop · factory · frontier models — three beats, 45 seconds, 18 years in the first one.","source":"Why Fluidstack › Say it in 45 seconds","par":45,"confirmInEdition":false},{"id":"I3-num-01","topicId":"I3","type":"number","prompt":"Story 1 setup numbers: towers, nodes, devices (about), crew.","interviewerPhrasing":"How big was the Hawaii job?","answer":{"fields":[{"label":"towers","value":3},{"label":"nodes","value":16},{"label":"devices (about)","value":1500},{"label":"crew","value":12}],"codeRef":null,"explanation":"3 towers · 16 nodes · about 1,500 devices · a crew of 12 — the setup numbers come first in the story."},"hook":"3 towers · 16 nodes · 1,500 devices · 12 people.","source":"Story 1 — Three occupied towers, one cutover › Number spine","par":25,"confirmInEdition":false},{"id":"I3-num-02","topicId":"I3","type":"number","prompt":"Story 1 action numbers: floors per tower (low and high), months before cutover you built the panels, critical parts caught, hours impaired (under).","answer":{"fields":[{"label":"floors per tower, low","value":15},{"label":"floors per tower, high","value":16},{"label":"months before cutover","value":1},{"label":"critical parts caught","value":4},{"label":"hours impaired, under","value":8}],"codeRef":null,"explanation":"Fifteen to sixteen floors a tower; a month before cutover I built every panel on site and caught four critical parts; impaired for under eight hours, shutdown to waterflow back in service."},"hook":"The action numbers count up: 1 month · 4 parts · under 8 hours.","source":"Story 1 — Three occupied towers, one cutover › Number spine","par":30,"confirmInEdition":false},{"id":"I3-ord-01","topicId":"I3","type":"order","prompt":"Story 1 — put the five beats to memorize in the order you tell them.","interviewerPhrasing":"Tell me about a project you owned start to finish.","answer":{"steps":["Hook: three occupied towers lose their fire alarm for a few hours; my job is to make that short and safe · 16 nodes · ~1,500 devices · crew of 12 · I own it end to end","Built every panel on site a month early → 4 missing critical parts caught in time to ship","Fiber never jumpered, no redlines → light source, panel by panel, every run labeled","Defined roles · bar for going home set before we started: proven, not sampled","Result: under 8 hours impaired, fire watch throughout → \"ownership starts a month before the outage\""],"codeRef":null,"explanation":"Hook and setup numbers → panels built a month early (4 parts) → the fiber gap owned → roles and the bar for going home → under 8 hours, fire watch, then the lesson."},"hook":"Setup numbers first; then the action numbers count up 1, 4, 8 — the 8 opens, lands and closes it.","source":"Story 1 — Three occupied towers, one cutover › Beats to memorize","par":50,"confirmInEdition":false},{"id":"I3-def-01","topicId":"I3","type":"defect","prompt":"One line of this telling of Story 1 breaks a rule. Tap it.","answer":{"lines":["1. Three occupied high-rise towers had to lose their fire alarm for a few hours; my job was to make that window short and safe.","2. Sixteen nodes and about fifteen hundred devices; I own it end to end and I'm leading a crew of twelve.","3. A month before cutover I flew out and built every panel on site.","4. The warehouse dropped the ball on four critical parts — not my miss, but I had to clean it up.","5. The fiber runs were never jumpered and had no redlines, so a coworker and I went panel by panel with a light source.","6. I gave the twelve defined roles and set the bar for going home before we started: proven, not sampled.","7. Three occupied towers were impaired for under eight hours, with fire watch the whole time.","8. The lesson I keep: ownership starts a month before the outage."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — keep out any blame on the warehouse or the fiber contractor. State what was missing and what you did: building the panels early caught four parts, early enough to ship them to the island."},"hook":"No blame on the warehouse — just the 4 parts and the month that found them.","source":"Story 1 — Three occupied towers, one cutover › Keep out","par":40,"confirmInEdition":false},{"id":"I3-def-02","topicId":"I3","type":"defect","prompt":"One line of this telling of Story 1 says something you can't say yet. Tap it.","answer":{"lines":["1. Three occupied high-rise towers had to lose their fire alarm for a few hours, and my job was to make that window as short and as safe as possible.","2. Sixteen nodes and about fifteen hundred devices; I own it end to end and I'm leading a crew of twelve.","3. A month before cutover I flew out and built every panel on site, which caught four critical parts the warehouse had missed.","4. For cutover I gave the twelve defined roles and set the bar for going home before we started: proven, not sampled.","5. Three occupied towers were impaired for under eight hours, shutdown to waterflow back in service, with fire watch the whole time.","6. We cut over on schedule, every device tested, zero punch items open, and the whole crew flew home the next day.","7. The lesson I keep: ownership starts a month before the outage. That's where you buy the eight-hour window."],"defectIndex":5,"codeRef":null,"explanation":"Line 6 — the result line is still bracketed: [Result after Oct 30: we cut over on ___, ___ devices tested, ___ punch items open, most of the crew home on ___.] Don't say a bracketed line until it's filled; say \"about\" rather than invent."},"hook":"The result line is still in brackets — fill it after Oct 30, don't invent it.","source":"How to deliver them","par":40,"confirmInEdition":false},{"id":"I3-scn-01","topicId":"I3","type":"scenario","prompt":"Story 1 follow-up: what would you do differently? 15 seconds.","interviewerPhrasing":"What would you do differently?","answer":{"beats":["The radios — I ordered them late","A coworker suggested a push-to-talk phone app","I bought licenses; the client let us on the site Wi-Fi","It cost less than radios would have",{"label":"What you do now (e.g. comms goes on the mobilization list with the same lead time as materials)","fillIn":true}],"requiresNumber":false,"codeRef":null,"explanation":"The radios: I ordered them late. A coworker suggested a push-to-talk phone app; I bought licenses, the client let us on site Wi-Fi, and it cost less than radios. [Confirm what you do now.]"},"hook":"Late radios → push-to-talk app on site Wi-Fi, cheaper than radios.","source":"Story 1 — Three occupied towers, one cutover › Follow-ups, 15 seconds each","par":30,"confirmInEdition":false},{"id":"I3-scn-02","topicId":"I3","type":"scenario","prompt":"Story 1 follow-up: why build the panels a month out? 15 seconds.","interviewerPhrasing":"Why build the panels a month out?","answer":{"beats":["On an island, a shortage found at cutover is a slipped date","A month gave shipping time","And it found four"],"requiresNumber":true,"codeRef":null,"explanation":"On an island, a shortage found at cutover is a slipped date. A month gave shipping time, and it found four."},"hook":"Island + shortage = slipped date; a month bought shipping and found 4.","source":"Story 1 — Three occupied towers, one cutover › Follow-ups, 15 seconds each","par":30,"confirmInEdition":false},{"id":"I3-sty-01","topicId":"I3","type":"story","prompt":"Story 1 — three occupied towers, one cutover. Tell it in 90–120 s: hook, decisions with reasons, the number, the lesson.","interviewerPhrasing":"Tell me about something you owned end to end, including what went wrong.","answer":{"script":"Three occupied high-rise towers had to lose their fire alarm for a few hours, and my job was to make that window as short and as safe as possible. It's a campus in Hawaii I'm finishing right now, fifteen to sixteen floors a tower. We're replacing the legacy fire alarm, bringing it to code and moving it onto a new fiber backbone, sixteen nodes and about fifteen hundred devices. I own it end to end, from the job walk and design through programming, and I'm leading a crew of twelve through cutover and testing.\n\nTwo things could have sunk it before we started. A month before cutover I flew out and built every panel on site. That caught four parts critical to the install that the warehouse had missed, early enough to get them shipped to the island. Then the fiber: the contractor pulled the runs but never jumpered the cassettes and left no redlines. Nobody owned that gap, so I did. A coworker and I went panel by panel with a light source, found every missing jumper and labeled every run end to end.\n\nFor cutover I gave the twelve defined roles and a schedule, and I set the bar for sending the crew home before we started: every waterflow and tamper, elevator recall and shunt trip, audibility, the sequence for every device type on every floor, and all manual paging. Proven, not sampled.\n\nThe result: three occupied towers were impaired for under eight hours, shutdown to waterflow back in service, with fire watch the whole time.\n\n[Result after Oct 30: we cut over on ___, ___ devices tested, ___ punch items open, most of the crew home on ___.]\n\nThe lesson I keep: ownership starts a month before the outage. That's where you buy the eight-hour window.","beats":[{"label":"Hook","kind":"hook","quote":"Three occupied high-rise towers had to lose their fire alarm for a few hours, and my job was to make that window as short and as safe as possible."},{"label":"Decision with reason","kind":"decision","quote":"A month before cutover I flew out and built every panel on site. That caught four parts critical to the install that the warehouse had missed, early enough to get them shipped to the island."},{"label":"A number","kind":"number","quote":"The result: three occupied towers were impaired for under eight hours, shutdown to waterflow back in service, with fire watch the whole time."},{"label":"Result line (after Oct 30)","kind":"number","fillIn":true},{"label":"Lesson","kind":"lesson","quote":"The lesson I keep: ownership starts a month before the outage. That's where you buy the eight-hour window."}],"codeRef":null,"explanation":"Hook: three occupied towers lose their fire alarm for a few hours → built every panel on site a month early, 4 missing parts caught → under 8 hours impaired, fire watch throughout → ownership starts a month before the outage."},"hook":"3 towers · 16 nodes · 1,500 devices · 12 people, then 1 month · 4 parts · under 8 hours.","source":"Story 1 — Three occupied towers, one cutover","par":120,"confirmInEdition":false},{"id":"I4-ord-01","topicId":"I4","type":"order","prompt":"Story 2 — put the five beats to memorize in the order you tell them.","answer":{"steps":["8 COLOs · 20 VESDAs · no drawings — waiting wasn't an option","Pulled data first: all 20 at factory defaults","Counted holes, paced runs → only 4 pipe variations → 4 designs, not 20 (80% less)","Thresholds, airflow, transport time on every pipe; damaged pipe found and fixed","Cause and effect caught a wrong-COLO release → \"every inherited system is unverified\""],"codeRef":null,"explanation":"No drawings → pulled the data first → counted holes and paced runs (4 designs, not 20) → thresholds, airflow, transport time → cause and effect caught the wrong-COLO release, and the lesson."},"hook":"Data first, then walk it: 20 → 4, then the valve that would have stayed dry.","source":"Story 2 — A data center with no drawings › Beats to memorize","par":50,"confirmInEdition":false},{"id":"I4-def-01","topicId":"I4","type":"defect","prompt":"One line of this telling of Story 2 breaks a rule. Tap it.","answer":{"lines":["1. A colocation data center: eight COLOs, three to four hundred thousand square feet, twenty VESDA units, and no drawings.","2. I pulled the configuration from all twenty detectors, and every one was still at factory defaults.","3. I counted every sampling hole and paced every pipe run; the networks came in four variations, so I modeled four instead of twenty.","4. Cause-and-effect testing found a pre-action release tripping the wrong COLO's valve; the releases for two COLOs were swapped.","5. The previous contractor had programmed the releases backwards — that's the kind of sloppiness I was cleaning up.","6. I verified the release relay for every system and corrected the programming to the sequence of operations.","7. Since then I treat every inherited system as unverified until I've tested cause and effect against the sequence, not just the devices."],"defectIndex":4,"codeRef":null,"explanation":"Line 5 — keep out who programmed the release wrong. End on what you changed, not on who missed it: \"Since then I treat every inherited system as unverified.\""},"hook":"Nobody gets named for the swapped releases — the story ends on what you changed.","source":"Story 2 — A data center with no drawings › Keep out","par":40,"confirmInEdition":false},{"id":"I4-num-01","topicId":"I4","type":"number","prompt":"Story 2 numbers: COLOs, VESDA units, pipe-network variations, percent less design work, weeks for the whole job.","interviewerPhrasing":"How big was that job, and how long did it take?","answer":{"fields":[{"label":"COLOs","value":8},{"label":"VESDA units","value":20},{"label":"pipe-network variations","value":4},{"label":"less design work, %","value":80},{"label":"weeks, about","value":2}],"codeRef":null,"explanation":"Eight COLOs, twenty VESDA units, four network variations → four designs in ASPIRE instead of twenty, about eighty percent less design work; the whole job took about two weeks."},"hook":"8 COLOs · 20 VESDAs · 4 designs · 80% less · 2 weeks.","source":"Story 2 — A data center with no drawings › Beats to memorize","par":30,"confirmInEdition":false},{"id":"I4-num-02","topicId":"I4","type":"number","prompt":"Story 2 thresholds, in %/ft: factory-default Fire 1 and Fire 2, and the Fire 1 and Fire 2 you set.","interviewerPhrasing":"What thresholds did you set?","answer":{"fields":[{"label":"default Fire 1, %/ft","value":2},{"label":"default Fire 2, %/ft","value":4},{"label":"set Fire 1, %/ft","value":0.0625},{"label":"set Fire 2, %/ft","value":1}],"codeRef":null,"explanation":"Factory defaults were Fire 1 at 2 %/ft and Fire 2 at 4 %/ft; we set Fire 1 to 0.0625 %/ft and Fire 2 to 1 %/ft for very early detection."},"hook":"Defaults 2 and 4; set 0.0625 and 1 — very early warning, not spot-detector sensitivity.","source":"Story 2 — A data center with no drawings › Follow-ups, 15 seconds each","par":30,"confirmInEdition":false},{"id":"I4-scn-01","topicId":"I4","type":"scenario","prompt":"Story 2 follow-up: what thresholds did you set, and why? 15 seconds.","interviewerPhrasing":"What thresholds did you set, and why?","answer":{"beats":["Factory defaults were Fire 1 at 2 %/ft and Fire 2 at 4 %/ft — no more sensitive than a spot photoelectric detector (roughly 0.5–4 %/ft)","We set Fire 1 to 0.0625 %/ft and Fire 2 to 1 %/ft for very early detection","Tie it to the alarm philosophy: Alert and Action call Ops, Fire 1 is the building alarm, Fire 2 releases"],"requiresNumber":true,"codeRef":null,"explanation":"Defaults Fire 1 2 %/ft and Fire 2 4 %/ft (spot-detector sensitivity); set Fire 1 0.0625 %/ft and Fire 2 1 %/ft for very early detection, tied to the alarm philosophy: Alert and Action call Ops, Fire 1 is the building alarm, Fire 2 releases."},"hook":"2 and 4 are spot-detector numbers; 0.0625 and 1 are very early warning.","source":"Story 2 — A data center with no drawings › Follow-ups, 15 seconds each","par":30,"confirmInEdition":false},{"id":"I4-scn-02","topicId":"I4","type":"scenario","prompt":"Story 2 follow-up: how did you test transport time? 15 seconds.","interviewerPhrasing":"How did you test transport time?","answer":{"beats":["Smoke at the end cap of every pipe","Timed against the ASPIRE calc","and NFPA 72's 120-second limit",{"label":"Your worst measured time, if you remember it","fillIn":true}],"requiresNumber":true,"codeRef":null,"explanation":"Smoke at the end cap of every pipe, timed against the ASPIRE calc and NFPA 72's 120-second limit. [Add your worst measured time if you remember it.]"},"hook":"End cap of every pipe, against the calc and the 120-second line.","source":"Story 2 — A data center with no drawings › Follow-ups, 15 seconds each","par":30,"confirmInEdition":false},{"id":"I4-scn-03","topicId":"I4","type":"scenario","prompt":"Story 2 follow-up: how did you catch the wrong-COLO release? 15 seconds.","interviewerPhrasing":"How did you catch the wrong-COLO release?","answer":{"beats":["Running cause and effect zone by zone against the sequence of operations","Watching which valve actually operated, not just that a release output went active","It was double interlock, so that system primed but never filled — the releases for two COLOs were swapped","Keep out who programmed it wrong; end on what you changed"],"requiresNumber":false,"codeRef":null,"explanation":"Cause and effect zone by zone against the sequence of operations, watching which valve actually operated, not just that a release output went active. Keep out who programmed the release wrong — end on what you changed."},"hook":"Watch the valve, not the output light — and never name who swapped them.","source":"Story 2 — A data center with no drawings › Follow-ups, 15 seconds each","par":30,"confirmInEdition":false},{"id":"I4-sty-01","topicId":"I4","type":"story","prompt":"Story 2 — a data center with no drawings. Tell it in 90–120 s: hook, decisions with reasons, the number, the lesson.","interviewerPhrasing":"Tell me about a decision you made without complete information.","answer":{"script":"A colocation data center: eight COLOs, three to four hundred thousand square feet. We were upgrading twenty VESDA units, VLP to VESDA-E, plus the fire alarm, and there were no drawings. Waiting for as-builts that didn't exist wasn't an option.\n\nSo I started with the data. I pulled the configuration from all twenty detectors, and every one was still at factory defaults. That's not something you rely on for very early warning in a data hall. Then I walked it: counted every sampling hole and paced every pipe run. That's where the speed came from. The above-ceiling and CRAC networks only came in four variations, so I modeled four networks in ASPIRE instead of twenty, about eighty percent less design work. We set new thresholds, normalized airflow and measured transport time on every pipe. The high-flow faults turned out to be damaged pipe above the ceiling, which we repaired.\n\nCause-and-effect testing then found the thing that mattered most. A pre-action release was tripping the wrong COLO's valve. It was double interlock, so that system primed but never filled. The releases for two COLOs were swapped, so in a real fire the COLO that needed water wouldn't have gotten it. I verified the release relay for every system and corrected the programming to the sequence of operations.\n\nThe whole job took about two weeks, end to end. Twenty detectors recommissioned from four designs, and a wrong-room release found in a test instead of a fire. Since then I treat every inherited system as unverified until I've tested cause and effect against the sequence, not just the devices.","beats":[{"label":"Hook","kind":"hook","quote":"A colocation data center: eight COLOs, three to four hundred thousand square feet. We were upgrading twenty VESDA units, VLP to VESDA-E, plus the fire alarm, and there were no drawings. Waiting for as-builts that didn't exist wasn't an option."},{"label":"Decision with reason","kind":"decision","quote":"The above-ceiling and CRAC networks only came in four variations, so I modeled four networks in ASPIRE instead of twenty, about eighty percent less design work."},{"label":"A number","kind":"number","quote":"The whole job took about two weeks, end to end. Twenty detectors recommissioned from four designs, and a wrong-room release found in a test instead of a fire."},{"label":"Lesson","kind":"lesson","quote":"Since then I treat every inherited system as unverified until I've tested cause and effect against the sequence, not just the devices."}],"codeRef":null,"explanation":"Hook: 8 COLOs, 20 VESDAs, no drawings — waiting wasn't an option → pulled the data (all 20 at defaults), walked it, 4 designs not 20 (80% less) → cause and effect caught a wrong-COLO release → about two weeks → every inherited system is unverified."},"hook":"8 COLOs · 20 VESDAs · 4 designs · 80% less · 2 weeks — and the wrong COLO's valve.","source":"Story 2 — A data center with no drawings","par":120,"confirmInEdition":false},{"id":"I5-num-01","topicId":"I5","type":"number","prompt":"Story 3 numbers: flame detectors installed, roughly how many connected before the ground fault appeared, and the panel's ground-fault threshold in volts.","interviewerPhrasing":"How many detectors, and what was the panel's threshold?","answer":{"fields":[{"label":"flame detectors","value":20},{"label":"detectors connected when the fault appeared (about)","value":7},{"label":"ground-fault threshold, V","value":0.4}],"codeRef":null,"explanation":"Twenty flame detectors; once more than about seven were connected the panel threw a ground fault — around seven monitor modules added up past the panel's 0.4-volt threshold."},"hook":"20 installed, 7 connected, 0.4 volts — that's the pattern.","source":"Story 3 — Ground faults nobody could ground out › Beats to memorize","par":25,"confirmInEdition":false},{"id":"I5-num-02","topicId":"I5","type":"number","prompt":"Story 3 numbers: induced voltage per leg (low and high, V) and about how many weeks the re-pull and retest took.","answer":{"fields":[{"label":"induced per leg, low, V","value":0.5},{"label":"induced per leg, high, V","value":4},{"label":"weeks to pull and retest (about)","value":2}],"codeRef":null,"explanation":"Half a volt to four volts induced on each leg of the detector circuits; every run from the control house re-pulled, about two weeks to pull and retest."},"hook":"Half a volt to four volts per leg; two weeks to re-pull every run.","source":"Story 3 — Ground faults nobody could ground out › Beats to memorize","par":25,"confirmInEdition":false},{"id":"I5-ord-01","topicId":"I5","type":"order","prompt":"Story 3 — put the five beats to memorize in the order you tell them.","answer":{"steps":["Texas BESS · 20 flame detectors · fault appears past ~7 connected","Measured, didn't hunt: 0.5–4 V induced per leg → ~7 modules sum past 0.4 V","Shielded, untwisted: a shield blocks electric fields, twisting cancels magnetic","Client tried cheaper fixes → I proved it with twisted cable laid on the ground","Re-pull ~2 weeks, commissioned → \"check cable data sheets at submittal\""],"codeRef":null,"explanation":"Fault past ~7 detectors → measured instead of hunting (0.5–4 V, ~7 modules past 0.4 V) → shielded but untwisted → proved it with twisted cable on the ground → re-pull ~2 weeks, and the lesson."},"hook":"Symptom, measurement, physics, proof, lesson — 7 · 0.4 · 2 weeks.","source":"Story 3 — Ground faults nobody could ground out › Beats to memorize","par":50,"confirmInEdition":false},{"id":"I5-def-01","topicId":"I5","type":"defect","prompt":"One line of this telling of Story 3 breaks a rule. Tap it.","answer":{"lines":["1. A battery storage site in Texas: twenty flame detectors, and once more than about seven were connected the panel threw a ground fault on the SLC.","2. I measured instead of hunting for a nicked wire: half a volt to four volts induced on each leg.","3. Around seven monitor modules added up past the panel's 0.4-volt ground-fault threshold, so we had induction diagnosed the same day.","4. The cable was shielded but not twisted; a shield stops electric-field pickup, twisting is what cancels magnetic pickup.","5. The designer had approved that cable without ever reading the sheet, which is really where this went wrong.","6. I laid twisted replacement cable on the ground out to the detectors, and the faults cleared.","7. We re-pulled every run from the control house, about two weeks to pull and retest, and commissioned the system.","8. What changed for me: I check cable data sheets at submittal review, not at start-up."],"defectIndex":4,"codeRef":null,"explanation":"Line 5 — keep out that the designer approved the cable without reading the sheet. It's a process story, not a blame story: the cable was approved before anyone read its data sheet, so the fix is reading cable sheets at submittal."},"hook":"Process gap, not the designer — the cheapest place to catch physics is on paper.","source":"Story 3 — Ground faults nobody could ground out › Keep out","par":40,"confirmInEdition":false},{"id":"I5-scn-01","topicId":"I5","type":"scenario","prompt":"Story 3 follow-up: explain the physics. 15 seconds.","interviewerPhrasing":"Explain the physics.","answer":{"beats":["Induced voltage scales with the loop area between the two conductors","Twisting makes each half-twist's pickup cancel the next, so the net loop area goes to nearly zero","A grounded foil shield drains capacitive pickup, but magnetic flux passes right through it"],"requiresNumber":false,"codeRef":null,"explanation":"Induced voltage scales with the loop area between the two conductors; twisting makes each half-twist's pickup cancel the next. A grounded foil shield drains capacitive pickup but magnetic flux passes right through it."},"hook":"Loop area is the enemy: twist cancels it, a shield doesn't.","source":"Story 3 — Ground faults nobody could ground out › Follow-ups, 15 seconds each","par":30,"confirmInEdition":false},{"id":"I5-scn-02","topicId":"I5","type":"scenario","prompt":"Story 3 follow-up: how did you handle the client pushing back? 15 seconds.","interviewerPhrasing":"How did you handle the client pushing back?","answer":{"beats":["I let them try their options, because each was cheaper than a re-pull if it worked","When they didn't, I put the proof on the ground in front of them instead of arguing","Twisted replacement cable laid on the ground out to the detectors — the faults cleared, and the decision was easy"],"requiresNumber":false,"codeRef":null,"explanation":"I let them try their options, because each was cheaper than a re-pull if it worked. When they didn't, I put the proof on the ground in front of them instead of arguing."},"hook":"Let them try the cheap fixes, then lay the proof on the ground.","source":"Story 3 — Ground faults nobody could ground out › Follow-ups, 15 seconds each","par":30,"confirmInEdition":false},{"id":"I5-scn-03","topicId":"I5","type":"scenario","prompt":"Story 3 follow-up: who approved that cable? 15 seconds.","interviewerPhrasing":"Who approved that cable?","answer":{"beats":["Treat it as a process gap: the cable was approved before anyone read its data sheet","My fix is reading cable sheets at submittal, every job","Keep out that the designer approved it — it's a process story, not a blame story"],"requiresNumber":false,"codeRef":null,"explanation":"A process gap: the cable was approved before anyone read its data sheet. My fix is reading cable sheets at submittal, every job. Not a blame story."},"hook":"Process gap, not a person: the sheet gets read at submittal, every job.","source":"Story 3 — Ground faults nobody could ground out › Follow-ups, 15 seconds each","par":30,"confirmInEdition":false},{"id":"I5-sty-01","topicId":"I5","type":"story","prompt":"Story 3 — ground faults nobody could ground out. Tell it in 90–120 s: hook, decisions with reasons, the number, the lesson.","interviewerPhrasing":"Tell me about a time you rejected a standard approach.","answer":{"script":"A battery storage site in Texas. I'd reviewed the design and the BACnet sequence matrix, ran the crew installing twenty flame detectors, and programmed the panel and the BACnet link to the client's control house. Once more than about seven detectors were connected, the panel threw a ground fault on the SLC.\n\nThe usual move with a ground fault is to hunt for a nicked wire. I measured instead. There was half a volt to four volts induced on each leg of the detector circuits. Each monitor module passed a fraction of that onto the SLC, and around seven of them added up past the panel's 0.4-volt ground-fault threshold. That explained the seven-detector pattern, and we had induction diagnosed the same day.\n\nThe root cause was the cable. It was shielded but not twisted. A shield stops electric-field pickup; it does nothing for magnetic pickup. Twisting the pair is what cancels that. So no amount of textbook shield grounding was going to fix it.\n\nThe client understandably wanted to try everything short of a re-pull, and each attempt failed. So rather than argue, I proved it. I laid twisted replacement cable on the ground out to the detectors, and the faults cleared. That made the decision easy. We re-pulled every run from the control house, about two weeks to pull and retest, and commissioned the system.\n\nWhat changed for me: I check cable data sheets at submittal review, not at start-up. The cheapest place to catch physics is on paper.","beats":[{"label":"Hook","kind":"hook","quote":"Once more than about seven detectors were connected, the panel threw a ground fault on the SLC."},{"label":"Decision with reason","kind":"decision","quote":"The usual move with a ground fault is to hunt for a nicked wire. I measured instead."},{"label":"A number","kind":"number","quote":"There was half a volt to four volts induced on each leg of the detector circuits. Each monitor module passed a fraction of that onto the SLC, and around seven of them added up past the panel's 0.4-volt ground-fault threshold."},{"label":"Zero faults after the re-pull?","kind":"number","fillIn":true},{"label":"Lesson","kind":"lesson","quote":"What changed for me: I check cable data sheets at submittal review, not at start-up. The cheapest place to catch physics is on paper."}],"codeRef":null,"explanation":"Hook: Texas BESS, 20 flame detectors, fault past ~7 connected → measured, didn't hunt: 0.5–4 V per leg, ~7 modules sum past 0.4 V → shielded but untwisted → proved it with twisted cable on the ground → re-pull ~2 weeks → check cable data sheets at submittal."},"hook":"20 detectors · fault past 7 · 0.5–4 V per leg · 0.4 V threshold · 2 weeks to re-pull.","source":"Story 3 — Ground faults nobody could ground out","par":120,"confirmInEdition":false},{"id":"I6-ord-01","topicId":"I6","type":"order","prompt":"Story 4 — put the five beats to memorize in the order you tell them.","answer":{"steps":["7 months in · SF data center · dirty head","No test mode, didn't pull the head, canned air from under the floor","Alarm → evacuation → fire department at rush hour","Didn't reset; confirmed, silenced, met the trucks and owned it","On test first · isolation-to-return-to-normal scripts · vacuum, don't blow → \"nobody learns about your test from an evacuation\""],"codeRef":null,"explanation":"Setup → the mistake → the consequence → what I did next (owned it) → the three habits and the lesson."},"hook":"Dirty head → canned air → evacuation → owned it → three habits.","source":"Story 4 — Canned air at a data center › Beats to memorize","par":45,"confirmInEdition":false},{"id":"I6-def-01","topicId":"I6","type":"defect","prompt":"One line of this telling of Story 4 breaks a rule. Tap it.","answer":{"lines":["1. Seven months into my career, I was sent to a data center in San Francisco for a smoke detector trouble.","2. I didn't put the system on test, and I didn't pull the head. I blew it out with canned air from under the raised floor.","3. It went to alarm. The building evacuated, and the fire department came through rush-hour traffic.","4. Honestly, it was kind of funny watching the trucks roll up for a dusty head — everyone has one of these stories.","5. I didn't reset the panel to make it go away. I confirmed the alarm was mine, silenced it, and waited for the trucks to tell them myself.","6. If I'm touching a panel or a device, the system is on test first; scripts start with isolation and end with a verified return to normal; heads get vacuumed, not blown out.","7. Nobody should ever learn about your test from an evacuation."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — keep out jokes or minimizing. The calm, specific telling is what scores: tell it straight, land the lesson, stop."},"hook":"No jokes about the trucks — calm and specific is what scores.","source":"Story 4 — Canned air at a data center › Keep out","par":40,"confirmInEdition":false},{"id":"I6-def-02","topicId":"I6","type":"defect","prompt":"One line of this telling of Story 4 dodges the point. Tap it.","answer":{"lines":["1. Seven months into my career, I was sent to a San Francisco data center for a smoke detector trouble; the head was dirty.","2. The system wasn't put on test and the head didn't get pulled; it got blown out with canned air from under the raised floor.","3. It went to alarm. The building evacuated, and the fire department came through rush-hour traffic.","4. I didn't reset the panel. I confirmed the alarm was mine, silenced it, and waited for the trucks to tell them it was me and exactly what happened.","5. From that day, if I'm touching a panel or a device, the system is on test first.","6. Every script I write starts with isolation and ends with a verified return to normal.","7. And heads get vacuumed, not blown out."],"defectIndex":1,"codeRef":null,"explanation":"Line 2 — own your part first, in the first person: \"I didn't put the system on test, and I didn't pull the head. I blew it out with canned air.\" Say \"I\", not \"we\" or the passive."},"hook":"\"I didn't put it on test\" — the mistake is told in the first person.","source":"How to deliver them","par":40,"confirmInEdition":false},{"id":"I6-num-01","topicId":"I6","type":"number","prompt":"Story 4 numbers: how many months into your career, and how many habits that day set.","answer":{"fields":[{"label":"months into my career","value":7},{"label":"habits","value":3}],"codeRef":null,"explanation":"Seven months into my career; that day set three habits I still run on — on test first, isolation to a verified return to normal, and heads get vacuumed, not blown out."},"hook":"7 months in, 3 habits out.","source":"Story 4 — Canned air at a data center › Beats to memorize","par":20,"confirmInEdition":false},{"id":"I6-scn-01","topicId":"I6","type":"scenario","prompt":"Story 4 follow-up: what would you do differently in the moment? 15 seconds.","interviewerPhrasing":"What would you do differently in the moment?","answer":{"beats":["Call central station","Put the system on test with outputs disabled","Pull the head and clean it away from the base","Restore and confirm normal before leaving"],"requiresNumber":false,"codeRef":null,"explanation":"Call central station, put the system on test with outputs disabled, pull the head and clean it away from the base, then restore and confirm normal before leaving."},"hook":"Call · test · pull · clean · restore and confirm — in that order.","source":"Story 4 — Canned air at a data center › Follow-ups, 15 seconds each","par":30,"confirmInEdition":false},{"id":"I6-scn-02","topicId":"I6","type":"scenario","prompt":"\"A mistake you made.\" Own your part first, then the three habits.","interviewerPhrasing":"Tell me about a mistake you made — something you learned the hard way.","answer":{"beats":["Own your part first: seven months in, dirty head, no test mode, didn't pull the head, canned air from under the raised floor","It went to alarm: the building evacuated, the fire department came through rush-hour traffic","Didn't reset the panel; confirmed it was mine, silenced it, met the trucks and owned it","Three habits: on test first; scripts start with isolation and end with a verified return to normal; vacuum, don't blow","Nobody should ever learn about your test from an evacuation"],"requiresNumber":true,"codeRef":null,"explanation":"Own your part first. Then: didn't reset, confirmed it was mine, met the trucks; the three habits; and the lesson — nobody should ever learn about your test from an evacuation. Tell it straight and short."},"hook":"Own it first, then the three habits — no jokes, no minimizing.","source":"Values and judgment (the 65%) › 4. A mistake you made","par":90,"confirmInEdition":false},{"id":"I6-sty-01","topicId":"I6","type":"story","prompt":"Story 4 — canned air at a data center. Short on purpose: tell it straight, land the lesson, stop (about 80 s).","interviewerPhrasing":"Tell me about a mistake you made.","answer":{"script":"Seven months into my career, I was sent to a data center in San Francisco for a smoke detector trouble. The head was dirty and needed cleaning. I didn't put the system on test, and I didn't pull the head. I blew it out with canned air from under the raised floor.\n\nIt went to alarm. The building evacuated, and the fire department came through rush-hour traffic.\n\nWhat I did next is the part that mattered. I didn't reset the panel to make it go away. I confirmed the alarm was mine, silenced it, and waited for the trucks so I could tell them myself that it was me and exactly what happened.\n\nThat day set three habits I still run on. If I'm touching a panel or a device, the system is on test first. Every test script I write starts with isolation and ends with a verified return to normal, because the worst outcomes of a test are an unplanned alarm and a system left disabled. And heads get vacuumed, not blown out.\n\nIn commissioning that's the whole job: nobody should ever learn about your test from an evacuation.","beats":[{"label":"Hook","kind":"hook","quote":"Seven months into my career, I was sent to a data center in San Francisco for a smoke detector trouble."},{"label":"Decision with reason","kind":"decision","quote":"I didn't reset the panel to make it go away. I confirmed the alarm was mine, silenced it, and waited for the trucks so I could tell them myself that it was me and exactly what happened."},{"label":"A number","kind":"number","quote":"That day set three habits I still run on."},{"label":"Lesson","kind":"lesson","quote":"In commissioning that's the whole job: nobody should ever learn about your test from an evacuation."}],"timing":{"min":60,"max":100,"limit":150},"codeRef":null,"explanation":"7 months in, dirty head, no test mode, canned air from under the floor → alarm, evacuation, fire department at rush hour → didn't reset; confirmed, silenced, met the trucks and owned it → three habits: on test first, isolation-to-return-to-normal scripts, vacuum don't blow → nobody learns about your test from an evacuation."},"hook":"7 months in · one can of air · three habits for life.","source":"Story 4 — Canned air at a data center","par":100,"confirmInEdition":false},{"id":"I7-ord-01","topicId":"I7","type":"order","prompt":"Story 5 — put the five beats to memorize in the order you tell them.","answer":{"steps":["\"Turn what one expert knows into something the next person can repeat\"","4 playbooks in company use → fewer go-backs, more techs can go","Thermal detection training with the manufacturer + my own camera placement tool","Night tools: EST3→EST4 priced BOM; panel capture that checks off the points list","\"Productizing a data center is the same job\""],"codeRef":null,"explanation":"The hook line → the four playbooks and their result → training and the camera tool → the two night tools → \"productizing a data center is the same job\"."},"hook":"Repeatable · 4 playbooks · camera tool · night tools · same job.","source":"Story 5 — Turning field lessons into something others can repeat › Beats to memorize","par":45,"confirmInEdition":false},{"id":"I7-def-01","topicId":"I7","type":"defect","prompt":"One line of this telling of Story 5 breaks a rule. Tap it.","answer":{"lines":["1. The best part of this work is turning what one expert knows into something the next person can repeat.","2. That's become four playbooks my company uses: linear heat in automated storage, thermal imaging for solar sites, flame detection for battery storage, and EST panel migrations.","3. The result is far fewer go-backs, and those jobs no longer depend on a select few people.","4. At night I build fire protection software with frontier models: one tool turns an EST3 program into a priced EST4 upgrade bill of materials.","5. I'm already charging contractors for seats on it, so it's turning into a real side business.","6. Another captures panel output during testing and checks devices off the points list as they come in — commissioning automation.","7. Productizing a data center is the same job: turn expertise into something repeatable."],"defectIndex":4,"codeRef":null,"explanation":"Line 5 — keep out pricing or business details of the tools. Keep it about the work they make repeatable."},"hook":"No prices, no business — only the work the tools make repeatable.","source":"Story 5 — Turning field lessons into something others can repeat › Keep out","par":40,"confirmInEdition":false},{"id":"I7-scn-01","topicId":"I7","type":"scenario","prompt":"Name the four playbooks and what they changed.","interviewerPhrasing":"What keeps you in this field — what do you do outside work?","answer":{"beats":["Linear heat detection in automated storage (ASRS)","Thermal imaging for solar (PV) sites","Flame detection for battery storage (BESS)","EST panel migrations","Result: far fewer go-backs; those jobs no longer depend on a select few — a lot more techs can be sent",{"label":"One number: go-backs before and after, or techs qualified then and now","fillIn":true}],"requiresNumber":true,"codeRef":null,"explanation":"Four playbooks my company uses: linear heat detection in automated storage, thermal imaging for solar sites, flame detection for battery storage, and EST panel migrations. Far fewer go-backs; a lot more techs can be sent. [Number still open.]"},"hook":"ASRS linear heat · PV thermal · BESS flame · EST migrations — four, and fewer go-backs.","source":"Story 5 — Turning field lessons into something others can repeat › Beats to memorize","par":60,"confirmInEdition":false},{"id":"I7-scn-02","topicId":"I7","type":"scenario","prompt":"Story 5 follow-up: which tool matters most for this role? 15 seconds.","interviewerPhrasing":"Which tool matters most for this role?","answer":{"beats":["The panel-capture app","It records what the panel reports during testing","and marks each device off the points list, so the test record builds itself","That's commissioning automation — the same problem your team has at scale",{"label":"One number: devices per day, or hours saved per test","fillIn":true}],"requiresNumber":false,"codeRef":null,"explanation":"The panel-capture app: it records what the panel reports during testing and marks each device off the points list, so the test record builds itself. [Add one number: devices per day, or hours saved per test.]"},"hook":"Panel capture: the test record builds itself off the points list.","source":"Story 5 — Turning field lessons into something others can repeat › Follow-ups, 15 seconds each","par":30,"confirmInEdition":false},{"id":"I7-scn-03","topicId":"I7","type":"scenario","prompt":"Story 5 follow-up: how do you use AI in your work today? 15 seconds.","interviewerPhrasing":"How do you use AI in your work today?","answer":{"beats":["I build these tools with frontier models","I'm the liaison for my company's AI design tool","So I see both sides: what the model gets right and where an engineer has to check it"],"requiresNumber":false,"codeRef":null,"explanation":"I build these tools with frontier models, and I'm the liaison for my company's AI design tool, so I see both sides: what the model gets right and where an engineer has to check it."},"hook":"Builder and liaison — both sides of what the model gets right.","source":"Story 5 — Turning field lessons into something others can repeat › Follow-ups, 15 seconds each","par":30,"confirmInEdition":false},{"id":"I7-scn-04","topicId":"I7","type":"scenario","prompt":"Story 5 follow-up: won't side projects pull focus? 15 seconds.","interviewerPhrasing":"Won't side projects pull focus?","answer":{"beats":["Every tool starts as a field problem I hit on a job","The work feeds the tools, not the other way around","Nobody asked me to do any of it — a lesson that lives only in my head doesn't help the next crew"],"requiresNumber":false,"codeRef":null,"explanation":"Every tool starts as a field problem I hit on a job. The work feeds the tools, not the other way around."},"hook":"The job feeds the tools — never the reverse.","source":"Story 5 — Turning field lessons into something others can repeat › Follow-ups, 15 seconds each","par":30,"confirmInEdition":false},{"id":"I7-sty-01","topicId":"I7","type":"story","prompt":"Story 5 — turning field lessons into something others can repeat. Tell it in 90–120 s: hook, decisions with reasons, the number, the lesson.","interviewerPhrasing":"Why this work? What do you do outside work?","answer":{"script":"For me, the best part of this work is turning what one expert knows into something the next person can repeat.\n\nWhen I solve something hard in the field, I write it down so the next crew doesn't have to solve it again. That's become four playbooks my company uses: linear heat detection in automated storage, thermal imaging for solar sites, flame detection for battery storage, and EST panel migrations. The result is far fewer go-backs, and those jobs no longer depend on a select few people. We can send a lot more techs. [Number: go-backs before and after, or techs qualified then and now.]\n\nIt goes past the playbooks. I work with a UL-listed thermal detection manufacturer on their training programs, and I built my own camera placement tool around lens angle, obstructions and commodity type.\n\nAt night I build fire protection software with frontier models. One tool turns an existing EST3 program into a priced EST4 upgrade bill of materials. Another captures panel output during testing and checks devices off the points list as they come in. That's commissioning automation, the same problem your team has at scale.\n\nNobody asked me to do any of it. A lesson that lives only in my head doesn't help the next crew. Productizing a data center is the same job: turn expertise into something repeatable. I've been doing that on my own time for years, and I want to do it where the scale makes it matter.","beats":[{"label":"Hook","kind":"hook","quote":"For me, the best part of this work is turning what one expert knows into something the next person can repeat."},{"label":"Decision with reason","kind":"decision","quote":"When I solve something hard in the field, I write it down so the next crew doesn't have to solve it again."},{"label":"A number","kind":"number","quote":"That's become four playbooks my company uses: linear heat detection in automated storage, thermal imaging for solar sites, flame detection for battery storage, and EST panel migrations."},{"label":"One number: go-backs before and after, or techs qualified then and now","kind":"number","fillIn":true},{"label":"Lesson","kind":"lesson","quote":"Productizing a data center is the same job: turn expertise into something repeatable. I've been doing that on my own time for years, and I want to do it where the scale makes it matter."}],"codeRef":null,"explanation":"Hook: turn what one expert knows into something the next person can repeat → 4 playbooks in company use (fewer go-backs, more techs can go) → thermal detection training and the camera placement tool → night tools: EST3→EST4 priced BOM, panel capture → productizing a data center is the same job."},"hook":"4 playbooks · a camera tool · two night tools — and one number still to fill.","source":"Story 5 — Turning field lessons into something others can repeat","par":120,"confirmInEdition":false},{"id":"I8-mat-01","topicId":"I8","type":"matrix","prompt":"Which backup answers which question? Mark ● where the story fits the question and — where it doesn't.","interviewerPhrasing":"Give me a second example.","answer":{"grid":{"inputs":["Working with a Cx agent, an AHJ or smoke control","Testing fairly; data integrity; a test that was set up wrong","A recent mistake (in the last year or two)","A mistake you made; a failure; what you learned the hard way"],"outputs":["Backup · Lab smoke control","Backup · FM burn test","Backup · The radios","Story 4 · Canned air"],"cells":[["●","—","—","—"],["—","●","—","—"],["—","—","●","—"],["—","—","—","●"]],"options":["●","—"]},"codeRef":null,"explanation":"Cx agent, AHJ or smoke control → lab backup (Extreme ownership); testing fairly, data integrity → FM burn test (First principles); a recent mistake → the radios; a mistake you made → Story 4, canned air (Owning the failure)."},"hook":"Agent → lab; fair test → FM burn; recent miss → radios; the big miss → canned air.","source":"Which story answers which question › table","par":60,"confirmInEdition":false},{"id":"I8-num-01","topicId":"I8","type":"number","prompt":"Backup numbers: the FM pan fire size (ft²), the ASD alarm time (low and high, seconds), and the crew size in the radios story.","answer":{"fields":[{"label":"pan fire, ft²","value":1},{"label":"ASD alarmed in about, low, s","value":15},{"label":"ASD alarmed in about, high, s","value":20},{"label":"crew (radios), people","value":12}],"codeRef":null,"explanation":"A one-square-foot pan fire was lit and the ASD alarmed in about fifteen to twenty seconds; the radios were late for a crew of twelve."},"hook":"1 ft² · 15–20 s · 12 people.","source":"Backup scripts (45–70 seconds)","par":25,"confirmInEdition":false},{"id":"I8-scn-01","topicId":"I8","type":"scenario","prompt":"From the contractor's side of a Cx script: what makes a test day go right?","interviewerPhrasing":"You've been on the contractor side of a commissioning script. What makes a test day go right?","answer":{"beats":["A script they've seen in advance","A pre-test that has already passed","One person running the room","That's how I'd run it from the commissioning seat"],"requiresNumber":false,"codeRef":null,"explanation":"A script they've seen in advance, a pre-test that has already passed, and one person running the room. That's how I'd run it from the commissioning seat."},"hook":"Seen in advance · already passed · one voice.","source":"Backup scripts (45–70 seconds)","par":45,"confirmInEdition":false},{"id":"I8-sty-01","topicId":"I8","type":"story","prompt":"Backup — lab with smoke control and a third-party Cx FPE. 45–70 seconds.","interviewerPhrasing":"Tell me about working with a commissioning agent or an AHJ.","answer":{"script":"On a high-rise lab I ran the subs and programmed the fire alarm, and I was the contractor's liaison to the third-party commissioning FPE, so I was on the receiving end of every Cx script. We tested smoke control and the generator backup for the emergency circuits, and I was the main troubleshooter on fan and damper monitoring. [The hardest one was ___, and the cause was ___.] I ran the AHJ inspection [result: ___] and trained the owners before turnover. It taught me what makes a test day go right from the contractor's side: a script they've seen in advance, a pre-test that has already passed, and one person running the room. That's how I'd run it from the commissioning seat.","beats":[{"label":"Hook: contractor's liaison to the third-party Cx FPE","kind":"hook","quote":"On a high-rise lab I ran the subs and programmed the fire alarm, and I was the contractor's liaison to the third-party commissioning FPE, so I was on the receiving end of every Cx script."},{"label":"What we tested: smoke control, generator backup, fan and damper monitoring","kind":"beat","quote":"We tested smoke control and the generator backup for the emergency circuits, and I was the main troubleshooter on fan and damper monitoring."},{"label":"The hardest fan or damper problem and its cause","kind":"beat","fillIn":true},{"label":"AHJ inspection result","kind":"number","fillIn":true},{"label":"Ran the AHJ inspection, trained the owners","kind":"decision","quote":"I ran the AHJ inspection"},{"label":"Lesson: what makes a test day go right","kind":"lesson","quote":"It taught me what makes a test day go right from the contractor's side: a script they've seen in advance, a pre-test that has already passed, and one person running the room. That's how I'd run it from the commissioning seat."}],"timing":{"min":45,"max":70,"limit":90},"codeRef":null,"explanation":"Contractor's liaison to the third-party Cx FPE on a high-rise lab; tested smoke control and generator backup; main troubleshooter on fan and damper monitoring; ran the AHJ inspection and trained the owners. A test day goes right with a script seen in advance, a pre-test already passed, and one person running the room."},"hook":"Script in advance · pre-test passed · one voice in the room.","source":"Backup scripts (45–70 seconds)","par":70,"confirmInEdition":false},{"id":"I8-sty-02","topicId":"I8","type":"story","prompt":"Backup — FM Global live burn. 45–70 seconds.","interviewerPhrasing":"Tell me about a test that was set up wrong.","answer":{"script":"FM Global ran a live burn comparing aspirating smoke detection with linear heat in a flash freezer's exhaust, in very high airflow [about ___ air changes per hour]. I verified the ASD install beforehand. A one-square-foot pan fire was lit, and the ASD alarmed in about fifteen to twenty seconds. I'd noticed the linear heat was mounted behind steel beams, so I flagged it; otherwise the comparison would have measured the installation, not the technology. They retested it separately, and I never saw those results. A test only proves something if the setup is fair to every system in it.","beats":[{"label":"Hook: live burn, ASD vs linear heat in a flash freezer's exhaust","kind":"hook","quote":"FM Global ran a live burn comparing aspirating smoke detection with linear heat in a flash freezer's exhaust, in very high airflow"},{"label":"Air changes per hour (about)","kind":"number","fillIn":true},{"label":"Decision with reason: flagged the linear heat behind steel beams","kind":"decision","quote":"I'd noticed the linear heat was mounted behind steel beams, so I flagged it; otherwise the comparison would have measured the installation, not the technology."},{"label":"A number: 1 ft² pan fire, alarm in about 15–20 s","kind":"number","quote":"A one-square-foot pan fire was lit, and the ASD alarmed in about fifteen to twenty seconds."},{"label":"Lesson","kind":"lesson","quote":"A test only proves something if the setup is fair to every system in it."}],"timing":{"min":45,"max":70,"limit":90},"codeRef":null,"explanation":"Live burn: ASD vs linear heat in a flash freezer's exhaust; 1 ft² pan fire, ASD alarmed in about 15–20 s; flagged the linear heat behind steel beams so the comparison measured the technology, not the installation. A test only proves something if the setup is fair to every system in it."},"hook":"1 square foot · 15–20 seconds · steel beams in the way.","source":"Backup scripts (45–70 seconds)","par":70,"confirmInEdition":false},{"id":"I8-sty-03","topicId":"I8","type":"story","prompt":"Backup — the radios, for \"a recent mistake\". 45–70 seconds.","interviewerPhrasing":"Tell me about a mistake in the last year or two.","answer":{"script":"On the Hawaii job I was late ordering radios for a crew of twelve. A coworker suggested a push-to-talk app on our phones. I bought the licenses, got the client's OK to use the site Wi-Fi, and we ran on it for less than radios would have cost. [Confirm what you do now — e.g. comms goes on my mobilization list with the same lead time as materials.] On a cutover, communication is part of the safety plan, not an afterthought.","beats":[{"label":"Hook: late ordering radios for a crew of twelve","kind":"hook","quote":"On the Hawaii job I was late ordering radios for a crew of twelve."},{"label":"Decision: push-to-talk app, licenses, client's OK for site Wi-Fi","kind":"decision","quote":"A coworker suggested a push-to-talk app on our phones. I bought the licenses, got the client's OK to use the site Wi-Fi"},{"label":"Cost less than radios","kind":"beat","quote":"and we ran on it for less than radios would have cost."},{"label":"What you do now (e.g. comms on the mobilization list with the same lead time as materials)","kind":"beat","fillIn":true},{"label":"Lesson","kind":"lesson","quote":"On a cutover, communication is part of the safety plan, not an afterthought."}],"timing":{"min":45,"max":70,"limit":90},"codeRef":null,"explanation":"Late ordering radios for a crew of twelve → a coworker's push-to-talk app, licenses bought, client's OK for site Wi-Fi, cheaper than radios → on a cutover, communication is part of the safety plan, not an afterthought. [Confirm what you do now.]"},"hook":"12 people, no radios → push-to-talk on Wi-Fi — comms is part of the safety plan.","source":"Backup scripts (45–70 seconds)","par":70,"confirmInEdition":false},{"id":"I9-num-01","topicId":"I9","type":"number","prompt":"Fluidstack sites: Lake Mariner (about, MW), Barber Lake (MW), River Bend first leg (MW), Cameron County first phase ($B) and its ceiling (GW).","interviewerPhrasing":"What do you know about our sites?","answer":{"fields":[{"label":"Lake Mariner, NY — about, MW","value":360},{"label":"Barber Lake, TX — MW","value":207},{"label":"River Bend, LA — first leg, MW","value":245},{"label":"Cameron County, TX — first phase, $B","value":4},{"label":"Cameron County — up to, GW","value":1.5}],"codeRef":null,"explanation":"Lake Mariner, NY (TeraWulf) ~360 MW, live commissioning now; Barber Lake, TX (Cipher) 207 MW; River Bend, LA (Hut 8) 245 MW first leg; Cameron County, TX — its own campus, $4B first phase, up to 1.5 GW."},"hook":"360 · 207 · 245 — and Cameron County: $4B now, 1.5 GW eventually.","source":"Why Fluidstack › Facts to know cold","par":35,"confirmInEdition":false},{"id":"I9-num-02","topicId":"I9","type":"number","prompt":"Fluidstack funding and founding: Series A ($M) and its valuation ($B), the Jane Street-led round ($B) and the valuation it was reported at (over, $B), and the founding year.","answer":{"fields":[{"label":"Series A, $M","value":830},{"label":"Series A valuation, $B","value":7.5},{"label":"Jane Street-led round, $B","value":1.5},{"label":"valuation, over $B","value":18},{"label":"founded, year","value":2017}],"codeRef":null,"explanation":"$830M Series A at $7.5B; a $1.5B Jane Street-led round at over $18B reported in Sep 2026. Founded at Oxford in 2017; HQ moved to New York in Dec 2025."},"hook":"830 at 7.5, then 1.5 at 18 — since Oxford, 2017.","source":"Why Fluidstack › Facts to know cold","par":35,"confirmInEdition":false},{"id":"I9-mat-01","topicId":"I9","type":"matrix","prompt":"Match each Fluidstack site to its status (●), and — where it doesn't apply.","answer":{"grid":{"inputs":["Lake Mariner, NY (TeraWulf)","Barber Lake, TX (Cipher)","River Bend, LA (Hut 8)","Cameron County, TX"],"outputs":["Live commissioning now; CB-3 delivered in July","Halls slipped to Q4 2026 – Q1 2027","First hall Q2 2027","Site work began Sep 2026"],"cells":[["●","—","—","—"],["—","●","—","—"],["—","—","●","—"],["—","—","—","●"]],"options":["●","—"]},"codeRef":null,"explanation":"Lake Mariner: CB-3 delivered in July, later buildings energizing into early 2027 — live commissioning now. Barber Lake: halls slipped to Q4 2026 – Q1 2027. River Bend: first hall Q2 2027. Cameron County: site work began Sep 2026."},"hook":"Mariner is live, Barber slipped, River Bend is 2027, Cameron just broke ground.","source":"Why Fluidstack › Facts to know cold","par":60,"confirmInEdition":false},{"id":"I9-def-01","topicId":"I9","type":"defect","prompt":"One line of this Fluidstack research summary is something you must not cite. Tap it.","answer":{"lines":["1. Fluidstack was founded at Oxford in 2017 and moved its global headquarters to New York in Dec 2025.","2. CEO Gary Wu; co-founder and President César Maklary, ex-Formula One aerodynamics; co-founder Jamie Cox.","3. Anthropic's $50B program: custom data centers
