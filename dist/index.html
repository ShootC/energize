orward-flow test at system ___, including ___ where applicable. At L5, waterflow reaches the FACP, central station and BMS on normal and ___ power.","answer":{"fields":[{"label":"forward-flow at system …","value":"demand","aliases":["system demand","the demand","design demand"]},{"label":"including …","value":"hose","aliases":["hose allowance","hose demand","the hose","hose stream"]},{"label":"normal and … power","value":"generator","aliases":["generator power","gen","standby","emergency","backup"]}],"codeRef":null,"explanation":"Backflow preventer: forward-flow test at system demand, including hose where applicable (NFPA 13 / NFPA 24). L5: waterflow reaches the FACP, central station and BMS on normal and generator power."},"hook":"Backflow at demand plus hose; signals on utility and on generator.","source":"Sprinkler and underground › table","par":30,"confirmInEdition":false},{"id":"S6-ord-01","topicId":"S6","type":"order","prompt":"Your sprinkler acceptance checklist — put it in order.","interviewerPhrasing":"What's on your sprinkler acceptance checklist?","answer":{"steps":["Flush","Hydros","Air test if dry","Inspector's test and tamper timing","Main drain baseline","Backflow forward flow","Signals to central station","Certificates"],"codeRef":null,"explanation":"Flush → hydros → air test if dry → inspector's test and tamper timing → main drain baseline → backflow forward flow → signals to central station → certificates."},"hook":"Flush, squeeze, puff, flow-and-turn, drain, backflow, signal, sign.","source":"Sprinkler and underground › Likely question","par":55,"confirmInEdition":false},{"id":"S6-ord-02","topicId":"S6","type":"order","prompt":"Wet system acceptance, underground to turnover: put the five stages in order.","answer":{"steps":["Install vs design: sprinkler type, K-factor, temperature rating, obstructions, hangers and bracing, FDC, nameplate, spare cabinet","Prove the pipe: witness the underground flush, then both hydros; signed certificates","Prove the system: inspector's test, tamper timing, main drain baseline, backflow forward-flow, trip test on dry systems","Prove it in the building: waterflow to FACP, central station and BMS on normal and generator power; pump carries the demand","Turnover: certificates, as-builts, the calc, baselines, spare sprinklers, NFPA 25 schedule in the CMMS"],"codeRef":null,"explanation":"L2 install vs design → L3 prove the pipe (flush, both hydros, certificates) → L4 prove the system → L5 prove it in the building on normal and generator power → turnover."},"hook":"Look at it, squeeze it, run it, run it with the building, hand it over.","source":"Sprinkler and underground › Acceptance sequence","par":55,"confirmInEdition":false},{"id":"S6-ord-03","topicId":"S6","type":"order","prompt":"L4 — prove the system. Put the guide's L4 sprinkler items in order.","answer":{"steps":["Inspector's test: time to alarm","Valve tamper switches report within two turns of the handwheel or one-fifth of stem travel","Main drain test: record static and residual — the NFPA 25 baseline","Backflow forward-flow test","On dry systems, trip test: time to trip and time to water at the test connection"],"codeRef":null,"explanation":"Inspector's test (time to alarm) → tamper switches within two turns or one-fifth of stem travel → main drain (static and residual, the NFPA 25 baseline) → backflow forward-flow → on dry systems, the trip test."},"hook":"Alarm, tamper, drain, backflow, trip.","source":"Sprinkler and underground › Acceptance sequence","par":45,"confirmInEdition":false},{"id":"S6-def-01","topicId":"S6","type":"defect","prompt":"Wet system L4/L5 script. One test is run at the wrong flow. Tap the line.","answer":{"lines":["1. Prerequisites: flush and both hydros passed; certificates signed; central station on test.","2. Inspector's test: time to alarm recorded at the FACP.","3. Tamper switches: signal within two turns of the handwheel.","4. Main drain: static and residual recorded as the NFPA 25 baseline.","5. Backflow preventer: forward-flow test at the main drain flow, hose allowance not included.","6. L5: waterflow reaches FACP, central station and BMS on normal and generator power.","7. Turnover: certificates, as-builts, calc, baselines, spare sprinklers, NFPA 25 schedule in the CMMS."],"defectIndex":4,"codeRef":null,"explanation":"Line 5 — the backflow forward-flow test runs at system demand, including hose where applicable."},"hook":"The backflow has to pass the whole demand, hose and all — not whatever the drain happens to flow.","source":"Sprinkler and underground › table","par":40,"confirmInEdition":false},{"id":"S6-scn-01","topicId":"S6","type":"scenario","prompt":"What's on your sprinkler acceptance checklist?","interviewerPhrasing":"What's on your sprinkler acceptance checklist?","answer":{"beats":["Flush","Hydros — underground and aboveground","Air test if dry","Inspector's test and tamper timing","Main drain baseline","Backflow forward flow","Signals to central station, then certificates"],"requiresNumber":true,"codeRef":null,"explanation":"Flush → hydros → air test if dry → inspector's test and tamper timing → main drain baseline → backflow forward flow → signals to central station → certificates."},"hook":"Eight stops, and the last one is paper.","source":"Sprinkler and underground › Likely question","par":90,"confirmInEdition":false},{"id":"S6-scn-02","topicId":"S6","type":"scenario","prompt":"What does L5 prove for a wet sprinkler system?","interviewerPhrasing":"Once the sprinkler FPT passes, what's left to prove at the integrated test?","answer":{"beats":["Waterflow reaches the FACP","…and the central station","…and the BMS","On normal and generator power","The fire pump (if any) starts and carries the demand"],"requiresNumber":false,"codeRef":null,"explanation":"L5 — prove it in the building: waterflow reaches the FACP, central station and BMS on normal and generator power; the fire pump (if any) starts and carries the demand."},"hook":"Three destinations, two power sources, one pump carrying the load.","source":"Sprinkler and underground › Acceptance sequence","par":75,"confirmInEdition":false},{"id":"S7-def-01","topicId":"S7","type":"defect","prompt":"L2 walk in a data hall. One line makes a decision the wrong way. Tap it.","answer":{"lines":["1. L2 walk, Hall 1: sprinkler type, K-factor and temperature rating against the design.","2. Hazard classification confirmed against the owner's and insurer's standard (FM Data Sheet 5-32).","3. Hot-aisle containment panels: listing confirms they drop away on heat; no sprinklers inside the aisle.","4. Obstructions checked at cable tray, busway and ductwork.","5. Branch line rerouted around the busway with added fittings; judged acceptable on the ladder by inspection, calc unchanged.","6. Hydraulic nameplate at the riser matches the calc.","7. Open items entered on the issues log with owner and due date."],"defectIndex":4,"codeRef":null,"explanation":"Line 5 — a field reroute that adds fittings changes the calc; the commissioning answer is a recalc against the supply test, not a judgment call on the ladder."},"hook":"Added fittings, changed calc — the ladder has no opinion.","source":"Sprinkler and underground › Data center points to make","par":40,"confirmInEdition":false},{"id":"S7-num-01","topicId":"S7","type":"number","prompt":"Under the insurer's data sheet that wants sprinklers throughout a data hall, gaseous systems are a ___. Which data sheet?","answer":{"fields":[{"label":"gaseous systems are a …","value":"supplement","aliases":["a supplement","supplemental","supplementary","supplement only"]}],"codeRef":"FM Data Sheet 5-32","codeRefAliases":["FM 5-32","DS 5-32","FM DS 5-32","5-32","Data Sheet 5-32"],"explanation":"FM Data Sheet 5-32 wants sprinklers throughout; gaseous systems are a supplement. Hazard classification is set by the owner's and insurer's standard."},"hook":"5-32: water first, gas as the extra.","source":"Sprinkler and underground › Data center points to make","par":25,"confirmInEdition":false},{"id":"S7-scn-01","topicId":"S7","type":"scenario","prompt":"How do sprinklers work with hot-aisle containment?","interviewerPhrasing":"How do sprinklers work with hot-aisle containment?","answer":{"beats":["It's an obstruction question first","Containment panels drop away on heat (listed)","…or sprinklers go inside the contained aisle"],"requiresNumber":false,"codeRef":null,"explanation":"Containment panels either drop away on heat (listed) or sprinklers go inside the contained aisle; it is an obstruction question first."},"hook":"The aisle is a ceiling — either it falls away hot, or the heads go inside it.","source":"Likely questions and day-of checklist › Commissioning technical (the 35%)","par":60,"confirmInEdition":false},{"id":"S7-scn-02","topicId":"S7","type":"scenario","prompt":"The sprinkler contractor rerouted a branch line around the busway and added fittings. What's the commissioning answer?","interviewerPhrasing":"A field reroute added fittings to a branch line. What do you do?","answer":{"beats":["A field reroute that adds fittings changes the calc","The commissioning answer is a recalc against the supply test","Not a judgment call on the ladder"],"requiresNumber":false,"codeRef":null,"explanation":"A field reroute that adds fittings changes the calc. The commissioning answer is a recalc against the supply test, not a judgment call on the ladder."},"hook":"Every elbow is a psi — recalc it, don't eyeball it from the ladder.","source":"Sprinkler and underground › Data center points to make","par":60,"confirmInEdition":false},{"id":"S7-scn-03","topicId":"S7","type":"scenario","prompt":"Who sets the hazard classification in a data hall, and where do gaseous systems fit?","interviewerPhrasing":"Who decides the sprinkler design basis in your data halls?","answer":{"beats":["Hazard classification is set by the owner's and insurer's standard","FM Data Sheet 5-32 wants sprinklers throughout","Gaseous systems are a supplement"],"requiresNumber":false,"codeRef":"FM Data Sheet 5-32","codeRefAliases":["FM 5-32","DS 5-32","FM DS 5-32","5-32","Data Sheet 5-32"],"explanation":"Hazard classification is set by the owner's and insurer's standard; FM Data Sheet 5-32 wants sprinklers throughout, with gaseous systems as a supplement."},"hook":"Owner and insurer pick the hazard; FM 5-32 says sprinklers everywhere, gas on top.","source":"Sprinkler and underground › Data center points to make","par":60,"confirmInEdition":false},{"id":"S8-num-01","topicId":"S8","type":"number","prompt":"Hose allowance: Light ___ gpm, Ordinary ___ gpm, Extra ___ gpm. Which table?","interviewerPhrasing":"What hose allowance goes on top of the sprinkler demand for each hazard?","answer":{"fields":[{"label":"Light hazard, gpm","value":100},{"label":"Ordinary hazard, gpm","value":250},{"label":"Extra hazard, gpm","value":500}],"codeRef":"NFPA 13 Table 19.2.3.1.2","codeRefAliases":["13 19.2.3.1.2","NFPA 13 19.2.3.1.2","Table 19.2.3.1.2","19.2.3.1.2"],"explanation":"Hose allowance: Light 100 gpm / 30 min · Ordinary 250 gpm / 60–90 min · Extra 500 gpm / 90–120 min (NFPA 13 Table 19.2.3.1.2)."},"hook":"100 · 250 · 500 — the hose doubles and doubles again as the hazard climbs.","source":"Sprinkler and underground › table","par":30,"confirmInEdition":false},{"id":"S8-num-02","topicId":"S8","type":"number","prompt":"Hose duration: Light ___ min; Ordinary ___ to ___ min; Extra ___ to ___ min. Which table?","answer":{"fields":[{"label":"Light, min","value":30},{"label":"Ordinary, from min","value":60},{"label":"Ordinary, to min","value":90},{"label":"Extra, from min","value":90},{"label":"Extra, to min","value":120}],"codeRef":"NFPA 13 Table 19.2.3.1.2","codeRefAliases":["13 19.2.3.1.2","NFPA 13 19.2.3.1.2","Table 19.2.3.1.2","19.2.3.1.2"],"explanation":"Light 100 gpm / 30 min · Ordinary 250 gpm / 60–90 min · Extra 500 gpm / 90–120 min (NFPA 13 Table 19.2.3.1.2)."},"hook":"30, then 60–90, then 90–120 — each hazard's clock starts where the last one ended.","source":"Sprinkler and underground › table","par":35,"confirmInEdition":false},{"id":"S8-num-03","topicId":"S8","type":"number","prompt":"Ordinary hazard hose allowance: ___ gpm for ___ to ___ min.","answer":{"fields":[{"label":"gpm","value":250},{"label":"from, min","value":60},{"label":"to, min","value":90}],"codeRef":"NFPA 13 Table 19.2.3.1.2","codeRefAliases":["13 19.2.3.1.2","NFPA 13 19.2.3.1.2","Table 19.2.3.1.2","19.2.3.1.2"],"explanation":"Ordinary hazard: 250 gpm for 60–90 min (NFPA 13 Table 19.2.3.1.2); Light is 100 gpm / 30 min, Extra 500 gpm / 90–120 min."},"hook":"Ordinary: a quarter-thousand gallons a minute for an hour to an hour and a half.","source":"Sprinkler and underground › table","par":25,"confirmInEdition":false},{"id":"P1-mat-01","topicId":"P1","type":"matrix","prompt":"For each pre-action type, what opens the valve? Mark what does (●) and what must not (—).","interviewerPhrasing":"What's the difference between single- and double-interlock?","answer":{"grid":{"inputs":["Non-interlock","Single-interlock","Double-interlock"],"outputs":["Detection alone opens the valve","Loss of air (sprinkler operation) alone opens the valve","Needs detection AND loss of air"],"cells":[["●","●","—"],["●","—","—"],["—","—","●"]],"notes":[["Up to 1,000 sprinklers per valve","",""],["Up to 1,000 sprinklers per valve","",""],["","","Sized like dry pipe; 30% design-area increase"]]},"codeRef":null,"explanation":"Non-interlock opens on detection or sprinkler operation (loss of air); single-interlock on detection only; double-interlock needs detection and loss of air — sized like dry pipe with a 30% design-area increase."},"hook":"Non: either key. Single: detection only. Double: both keys, and 30% more area.","source":"Pre-action › table","par":60,"confirmInEdition":false},{"id":"P1-def-01","topicId":"P1","type":"defect","prompt":"Single-interlock L4 script. One expected result is wrong for this valve type. Tap it.","answer":{"lines":["1. System: single-interlock pre-action, Electrical Room 3; central station on test.","2. Detection only: alarm annunciates; valve trips and the waterflow pressure switch alarms.","3. Loss of air only (inspector's test open): low-air supervisory; valve trips on loss of air alone.","4. Manual release per the design: valve trips.","5. Faults on the solenoid and detection circuits annunciate as trouble.","6. Restore: drain, reset the valve per the manufacturer, restore air, panel normal."],"defectIndex":2,"codeRef":null,"explanation":"Line 3 — a single-interlock valve opens on detection only; loss of air alone gives a low-air supervisory with the valve shut. Only a non-interlock valve opens on sprinkler operation (loss of air) alone."},"hook":"Single-interlock has one key, and it isn't air.","source":"Pre-action › table","par":40,"confirmInEdition":false},{"id":"P1-num-01","topicId":"P1","type":"number","prompt":"Non- and single-interlock: up to ___ sprinklers per valve. Automatic air supervision is required above ___ sprinklers. Double-interlock carries a ___% design-area increase.","answer":{"fields":[{"label":"sprinklers per valve","value":1000},{"label":"air supervision above, sprinklers","value":20},{"label":"design-area increase, %","value":30}],"codeRef":null,"explanation":"Non- and single-interlock: up to 1,000 sprinklers per valve. Automatic air supervision is required above 20 sprinklers. Double-interlock is sized like dry pipe with a 30% design-area increase."},"hook":"1,000 heads a valve, air watched past 20, and double-interlock pays 30% more area.","source":"Pre-action › table","par":30,"confirmInEdition":false},{"id":"P1-num-02","topicId":"P1","type":"number","prompt":"Fill the connectors: non-interlock opens on detection ___ sprinkler operation (loss of air); double-interlock opens on detection ___ loss of air; single-interlock opens on ___ alone.","answer":{"fields":[{"label":"non-interlock: detection … sprinkler operation","value":"or","aliases":["either","or sprinkler operation"]},{"label":"double-interlock: detection … loss of air","value":"and","aliases":["plus","both","and loss of air"]},{"label":"single-interlock opens on","value":"detection","aliases":["detection alone","detection only","a detector","detector","smoke detection"]}],"codeRef":null,"explanation":"Non-interlock: detection or sprinkler operation (loss of air). Single-interlock: detection. Double-interlock: detection and loss of air."},"hook":"OR, DETECTION, AND — non, single, double.","source":"Pre-action › table","par":25,"confirmInEdition":false},{"id":"P1-scn-01","topicId":"P1","type":"scenario","prompt":"Explain the three pre-action types — what opens the valve, and what rules come with each?","interviewerPhrasing":"Non-, single-, double-interlock — walk me through them.","answer":{"beats":["Non-interlock: detection or sprinkler operation (loss of air)","Single-interlock: detection","Double-interlock: detection and loss of air","Non- and single-interlock: up to 1,000 sprinklers per valve","Double-interlock: sized like dry pipe, 30% design-area increase, the 40 psi / 24 h air test","Automatic air supervision above 20 sprinklers"],"requiresNumber":true,"codeRef":null,"explanation":"Non-interlock opens on detection or sprinkler operation (loss of air); single-interlock on detection; double-interlock on detection and loss of air. Non- and single-interlock run up to 1,000 sprinklers per valve; double-interlock is sized like dry pipe with a 30% design-area increase; air supervision is required above 20 sprinklers."},"hook":"Or, detection, and — then 1,000, 30%, 20.","source":"Pre-action › table","par":90,"confirmInEdition":false},{"id":"P1-scn-02","topicId":"P1","type":"scenario","prompt":"What releases the pre-action valve in a data hall, and what still has to happen before water moves?","interviewerPhrasing":"What's the release input for pre-action in your data halls?","answer":{"beats":["ASD Fire 2 (or a second detector) is the usual release input","Fire 1 is the building alarm; Alert and Action call Ops to investigate","On double-interlock the valve still needs loss of air — a sprinkler operating — before water enters the pipe","So one false signal or one damaged sprinkler alone can't put water on IT"],"requiresNumber":false,"codeRef":null,"explanation":"ASD Fire 2 (or a second detector) is the usual release input; Fire 1 is the building alarm. Double-interlock opens on detection and loss of air, so a single false signal or a damaged sprinkler alone can't put water on IT."},"hook":"Fire 2 turns the first key; a fused head turns the second.","source":"Pre-action › Data center points to make","par":75,"confirmInEdition":false},{"id":"P2-num-01","topicId":"P2","type":"number","prompt":"Dry and double-interlock air test — pressure, duration, allowed loss, and the section.","interviewerPhrasing":"The 24-hour air test lost 3 psi. What next?","answer":{"fields":[{"label":"psi","value":40,"tolerance":0},{"label":"hours","value":24,"tolerance":0},{"label":"max loss psi","value":1.5,"tolerance":0.01}],"codeRef":"NFPA 13 §29.2.2","codeRefAliases":["13 29.2.2","NFPA 13 29.2.2","13 §29.2.2","29.2.2"],"explanation":"40 psi for 24 h, loss ≤ 1.5 psi (NFPA 13 §29.2.2) — a 3 psi loss fails. Common leaks: grooved couplings and threaded joints."},"hook":"40 · 24 · 1.5 — forty for a day, lose a buck-fifty.","source":"Sprinkler and underground › table","par":25,"confirmInEdition":false},{"id":"P2-num-02","topicId":"P2","type":"number","prompt":"Air supply: restores normal air pressure within ___ min — ___ min for refrigerated spaces below ___ °F. Section?","answer":{"fields":[{"label":"restore, min","value":30},{"label":"refrigerated spaces, min","value":60},{"label":"refrigerated below, °F","value":5}],"codeRef":"NFPA 13 §8.2.6.3","codeRefAliases":["13 8.2.6.3","NFPA 13 8.2.6.3","13 §8.2.6.3","8.2.6.3"],"explanation":"The air supply restores normal air pressure within 30 min (60 min for refrigerated spaces below 5 °F), NFPA 13 §8.2.6.3. A compressor too small to do that is a common acceptance failure."},"hook":"Half an hour to re-air — a full hour only below 5 °F.","source":"Sprinkler and underground › table","par":30,"confirmInEdition":false},{"id":"P2-num-03","topicId":"P2","type":"number","prompt":"Automatic air supervision is required above ___ sprinklers. The first places you look for an air leak: ___ couplings and ___ joints.","answer":{"fields":[{"label":"sprinklers","value":20},{"label":"… couplings","value":"grooved","aliases":["grooved couplings","groove","grooved coupling"]},{"label":"… joints","value":"threaded","aliases":["threaded joints","thread","threads","threaded joint"]}],"codeRef":null,"explanation":"Automatic air supervision is required above 20 sprinklers. Common acceptance failures: air leaks at grooved couplings and threaded joints; a compressor too small to restore air in 30 minutes."},"hook":"Past 20 heads the air watches itself — and leaks hide in grooves and threads.","source":"Pre-action › Test-day details an interviewer will probe","par":30,"confirmInEdition":false},{"id":"P2-def-01","topicId":"P2","type":"defect","prompt":"Air test and air supply script. One pass is really a fail. Tap the line.","answer":{"lines":["1. Prerequisites: hydro passed; piping complete; low-point drains labeled; gauges calibrated.","2. Air test: pressurize to 40 psi and hold 24 h.","3. Pass: loss not more than 1.5 psi; any leak hunted at grooved couplings and threaded joints.","4. Air supply: from normal pressure released, the compressor restores normal pressure in 45 min — pass.","5. Low-air and high-air supervisory signals verified at the panel.","6. Automatic air supervision confirmed (system above 20 sprinklers).","7. Restore: air at normal pressure, supervisory clear, central station off test, verified."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — the air supply must restore normal air pressure within 30 min (60 min only for refrigerated spaces below 5 °F), NFPA 13 §8.2.6.3; a compressor too small to do that is a common acceptance failure."},"hook":"Forty-five minutes is a small compressor, not a pass.","source":"Sprinkler and underground › table","par":40,"confirmInEdition":false},{"id":"P2-scn-01","topicId":"P2","type":"scenario","prompt":"The 24-hour air test lost 3 psi. What next?","interviewerPhrasing":"The 24-hour air test lost 3 psi. What next?","answer":{"beats":["It fails: the limit is 1.5 psi loss over 24 h at 40 psi (NFPA 13 §29.2.2)","Find the leak — grooved couplings and threaded joints are the usual places","Fix it and run the air test again","Check the air supply too: it has to restore normal pressure within 30 min"],"requiresNumber":true,"codeRef":"NFPA 13 §29.2.2","codeRefAliases":["13 29.2.2","NFPA 13 29.2.2","13 §29.2.2","29.2.2"],"explanation":"40 psi for 24 h, loss ≤ 1.5 psi (NFPA 13 §29.2.2) — 3 psi fails. Find the leak at grooved couplings and threaded joints, fix it, retest; the air supply must restore normal pressure within 30 min."},"hook":"Double the allowance is a fail — hunt grooves and threads, then another 24 hours.","source":"Sprinkler and underground › table","par":90,"confirmInEdition":false},{"id":"P2-scn-02","topicId":"P2","type":"scenario","prompt":"What air-side failures turn up at pre-action acceptance?","interviewerPhrasing":"Where do dry and pre-action systems usually fail acceptance?","answer":{"beats":["Air leaks at grooved couplings and threaded joints","A compressor too small to restore air in 30 minutes","Missing or unlabeled low-point drains","Trapped sections that hold water in a dry system"],"requiresNumber":true,"codeRef":null,"explanation":"Common acceptance failures: air leaks at grooved couplings and threaded joints; a compressor too small to restore air in 30 minutes; missing or unlabeled low-point drains; trapped sections that hold water in a dry system."},"hook":"Leaks, a weak compressor (30 min), lost drains, trapped water.","source":"Pre-action › Test-day details an interviewer will probe","par":75,"confirmInEdition":false},{"id":"P3-def-01","topicId":"P3","type":"defect","prompt":"A 60-second delivery test script. One line runs the method wrong. Tap it.","answer":{"lines":["1. System: double-interlock pre-action, Hall 1, capacity above 500 gal, so delivery must be proven.","2. Test connection at the most remote end of the top branch line; orifice matches the smallest K-factor.","3. Start from normal air pressure; stopwatch ready; gauges calibrated.","4. Open the inspector's test connection first; once air pressure has dropped, activate detection.","5. Record time to trip and time to water at the test connection.","6. Pass: water at the test connection within 60 s, or delivery shown by calculation (NFPA 13 §8.3.2.3).","7. Restore: drain, reset the valve per the manufacturer, restore air, panel normal."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — the 60 s test starts from normal air pressure with detection activated and the test connection opened at the same moment."},"hook":"Same moment, not one-then-the-other — a head start is a fake pass.","source":"Pre-action › Dry-pipe sizing rules","par":40,"confirmInEdition":false},{"id":"P3-num-01","topicId":"P3","type":"number","prompt":"Dry-pipe delivery exemptions: ___ gal or less without a quick-opening device; ___ gal or less with one; otherwise water at the inspector's test connection within ___ s by test. Section (2022 edition)?","interviewerPhrasing":"When does a dry system have to prove its water delivery time?","answer":{"fields":[{"label":"without quick-opening device, gal","value":500},{"label":"with quick-opening device, gal","value":750},{"label":"water at the test connection within, s","value":60}],"codeRef":"NFPA 13-2022 §8.2.3","codeRefAliases":["13 8.2.3","NFPA 13 8.2.3","13 §8.2.3","8.2.3","NFPA 13 §8.2.4","8.2.4"],"explanation":"Acceptable by any one of: 500 gal or less without a quick-opening device; 750 gal or less with one; water at the inspector's test connection within 60 s by test; calculated delivery meeting the table; or a manifold functional test (NFPA 13-2022 §8.2.3; consolidated into §8.2.4 in 2025)."},"hook":"500 bare, 750 with a quick-opener, or prove 60 seconds.","source":"Pre-action › Dry-pipe sizing rules","par":35,"confirmInEdition":false},{"id":"P3-num-02","topicId":"P3","type":"number","prompt":"Double-interlock gets only the ___ gal exemption; above that, prove water at the test connection within ___ s — or by calculation. Section for the calculation option?","answer":{"fields":[{"label":"exemption, gal","value":500},{"label":"water within, s","value":60}],"codeRef":"NFPA 13 §8.3.2.3","codeRefAliases":["13 8.3.2.3","NFPA 13 8.3.2.3","13 §8.3.2.3","8.3.2.3"],"explanation":"Double-interlock gets only the 500 gal exemption: above that, prove water at the test connection within 60 s — starting from normal air pressure, with detection activated and the test connection opened at the same moment — or by calculation (NFPA 13 §8.3.2.3)."},"hook":"Double-interlock: no 750 bonus — 500 gal, then prove 60 s or calc it.","source":"Pre-action › Dry-pipe sizing rules","par":30,"confirmInEdition":false},{"id":"P3-num-03","topicId":"P3","type":"number","prompt":"The 500 and 750 gal figures are ___ from the delivery-time rule, not ___ limits. Which section are they in (2022)?","answer":{"fields":[{"label":"they are …","value":"exemptions","aliases":["exemption","exempt","an exemption","exceptions"]},{"label":"not … limits","value":"size","aliases":["system size","capacity","volume","a size"]}],"codeRef":"NFPA 13-2022 §8.2.3","codeRefAliases":["13 8.2.3","NFPA 13 8.2.3","13 §8.2.3","8.2.3","NFPA 13 §8.2.4","8.2.4"],"explanation":"The 500 and 750 gal figures are exemptions from the delivery-time rule, not size limits (NFPA 13-2022 §8.2.3; consolidated into §8.2.4 in 2025)."},"hook":"500 and 750 let you skip the stopwatch — they don't cap the system.","source":"Pre-action › Dry-pipe sizing rules","par":30,"confirmInEdition":false},{"id":"P3-scn-01","topicId":"P3","type":"scenario","prompt":"How do you show a dry or double-interlock system meets the delivery rule?","interviewerPhrasing":"Your dry system is over 500 gallons. How do you show it's acceptable?","answer":{"beats":["Any one of: 500 gal or less without a quick-opening device","…750 gal or less with one","…water at the inspector's test connection within 60 s by test","…calculated delivery meeting the table","…or a manifold functional test","The 500 and 750 gal figures are exemptions from the delivery-time rule, not size limits","Double-interlock gets only the 500 gal exemption"],"requiresNumber":true,"codeRef":"NFPA 13-2022 §8.2.3","codeRefAliases":["13 8.2.3","NFPA 13 8.2.3","13 §8.2.3","8.2.3","NFPA 13 §8.2.4","8.2.4"],"explanation":"Any one of: 500 gal or less without a quick-opening device; 750 gal or less with one; water at the test connection within 60 s by test; calculated delivery meeting the table; or a manifold functional test (NFPA 13-2022 §8.2.3). Double-interlock gets only the 500 gal exemption."},"hook":"Five doors in: 500, 750, 60 seconds, the calc, the manifold — double-interlock loses the 750.","source":"Pre-action › Dry-pipe sizing rules","par":90,"confirmInEdition":false},{"id":"P3-scn-02","topicId":"P3","type":"scenario","prompt":"How do you run the 60-second delivery test on a double-interlock system?","interviewerPhrasing":"Describe the 60-second test method for double-interlock.","answer":{"beats":["Start from normal air pressure","Detection activated and the test connection opened at the same moment","Water at the test connection within 60 s","…or prove delivery by calculation (NFPA 13 §8.3.2.3)","The test connection has an orifice matching the smallest K-factor, at the most remote end of the top branch line"],"requiresNumber":true,"codeRef":"NFPA 13 §8.3.2.3","codeRefAliases":["13 8.3.2.3","NFPA 13 8.3.2.3","13 §8.3.2.3","8.3.2.3"],"explanation":"Prove water at the test connection within 60 s — starting from normal air pressure, with detection activated and the test connection opened at the same moment — or by calculation (NFPA 13 §8.3.2.3)."},"hook":"Full air, both inputs on the same tick, water in sixty.","source":"Pre-action › Dry-pipe sizing rules","par":90,"confirmInEdition":false},{"id":"P4-num-01","topicId":"P4","type":"number","prompt":"Maximum time to water: Light hazard ___ s; Ordinary ___ s; Extra ___ s; High-piled storage ___ s.","interviewerPhrasing":"What delivery time does the table give for an ordinary hazard dry system?","answer":{"fields":[{"label":"Light, s","value":60},{"label":"Ordinary, s","value":50},{"label":"Extra, s","value":45},{"label":"High-piled storage, s","value":40}],"codeRef":null,"explanation":"Dwelling unit 1 sprinkler / 15 s · Light 1 / 60 s · Ordinary 2 / 50 s · Extra 4 / 45 s · High-piled storage 4 / 40 s."},"hook":"60 · 50 · 45 · 40 — the hotter the hazard, the shorter the wait.","source":"Pre-action › table","par":30,"confirmInEdition":false},{"id":"P4-num-02","topicId":"P4","type":"number","prompt":"Delivery table: Dwelling unit ___ sprinkler open, ___ s. Sprinklers assumed open — Ordinary ___, Extra ___, High-piled storage ___.","answer":{"fields":[{"label":"Dwelling unit, sprinklers open","value":1},{"label":"Dwelling unit, s","value":15},{"label":"Ordinary, sprinklers open","value":2},{"label":"Extra, sprinklers open","value":4},{"label":"High-piled storage, sprinklers open","value":4}],"codeRef":null,"explanation":"Dwelling unit 1 / 15 s · Light 1 / 60 s · Ordinary 2 / 50 s · Extra 4 / 45 s · High-piled storage 4 / 40 s."},"hook":"1 · 1 · 2 · 4 · 4 heads open — and the dwelling unit gets only 15 seconds.","source":"Pre-action › table","par":35,"confirmInEdition":false},{"id":"P4-def-01","topicId":"P4","type":"defect","prompt":"Delivery test on an ordinary hazard area. One acceptance criterion is wrong. Tap the line.","answer":{"lines":["1. System: dry pipe, ordinary hazard storage area; test from normal air pressure.","2. Inspector's test at the most remote end of the top branch line.","3. Acceptance criterion from the table: ordinary hazard, 2 sprinklers assumed open, water within 60 s.","4. Record starting air pressure, pressure at trip, time to trip, time to water, steady water pressure.","5. Fail = code failure, not a punch item: split, adjust air within the listed range, or recalc — then retest.","6. Restore: drain, reset the valve, restore air, panel normal, sign-off."],"defectIndex":2,"codeRef":null,"explanation":"Line 3 — ordinary hazard is 2 sprinklers open and 50 s; 60 s is light hazard (1 open)."},"hook":"Ordinary gets fifty, not sixty — sixty belongs to light hazard.","source":"Pre-action › table","par":40,"confirmInEdition":false},{"id":"P4-scn-01","topicId":"P4","type":"scenario","prompt":"Walk me down the water delivery time table.","interviewerPhrasing":"What delivery times do you hold a dry or pre-action system to?","answer":{"beats":["Dwelling unit: 1 sprinkler open, 15 s","Light hazard: 1 open, 60 s","Ordinary: 2 open, 50 s","Extra: 4 open, 45 s","High-piled storage: 4 open, 40 s"],"requiresNumber":true,"codeRef":null,"explanation":"Dwelling unit 1 / 15 s · Light 1 / 60 s · Ordinary 2 / 50 s · Extra 4 / 45 s · High-piled storage 4 / 40 s — calculated delivery meeting the table is one way to satisfy the dry-pipe rule."},"hook":"15, 60, 50, 45, 40 — with 1, 1, 2, 4, 4 heads open.","source":"Pre-action › table","par":75,"confirmInEdition":false},{"id":"P5-ord-01","topicId":"P5","type":"order","prompt":"Order the double-interlock L4 script, start to restore.","interviewerPhrasing":"Walk me through your L4 functional test on a double-interlock pre-action system.","answer":{"steps":["Prerequisites: hydro and air test passed, panel programmed, central station on test","Detection only: alarms annunciate, valve stays shut","Loss of air only: low-air supervisory, valve stays shut","Both: valve trips; record time to trip and time to water","Manual release per the design","Faults: solenoid and detection circuits, air, compressor, tamper, panel AC loss","Restore: drain, reset the valve, restore air, panel normal, sign-off"],"codeRef":null,"explanation":"Prerequisites → detection only (valve stays shut) → loss of air only (valve stays shut) → both: valve trips, record time to trip and time to water at the test connection → manual release → faults → restore."},"hook":"7 steps: prereqs, one input, the other, both, by hand, break it, put it back.","source":"Pre-action › Sample L4 script — double-interlock (the Day 12 exercise)","par":60,"confirmInEdition":false},{"id":"P5-ord-02","topicId":"P5","type":"order","prompt":"The restore step of the double-interlock L4 script: put its parts in order.","answer":{"steps":["Drain","Reset the valve per the manufacturer (clapper, priming water)","Restore air","Panel normal","Sign-off"],"codeRef":null,"explanation":"Restore: drain, reset the valve per the manufacturer (clapper, priming water), restore air, panel normal, sign-off."},"hook":"Empty it, seat it, pump it up, clear the panel, sign.","source":"Pre-action › Sample L4 script — double-interlock (the Day 12 exercise)","par":40,"confirmInEdition":false},{"id":"P5-def-01","topicId":"P5","type":"defect","prompt":"Double-interlock L4 script. One expected result would mean the interlock isn't working. Tap it.","answer":{"lines":["1. Prerequisites: hydro and air test passed; panel programmed; central station on test; gauges calibrated; drain path ready.","2. Detection only, one zone: alarms annunciate; valve trips and the waterflow pressure switch alarms.","3. Loss of air only (inspector's test open): low-air supervisory; valve stays shut.","4. Both: detection plus open test connection — valve trips; record time to trip and time to water against the table or calc.","5. Manual release per the design.","6. Faults: open and short on the solenoid circuit; detection circuit faults; low and high air; compressor failure; tamper; panel AC loss.","7. Restore: drain, reset the valve per the manufacturer (clapper, priming water), restore air, panel normal, sign-off."],"defectIndex":1,"codeRef":null,"explanation":"Line 2 — on detection only (one zone, then the cross-zone or Fire 2 input) alarms annunciate and the valve stays shut; it trips only with detection plus loss of air."},"hook":"One key turned, door still locked — that's the whole point of double-interlock.","source":"Pre-action › Sample L4 script — double-interlock (the Day 12 exercise)","par":40,"confirmInEdition":false},{"id":"P5-def-02","topicId":"P5","type":"defect","prompt":"Double-interlock L4 script. One line leaves the system disabled. Tap it.","answer":{"lines":["1. Prerequisites: hydro and air test passed; panel programmed; central station on test; gauges calibrated; drain path ready.","2. Detection only: alarms annunciate; valve stays shut.","3. Loss of air only: low-air supervisory; valve stays shut.","4. Both: valve trips; waterflow pressure switch alarms; time to trip and time to water recorded.","5. Manual release per the design: valve trips.","6. Faults: solenoid open and short, detection faults, low and high air, compressor failure, tamper, panel AC loss — each annunciates.","7. Restore: drain; reset the valve per the manufacturer; panel normal; sign-off. Air left off — the compressor can bring the system up overnight."],"defectIndex":6,"codeRef":null,"explanation":"Line 7 — restore means drain, reset the valve (clapper, priming water), restore air, panel normal, sign-off; every isolation reversed and verified before you leave."},"hook":"No air means no supervision and no interlock — restore it before the sign-off, not overnight.","source":"Pre-action › Sample L4 script — double-interlock (the Day 12 exercise)","par":40,"confirmInEdition":false},{"id":"P5-num-01","topicId":"P5","type":"number","prompt":"The sample double-interlock L4 script has ___ steps. Its prerequisites include central station on ___. Step 6 faults the solenoid circuit with an ___ and a ___.","answer":{"fields":[{"label":"steps","value":7},{"label":"central station on …","value":"test","aliases":["on test","test mode","test status"]},{"label":"solenoid circuit fault 1","value":"open","aliases":["open circuit","open fault","an open"]},{"label":"solenoid circuit fault 2","value":"short","aliases":["short circuit","short fault","a short"]}],"codeRef":null,"explanation":"Seven steps: prerequisites (hydro and air test passed, panel programmed, central station on test, gauges calibrated, drain path ready) → detection only → loss of air only → both → manual release → faults (open and short on the solenoid circuit, detection faults, low and high air, compressor or nitrogen generator failure, tamper, panel AC loss) → restore."},"hook":"Seven steps, central station on test, and the solenoid gets opened and shorted on purpose.","source":"Pre-action › Sample L4 script — double-interlock (the Day 12 exercise)","par":30,"confirmInEdition":false},{"id":"P5-scn-01","topicId":"P5","type":"scenario","prompt":"What are the failure modes in a pre-action release sequence?","interviewerPhrasing":"What are the failure modes in a pre-action release sequence?","answer":{"beats":["Releasing solenoid open or ground fault","Detection zone fault","Loss of supervisory air","Compressor or nitrogen generator failure","Priming water lost","Panel power","Manual release path — each one gets a line in your script"],"requiresNumber":false,"codeRef":null,"explanation":"Releasing solenoid open or ground fault, detection zone fault, loss of supervisory air, compressor or nitrogen generator failure, priming water lost, panel power, manual release path. Each one gets a line in your script."},"hook":"Solenoid, zone, air, compressor, priming water, power, manual pull — seven lines in the script.","source":"Likely questions and day-of checklist › Commissioning technical (the 35%)","par":90,"confirmInEdition":false},{"id":"P5-scn-02","topicId":"P5","type":"scenario","prompt":"Walk me through your L4 on a double-interlock pre-action system, start to restore.","interviewerPhrasing":"Walk me through a double-interlock functional test.","answer":{"beats":["Prerequisites: hydro and air test passed; panel programmed; central station on test; gauges calibrated; drain path ready","Detection only (one zone, then the cross-zone or Fire 2 input): alarms annunciate, valve stays shut","Loss of air only (open the inspector's test): low-air supervisory, valve stays shut","Both: valve trips, waterflow pressure switch alarms; record time to trip and time to water against the table or calc","Manual release per the design","Faults: open and short on the solenoid circuit, detection faults, low and high air, compressor or nitrogen generator failure, tamper, panel AC loss","Restore: drain, reset the valve per the manufacturer, restore air, panel normal, sign-off"],"requiresNumber":true,"codeRef":null,"explanation":"Prerequisites → detection only, valve shut → loss of air only, valve shut → both: trip, record time to trip and time to water → manual release → faults → restore (drain, reset, restore air, panel normal, sign-off)."},"hook":"Shut, shut, trip — then by hand, then break it seven ways, then put it back.","source":"Pre-action › Sample L4 script — double-interlock (the Day 12 exercise)","par":120,"confirmInEdition":false},{"id":"P6-num-01","topicId":"P6","type":"number","prompt":"The test connection orifice matches the smallest ___ on the system. The NFPA 25 baseline you're setting: partial trip test every ___ year(s), full-flow trip test every ___ years. Standard?","answer":{"fields":[{"label":"smallest …","value":"K-factor","aliases":["k factor","k","k-factor sprinkler","sprinkler k-factor"]},{"label":"partial trip test, every … year(s)","value":1},{"label":"full-flow trip test, every … years","value":3}],"codeRef":"NFPA 25","codeRefAliases":["25","NFPA-25","NFPA 25 baseline"],"explanation":"The test connection has an orifice matching the smallest K-factor on the system. NFPA 25: dry and pre-action valves get a partial trip test every year and a full-flow trip test every 3 years."},"hook":"Smallest K at the far end; partial trip yearly, full flow every third year.","source":"Pre-action › Test-day details an interviewer will probe","par":30,"confirmInEdition":false},{"id":"P6-num-02","topicId":"P6","type":"number","prompt":"Common acceptance failures: a compressor too small to restore air in ___ minutes; low-point drains missing or ___; ___ sections that hold water in a dry system.","answer":{"fields":[{"label":"restore air in, minutes","value":30},{"label":"drains missing or …","value":"unlabeled","aliases":["unlabelled","not labeled","not labelled","missing labels","mislabeled"]},{"label":"… sections","value":"trapped","aliases":["trapped sections","trap","traps","low sections"]}],"codeRef":null,"explanation":"Common acceptance failures: air leaks at grooved couplings and threaded joints; a compressor too small to restore air in 30 minutes; missing or unlabeled low-point drains; trapped sections that hold water in a dry system."},"hook":"Thirty minutes to re-air, every drain labeled, no trap holding water.","source":"Pre-action › Test-day details an interviewer will probe","par":30,"confirmInEdition":false},{"id":"P6-ord-01","topicId":"P6","type":"order","prompt":"What you record on a trip test — put the five readings in the order they happen.","interviewerPhrasing":"What do you write down on a pre-action trip test?","answer":{"steps":["Starting air pressure","Air pressure at trip","Time to trip","Time to water at the test connection","Water pressure at the test connection once flow is steady"],"codeRef":null,"explanation":"Record: starting air pressure, air pressure at trip, time to trip, time to water at the test connection, and water pressure there once flow is steady."},"hook":"Air at start, air at trip, time to trip, time to water, water pressure settled.","source":"Pre-action › Test-day details an interviewer will probe","par":45,"confirmInEdition":false},{"id":"P6-def-01","topicId":"P6","type":"defect","prompt":"Trip test record and close-out. One line treats a failure as paperwork. Tap it.","answer":{"lines":["1. Test connection: orifice matching the smallest K-factor, at the most remote end of the top branch line.","2. Record starting air pressure and air pressure at trip.","3. Record time to trip and time to water at the test connection.","4. Record water pressure at the test connection once flow is steady.","5. Delivery time over the table value: logged as a punch item to close after turnover.","6. Low-point drains located and labeled; no trapped sections holding water.","7. Restore: drain, reset the valve, restore air, panel normal, sign-off."],"defectIndex":4,"codeRef":null,"explanation":"Line 5 — a failed delivery time is a code failure, not a punch item: split the system onto another valve, adjust air pressure within the valve's listed range, or re-run the calc — then retest."},"hook":"Late water isn't a punch item; it's a retest.","source":"Pre-action › Test-day details an interviewer will probe","par":40,"confirmInEdition":false},{"id":"P6-def-02","topicId":"P6","type":"defect","prompt":"Trip test script. One line times the water from the wrong place. Tap it.","answer":{"lines":["1. Prerequisites: air test passed; central station on test; drain path ready; gauges calibrated.","2. Inspector's test connection used for timing: the one at the riser next to the valve, for a quick reading.","3. Starting air pressure recorded; detection activated and the test connection opened at the same moment.","4. Air pressure at trip and time to trip recorded.","5. Time to water at the test connection recorded against the table or calc.","6. Water pressure at the test connection recorded once flow is steady.","7. Restore: drain, reset the valve per the manufacturer, restore air, panel normal, sign-off."],"defectIndex":1,"codeRef":null,"explanation":"Line 2 — on dry systems the test connection sits at the most remote end of the top branch line, with an orifice matching the smallest K-factor."},"hook":"Time the water where it arrives last, not where it leaves first.","source":"Pre-action › Test-day details an interviewer will probe","par":40,"confirmInEdition":false},{"id":"P6-scn-01","topicId":"P6","type":"scenario","prompt":"The delivery time came in at 70 s on a light-hazard double-interlock system. What now?","interviewerPhrasing":"Your pre-action trip test misses the delivery time. Punch item or failure?","answer":{"beats":["A failed delivery time is a code failure, not a punch item (light hazard allows 60 s)","Fix: split the system onto another valve","Fix: adjust air pressure within the valve's listed range","Fix: re-run the calc","Then retest","Record the trip test values: starting air, air at trip, time to trip, time to water, steady water pressure"],"requiresNumber":true,"codeRef":null,"explanation":"A failed delivery time is a code failure, not a punch item. Fixes: split the system onto another valve, adjust air pressure within the valve's listed range, or re-run the calc — then retest."},"hook":"Ten seconds late is a failure, not a punch — split it, re-air it, or recalc it, then run it again.","source":"Pre-action › Test-day details an interviewer will probe","par":90,"confirmInEdition":false},{"id":"P6-scn-02","topicId":"P6","type":"scenario","prompt":"What do you record on a trip test, and where is the test connection?","interviewerPhrasing":"Tell me about the test connection and what you log when you trip the valve.","answer":{"beats":["Starting air pressure","Air pressure at trip","Time to trip","Time to water at the test connection","Water pressure there once flow is steady","The test connection has an orifice matching the smallest K-factor on the system","On dry systems it sits at the most remote end of the top branch line"],"requiresNumber":false,"codeRef":null,"explanation":"Record starting air pressure, air pressure at trip, time to trip, time to water at the test connection, and water pressure there once flow is steady. The test connection has an orifice matching the smallest K-factor; on dry systems it sits at the most remote end of the top branch line."},"hook":"Five readings from one tap at the far end of the top line, drilled to the smallest K.","source":"Pre-action › Test-day details an interviewer will probe","par":90,"confirmInEdition":false},{"id":"P7-def-01","topicId":"P7","type":"defect","prompt":"Releasing panel power check on an FM-insured job. One line passes the wrong number. Tap it.","answer":{"lines":["1. Releasing panel, Hall 1 pre-action: the owner's insurer specifies FM Approvals.","2. Standby calc: 24 h standby plus 5 min alarm per NFPA 72 — meets the insurer's requirement.","3. Solenoid and panel listed as compatible (listing numbers on the submittal).","4. Secondary power test: primary AC removed; panel carries the standby load; AC trouble reported.","5. Alarm load applied on batteries; release output proven on test lamps.","6. Return to normal: AC restored, batteries on charge, trouble clear, verified."],"defectIndex":1,"codeRef":null,"explanation":"Line 2 — FM Approval Standard 1011 requires 90 h standby plus 10 min for deluge and pre-action releasing; 24 h + 5 min is NFPA 72's minimum."},"hook":"On an FM job the battery calc reads 90 and 10, not 24 and 5.","source":"Pre-action › Releasing panel power.","par":40,"confirmInEdition":false},{"id":"P7-num-01","topicId":"P7","type":"number","prompt":"Releasing panel standby power under the fire alarm code: ___ h standby plus ___ min alarm. Which standard?","interviewerPhrasing":"How much battery does the releasing panel need?","answer":{"fields":[{"label":"standby, h","value":24},{"label":"alarm, min","value":5}],"codeRef":"NFPA 72","codeRefAliases":["72","NFPA-72","NFPA 72 Chapter 10","NFPA 72 Ch 10"],"explanation":"NFPA 72 requires 24 h standby plus 5 min alarm. FM Approval Standard 1011 requires 90 h plus 10 min for deluge and pre-action releasing — ask whether the owner or insurer specifies FM."},"hook":"A day on standby and five minutes of noise — that's the code floor.","source":"Pre-action › Releasing panel power.","par":25,"confirmInEdition":false},{"id":"P7-num-02","topicId":"P7","type":"number","prompt":"FM Approval Standard 1011: ___ h standby plus ___ min for ___ and pre-action releasing. Which FM standard?","answer":{"fields":[{"label":"standby, h","value":90},{"label":"alarm, min","value":10},{"label":"… and pre-action releasing","value":"deluge","aliases":["deluge systems","deluge release","deluge releasing"]}],"codeRef":"FM Approval Standard 1011","codeRefAliases":["FM 1011","1011","FM Approval 1011","FM Standard 1011","FM Approvals 1011"],"explanation":"FM Approval Standard 1011 requires 90 h standby plus 10 min for deluge and pre-action releasing (NFPA 72: 24 h plus 5 min). Ask whether the owner or insurer specifies FM."},"hook":"FM wants almost four days — 90 hours and ten minutes — before the valve may starve.","source":"Pre-action › Releasing panel power.","par":30,"confirmInEdition":false},{"id":"P7-num-03","topicId":"P7","type":"number","prompt":"Solenoid and panel must be listed as ___. Before sizing the batteries, ask whether the owner or ___ specifies FM.","answer":{"fields":[{"label":"listed as …","value":"compatible","aliases":["compatible with each other","a compatible pair","compatibility listed"]},{"label":"owner or …","value":"insurer","aliases":["the insurer","insurance","insurance carrier","FM"]}],"codeRef":null,"explanation":"Solenoid and panel must be listed as compatible. FM Approval Standard 1011 (90 h + 10 min) applies when the owner or insurer specifies FM; otherwise NFPA 72's 24 h + 5 min."},"hook":"Listed together, and ask the insurer before you buy batteries.","source":"Pre-action › Releasing panel power.","par":25,"confirmInEdition":false},{"id":"P7-scn-01","topicId":"P7","type":"scenario","prompt":"How much standby power does a pre-action releasing panel need?","interviewerPhrasing":"The releasing panel battery calc — what number do you check it against?","answer":{"beats":["NFPA 72: 24 h standby plus 5 min alarm","FM Approval Standard 1011: 90 h standby plus 10 min for deluge and pre-action releasing","Ask whether the owner or insurer specifies FM","Solenoid and panel must be listed as compatible"],"requiresNumber":true,"codeRef":"FM Approval Standard 1011","codeRefAliases":["FM 1011","1011","FM Approval 1011","FM Standard 1011","FM Approvals 1011"],"explanation":"NFPA 72 requires 24 h standby plus 5 min alarm; FM Approval Standard 1011 requires 90 h plus 10 min for deluge and pre-action releasing — ask whether the owner or insurer specifies FM. Solenoid and panel must be listed as compatible."},"hook":"24 + 5 by code, 90 + 10 by FM — the insurer decides which.","source":"Pre-action › Releasing panel power.","par":75,"confirmInEdition":false},{"id":"P8-num-01","topicId":"P8","type":"number","prompt":"Double-interlock costs: a ___% design-area increase, sized like ___ pipe. Which FM data sheet cautions that double-interlock can delay control?","answer":{"fields":[{"label":"design-area increase, %","value":30},{"label":"sized like … pipe","value":"dry","aliases":["dry pipe","a dry pipe system","dry-pipe","dry system"]}],"codeRef":"FM Data Sheet 5-32","codeRefAliases":["FM 5-32","FM DS 5-32","DS 5-32","5-32","Data Sheet 5-32"],"explanation":"Double-interlock is sized like dry pipe with a 30% design-area increase; FM Data Sheet 5-32 cautions that double-interlock can delay control."},"hook":"Thirty percent more area, dry-pipe rules, and FM 5-32 raising an eyebrow.","source":"Pre-action › Data center points to make","par":30,"confirmInEdition":false},{"id":"P8-num-02","topicId":"P8","type":"number","prompt":"One ___ detection signal or one ___ sprinkler alone can't put water on IT. The usual release input is ASD Fire ___.","answer":{"fields":[{"label":"one … detection signal","value":"false","aliases":["false alarm","spurious","a false"]},{"label":"one … sprinkler","value":"damaged","aliases":["broken","a damaged","mechanically damaged","fused"]},{"label":"ASD Fire …","value":2}],"codeRef":null,"explanation":"Double-interlock is common in data halls because one false detection signal or one damaged sprinkler alone can't put water on IT; ASD Fire 2 (or a second detector) is the usual release input."},"hook":"False signal, damaged head — neither alone — and Fire 2 is the trigger.","source":"Pre-action › Data center points to make","par":25,"confirmInEdition":false},{"id":"P8-def-01","topicId":"P8","type":"defect","prompt":"Data hall pre-action sequence notes. One line names the wrong release input. Tap it.","answer":{"lines":["1. Hall 1 pre-action, double-interlock: valve opens on detection and loss of air.","2. Release input: ASD Fire 1 energizes the pre-action solenoid.","3. Alert and Action call Ops to investigate.","4. Loss of air (sprinkler operation) still required before water enters the pipe.","5. Delivery time proven at the test connection against the table or calc.","6. Nitrogen generator failure annunciates as a fault; oxygen-depletion detector in the generator room proven.","7. Restore: drain, reset the valve, restore nitrogen, panel normal, sign-off."],"defectIndex":1,"codeRef":null,"explanation":"Line 2 — ASD Fire 2 (or a second detector) is the usual release input; Fire 1 is the building alarm."},"hook":"Fire 1 rings the building; Fire 2 arms the valve.","source":"Pre-action › Data center points to make","par":40,"confirmInEdition":false},{"id":"P8-scn-01","topicId":"P8","type":"scenario","prompt":"Why double-interlock in a data hall, and what does it cost you?","interviewerPhrasing":"Why double-interlock in a data hall, and what does it cost you?","answer":{"beats":["One false detection signal alone can't put water on IT","One damaged sprinkler alone can't either (mechanical damage)","Cost: delivery time","Cost: design area — the 30% increase","Cost: complexity","You prove the delivery time at acceptance, not assume it"],"requiresNumber":true,"codeRef":"FM Data Sheet 5-32","codeRefAliases":["FM 5-32","FM DS 5-32","DS 5-32","5-32","Data Sheet 5-32"],"explanation":"Protection against a single false signal or mechanical damage, paid for in delivery time, design area and complexity — and you prove the delivery time at acceptance, not assume it. FM Data Sheet 5-32 cautions that double-interlock can delay control."},"hook":"Two keys to open, 30% more area to pay — and you time the water.","source":"Pre-action › Data center points to make","par":90,"confirmInEdition":false},{"id":"P8-scn-02","topicId":"P8","type":"scenario","prompt":"Nitrogen inerting on a pre-action system — why, and what else does it bring onto the site?","interviewerPhrasing":"Why would the dry pipe be on nitrogen instead of air?","answer":{"beats":["Nitrogen inerting fights corrosion in the dry pipe","It puts an oxygen-depletion detector in the generator room (alarm at 19.5% O2)","Nitrogen generator failure is one of the faults in the L4 script"],"requiresNumber":true,"codeRef":null,"explanation":"Nitrogen inerting fights corrosion in the dry pipe; it also puts an oxygen-depletion detector in the generator room (alarm at 19.5% O2), and nitrogen generator failure is a fault the L4 script has to annunciate."},"hook":"Nitrogen saves the pipe and adds a 19.5% O2 alarm next door.","source":"Pre-action › Data center points to make","par":60,"confirmInEdition":false},{"id":"P8-scn-03","topicId":"P8","type":"scenario","prompt":"Doesn't double-interlock just delay the water?","interviewerPhrasing":"Doesn't double-interlock just delay the water?","answer":{"beats":["Yes — delivery time is the cost, with the 30% design-area increase and complexity","FM Data Sheet 5-32 cautions that double-interlock can delay control","The benefit: one false signal or one damaged sprinkler alone can't put water on IT","So you prove the delivery time at acceptance, not assume it"],"requiresNumber":true,"codeRef":"FM Data Sheet 5-32","codeRefAliases":["FM 5-32","FM DS 5-32","DS 5-32","5-32","Data Sheet 5-32"],"explanation":"The cost is delivery time, the area increase and complexity — FM Data Sheet 5-32 cautions that double-interlock can delay control. The benefit is that one false detection signal or one damaged sprinkler alone can't put water on IT, and you prove the delivery time at acceptance."},"hook":"It does delay — so the stopwatch at acceptance is the price of the second key.","source":"Pre-action › Data center points to make","par":75,"confirmInEdition":false},{"id":"F1-ord-01","topicId":"F1","type":"order","prompt":"Put the fire pump acceptance sequence in order, L1 to L5.","interviewerPhrasing":"Place a fire pump on the commissioning ladder for me.","answer":{"steps":["L1: certified shop test curve on file","L2: alignment and rotation checked; no elbow or tee parallel to the shaft within 10 pipe diameters of the suction flange; relief valve and test header as designed","L3: suction flush and hydro; controller settings; jockey and fire pump start / stop pressures","L4: field acceptance test — churn, 100%, 150%; all starts; alternate-source transfer","L5: pump runs on generator at system demand; signals reach the FACP"],"codeRef":null,"explanation":"L1 shop curve on file → L2 alignment, rotation, suction piping, relief valve and test header → L3 flush, hydro and controller settings → L4 field acceptance test → L5 pump on generator at demand with signals at the FACP."},"hook":"Curve, fit, flush, flow, generator — the pump climbs the same ladder as everything else.","source":"Fire pump › Acceptance sequence","par":50,"confirmInEdition":false},{"id":"F1-def-01","topicId":"F1","type":"defect","prompt":"One line in this pump acceptance script breaks a rule from the guide. Tap it.","answer":{"lines":["1. Prerequisites: certified shop curve on file; pump, controller and transfer switch reps present; central station on test.","2. Churn: record speed, suction, discharge, volts and amps; discharge not more than 140% of rated pressure.","3. 100% rated flow: record speed, suction, discharge, flow, volts and amps.","4. 150% rated flow: pressure at least 65% of rated; record the same readings.","5. Correct each point to rated speed with the affinity laws; plot net pressure.","6. Acceptance: the field curve is within 95% of the certified shop curve at each point.","7. Run at least 1 h cumulative; all automatic and manual starts completed.","8. Return to normal: controller in automatic, test header valves closed, central station off test."],"defectIndex":5,"codeRef":null,"explanation":"Line 6 — field results must match the certified shop curve within the accuracy of the test equipment. The 95% / 5% figure is NFPA 25's annual test, not acceptance."},"hook":"Within gauge accuracy, not within 95% — save the 95/5 for NFPA 25's birthday test.","source":"Fire pump › table","par":45,"confirmInEdition":false},{"id":"F1-num-01","topicId":"F1","type":"number","prompt":"Pump field acceptance criteria: churn no more than ___% of rated pressure; at 150% of rated flow at least ___% of rated pressure. And the NFPA 20 chapter for field acceptance.","interviewerPhrasing":"What are the pass criteria on a fire pump acceptance test?","answer":{"fields":[{"label":"churn, max % of rated pressure","value":140},{"label":"150% flow, min % of rated pressure","value":65}],"codeRef":"NFPA 20 Chapter 14","codeRefAliases":["20 14","NFPA 20 Ch. 14","Chapter 14","NFPA 20 chapter 14 field acceptance","20 Chapter 14"],"explanation":"Churn no more than 140% of rated pressure; 150% flow at least 65% of rated pressure (NFPA 20 Chapter 14, field acceptance). The installed pump has to reproduce its certified shop curve at churn, 100% and 150%."},"hook":"140 at churn, 65 at 150 — the curve bends from fourteen-oh down to sixty-five.","source":"Fire pump › table","par":30,"confirmInEdition":false},{"id":"F1-num-02","topicId":"F1","type":"number","prompt":"The three field test points are churn, ___% and ___% of rated flow; cumulative run time during the test is at least ___ h. Chapter?","answer":{"fields":[{"label":"second test point, % of rated flow","value":100},{"label":"third test point, % of rated flow","value":150},{"label":"cumulative run time, h","value":1}],"codeRef":"NFPA 20 Chapter 14","codeRefAliases":["20 14","NFPA 20 Ch. 14","Chapter 14","20 Chapter 14"],"explanation":"Churn, 100% and 150% of rated flow, with speed, suction, discharge, flow, volts and amps recorded at each point; at least 1 h cumulative run time (NFPA 20 Chapter 14)."},"hook":"0 · 100 · 150, and the pump runs an hour before you sign.","source":"Fire pump › table","par":30,"confirmInEdition":false},{"id":"F1-num-03","topicId":"F1","type":"number","prompt":"Curve match: the ___% / ___% figure is NOT an acceptance criterion — it belongs to which standard's annual test? Acceptance is a match to the certified shop curve within the accuracy of the test equipment.","interviewerPhrasing":"Is the 95% rule how you accept a new pump?","answer":{"fields":[{"label":"NFPA 25 annual-test figure, first %","value":95},{"label":"NFPA 25 annual-test figure, second %","value":5}],"codeRef":"NFPA 25","codeRefAliases":["25","NFPA25","NFPA 25 annual test","NFPA 25 annual"],"explanation":"Field results must match the certified shop curve within the accuracy of the test equipment. The 95% / 5% figure is NFPA 25's annual test — not acceptance."},"hook":"95/5 is the birthday test, not the birth certificate — acceptance is the shop curve within gauge accuracy.","source":"Fire pump › table","par":25,"confirmInEdition":false},{"id":"F1-num-04","topicId":"F1","type":"number","prompt":"Governing documents for the pump test: NFPA 20 Chapter ___ (field acceptance); NEC Article ___ (fire pumps); NFPA ___ for the baseline you hand to Ops.","answer":{"fields":[{"label":"NFPA 20 chapter","value":14},{"label":"NEC article","value":695},{"label":"NFPA standard for the Ops baseline","value":25}],"codeRef":null,"explanation":"NFPA 20 Chapter 14 (field acceptance), NEC 695, NFPA 25 for the baseline. The pump, engine, controller and transfer switch manufacturers or their authorized reps must be present."},"hook":"20-14 to accept it, 695 to feed it, 25 to keep it.","source":"Fire pump › Governing","par":25,"confirmInEdition":false},{"id":"F1-scn-01","topicId":"F1","type":"scenario","prompt":"What does the fire pump field acceptance test prove, and what are the numbers you accept against?","interviewerPhrasing":"Walk me through what a pump acceptance test has to show you.","answer":{"beats":["The installed pump reproduces its certified shop curve at churn, 100% and 150% of rated flow","The controller and driver start it every time, on every power source","Churn: no more than 140% of rated pressure","150% flow: at least 65% of rated pressure","Curve match within the accuracy of the test equipment — 95% / 5% is NFPA 25's annual test, not acceptance","Pump, engine, controller and transfer switch manufacturers or their reps present"],"requiresNumber":true,"codeRef":"NFPA 20 Chapter 14","codeRefAliases":["20 14","Chapter 14","NFPA 20 Ch. 14"],"explanation":"The field acceptance test proves the installed pump reproduces its certified shop curve at churn, 100% and 150% of rated flow (churn ≤ 140%, 150% ≥ 65% of rated pressure), and that the controller and driver start it every time, on every power source (NFPA 20 Chapter 14)."},"hook":"Three points on the curve, every start on every source — 140 at the top, 65 at the end.","source":"Fire pump","par":90,"confirmInEdition":false},{"id":"F2-num-01","topicId":"F2","type":"number","prompt":"Starts on the acceptance test: ___ automatic + ___ manual, each run at least ___ min at full speed; cumulative run time at least ___ h. Chapter?","interviewerPhrasing":"How many starts does a pump acceptance test take, and how long does the pump run?","answer":{"fields":[{"label":"automatic starts","value":6},{"label":"manual starts","value":6},{"label":"minutes per start at full speed","value":5},{"label":"cumulative run time, h","value":1}],"codeRef":"NFPA 20 Chapter 14","codeRefAliases":["20 14","NFPA 20 Ch. 14","Chapter 14","20 Chapter 14"],"explanation":"6 automatic + 6 manual starts, each run at least 5 min at full speed; at least 1 h cumulative run time during the test (NFPA 20 Chapter 14)."},"hook":"Six and six, five minutes each — twelve starts add up to the hour.","source":"Fire pump › table","par":30,"confirmInEdition":false},{"id":"F2-num-02","topicId":"F2","type":"number","prompt":"Diesel pump starts are split across ___ battery sets, and no 5-min run is needed between starts until cumulative cranking reaches ___ s. Chapter?","interviewerPhrasing":"On a diesel pump, what's different about the starts?","answer":{"fields":[{"label":"battery sets the starts are split across","value":2},{"label":"cumulative cranking before a 5-min run is needed, s","value":45}],"codeRef":"NFPA 20 Chapter 14","codeRefAliases":["20 14","NFPA 20 Ch. 14","Chapter 14","20 Chapter 14"],"explanation":"Diesel: starts split across both battery sets; no 5-min run needed between starts until cumulative cranking reaches 45 s (NFPA 20 Chapter 14)."},"hook":"Two battery sets share the cranking; 45 seconds of crank buys a 5-minute run.","source":"Fire pump › table","par":25,"confirmInEdition":false},{"id":"F2-num-03","topicId":"F2","type":"number","prompt":"Total starts on the test (automatic plus manual): ___; each runs at least ___ min at full speed; the pump runs at least ___ h in total.","answer":{"fields":[{"label":"total starts","value":12},{"label":"minutes per start","value":5},{"label":"total run time, h","value":1}],"codeRef":"NFPA 20 Chapter 14","codeRefAliases":["20 14","NFPA 20 Ch. 14","Chapter 14","20 Chapter 14"],"explanation":"6 automatic + 6 manual = 12 starts, each run at least 5 min at full speed, with at least 1 h cumulative run time (NFPA 20 Chapter 14)."},"hook":"Twelve starts, five minutes each, one hour on the clock.","source":"Fire pump › table","par":25,"confirmInEdition":false},{"id":"F2-mat-01","topicId":"F2","type":"matrix","prompt":"Electric vs diesel: which rule applies to which driver? ● = applies, — = does not.","answer":{"grid":{"inputs":["Electric motor pump","Diesel pump"],"outputs":["6 automatic + 6 manual starts","Starts split across two battery sets","Minimum run timer 10 min after an automatic start","Minimum run timer 30 min after an automatic start"],"cells":[["●","—","●","—"],["●","●","—","●"]],"notes":[["","","",""],["","No 5-min run between starts until cumulative cranking reaches 45 s","",""]]},"codeRef":null,"explanation":"Both drivers take 6 automatic + 6 manual starts. Diesel splits the starts across both battery sets and has a 30-min minimum run timer; electric has 10 min after an automatic start."},"hook":"Both get twelve starts; only diesel shares batteries and runs 30 — electric runs 10.","source":"Fire pump › table","par":60,"confirmInEdition":false},{"id":"F2-def-01","topicId":"F2","type":"defect","prompt":"One line in this diesel pump start test breaks a rule. Tap it.","answer":{"lines":["1. Prerequisites: both battery sets charged; controller in automatic; central station on test; engine rep present.","2. Automatic starts: 6, initiated by a pressure drop at the sensing line; each run at least 5 min at full speed.","3. Manual starts: 6 from the controller.","4. Crank all 12 starts from battery set A; hold set B in reserve.","5. No 5-min run between starts until cumulative cranking reaches 45 s.","6. Record speed, suction and discharge on each run; total run time at least 1 h.","7. Return to normal: controller in automatic, both battery chargers on, central station off test."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — diesel starts are split across both battery sets. Everything else matches the guide: 6 + 6 starts, 5 min each, 45 s cumulative cranking rule, 1 h total."},"hook":"Two battery sets, both proven — a diesel start test on one set proves half a pump.","source":"Fire pump › table","par":40,"confirmInEdition":false},{"id":"F2-scn-01","topicId":"F2","type":"scenario","prompt":"Describe the starts on a diesel fire pump acceptance test.","interviewerPhrasing":"Walk me through the starts on a diesel pump acceptance test.","answer":{"beats":["6 automatic + 6 manual starts","Each run at least 5 min at full speed","Starts split across both battery sets","No 5-min run needed between starts until cumulative cranking reaches 45 s","At least 1 h cumulative run time during the test"],"requiresNumber":true,"codeRef":"NFPA 20 Chapter 14","codeRefAliases":["20 14","Chapter 14","NFPA 20 Ch. 14"],"explanation":"6 automatic + 6 manual starts, each run at least 5 min at full speed; diesel starts split across both battery sets with no 5-min run needed between starts until cumulative cranking reaches 45 s; at least 1 h cumulative run time (NFPA 20 Chapter 14)."},"hook":"6 + 6, 5 minutes, both battery sets, 45 s of crank, 1 hour total.","source":"Fire pump › table","par":90,"confirmInEdition":false},{"id":"F3-ord-01","topicId":"F3","type":"order","prompt":"Order the alternate-power part of the pump acceptance test.","answer":{"steps":["Run the pump at peak load","Simulate loss of normal power","Transfer to the alternate source without opening overcurrent devices","Transfer back to normal without opening overcurrent devices","Repeat until at least half the starts are on the alternate source"],"codeRef":null,"explanation":"Simulate loss of normal power at peak load; transfer to the alternate source and back without opening overcurrent devices; at least half the starts on the alternate source."},"hook":"Load it, lose it, transfer over, transfer back, then do half the starts that way.","source":"Fire pump › table","par":45,"confirmInEdition":false},{"id":"F3-mat-01","topicId":"F3","type":"matrix","prompt":"L5 pump signals at the FACP: which signal does each driver report? ● = yes, — = not for this driver.","interviewerPhrasing":"What pump signals do you expect at the fire alarm panel?","answer":{"grid":{"inputs":["Electric pump","Diesel pump"],"outputs":["Pump running","Loss of phase or phase reversal","Controller trouble","Engine running","Switch off-automatic"],"cells":[["●","●","●","—","—"],["—","—","●","●","●"]],"notes":[["","","","No engine on an electric pump",""],["Diesel reports engine running instead","","","",""]]},"codeRef":null,"explanation":"Signals reach the FACP — pump running, loss of phase or phase reversal, controller trouble; for diesel, engine running, controller trouble, and switch off-automatic."},"hook":"Electric: running, phase, trouble. Diesel: engine, trouble, off-auto.","source":"Fire pump › Acceptance sequence","par":60,"confirmInEdition":false},{"id":"F3-def-01","topicId":"F3","type":"defect","prompt":"One line in this alternate-power test breaks a rule. Tap it.","answer":{"lines":["1. Prerequisites: generator available; transfer switch rep present; central station on test.","2. Run the pump at peak load.","3. Simulate loss of normal power at the controller's normal feed.","4. Watch the transfer to the alternate source; pump keeps running; record the transfer.","5. Restore normal power; transfer back; no overcurrent device opens on either transfer.","6. Perform the remaining starts on normal power only — the alternate source has now been proven.","7. Simulate loss of phase and phase reversal; confirm each reaches the FACP.","8. Return to normal: transfer switch and controller in automatic, central station off test."],"defectIndex":5,"codeRef":null,"explanation":"Line 6 — at least half the starts must be on the alternate source. One transfer does not prove the alternate source starts the pump every time."},"hook":"Half the starts on the alternate — one transfer is a demo, six is a test.","source":"Fire pump › table","par":45,"confirmInEdition":false},{"id":"F3-num-01","topicId":"F3","type":"number","prompt":"Alternate power during acceptance: simulate loss of normal power at peak load; at least ___% of the starts on the alternate source; transfer to the alternate source and back without opening what? Chapter?","interviewerPhrasing":"How much of the pump test runs on the alternate source?","answer":{"fields":[{"label":"share of starts on the alternate source, %","value":50},{"label":"transfer and back without opening…","value":"overcurrent devices","aliases":["overcurrent device","the overcurrent devices","breakers","circuit breakers","overcurrent protection","ocpd","any overcurrent device"]}],"codeRef":"NFPA 20 Chapter 14","codeRefAliases":["20 14","NFPA 20 Ch. 14","Chapter 14","20 Chapter 14"],"explanation":"Simulate loss of normal power at peak load; transfer to the alternate source and back without opening overcurrent devices; at least half the starts on the alternate source (NFPA 20 Chapter 14)."},"hook":"Pull it at peak, transfer both ways, no breaker trips — and half the starts ride the alternate.","source":"Fire pump › table","par":35,"confirmInEdition":false},{"id":"F3-scn-01","topicId":"F3","type":"scenario","prompt":"How do you prove the pump's alternate power source during acceptance?","interviewerPhrasing":"How do you prove the fire pump on its alternate source?","answer":{"beats":["Simulate loss of normal power at peak load","Transfer to the alternate source and back","Without opening overcurrent devices","At least half the starts on the alternate source","At L5 the pump runs on generator at system demand with signals at the FACP"],"requiresNumber":true,"codeRef":"NFPA 20 Chapter 14","codeRefAliases":["20 14","Chapter 14","NFPA 20 Ch. 14"],"explanation":"Simulate loss of normal power at peak load; transfer to the alternate source and back without opening overcurrent devices; at least half the starts on the alternate source (NFPA 20 Chapter 14). At L5 the pump runs on generator at system demand."},"hook":"Peak load, both directions, no breaker, half the starts — then the generator carries demand at L5.","source":"Fire pump › table","par":90,"confirmInEdition":false},{"id":"F3-scn-02","topicId":"F3","type":"scenario","prompt":"On an islanded-power campus, what is the pump's alternate source, and how do you prove the transfer?","interviewerPhrasing":"There's no utility feed here. How do you write the pump's alternate-power test?","answer":{"beats":["The alternate source is part of a microgrid, not a utility feed plus a generator","What counts as a reliable source has to be defined","How transfer is proven is a conversation with the electrical team and the AHJ","Normal and alternate sources are defined with the AHJ before you can write the transfer test"],"requiresNumber":false,"codeRef":null,"explanation":"On an islanded-power campus the pump's alternate source is part of a microgrid, not a utility feed plus a generator — what counts as a reliable source and how transfer is proven is a real conversation with the electrical team and the AHJ."},"hook":"No utility means no default \"normal\" — define both sources with the AHJ before the script exists.","source":"Fire pump › Data center points to make","par":90,"confirmInEdition":false},{"id":"F4-num-01","topicId":"F4","type":"number","prompt":"Electric motor limits during the test: starting voltage no more than ___% below rated at the controller line terminals; running at ___% of full-load current, no more than ___% below rated at the motor terminals. Chapter?","interviewerPhrasing":"What voltage drop is allowed on the electric fire pump motor, starting and running?","answer":{"fields":[{"label":"starting: max % below rated (controller line terminals)","value":15},{"label":"running check at % of full-load current","value":115},{"label":"running: max % below rated (motor terminals)","value":5}],"codeRef":"NFPA 20 Chapter 14","codeRefAliases":["20 14","NFPA 20 Ch. 14","Chapter 14","20 Chapter 14"],"explanation":"Starting: no more than 15% below rated at the controller line terminals. Running at 115% of full-load current: no more than 5% below rated at the motor terminals (NFPA 20 Chapter 14)."},"hook":"15 starting at the controller, 5 running at the motor — measured at 115% of full load.","source":"Fire pump › table","par":35,"confirmInEdition":false},{"id":"F4-num-02","topicId":"F4","type":"number","prompt":"Current limit on the motor: amps no more than FLA × ___ (the nameplate factor). The running voltage check is made at ___% of full-load current.","answer":{"fields":[{"label":"amps ≤ FLA × …","value":"service factor","aliases":["sf","the service factor","service-factor","motor service factor","nameplate service factor","s.f."]},{"label":"running check at % of full-load current","value":115}],"codeRef":"NFPA 20 Chapter 14","codeRefAliases":["20 14","NFPA 20 Ch. 14","Chapter 14","20 Chapter 14"],"explanation":"Amps ≤ FLA × service factor; the running voltage check is at 115% of full-load current, no more than 5% below rated at the motor terminals (NFPA 20 Chapter 14)."},"hook":"FLA times service factor is the ceiling on amps; 115% is where you read the volts.","source":"Fire pump › table","par":30,"confirmInEdition":false},{"id":"F4-def-01","topicId":"F4","type":"defect","prompt":"One line in this electric motor check breaks a rule. Tap it.","answer":{"lines":["1. Prerequisites: voltmeter and ammeter calibrated; rated voltage and FLA recorded from the motor nameplate.","2. At churn, 100% and 150%: record volts and amps at each point.","3. Starting: voltage at the controller line terminals not more than 15% below rated.","4. Running at 115% of full-load current: voltage at the motor terminals not more than 10% below rated.","5. Amps at 150% flow not more than FLA × service factor.","6. Return to normal: controller in automatic; test header valves closed."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — running at 115% of full-load current, the voltage at the motor terminals may be no more than
