 9%, FK-5-1-12 10%","It changes the overpressure vent sizing","A fail means leaks: hunt them under depressurization","Seal and retest; if turnover proceeds, document the risk acceptance"],"requiresNumber":true,"codeRef":null,"explanation":"Never just add agent — that changes concentration against NOAEL (HFC-227ea 9%, FK-5-1-12 10%) and the overpressure vent sizing. Find the leaks under depressurization, seal, retest; document the risk acceptance if turnover proceeds."},"hook":"Another cylinder moves you toward 9 and 10 percent and past the vent — seal the room instead.","source":"Commissioning technical (the 35%) › 10","par":75,"confirmInEdition":false},{"id":"G3-def-01","topicId":"G3","type":"defect","prompt":"CO2 acceptance script, turbine enclosure. One line breaks a rule. Tap it.","answer":{"lines":["1. Prerequisites: enclosure unoccupied and entry controlled; central station on test; impairment logged.","2. Verify the supervised lockout valve is installed and its position reports at the releasing panel.","3. Close and tag the lockout valve before any detection or release test.","4. Confirm the wintergreen odorizer is installed on the discharge.","5. Detection → pre-discharge alarm → pneumatic time delay sized to evacuation → release output; abort and manual release per the design.","6. Acceptance by simulated discharge only — no agent leaves the cylinders; file the simulation record as the discharge test.","7. Restore: lockout valve open and supervised normal; panel normal; central station off test."],"defectIndex":5,"codeRef":null,"explanation":"Line 6 — CO2 is the exception: NFPA 12 requires a full discharge test. Simulated actuators prove a clean agent sequence; they don't accept a CO2 system."},"hook":"Clean agent gets a lamp; CO2 gets a real discharge.","source":"Clean agent and CO2 › CO2 specifics (NFPA 12)","par":40,"confirmInEdition":false},{"id":"G3-num-01","topicId":"G3","type":"number","prompt":"CO2: minimum design concentration ___ %; surface fires reach design concentration within ___ min. Standard?","answer":{"fields":[{"label":"minimum design concentration, %","value":34},{"label":"surface fires, min","value":1}],"codeRef":"NFPA 12","codeRefAliases":["12","NFPA12","nfpa 12"],"explanation":"CO2: 34% minimum design concentration; surface fires reach design concentration within 1 min (NFPA 12). Lethal at design concentration — new total flooding is barred from normally occupied spaces."},"hook":"34% in a minute — enough to put out the fire and the person standing in it.","source":"Clean agent and CO2 › table","par":25,"confirmInEdition":false},{"id":"G3-num-02","topicId":"G3","type":"number","prompt":"CO2 safeguards: the lockout valve must be ___; the time delay is ___ (type); the odorizer is ___ (scent). Standard?","answer":{"fields":[{"label":"lockout valve","value":"supervised","aliases":["supervisory","monitored","supervised lockout","supervised lockout valve"]},{"label":"time delay type","value":"pneumatic","aliases":["pneumatic time delay","pneumatic delay","air"]},{"label":"odorizer","value":"wintergreen","aliases":["wintergreen odorizer","winter green","wintergreen oil"]}],"codeRef":"NFPA 12","codeRefAliases":["12","NFPA12","nfpa 12"],"explanation":"NFPA 12: a supervised lockout valve on all systems unless people can't physically enter, and wherever CO2 could migrate; a pneumatic time delay and pre-discharge alarm sized to evacuation; wintergreen odorizer as a recognized safeguard."},"hook":"Lock it, delay it, make it smell like wintergreen — CO2 gives no second chance.","source":"Clean agent and CO2 › CO2 specifics (NFPA 12)","par":30,"confirmInEdition":false},{"id":"G3-scn-01","topicId":"G3","type":"scenario","prompt":"What's different about commissioning a CO2 system, and what keeps people alive around it?","interviewerPhrasing":"We have CO2 in the turbine enclosures. What's different about accepting it?","answer":{"beats":["CO2 is the exception: NFPA 12 requires a full discharge test","Lethal at design concentration — 34% minimum; new total flooding barred from normally occupied spaces","Supervised lockout valve on all systems unless people can't physically enter, and wherever CO2 could migrate","Pneumatic time delay and pre-discharge alarm are mandatory, delay sized to evacuation","Wintergreen odorizer is a recognized safeguard","On a campus CO2 shows up in engine or turbine enclosures, not data halls"],"requiresNumber":true,"codeRef":"NFPA 12","codeRefAliases":["12","NFPA12","nfpa 12"],"explanation":"NFPA 12 requires a full discharge test. A supervised lockout valve on all systems unless people can't physically enter, and wherever CO2 could migrate; a pneumatic time delay and pre-discharge alarm sized to evacuation; wintergreen odorizer. 34% minimum, lethal at design concentration."},"hook":"Discharge it for real, lock it out for real — 34% and nobody inside.","source":"Clean agent and CO2 › CO2 specifics (NFPA 12)","par":90,"confirmInEdition":false},{"id":"G3-scn-02","topicId":"G3","type":"scenario","prompt":"Where would you expect to find CO2 on one of our campuses, and why not in a data hall?","answer":{"beats":["Engine or turbine enclosures","Lethal at design concentration","New total flooding barred from normally occupied spaces","34% minimum design concentration"],"requiresNumber":true,"codeRef":"NFPA 12","codeRefAliases":["12","NFPA12","nfpa 12"],"explanation":"On a data center campus CO2 shows up in engine or turbine enclosures, not data halls: it is lethal at design concentration (34% minimum) and new total flooding is barred from normally occupied spaces (NFPA 12)."},"hook":"Turbines yes, people no — 34% is a kill concentration.","source":"Clean agent and CO2 › CO2 specifics (NFPA 12)","par":60,"confirmInEdition":false},{"id":"G4-num-01","topicId":"G4","type":"number","prompt":"How aerosol works: a solid, typically ___-based compound ignites; the particles break the flame's chain reaction ___ (how); it does not depend on ___ depletion.","answer":{"fields":[{"label":"compound base","value":"potassium","aliases":["potassium-based","potassium based","k","potassium compound"]},{"label":"breaks the chain reaction","value":"chemically","aliases":["chemical","chemical chain reaction","chain reaction","chemical inhibition"]},{"label":"does not depend on","value":"oxygen","aliases":["o2","oxygen depletion","o 2"]}],"codeRef":null,"explanation":"A solid compound (typically potassium-based) ignites and produces fine solid particles and gas that break the flame's chain reaction chemically. It does not depend on oxygen depletion, but it obscures visibility, discharges hot, and leaves residue."},"hook":"Potassium smoke that argues with the flame chemically — no oxygen trick, lots of cleanup.","source":"Condensed aerosol › How it works","par":30,"confirmInEdition":false},{"id":"G4-ord-01","topicId":"G4","type":"order","prompt":"Order the condensed aerosol acceptance sequence.","interviewerPhrasing":"Take me through accepting an aerosol system in a generator enclosure.","answer":{"steps":["L2 — quantity and placement: generator count matches listed density × net volume × safety factor; clearances; discharge path; service-life dates","L2 — enclosure: openings match the leakage assumptions; dampers close; doors self-close; signage","L3 — circuit: panel and actuators listed compatible; wiring per the listing; values measured with the approved low-current tester only","L4 — sequence with generators disconnected: detection → pre-discharge alarm → time delay → release; abort; manual release; shutdowns; faults","Reconnection: panel normal with no active outputs, verified by a second person; final check with the approved tester","L5 — release signal drives enclosure fans, fuel valves and BMS points on normal and generator power"],"codeRef":null,"explanation":"L2 quantity and placement → L2 enclosure → L3 circuit → L4 sequence with generators disconnected → reconnection (the riskiest step) → L5 integrated shutdowns on normal and generator power."},"hook":"Count it, seal it, meter it gently, sequence it, reconnect it with a witness, integrate it.","source":"Condensed aerosol › Acceptance sequence","par":60,"confirmInEdition":false},{"id":"G4-def-01","topicId":"G4","type":"defect","prompt":"Aerosol acceptance script, generator enclosure. One line breaks a rule. Tap it.","answer":{"lines":["1. Prerequisites: every generator disconnected and replaced with a listed test device; releasing panel programmed; central station on test.","2. Verify generator count and models match the design: listed design density × net protected volume × safety factor, adjusted for openings.","3. Check the listed clearances to people and combustibles and that nothing blocks the discharge path; record manufacture and service-life dates.","4. Megger the release circuit to prove insulation resistance before the sequence test.","5. Sequence: detection → pre-discharge alarm → time delay → release output on the test device; abort; manual release; HVAC and dampers shut down.","6. Open and short faults on the release circuit report trouble.","7. Reconnection: panel normal with no active outputs, verified by a second person, then generators reconnect; final check with the approved tester."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — never megger or continuity-test with a meter that can push enough current to fire a generator; measure circuit values with the manufacturer's approved low-current tester only."},"hook":"A megger is an igniter with a readout — only the maker's low-current tester touches that circuit.","source":"Condensed aerosol › Traps","par":40,"confirmInEdition":false},{"id":"G4-scn-01","topicId":"G4","type":"scenario","prompt":"How do you commission a system you can't discharge?","interviewerPhrasing":"How do you commission a system you can't discharge?","answer":{"beats":["Prove the inputs to the design: volume, openings, quantity, clearances","Prove the sequence with simulators — every generator replaced by a listed test device","Treat reconnection as a controlled procedure: panel normal, no active outputs, second person","Generators are single-use pyrotechnic devices, so there is no discharge test"],"requiresNumber":false,"codeRef":null,"explanation":"Prove the inputs to the design (volume, openings, quantity, clearances), prove the sequence with simulators, and treat reconnection as a controlled procedure. Aerosol generators are single-use pyrotechnic devices, so you can't discharge at acceptance."},"hook":"Prove the design, prove the sequence, control the reconnect — the generator only fires once.","source":"Condensed aerosol › Likely question","par":90,"confirmInEdition":false},{"id":"G4-scn-02","topicId":"G4","type":"scenario","prompt":"Where does condensed aerosol belong on a campus, and what are the traps?","answer":{"beats":["Unoccupied enclosures: generator and turbine enclosures, electrical cabinets, some battery cabinets per listing","NFPA 2010 restricts use in normally occupied spaces — confirm the edition's wording","It obscures visibility, discharges hot and leaves residue that has to be cleaned","Never megger or continuity-test with a meter that can push enough current to fire a generator","Plan residue cleanup and post-discharge ventilation in the EOP","A hot discharge near cabling or plastics is a design defect, not a field fix"],"requiresNumber":false,"codeRef":"NFPA 2010","codeRefAliases":["2010","NFPA2010","nfpa 2010"],"explanation":"Unoccupied enclosures only — generator and turbine enclosures, electrical cabinets, some battery cabinets per listing; NFPA 2010 restricts use in normally occupied spaces. Traps: no megger or continuity meter that can fire a generator; residue cleanup and ventilation in the EOP; a hot discharge near cabling is a design defect."},"hook":"Hot, cloudy, dirty and single-shot — keep it out of occupied rooms and keep the megger away.","source":"Condensed aerosol › Traps","par":90,"confirmInEdition":true},{"id":"G5-ord-01","topicId":"G5","type":"order","prompt":"Order the ASD acceptance sequence, L2 to L5.","answer":{"steps":["L2 — pipe lengths, bends, hole sizes and locations, capillary drops and end caps match the design calc","L3 — load Alert, Action, Fire 1 and Fire 2 thresholds per the BOD","L3 — normalize airflow once the pipes are clean and HVAC runs in its normal mode","L3 — run the learn period under real operating conditions, not construction dust","L4 — smoke at the end-cap of every pipe: time to response vs the calc and vs 120 s","L4 — verify each pipe's flow reading, then force low-flow and high-flow faults","L5 — re-check flow with CRAHs in every mode, including one failed; smoke-test inside containment with load banks running"],"codeRef":null,"explanation":"L2 install vs calc → L3 thresholds, normalize airflow, learn under real conditions → L4 smoke at every end-cap vs the calc and 120 s, flow readings and forced low-/high-flow faults → L5 flow with CRAHs in every mode and smoke inside containment with load banks."},"hook":"Match the calc, set it, learn it clean, smoke every pipe, break the flow, then do it with the cooling misbehaving.","source":"Aspirating smoke detection (ASD) › Acceptance sequence","par":60,"confirmInEdition":false},{"id":"G5-ord-02","topicId":"G5","type":"order","prompt":"Commissioning VESDA in a contained data hall: order the four beats of the answer.","answer":{"steps":["Verify install against the calc","Set thresholds to the alarm philosophy","Transport-time test every pipe with a pass criterion","Re-verify flow with cooling in failure modes at IST"],"codeRef":null,"explanation":"Four beats: verify install against the calc; set thresholds to the alarm philosophy; transport-time test every pipe with a pass criterion; re-verify flow with cooling in failure modes at IST."},"hook":"Calc, thresholds, time every pipe, then break the cooling.","source":"Aspirating smoke detection (ASD) › Likely question","par":40,"confirmInEdition":false},{"id":"G5-mat-01","topicId":"G5","type":"matrix","prompt":"ASD alarm philosophy: for each level, does it alert Ops (●), sound the building alarm, or feed the release input — or must it not (—)?","answer":{"grid":{"inputs":["ASD Alert / Action","ASD Fire 1","ASD Fire 2 or a second detector"],"outputs":["Ops alert (BMS / EPMS)","Building alarm","Release input"],"cells":[["●","—","—"],["●","●","—"],["●","●","●"]],"notes":[["Alert and Action call Ops to investigate","",""],["","Fire 1 is the building alarm",""],["","","Pre-action or clean agent release input"]]},"codeRef":null,"explanation":"Alert and Action call Ops to investigate; Fire 1 is the building alarm; Fire 2 (or a second detector) is the pre-action or clean agent release input. Example only — the BOD decides every cell."},"hook":"Alert wakes Ops, Fire 1 wakes the building, Fire 2 opens the solenoid.","source":"Aspirating smoke detection (ASD) › Data center points to make","par":60,"confirmInEdition":false},{"id":"G5-def-01","topicId":"G5","type":"defect","prompt":"ASD acceptance script, Data Hall 2. One line breaks a rule. Tap it.","answer":{"lines":["1. Prerequisites: pipe network verified against the ASPIRE calc; sampling holes labeled; detector exhaust returned to the sampled zone.","2. Load Alert, Action, Fire 1 and Fire 2 thresholds per the BOD.","3. Normalize airflow after the pipes are cleaned and the CRAHs are in normal mode.","4. Run the learn period now, while drywall sanding finishes, so the baseline is set before the hall is cleaned.","5. Smoke at the end-cap of every pipe; record time to response against the calc and the 120 s limit.","6. Block an inlet for a low-flow fault and open a pipe for a high-flow fault; confirm each reports at the FACP.","7. Confirm each alarm level and trouble reaches the FACP as its own point and drives its output."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — run the learn period under real operating conditions, not construction dust: a learn done during construction sets a dirty baseline and desensitizes the system. Re-learn after final clean and after load banks leave."},"hook":"A learn in drywall dust teaches the detector that dust is normal — learn clean, re-learn after load banks.","source":"Aspirating smoke detection (ASD) › Acceptance sequence","par":40,"confirmInEdition":false},{"id":"G5-num-01","topicId":"G5","type":"number","prompt":"ASD transport time: smoke from the farthest hole reaches the detector within the calculated time — never more than ___ s. Since the ___ edition, Chapter 14 also requires computer-calculated pipe designs and an airflow trouble signal. Standard?","interviewerPhrasing":"What's the pass criterion on an ASD transport-time test?","answer":{"fields":[{"label":"max transport time, s","value":120},{"label":"edition year","value":2019}],"codeRef":"NFPA 72","codeRefAliases":["72","NFPA72","NFPA 72 Chapter 14","72 Chapter 14"],"explanation":"Smoke from the farthest hole reaches the detector within the calculated transport time — never more than 120 s (NFPA 72). Since 2019 Chapter 14 also requires computer-calculated pipe designs and an airflow trouble signal."},"hook":"Two minutes from the last hole, and since 2019 the calc has to be on a computer.","source":"Aspirating smoke detection (ASD) › Governing","par":30,"confirmInEdition":false},{"id":"G5-num-02","topicId":"G5","type":"number","prompt":"The VESDA thresholds from Story 2: factory defaults Fire 1 ___ %/ft and Fire 2 ___ %/ft; you set Fire 1 to ___ %/ft and Fire 2 to ___ %/ft.","answer":{"fields":[{"label":"default Fire 1, %/ft","value":2},{"label":"default Fire 2, %/ft","value":4},{"label":"set Fire 1, %/ft","value":0.0625,"tolerance":0.001},{"label":"set Fire 2, %/ft","value":1}],"codeRef":null,"explanation":"Factory defaults were Fire 1 at 2 %/ft and Fire 2 at 4 %/ft — no more sensitive than a spot photoelectric (roughly 0.5–4 %/ft). Set to Fire 1 0.0625 %/ft and Fire 2 1 %/ft for very early detection, tied to the alarm philosophy."},"hook":"2 and 4 is a spot detector on a pipe; 0.0625 and 1 is very early warning.","source":"Story 2 — A data center with no drawings › Follow-ups, 15 seconds each","par":35,"confirmInEdition":false},{"id":"G5-scn-01","topicId":"G5","type":"scenario","prompt":"How would you commission VESDA in a contained data hall?","interviewerPhrasing":"How would you commission VESDA in a contained data hall?","answer":{"beats":["Verify install against the calc: pipe lengths, bends, hole sizes and locations, end caps; exhaust returned to the sampled zone","Set thresholds to the alarm philosophy: Alert and Action call Ops, Fire 1 is the building alarm, Fire 2 releases","Transport-time test every pipe with a pass criterion: smoke at the end-cap, time vs the calc and vs 120 s","Re-verify flow with cooling in failure modes at IST — CRAHs in every mode, one unit failed, smoke inside containment with load banks running"],"requiresNumber":true,"codeRef":null,"explanation":"Four beats: verify install against the calc; set thresholds to the alarm philosophy; transport-time test every pipe with a pass criterion (never more than 120 s); re-verify flow with cooling in failure modes at IST."},"hook":"Calc · philosophy · 120 s on every pipe · cooling in failure modes.","source":"Aspirating smoke detection (ASD) › Likely question","par":90,"confirmInEdition":false},{"id":"G5-scn-02","topicId":"G5","type":"scenario","prompt":"The VESDA in Hall 2 keeps throwing flow faults. Where do you look?","interviewerPhrasing":"An ASD detector is in flow fault every morning. What's your list?","answer":{"beats":["Pressure-zone mismatch between sampling and exhaust is the most common source of flow faults","Return the detector exhaust to the sampled zone when it sits in a different pressure zone (under-floor, duct, plenum)","High-flow faults: damaged pipe — in Story 2 it was above the ceiling","Re-check flow with CRAHs in every mode, including one unit failed","Normalize airflow only after pipes are clean and HVAC runs in its normal mode"],"requiresNumber":false,"codeRef":null,"explanation":"Pressure-zone mismatch between sampling and exhaust is the most common source of flow faults — return the exhaust to the sampled zone. High-flow faults point at damaged pipe (Story 2: above the ceiling). Re-check flow with CRAHs in every mode and normalize only after pipes are clean and HVAC is in its normal mode."},"hook":"Exhaust in the wrong pressure zone, a broken pipe above the ceiling, or a CRAH mode nobody tested.","source":"Aspirating smoke detection (ASD) › Data center points to make","par":75,"confirmInEdition":false},{"id":"G6-num-01","topicId":"G6","type":"number","prompt":"High-airflow spacing, ft² per detector or sampling hole: at 60 air changes per hour ___; at 30 ___; at 20 ___. Which standard's table?","interviewerPhrasing":"The hall runs at 60 air changes an hour. What's your detector or hole spacing?","answer":{"fields":[{"label":"60 ACH, ft²","value":125},{"label":"30 ACH, ft²","value":250},{"label":"20 ACH, ft²","value":375}],"codeRef":"NFPA 72","codeRefAliases":["72","NFPA72","NFPA 72 table","nfpa 72"],"explanation":"High airflow cuts spacing (NFPA 72 — confirm the table number in your edition): 60 ACH → 125 ft², 30 → 250, 20 → 375 per detector or hole. Each sampling hole is treated as a spot-type smoke detector for spacing."},"hook":"60 → 125, 30 → 250, 20 → 375 — halve the air, double the floor.","source":"Aspirating smoke detection (ASD) › High airflow cuts spacing","par":30,"confirmInEdition":true},{"id":"G6-num-02","topicId":"G6","type":"number","prompt":"High-airflow spacing, ft² per detector or sampling hole: at 15 air changes per hour ___; at 12 ___; at 10 ___. Standard?","answer":{"fields":[{"label":"15 ACH, ft²","value":500},{"label":"12 ACH, ft²","value":625},{"label":"10 ACH, ft²","value":750}],"codeRef":"NFPA 72","codeRefAliases":["72","NFPA72","NFPA 72 table","nfpa 72"],"explanation":"15 ACH → 500 ft², 12 → 625, 10 → 750 per detector or hole (NFPA 72 — confirm the table number in your edition)."},"hook":"15 → 500, 12 → 625, 10 → 750 — each step adds 125.","source":"Aspirating smoke detection (ASD) › High airflow cuts spacing","par":30,"confirmInEdition":true},{"id":"G6-num-03","topicId":"G6","type":"number","prompt":"High-airflow spacing: at 8.6 air changes per hour ___ ft²; at ___ ACH or fewer the full ___ ft² applies. Standard?","answer":{"fields":[{"label":"8.6 ACH, ft²","value":875},{"label":"full spacing at or below, ACH","value":7.5,"tolerance":0.05},{"label":"full spacing, ft²","value":900}],"codeRef":"NFPA 72","codeRefAliases":["72","NFPA72","NFPA 72 table","nfpa 72"],"explanation":"8.6 ACH → 875 ft²; 7.5 ACH or fewer → 900 ft² per detector or hole (NFPA 72 — confirm the table number in your edition)."},"hook":"875 at 8.6, and the full 900 only once you're down to 7.5 air changes.","source":"Aspirating smoke detection (ASD) › High airflow cuts spacing","par":30,"confirmInEdition":true},{"id":"G6-num-04","topicId":"G6","type":"number","prompt":"Spot spacing the table reduces from: smoke detectors ___ ft nominal, every point within 0.7 S = ___ ft; heat detector listed spacing is reduced above ___ ft ceilings.","answer":{"fields":[{"label":"smoke detector nominal spacing, ft","value":30},{"label":"0.7 S, ft","value":21},{"label":"heat detector reduction starts above, ft","value":10}],"codeRef":null,"explanation":"Smoke detectors: 30 ft nominal, every point within 0.7 S (21 ft). Heat detectors: listed spacing reduced above 10 ft ceilings, from ×0.91 at 10–12 ft down to ×0.34 at 28–30 ft. High-airflow reductions are in the ASD section."},"hook":"30 ft nominal, 21 ft to any point — then the airflow table cuts it further.","source":"Fire alarm › Spacing","par":30,"confirmInEdition":false},{"id":"G6-scn-01","topicId":"G6","type":"scenario","prompt":"The hall runs at 30 air changes an hour. How does that change your detector and sampling-hole layout?","interviewerPhrasing":"Our halls run at 30 air changes an hour. Does that change your detection layout?","answer":{"beats":["High airflow cuts spacing: at 30 ACH, 250 ft² per detector or hole, against 900 ft² at 7.5 ACH or fewer","Each sampling hole is treated as a spot-type smoke detector for spacing (NFPA 72)","Sample where smoke goes — CRAH returns, hot-aisle containment, ceiling return plenum — plus area coverage","Confirm the table number in your edition before quoting it"],"requiresNumber":true,"codeRef":"NFPA 72","codeRefAliases":["72","NFPA72","NFPA 72 table","nfpa 72"],"explanation":"At 30 ACH the table gives 250 ft² per detector or hole (900 at 7.5 or fewer); each sampling hole counts as a spot detector for spacing. Sample where smoke goes — CRAH returns, containment, return plenum — plus area coverage (NFPA 72 — confirm the table number in your edition)."},"hook":"30 changes an hour buys you 250 square feet a hole — and put the holes where the air goes.","source":"Aspirating smoke detection (ASD) › High airflow cuts spacing","par":75,"confirmInEdition":true},{"id":"B1-ord-01","topicId":"B1","type":"order","prompt":"Order the layered defense a BESS commissioning proves, first layer first.","answer":{"steps":["Off-gas detection catches a failing cell","The BMS isolates it","Exhaust keeps vent gas below 25% LFL","Explosion control handles what exhaust can't","Water controls the fire"],"codeRef":null,"explanation":"Battery fire protection commissioning proves a layered defense works in order: off-gas detection catches a failing cell, the BMS isolates it, exhaust keeps vent gas below 25% LFL, explosion control handles what exhaust can't, and water controls the fire — all under an approved commissioning plan."},"hook":"Sniff it, trip it, vent it, blow-out-panel it, drown it.","source":"Battery and BESS","par":45,"confirmInEdition":false},{"id":"B1-def-01","topicId":"B1","type":"defect","prompt":"BESS commissioning plan and explosion control script. One line breaks a rule. Tap it.","answer":{"lines":["1. Commissioning plan per IFC 1207.2.1 drafted with the 12 items, including OPR and BOD, integrated fire and safety testing, ventilation testing, training and a decommissioning plan.","2. Plan approval to be obtained from the fire code official after integrated testing, together with the final report.","3. L1: UL 9540 listing and the UL 9540A test report on file; vent gas composition and volume carried into the explosion control calc.","4. Explosion control: NFPA 69 prevention verified against its design calc.","5. NFPA 68 vents installed per design, unobstructed, discharging somewhere safe.","6. Sprinklers: 0.3 gpm/ft² over the room or 2,500 ft², whichever is smaller, unless large-scale fire testing justifies less.","7. Report to the fire code official at close-out."],"defectIndex":1,"codeRef":null,"explanation":"Line 2 — the commissioning plan (IFC 1207.2.1) is required and approved before work, not after testing. The report to the fire code official comes at the end; the approval comes first."},"hook":"Approve the plan before the work; report after — never the other way round.","source":"Battery and BESS › The commissioning plan (IFC 1207.2.1).","par":40,"confirmInEdition":false},{"id":"B1-num-01","topicId":"B1","type":"number","prompt":"When does the ESS code apply? Lithium-ion above ___ kWh triggers IFC 1207, aggregated per ___. Which table sets the threshold?","interviewerPhrasing":"Is a lithium-ion UPS in a data center an energy storage system under the fire code?","answer":{"fields":[{"label":"threshold, kWh","value":20},{"label":"aggregated per","value":"fire area","aliases":["per fire area","fire areas","a fire area","the fire area"]}],"codeRef":"IFC Table 1207.1.3","codeRefAliases":["1207.1.3","IFC 1207.1.3","Table 1207.1","1207.1","IFC 1207.1"],"explanation":"Lithium-ion above 20 kWh triggers IFC 1207 (Table 1207.1.3 in IFC 2024; Table 1207.1 in 2021), aggregated per fire area — AHJ interpretations vary. No blanket UPS exemption: a data center Li-ion UPS above the threshold is an ESS."},"hook":"20 kWh of lithium in one fire area and the UPS room is an ESS — no exemption for calling it a UPS.","source":"Battery and BESS › When it applies.","par":30,"confirmInEdition":false},{"id":"B1-num-02","topicId":"B1","type":"number","prompt":"The ESS commissioning plan: required and approved before work, with ___ items — including the OPR and BOD, integrated fire and safety testing, ventilation testing, training and a ___ plan. Section?","answer":{"fields":[{"label":"items","value":12},{"label":"…and a ___ plan","value":"decommissioning","aliases":["decommission","decommissioning plan","decom"]}],"codeRef":"IFC 1207.2.1","codeRefAliases":["1207.2.1","IFC 1207.2.1","CFC 1207.2.1","ifc 1207.2.1"],"explanation":"The commissioning plan (IFC 1207.2.1) is required and approved before work, with 12 items — including the OPR and BOD, integrated fire and safety testing, ventilation testing, training and a decommissioning plan — and a report to the fire code official."},"hook":"Twelve items, approved before the first module lands, and a plan for taking it all out again.","source":"Battery and BESS › The commissioning plan (IFC 1207.2.1).","par":30,"confirmInEdition":false},{"id":"B1-num-03","topicId":"B1","type":"number","prompt":"ESS sprinkler density: ___ gpm/ft² over the room or ___ ft², whichever is smaller, unless large-scale fire testing justifies less. Section?","answer":{"fields":[{"label":"density, gpm/ft²","value":0.3,"tolerance":0.01},{"label":"area cap, ft²","value":2500}],"codeRef":"IFC 1207.5.5","codeRefAliases":["1207.5.5","IFC 1207.5.5","CFC 1207.5.5","ifc 1207.5.5"],"explanation":"Sprinklers at 0.3 gpm/ft² over the room or 2,500 ft², whichever is smaller (IFC 1207.5.5), unless large-scale fire testing justifies less. Clean agent and mist aren't accepted as primary protection for Li-ion racks in FM guidance."},"hook":"Point-three over 2,500 — water cools, and only a 9540A test talks that number down.","source":"Battery and BESS › table","par":30,"confirmInEdition":false},{"id":"B1-num-04","topicId":"B1","type":"number","prompt":"NFPA 855: the current edition is ___, with a ___ edition out. In the new edition explosion control is commissioned per NFPA ___ and tested per NFPA ___. Standard?","answer":{"fields":[{"label":"current edition","value":2023},{"label":"new edition","value":2026},{"label":"commissioned per NFPA","value":3},{"label":"tested per NFPA","value":4}],"codeRef":"NFPA 855","codeRefAliases":["855","NFPA855","nfpa 855"],"explanation":"NFPA 855 (2023, with a 2026 edition out). NFPA 855-2026 has explosion control commissioned per NFPA 3 and tested per NFPA 4. NFPA 75-2024 moved its lithium-ion rules to NFPA 855 and added off-gas detection."},"hook":"855 in '23 and '26 — the new one hands explosion control to NFPA 3 and 4.","source":"Battery and BESS › Governing","par":30,"confirmInEdition":false},{"id":"B1-scn-01","topicId":"B1","type":"scenario","prompt":"What does UL 9540A tell you that UL 9540 doesn't — and which design decisions does each result feed?","interviewerPhrasing":"What does UL 9540A tell you that UL 9540 doesn't?","answer":{"beats":["UL 9540 says the system is listed","UL 9540A is the fire test method behind the design — it tells you how it fails","Cell-to-module-to-unit propagation","Vent gas composition and volume","Those feed the explosion control calc, spacing and any sprinkler density relief"],"requiresNumber":false,"codeRef":null,"explanation":"UL 9540 says the system is listed. UL 9540A tells you how it fails: cell-to-module-to-unit propagation and vent gas composition and volume, which feed the explosion control calc, spacing and any sprinkler density relief."},"hook":"9540 is the certificate; 9540A is the autopsy — propagation and vent gas, into the calc, the spacing and the density.","source":"Battery and BESS › Likely question","par":90,"confirmInEdition":false},{"id":"B1-scn-02","topicId":"B1","type":"scenario","prompt":"The electrical lead says the Li-ion UPS in the data hall is 'just a UPS', not an ESS. Is it?","interviewerPhrasing":"Does the fire code treat our in-hall lithium UPS as an energy storage system?","answer":{"beats":["Lithium-ion above 20 kWh triggers IFC 1207","Aggregated per fire area — AHJ interpretations vary","There's no blanket UPS exemption, so a Li-ion UPS above the threshold is an ESS","Exceptions are narrow — a UL 1778 lead-acid UPS is exempt from explosion control","NFPA 75-2024 moved its lithium-ion rules to NFPA 855 and added off-gas detection"],"requiresNumber":true,"codeRef":"IFC 1207","codeRefAliases":["1207","CFC 1207","IFC Chapter 12","ifc 1207"],"explanation":"Lithium-ion above 20 kWh triggers IFC 1207, aggregated per fire area (AHJ interpretations vary). There's no blanket UPS exemption, so a data center Li-ion UPS above the threshold is an ESS; exceptions are narrow (UL 1778 lead-acid UPS exempt from explosion control)."},"hook":"Above 20 kWh it's an ESS whatever the nameplate says — lead-acid gets the pass, lithium doesn't.","source":"Battery and BESS › When it applies.","par":90,"confirmInEdition":false},{"id":"B2-num-01","topicId":"B2","type":"number","prompt":"Off-gas detection typically gives ___ to ___ min of warning before thermal runaway. Exhaust is sized to hold ≤ ___ % LFL, or continuous ≥ ___ cfm/ft², supervised.","answer":{"fields":[{"label":"warning, min (low end)","value":2},{"label":"warning, min (high end)","value":30},{"label":"max vent gas, % LFL","value":25},{"label":"continuous alternative, cfm/ft²","value":1}],"codeRef":null,"explanation":"Off-gas detection (e.g., Li-ion Tamer) typically gives 2–30 min of warning before thermal runaway. Gas detection starts exhaust sized to hold ≤ 25% LFL (or continuous ≥ 1 cfm/ft², supervised); airflow proven; fan failure alarms; on standby power."},"hook":"Two to thirty minutes of warning, a quarter of the LFL, one cfm a square foot.","source":"Battery and BESS › table","par":30,"confirmInEdition":false},{"id":"B2-num-02","topicId":"B2","type":"number","prompt":"BMS layer at L4: on a trip the ___ open; the ___ must work; status reaches the ___ or BMS.","answer":{"fields":[{"label":"what opens","value":"contactors","aliases":["contactor","the contactors","string contactors","dc contactors"]},{"label":"what must work","value":"E-stop","aliases":["estop","emergency stop","e stop","the e-stop"]},{"label":"status reaches the","value":"FACP","aliases":["fire alarm control panel","fire alarm panel","panel","fire alarm"]}],"codeRef":null,"explanation":"BMS: trips on off-gas, over-temperature and voltage faults; contactors open; E-stop works; status reaches the FACP or BMS."},"hook":"Contactors open, E-stop works, the panel knows — three things the BMS has to show you.","source":"Battery and BESS › table","par":30,"confirmInEdition":false},{"id":"B2-ord-01","topicId":"B2","type":"order","prompt":"Order the BESS L5 integrated scenario.","interviewerPhrasing":"Write me the integrated test scenario for a BESS container.","answer":{"steps":["Off-gas alarm","BMS isolates the string","Exhaust starts and proves flow","Alarm to Ops","If smoke or heat follows: building alarm and sprinklers","Drop utility mid-event — confirm detection, BMS and exhaust stay powered"],"codeRef":null,"explanation":"Off-gas alarm → BMS isolates the string → exhaust starts and proves flow → alarm to Ops → if smoke or heat follows, building alarm and sprinklers → drop utility mid-event and confirm detection, BMS and exhaust stay powered."},"hook":"Gas, trip, vent, tell Ops, then fire — and pull the plug while it's happening.","source":"Battery and BESS › L5 scenario","par":50,"confirmInEdition":false},{"id":"B2-mat-01","topicId":"B2","type":"matrix","prompt":"Off-gas in the UPS room vs a clean agent release in the electrical room: which outputs happen, which must not, which are per BOD?","answer":{"grid":{"inputs":["Li-ion off-gas, UPS room","Clean agent release, electrical room"],"outputs":["Building alarm","Central station","Release / trip","HVAC and dampers","BMS / EPMS","Elevator"],"cells":[["—","—","●","●","●","—"],["●","●","●","●","per BOD","—"]],"notes":[["","","BMS trips the string","Exhaust on","",""],["","","Agent","Room HVAC off, dampers close","Power-down per BOD",""]]},"codeRef":null,"explanation":"Li-ion off-gas: no building alarm, no central station — the BMS trips the string, exhaust comes on, the BMS / EPMS sees it. Clean agent release: building alarm, central station, agent, room HVAC off and dampers closed, power-down per BOD. Example only — the BOD decides every cell."},"hook":"Off-gas is a quiet event — trip the string and vent; agent is a loud one.","source":"Data center commissioning language › IST matrix — the document the posting says you'll review.","par":75,"confirmInEdition":false},{"id":"B2-def-01","topicId":"B2","type":"defect","prompt":"BESS integrated test script, container 3. One line breaks a rule. Tap it.","answer":{"lines":["1. Prerequisites: UL 9540A data and the approved commissioning plan on file; central station on test; impairment logged.","2. Apply test gas at the off-gas sensor per the manufacturer; confirm response at the controller.","3. Off-gas alarm: the BMS isolates the affected string; contactors open; status reaches the FACP or BMS.","4. Exhaust starts; the airflow switch proves flow; fail the fan and confirm the alarm.","5. Off-gas alarm puts the building into general alarm and reports to central station as a fire alarm.","6. Simulate smoke in the container: building alarm and sprinkler waterflow per NFPA 72 and 13 acceptance.","7. Drop utility mid-event: detection, BMS and exhaust stay powered.","8. Restore: strings re-enabled per the manufacturer; exhaust normal; panel normal; central station off test."],"defectIndex":4,"codeRef":null,"explanation":"Line 5 — in the L5 scenario an off-gas event trips the string, starts exhaust and alarms to Ops; the building alarm and sprinklers come only if smoke or heat follows. In the example IST matrix the off-gas row is blank under building alarm and central station."},"hook":"Off-gas tells Ops and vents; the building alarm waits for smoke or heat.","source":"Battery and BESS › L5 scenario","par":45,"confirmInEdition":false},{"id":"B2-scn-01","topicId":"B2","type":"scenario","prompt":"Why not clean agent on a lithium-ion battery fire?","interviewerPhrasing":"Why not clean agent on a lithium-ion battery fire?","answer":{"beats":["Agent does not cool cells in thermal runaway","Re-ignition follows once concentration decays","Water cools","Off-gas detection buys minutes — typically 2–30 before thermal runaway","Vent gas is flammable, so explosion control matters","FM guidance doesn't accept clean agent or mist as primary protection for Li-ion racks"],"requiresNumber":true,"codeRef":null,"explanation":"Agent does not cool cells in thermal runaway; re-ignition follows once concentration decays. Water cools. Off-gas detection buys minutes. Vent gas is flammable, so explosion control matters."},"hook":"Agent fades, the cell relights — water cools, minutes come from the sniffer, the vent gas wants a blow-out panel.","source":"Commissioning technical (the 35%) › 12","par":90,"confirmInEdition":false},{"id":"B2-scn-02","topicId":"B2","type":"scenario","prompt":"Walk me through the BESS integrated test — what do you prove at each layer, and what happens when you drop utility mid-event?","interviewerPhrasing":"How do you prove the off-gas sequence end to end?","answer":{"beats":["Off-gas alarm → the BMS isolates the affected string; contactors open; status reaches the FACP or BMS","Exhaust starts and proves flow — airflow proven, fan failure alarms","Alarm to Ops","If smoke or heat follows: building alarm and sprinklers","Drop utility mid-event: detection, BMS and exhaust stay powered"],"requiresNumber":false,"codeRef":null,"explanation":"Off-gas alarm → BMS isolates the string → exhaust starts and proves flow → alarm to Ops → if smoke or heat follows, building alarm and sprinklers → drop utility mid-event and confirm detection, BMS and exhaust stay powered."},"hook":"Trip, vent, tell, burn, unplug — and nothing in the chain goes dark.","source":"Battery and BESS › L5 scenario","par":90,"confirmInEdition":false},{"id":"B3-mat-01","topicId":"B3","type":"matrix","prompt":"Where does each gas sensor mount? Tap each row to the height the guide gives.","answer":{"grid":{"inputs":["VRLA / flooded UPS battery rooms — hydrogen","Chiller plant — heavier-than-air refrigerant","Nitrogen generator rooms — oxygen depletion","Generator rooms, docks — CO / NO2","Gas turbines, recips, fuel cells — natural gas"],"outputs":["Mount"],"cells":[["High"],["Low"],["Breathing zone"],["Breathing zone"],["High"]],"options":["High","Low","Breathing zone"],"notes":[["near the ceiling"],["per manufacturer"],["alarm at 19.5% O2"],["ventilation, alarm"],["shut fuel valve, alarm"]]},"codeRef":null,"explanation":"Mounting height follows gas density: hydrogen and natural gas high; heavier-than-air refrigerants low; oxygen depletion and CO / NO2 in the breathing zone. Li-ion off-gas and A2L sensors go per the manufacturer or unit listing."},"hook":"Light gas up, heavy gas down, and anything that hurts a person at nose height.","source":"Gas detection › table","par":60,"confirmInEdition":false},{"id":"B3-def-01","topicId":"B3","type":"defect","prompt":"Hydrogen detection acceptance script, UPS battery room. One line breaks a rule. Tap it.","answer":{"lines":["1. Prerequisites: sensors warmed up and stabilized per the manufacturer (24 h where required); zeroed in clean air; central station on test.","2. Span-calibrate each hydrogen sensor with certified, in-date, traceable cal gas.","3. The target cal gas is back-ordered, so span the remaining sensors with a surrogate gas and record the raw reading as the as-left value.","4. Record as-found and as-left values; check response time against the manufacturer's spec.","5. Low alarm at setpoint: exhaust starts and the fan's airflow switch proves flow.","6. High alarm: sounds and shuts down what the BOD says.","7. Pull a sensor: trouble at the controller, FACP or BMS. Fail the fan: alarm.","8. Repeat the sequence on generator power; load the setpoint table and cal certificates into the CMMS."],"defectIndex":2,"codeRef":null,"explanation":"Line 3 — calibrating with a surrogate gas needs the manufacturer's correction factor, noted on the sheet. A raw surrogate reading recorded as as-left is a calibration you can't defend."},"hook":"Surrogate gas is fine — if the correction factor is written next to it.","source":"Gas detection › Traps an interviewer may probe","par":40,"confirmInEdition":false},{"id":"B3-num-01","topicId":"B3","type":"number","prompt":"Hydrogen in a VRLA battery room: LFL is ___ %; exhaust holds ≤ ___ % LFL — about ___ % by volume — or runs continuously at ≥ ___ cfm/ft², supervised.","interviewerPhrasing":"What hydrogen concentration are you keeping the battery room under, and why that number?","answer":{"fields":[{"label":"H2 LFL, %","value":4},{"label":"exhaust holds ≤, % LFL","value":25},{"label":"…about, % by volume","value":1},{"label":"continuous alternative, cfm/ft²","value":1}],"codeRef":null,"explanation":"Exhaust holding ≤ 25% LFL (H2 LFL is 4%, so about 1% by volume), or continuous ≥ 1 cfm/ft², supervised. Hydrogen sensors mount high, near the ceiling."},"hook":"4% burns, so you alarm at a quarter of it — 1% hydrogen, 1 cfm a foot if you'd rather just blow.","source":"Gas detection › table","par":30,"confirmInEdition":false},{"id":"B3-num-02","topicId":"B3","type":"number","prompt":"Nitrogen generator rooms alarm at ___ % O2. A2L refrigerant mitigation at about ___ % LFL within seconds. Some sensors need ___ hours to warm up and stabilize. Standard for the A2L number?","answer":{"fields":[{"label":"oxygen depletion alarm, % O2","value":19.5,"tolerance":0.05},{"label":"A2L mitigation, % LFL","value":25},{"label":"warm-up, hours","value":24}],"codeRef":"UL 60335-2-40","codeRefAliases":["60335-2-40","UL 60335","60335","UL60335-2-40"],"explanation":"Oxygen depletion alarm at 19.5% O2 (nitrogen generator rooms, breathing zone). A2L: mitigation (fans on, isolation) at about 25% LFL within seconds (UL 60335-2-40). L3: warm-up and stabilization per the manufacturer — some sensors need 24 hours."},"hook":"19.5 for air you can breathe, 25% LFL for the A2L, and a day for the sensor to wake up.","source":"Gas detection › table","par":35,"confirmInEdition":false},{"id":"B3-scn-01","topicId":"B3","type":"scenario","prompt":"How do you prove a hydrogen detector protects the room?","interviewerPhrasing":"How do you prove a hydrogen detector protects the room?","answer":{"beats":["Calibrated reading — span with certified, in-date, traceable cal gas; record as-found and as-left","Alarm at setpoint","Exhaust starts and airflow is proven (the fan's airflow switch)","Detector or fan failure is annunciated — pull the sensor, fail the fan","All of it works on generator power"],"requiresNumber":true,"codeRef":null,"explanation":"Calibrated reading → alarm at setpoint → exhaust starts and airflow is proven → detector or fan failure is annunciated → all of it works on generator power. Exhaust holds ≤ 25% LFL (about 1% H2)."},"hook":"Reads right, alarms at 25% LFL, fan proves flow, failures tell on themselves, and it all runs on the generator.","source":"Gas detection › Likely question","par":90,"confirmInEdition":false},{"id":"B3-scn-02","topicId":"B3","type":"scenario","prompt":"What goes wrong with gas detection that an interviewer might probe?","answer":{"beats":["Calibrating with a surrogate gas needs the manufacturer's correction factor — note it on the sheet","Catalytic bead sensors are poisoned by silicones","Electrochemical cells drift and expire","Setpoints come from the BOD and the governing code (IFC, ASHRAE 15, NFPA 855) — confirm each in the script, not from memory","Mounting height follows gas density; keep sensors away from supply diffusers and reachable for calibration"],"requiresNumber":false,"codeRef":null,"explanation":"Surrogate cal gas needs the manufacturer's correction factor; catalytic bead sensors are poisoned by silicones; electrochemical cells drift and expire; setpoints come from the BOD and the governing code — confirm each against its source in the script."},"hook":"Wrong gas without the factor, silicone on the bead, a cell past its date, a setpoint from memory.","source":"Gas detection › Traps an interviewer may probe","par":75,"confirmInEdition":false},{"id":"B4-num-01","topicId":"B4","type":"number","prompt":"Water mist pressure classes: low ≤ ___ psi; intermediate above that to below ___ psi; high at or above the same figure. Mist is defined by droplet size: Dv0.99 below ___ µm at minimum design operating pressure. Standard?","interviewerPhrasing":"What makes it mist rather than a sprinkler, and what are the pressure classes?","answer":{"fields":[{"label":"low class max, psi","value":175},{"label":"intermediate / high boundary, psi","value":500},{"label":"Dv0.99 below, µm","value":1000}],"codeRef":"NFPA 750","codeRefAliases":["750","NFPA750","nfpa 750"],"explanation":"Low ≤ 175 psi; intermediate > 175 to \u003c 500 psi; high ≥ 500 psi (NFPA 750). Mist is defined by droplet size: Dv0.99 below 1,000 µm at minimum design operating pressure."},"hook":"175 and 500 split the classes; under a thousand microns makes it mist.","source":"Water mist › table","par":30,"confirmInEdition":false},{"id":"B4-num-02","topicId":"B4","type":"number","prompt":"Mist hydrostatic tests: intermediate and high pressure at ___ × working pressure for ___ min, then working pressure for ___ min, no loss. Low pressure: ___ psi for ___ h. Standard?","answer":{"fields":[{"label":"× working pressure","value":1.5,"tolerance":0.01},{"label":"first hold, min","value":10},{"label":"then working pressure for, min","value":110},{"label":"low pressure test, psi","value":200},{"label":"low pressure hold, h","value":2}],"codeRef":"NFPA 750","codeRefAliases":["750","NFPA750","nfpa 750"],"explanation":"Intermediate and high: 1.5 × working pressure for 10 min, then working pressure for 110 min, no loss. Low: 200 psi for 2 h (working pressure + 50 psi where it exceeds 150 psi) (NFPA 750). Dry or pre-action mist also gets the 40 psi, 24-hour air test."},"hook":"One-and-a-half times for ten, then a hundred and ten at working — two hours either way.","source":"Water mist › table","par":35,"confirmInEdition":false},{"id":"B4-ord-01","topicId":"B4","type":"order","prompt":"Order the water mist acceptance sequence.","answer":{"steps":["L2 — install vs listing: materials, nozzles, strainers, pump unit or cylinders, supply volume, water quality","L3 — flush before nozzles go in, then the hydrostatic test for the pressure class","L4 — pump start and stop, pressure maintenance, flow through the test valve, pressure at the remote test connection; ventilation shuts down; supervisories","Discharge test where the listing or owner requires it","L5 — pump unit on generator power; interlocks to BMS and enclosure ventilation"],"codeRef":null,"explanation":"L2 install vs listing → L3 clean and tight (flush before nozzles go in, then hydro) → L4 performance → discharge test where required (mist uses little water, so a real discharge is often practical) → L5 pump on generator, interlocks to BMS and ventilation."},"hook":"Match the listing, flush before the nozzles, pump and pressures, maybe a real discharge, then the generator.","source":"Water mist › Acceptance sequence","par":50,"confirmInEdition":false},{"id":"B4-def-01","topicId":"B4","type":"defect","prompt":"High-pressure mist acceptance script, engine enclosure. One line breaks a rule. Tap it.","answer":{"lines":["1. L2: pipe and fittings per the listing (stainless, compression fittings); nozzle model, orientation, spacing and height within listed limits; strainers and filters in place.","2. Install all nozzles, then flush the network through the end nozzles to clear construction debris.","3. Hydrostatic test for the pressure class: 1.5 × working pressure for 10 min, then working pressure for 110 min, no loss.","4. L4: pump unit start and stop, pressure maintenance, flow through the test valve at design pressure, pressure at the remote test connection against the calc.","5. Open-nozzle sections: detection opens the section valve; enclosure ventilation shuts down.","6. Supervisory signals: low tank level, low gas pressure, pump trouble.","7. L5: pump unit on generator power; interlocks to BMS and enclosure ventilation."],"defectIndex":1,"codeRef":null,"explanation":"Line 2 — flush before nozzles go in: small orifices clog, and debris is the most common mist failure."},"hook":"Flush the pipe while the nozzle holes are still open — a clogged orifice is the usual way mist dies.","source":"Water mist › Acceptance sequence","par":40,"confirmInEdition":false},{"id":"B4-scn-01","topicId":"B4","type":"scenario","prompt":"How is commissioning mist different from sprinklers?","interviewerPhrasing":"How is commissioning mist different from sprinklers?","answer":{"beats":["The listing replaces the density — the install has to match every parameter the fire tests used","Cleanliness is critical: flush before nozzles go in; debris is the most common mist failure","The pressure tests are higher: 1.5 × working pressure for 10 min, then working pressure for 110 min","The calc method differs: Darcy-Weisbach for intermediate and high pressure, not Hazen-Williams","Ventilation shutdown is part of the protection — moving air strips mist out of a room"],"requiresNumber":true,"codeRef":null,"explanation":"The listing replaces the density, cleanliness is critical, the pressure tests are higher, the calc method differs, and ventilation shutdown is part of the protection."},"hook":"Listing not density, clean not just tight, 1.5× not 200, Darcy not Hazen, fans off.","source":"Water mist › Likely question","par":90,"confirmInEdition":false},{"id":"B4-scn-02","topicId":"B4","type":"scenario","prompt":"The turbine enclosure you're commissioning is taller and leakier than the enclosure the mist listing was tested in. Commissioning problem?","answer":{"beats":["Listings are narrow — the enclosure is outside the listing","That's a design-review finding before it's a commissioning one","Mist appears in some white spaces and in engine and turbine enclosures on islanded-power sites","FM guidance doesn't accept mist as primary protection for lithium-ion racks"],"requiresNumber":false,"codeRef":null,"explanation":"Listings are narrow — an enclosure taller or leakier than the tested one is outside the listing, which is a design-review finding before it's a commissioning one."},"hook":"If the room isn't the room they burned, the listing isn't yours — send it back to design.","source":"Water mist › Data center points to make","par":75,"confirmInEdition":false},{"id":"A1-num-01","topicId":"A1","type":"number","prompt":"Sprinkler discharge is Q = K√P. Minimum ___ psi at any sprinkler unless the listing says otherwise; elevation costs ___ psi per ft; 1 psi of head is ___ ft.","answer":{"fields":[{"label":"minimum sprinkler pressure, psi","value":7},{"label":"elevation, psi per ft","value":0.433,"tolerance":0.002},{"label":"1 psi = ___ ft","value":2.31,"tolerance":0.01}],"codeRef":null,"explanation":"Q = K√P, minimum 7 psi at any sprinkler unless the listing says otherwise. Elevation 0.433 psi per ft; head 1 psi = 2.31 ft; velocity v = 0.4085 Q / d²."},"hook":"Seven at the head, 0.433 a foot going up, 2.31 feet to the psi.","source":"Core formulas (US units: gpm, psi, in., ft) › Sprinkler discharge","par":30,"confirmInEdition":false},{"id":"A1-num-02","topicId":"A1","type":"number","prompt":"Hazen-Williams friction loss p = k·Q^a / (C^a d^b), psi per ft: the constant k ___, the flow exponent a ___, the diameter exponent b ___. C for black steel dry and pre-action ___; black steel wet ___.","interviewerPhrasing":"Give me the Hazen-Williams shape and the C-factors you'd use on a pre-action system.","answer":{"fields":[{"label":"constant","value":4.52,"tolerance":0.01},{"label":"flow exponent","value":1.85,"tolerance":0.005},{"label":"diameter exponent","value":4.87,"tolerance":0.005},{"label":"C, black steel dry / pre-action","value":100},{"label":"C, black steel wet","value":120}],"codeRef":null,"explanation":"p = 4.52 Q^1.85 / (C^1.85 d^4.87) psi per ft, d = actual internal diameter. C: 120 for black steel wet and galvanized; 100 for black steel dry and pre-action; 140 cement-lined iron; 150 copper, stainless and listed CPVC. Darcy-Weisbach for antifreeze and intermediate / high-pressure mist."},"hook":"4.52 over C and d — flow to the 1.85, diameter to the 4.87; dry pipe rusts to a C of 100.","source":"Core formulas (US units: gpm, psi, in., ft) › Hazen-Williams friction loss","par":40,"confirmInEdition":false},{"id":"A1-scn-01","topicId":"A1","type":"scenario","prompt":"The sprinkler contractor rerouted a branch line around new ductwork and added fittings. Do you care, and what do you do about it?","interviewerPhrasing":"A field reroute added fittings on a data hall branch line. Is that a commissioning issue?","answer":{"beats":["A field reroute that adds fittings changes the calc","The commissioning answer is a recalc against the supply test, not a judgment call on the ladder","Supply at demand from the test: static and residual at flow give the curve, P_Q = S − (S − R)(Q/Q_R)^1.85","Margin: many owners and insurers require 10 psi over demand","A reroute that adds 3 psi of loss can break the owner's margin even though the system still works"],"requiresNumber":true,"codeRef":null,"explanation":"A field reroute that adds fittings changes the calc; the commissioning answer is a recalc against the supply test. Static 80 / residual 60 at 1,000 gpm gives 72.2 psi at 600 gpm; against 62 psi demand that's a 10.2 psi margin — just over the 10 psi many owners and insurers require — so 3 psi of added loss breaks it."},"hook":"Three psi of elbows eats a ten-psi margin — rerun the calc, don't eyeball the ladder.","source":"Worked example: supply check","par":90,"confirmInEdition":false},{"id":"A2-num-01","topicId":"A2","type":"number","prompt":"The numbers your L4 script leans on: air test ___ psi for ___ h with loss ≤ ___ psi; double-interlock above the 500 gal exemption proves water at the test connection within ___ s. Section for the delivery-time rule?","answer":{"fields":[{"label":"air test, psi","value":40},{"label":"air test, hours","value":24},{"label":"max loss, psi","value":1.5,"tolerance":0.01},{"label":"water at the test connection within, s","value":60}],"codeRef":"NFPA 13 §8.3.2.3","codeRefAliases":["13 8.3.2.3","NFPA 13 8.3.2.3","13 §8.3.2.3","8.3.2.3"],"explanation":"Air test 40 psi for 24 h, loss ≤ 1.5 psi. Double-interlock gets only the 500 gal exemption: above that, prove water at the test connection within 60 s — from normal air pressure, detection activated and the test connection opened at the same moment — or by calculation (NFPA 13 §8.3.2.3)."},"hook":"40 for 24, lose 1.5 — then both keys at once and water in 60.","source":"Pre-action › Dry-pipe sizing rules","par":35,"confirmInEdition":false},{"id":"A2-num-02","topicId":"A2","type":"number","prompt":"Trip test record and test connection: you record ___ things on a trip test; the test connection orifice matches the ___ K-factor on the system; on dry systems it sits at the ___ end of the top branch line.","answer":{"fields":[{"label":"items recorded on a trip test","value":5},{"label":"orifice matches the ___ K-factor","value":"smallest","aliases":["lowest","smallest k","smallest k-factor","minimum"]},{"label":"sits at the ___ end","value":"most remote","aliases":["remote","most remote end","far","farthest","furthest","hydraulically most remote"]}],"codeRef":null,"explanation":"Record five things: starting air pressure, air pressure at trip, time to trip, time to water at the test connection, and water pressure there once flow is steady. The test connection has an orifice matching the smallest K-factor on the system; on dry systems it sits at the most remote end of the top branch line."},"hook":"Five numbers at the far end of the top line, through the smallest hole on the job.","source":"Pre-action › Test-day details an interviewer will probe","par":35,"confirmInEdition":false},{"id":"A2-ord-01","topicId":"A2","type":"order","prompt":"Order the seven sections of the double-interlock L4 script as you'd hand it to Ops.","answer":{"steps":["Prerequisites: hydro and air test passed, panel programmed, central station on test, gauges calibrated, drain path ready","Detection only — one zone, then the cross-zone or Fire 2 input: alarms annunciate, valve stays shut","Loss of air only — open the inspector's test: low-air supervisory, valve stays shut","Both — detection plus open test connection: valve trips, waterflow pressure switch alarms; record time to trip and time to water","Manual release per the design","Faults — solenoid open and short, detection faults, low and high air, compressor or nitrogen generator failure, tamper, panel AC loss","Restore — drain, reset the valve per the manufacturer, restore air, panel normal, sign-off"],"codeRef":null,"explanation":"Prerequisites → detection only → loss of air only → both (valve trips; record time to trip and time to water at the test connection) → manual release → faults → restore."},"hook":"Neither key opens it alone; both do; then you try the handle, break everything, and put it back.","source":"Pre-action › Sample L4 script — double-interlock (the Day 12 exercise)","par":60,"confirmInEdition":false},{"id":"A2-mat-01","topicId":"A2","type":"matrix","prompt":"Double-interlock logic as the script tests it: for each input, does the panel annunciate and does the valve trip?","answer":{"grid":{"inputs":["Detection only (one zone, then the cross-zone)","Loss of air only (inspector's test open)","Detection and loss of air","Manual release"],"outputs":["Panel annunciates","Valve trips"],"cells":[["●","—"],["●","—"],["●","●"],["per BOD","per BOD"]],"notes":[["alarms annunciate","valve stays shut"],["low-air supervisory","valve stays shut"],["waterflow pressure switch alarms","record time to trip and time to water"],["per the design","per the design"]]},"codeRef":null,"explanation":"Detection only: alarms annunciate, valve stays shut. Loss of air only: low-air supervisory, valve stays shut. Both: valve trips, waterflow pressure switch alarms — record time to trip and time to water. Manual release per the design."},"hook":"One key, the other key, both keys — only both open the door; the manual key is whatever the BOD says.","source":"Pre-action › Sample L4 script — double-interlock (the Day 12 exercise)","par":60,"confirmInEdition":false},{"id":"A2-def-01","topicId":"A2","type":"defect","prompt":"A written L4 script for the double-interlock valve. One line breaks a rule. Tap it.","answer":{"lines":["1. Purpose: L4 functional test, double-interlock pre-action valve, Data Hall 1; acceptance criteria cite NFPA 13 §8.3.2.3 and the BOD.","2. Prerequisites: hydro and air test passed; panel programmed; central station on test; gauges calibrated; drain path ready.","3. Steps list the action only; the technician notes the outcome in the margin if anything unexpected happens.","4. Detection only (one zone, then the cross-zone): alarms annunciate, valve stays shut.","5. Loss of air only (open the inspector's test): low-air supervisory, valve stays shut.","6. Both: valve trips; record starting air pressure, air pressure at trip, time to trip, time to water, and steady water pressure at the test connection.","7. Faults: solenoid open and short, detection faults, low and high air, compressor failure, tamper, panel AC loss — each annunciates correctly.","8. Restore: drain, reset the valve per the manufacturer, restore air, panel normal, sign-off."],"defectIndex":2,"codeRef":null,"explanation":"Line 3 — every step carries an expected result, an actual result, pass/fail and initials on every line. Outcomes scribbled in the margin are not a test record you can hand Ops."},"hook":"Expected, actual, pass/fail, initials — on every line, or it didn't happen.","source":"Data center commissioning language › Script development — what a good fire FPT script contains.","par":45,"confirmInEdition":false},{"id":"A2-scn-01","topicId":"A2","type":"scenario","prompt":"You're handed a blank page: write the L4 script for a double-interlock pre-action system. What are the sections, start to restore?","interviewerPhrasing":"Write me an L4 functional test for a double-interlock pre-action system — what's in it?","answer":{"beats":["Prerequisites: hydro and air test passed; panel programmed; central station on test; gauges calibrated; drain path ready","Detection only (one zone, then the cross-zone or Fire 2 input): alarms annunciate, valve stays shut","Loss of air only (open the inspector's test): low-air supervisory, valve stays shut","Both: valve trips, waterflow pressure switch alarms; record time to trip and time to water at the test connection against the table or calc","Manual release per the design","Faults: open and short on the solenoid circuit, detection circuit faults, low and high air, compressor or nitrogen generator failure, tamper, panel AC loss","Restore: drain, reset the valve per the manufacturer (clapper, priming water), restore air, panel normal, sign-off"],"requiresNumber":true,"codeRef":null,"explanation":"Prerequisites → detection only (valve stays shut) → loss of air only (valve stays shut) → both: valve trips, record time to trip and time to water → manual release → faults → restore. Delivery time is proven against the table or calc — 60 s by test for double-interlock above the 500 gal exemption."},"hook":"Prereqs, one key, the other key, both keys, by hand, break everything, put it back — seven sections.","source":"Pre-action › Sample L4 script — double-interlock (the Day 12 exercise)","par":120,"confirmInEdition":false},{"id":"A2-scn-02","topicId":"A2","type":"scenario","prompt":"Before the seven test steps: what does a good fire FPT script contain, and what does each part look like for your pre-action script?","answer":{"beats":["Purpose, system, and the code / BOD sections each acceptance criterion comes from","Prerequisites: prior level signed off, AHJ notified, central station on test, impairment logged, fire watch if the system goes out of service","Safety isolation: actuators and solenoids replaced by test lamps or simulators, shutdown circuits verified before you trip anything","Steps with an expected result, an actual result, pass/fail and initials on every line","Failure modes: open and ground faults on releasing circuits, loss of primary power, loss of air, abort and manual release behavior","Return to normal — every isolation reversed and verified"],"requiresNumber":false,"codeRef":null,"explanation":"Purpose and criteria sources → prerequisites → safety isolation → steps with expected result, actual result, pass/fail and initials on every line → failure modes → return to normal, every isolation reversed and verified. The most dangerous outcome of a test is a system left disabled."},"hook":"Why, before, isolate, step-by-step with initials, break it, put it back — six parts to every script.","source":"Data center commissioning language › Script development — what a good fire FPT script contains.","par":90,"confirmInEdition":false},{"id":"A3-ord-01","topicId":"A3","type":"order","prompt":"Order the data hall IST fire scenario.","interviewerPhrasing":"Write the IST fire scenario for a data hall.","answer":{"steps":["Halls at full load-bank heat on normal power","ASD Fire 1, then Fire 2 or a second detector","Pre-action valve trips","Inspector's test simulates a fused head","Verify notification, central station, valve trip and water delivery time, BMS / EPMS responses; cooling stays up","Drop utility mid-event","Fire alarm on secondary power, pumps on generator, controllers transfer","Restore and verify every isolation reversed"],"codeRef":null,"explanation":"Halls at full load-bank heat on normal power → ASD Fire 1, then Fire 2 or a second detector → pre-action valve trips → inspector's test simulates a fused head → verify notification, central station, valve trip and water delivery time, BMS / EPMS, cooling stays up → drop utility mid-event → fire alarm on secondary power, pumps on generator, controllers transfer → restore and verify every isolation reversed."},"hook":"Heat the hall, smoke it twice, trip it, fuse a head, check everything, pull the plug, check again, put it back.","source":"Commissioning technical (the 35%) › 9","par":60,"confirmInEdition":false},{"id":"A3-mat-01","topicId":"A3","type":"matrix","prompt":"The fire scenario's rows of the IST matrix: for each input, which outputs happen, which must not, which are per BOD — and where does utility failure show up as Trouble?","answer":{"grid":{"inputs":["ASD Fire 1, Hall 1","ASD Fire 2 or 2nd detector, Hall 1","Pre-action waterflow, Hall 1","Utility failure"],"outputs":["Building alarm","Central station","Release / trip","HVAC and dampers","BMS / EPMS"],"cells":[["●","●","—","per BOD","●"],["●","●","●","per BOD","●"],["●","●","—","per BOD","●"],["—","Trouble","—","●","●"]],"options":["●","—","per BOD","Trouble"],"notes":[["","","","Per BOD — halls often keep cooling running",""],["","","Pre-action solenoid (valve trips only on loss of air)","Per BOD",""],["","","","Per BOD",""],["","Trouble if a panel loses AC","","Smoke control fans restart",""]]},"codeRef":null,"explanation":"Fire 1 alarms and reports but releases nothing; Fire 2 or a second detector opens the pre-action solenoid — the valve trips only on loss of air; waterflow alarms and reports; utility failure is no alarm — trouble if a panel loses AC, smoke control fans restart, the BMS / EPMS sees it. HVAC in the halls is per BOD. Example only — the BOD decides every cell."},"hook":"Fire 1 talks, Fire 2 opens the solenoid, waterflow reports, utility failure is only a trouble — and the halls keep cooling.","source":"Data center commissioning language › IST matrix — the document the posting says you'll review.","par":90,"confirmInEdition":false},{"id":"A3-def-01","topicId":"A3","type":"defect","prompt":"Written L5 fire scenario, Data Hall 1. One line breaks a rule. Tap it.","answer":{"lines":["1. Prerequisites: L4 complete and signed for ASD, pre-action and fire alarm; central station on test; impairment logged; fire watch posted.","2. Halls at full load-bank heat on normal power; FACP, BMS and EPMS trending.","3. ASD Fire 1 in Hall 1: building alarm and central station; no release.","4. ASD Fire 2 (or a second detector): pre-action solenoid opens; open the inspector's test to simulate a fused head; valve trips; record water delivery time.","5. Verify notification, central station and BMS / EPMS responses; confirm the CRAHs shut down on Fire 2 to starve the hall of airflow.","6. Drop utility mid-event: fire alarm on secondary power, pumps on generator, controllers transfer.","7. Restore normal power; verify every isolation reversed; central station off test."],"defectIndex":4,"codeRef":null,"explanation":"Line 5 — the scenario verifies cooling stays up; in the example IST matrix HVAC on an ASD Fire 1 or Fire 2 is per BOD, and halls often keep cooling running. A CRAH shutdown has to come from the BOD, not from the script writer."},"hook":"The script doesn't get to turn the cooling off — the BOD does, and in a hall it usually doesn't.","source":"Commissioning technical (the 35%) › 9","par":45,"confirmInEdition":false},{"id":"A3-def-02","topicId":"A3","type":"defect","prompt":"The same L5 fire scenario, second draft. One line breaks a rule. Tap it.","answer":{"lines":["1. Halls at full load-bank heat on normal power.","2. ASD Fire 1 in Hall 1, then Fire 2 or a second detector.","3. Pre-action valve trips; inspector's test simulates a fused head; record water delivery time against the table or calc.","4. Verify notification, central station, valve trip, BMS / EPMS responses; cooling stays up.","5. Drop utility mid-event: fire alarm on secondary power, pumps on generator, controllers transfer.","6. Restore normal power and reset the FACP; leave the pre-action valve tripped and the hall on low air so tomorrow's retest starts faster.","7. Sign-off: issues log updated; central station off test; impairment closed."],"defectIndex":5,"codeRef":null,"explanation":"Line 6 — restore and verify every isolation reversed: the most dangerous outcome of a test is a system left disabled. A tripped valve and a hall on low air overnight is exactly that."},"hook":"Nothing stays tripped overnight — every isolation reversed, every one verified.","source":"Commissioning technical (the 35%) › 9","par":45,"confirmInEdition":false},{"id":"A3-num-01","topicId":"A3","type":"number","prompt":"The line to own: 'At L4 I prove the ___. At L5 I prove the ___.' And the integrated test at L5 is the NFPA ___ test.","answer":{"fields":[{"label":"L4 proves the","value":"system","aliases":["the system","systems"]},{"label":"L5 proves the","value":"building","aliases":["the building","whole building"]},{"label":"NFPA ___ integrated test","value":4}],"codeRef":null,"explanation":"At L4 I prove the system. At L5 I prove the building. L5 is the integrated systems test: all systems work together under simulated load and utility failure, the way Ops will live with them — the NFPA 4 integrated test, run by the Integrated Testing Agent (ITa)."},"hook":"L4 the system, L5 the building — and NFPA 4 is the number on the integrated test.","source":"Data center commissioning language › table","par":25,"confirmInEdition":false},{"id":"A3-scn-01","topicId":"A3","type":"scenario","prompt":"Write the IST fire scenario for a data hall — out loud, start to restore.","interviewerPhrasing":"Write the IST fire scenario for a data hall.","answer":{"beats":["Halls at full load-bank heat on normal power","ASD Fire 1, then Fire 2 or a second detector → pre-action valve trips","Inspector's test simulates a fused head","Verify notification, central station, valve trip and water delivery time, BMS / EPMS responses; cooling stays up","Drop utility mid-event: fire alarm on secondary power, pumps on generator, controllers transfer","Restore and verify every isolation reversed"],"requiresNumber":false,"codeRef":null,"explanation":"Halls at full load-bank heat on normal power → ASD Fire 1, then Fire 2 or a second detector → pre-action valve trips → inspector's test simulates a fused head → verify notification, central station, valve trip and water delivery time, BMS / EPMS, cooling stays up → drop utility mid-event → fire alarm on secondary power, pumps on generator, controllers transfer → restore and verify every isolation reversed."},"hook":"At L5 I prove the building: fire, water, power loss, and everything back to normal.","source":"Commissioning technical (the 35%) › 9","par":120,"confirmInEdition":false},{"id":"A3-scn-02","topicId":"A3","type":"scenario","prompt":"Mid-scenario you drop utility. What do you watch at the FACP and BMS, and what counts as a pass when power comes back?","interviewerPhrasing":"What are you looking at when the utility drops in the middle of the fire scenario?","answer":{"beats":["Generator running and fault (NFPA 110 remote annunciator), low fuel, ATS position","Fire pump power status: loss of phase, phase reversal, transfer switch position","Fire alarm and releasing panels ride through on their own batteries — no lost points or trouble storms; an alarm in progress keeps sounding","Pre-action compressors or nitrogen generators restore air within 30 min once power returns","On restore every system returns to normal without a manual reset — log any that don't"],"requiresNumber":true,"codeRef":null,"explanation":"Signals at the FACP and BMS: generator running and fault, low fuel, ATS position, fire pump power status (loss of phase, phase reversal, transfer switch position). Panels ride through on batteries with no lost points or trouble storms; air restored within 30 min; everything returns to normal without a manual reset."},"hook":"Generator, fuel, ATS, pump phases — then no trouble storm, air back in 30, and nobody touches a reset.","source":"Emergency power interface › Signals to check at the FACP and BMS","par":90,"confirmInEdition":false},{"id":"A4-num-01","topicId":"A4","type":"number","prompt":"The Lake Mariner fire: month ___, year ___; the chief reported ___ hydrants that didn't work.","answer":{"fields":[{"label":"month","value":"June","aliases":["early june","jun"]},{"label":"year","value":2026},{"label":"hydrants that didn't work","value":3}],"codeRef":null,"explanation":"Early June 2026: a former water treatment building on the Lake Mariner campus burned while the site was still under construction. The fire chief reported no functional alarm or suppression, three hydrants that didn't work, and safety data sheets that had burned."},"hook":"June '26, three dead hydrants, and the data sheets burned with the building.","source":"Why Fluidstack › The Lake Mariner fire — know it, don't lead with it.","par":25,"confirmInEdition":false},{"id":"A4-ord-01","topicId":"A4","type":"order","prompt":"Order the Lake Mariner argument the way the guide builds it: event, finding, code, conclusion, question.","answer":{"steps":["Early June 2026: a former water treatment building on the Lake Mariner campus burned while the site was still under construction","The fire chief reported no functional alarm or suppression, three hydrants that didn't work, and safety data sheets that had burned","NFPA 241 and IFC Chapter 33 expect a fire prevention program and a working water supply once combustibles arrive","So temporary protection is a commissioning deliverable, not a pre-L1 afterthought","If you raise it, ask rather than judge: \"What changed in construction-phase fire protection after Lake Mariner?\""],"codeRef":null,"explanation":"Event → the chief's findings → what NFPA 241 and IFC Chapter 33 expect once combustibles arrive → temporary protection is a commissioning deliverable, not a pre-L1 afterthought → ask rather than judge."},"hook":"Fire, findings, 241 and Chapter 33, deliverable, question.","source":"Why Fluidstack › The Lake Mariner fire — know it, don't lead with it.","par":45,"confirmInEdition":false},{"id":"A4-def-01","topicId":"A4","type":"defect","prompt":"Construction-phase fire protection checklist for the next building. One line breaks a rule. Tap it.","answer":{"lines":["1. Purpose: confirm construction-phase fire protection per NFPA 241 and IFC Chapter 33 before combustibles arrive.","2. Fire prevention program on file.","3. Water supply: hydrants flowed and proven working before combustibles arrive on site.","4. Impairment procedure: any system out of service is logged and a fire watch is in place.","5. Temporary protection is scheduled as a pre-L1 item: the trailer sets it up once the permanent systems reach L3.","6. Temporary cabling for load banks reviewed for added fuel load.","7. Every finding on the issues log with an ID, severity (life safety first), owner and due date."],"defectIndex":4,"codeRef":null,"explanation":"Line 5 — NFPA 241 and IFC Chapter 33 expect a fire prevention program and a working water supply once combustibles arrive, so temporary protection is a commissioning deliverable, not a pre-L1 afterthought."},"hook":"Temporary protection isn't 'before L1' — it's a deliverable the day the combustibles show up.","source":"Why Fluidstack › The Lake Mariner fire — know it, don't lead with it.","par":40,"confirmInEdition":false},{"id":"A4-scn-01","topicId":"A4","type":"scenario","prompt":"Construction-phase fire protection comes up. What's your first-principles point, and how do you raise Lake Mariner without judging?","interviewerPhrasing":"What's your view on fire protection while a site is still under construction?","answer":{"beats":["NFPA 241 and IFC Chapter 33 expect a fire prevention program and a working water supply once combustibles arrive","So temporary protection is a commissioning deliverable, not a pre-L1 afterthought","Lake Mariner, early June 2026: a former water treatment building burned while the site was still under construction","The chief reported no functional alarm or suppression, three hydrants that didn't work, and safety data sheets that had burned","Ask rather than judge: \"What changed in construction-phase fire protection after Lake Mariner?\""],"requiresNumber":true,"codeRef":"NFPA 241","codeRefAliases":["241","NFPA241","IFC Chapter 33","IFC 33","Chapter 33"],"explanation":"NFPA 241 and IFC Chapter 33 expect a fire prevention program and a working water supply once combustibles arrive, so temporary protection is a commissioning deliverable, not a pre-L1 afterthought. Know Lake Mariner, don't lead with it — and ask rather than judge."},"hook":"Water and a program the day combustibles arrive — three dead hydrants is the lesson, asked as a question.","source":"Why Fluidstack › The Lake Mariner fire — know it, don't lead with it.","par":90,"confirmInEdition":false},{"id":"A4-scn-02","topicId":"A4","type":"scenario","prompt":"If you bring up Lake Mariner at all, how do you frame it — and what question does it set up?","answer":{"beats":["Know it, don't lead with it","Ask rather than judge: \"What changed in construction-phase fire protection after Lake Mariner?\"","Lake Mariner is live commissioning now: CB-3 delivered in July, later buildings energizing into early 2027","It sets up the modular-build question: with Lake Mariner energizing and Cameron County breaking ground, where does fire protection commissioning sit — at the factory, or on site?"],"requiresNumber":false,"codeRef":null,"explanation":"Know it, don't lead with it. If you raise it, ask rather than judge: \"What changed in construction-pha
