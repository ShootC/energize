<p><strong>Decide before they ask:</strong> the posting lists San Francisco, Austin or New York, and commissioning means time on site in New York, Texas and beyond. Know your honest answer on travel and location before Stage 2.</p>
<h2 id="g-data-center-commissioning-language">Data center commissioning language</h2>
<p>Data center commissioning runs on five levels, each proving something the one before cannot. Learn the ladder, then place every fire system on it — that is the vocabulary their commissioning interviewer thinks in. One line to own: <strong>&quot;At L4 I prove the system. At L5 I prove the building.&quot;</strong></p>
<div class="table-wrap"><table><thead><tr><th>Level</th><th>Name</th><th>What it proves</th><th>Fire protection example</th></tr></thead><tbody><tr><td>L1</td><td>Factory acceptance / factory witness test</td><td>The equipment meets spec before it ships</td><td>Fire pump certified shop curve; releasing panel factory test; agent cylinder fill weights and pressures; UL 9540 / 9540A data for battery systems</td></tr><tr><td>L2</td><td>Delivery and installation verification</td><td>What arrived matches the submittal and is installed per design and listing</td><td>ASD hole sizes and labels match the design calc; nozzle orientation; hangers and seismic bracing; sprinkler temperature ratings and obstructions around containment</td></tr><tr><td>L3</td><td>Start-up / pre-functional</td><td>Each component runs on its own; vendor start-up is done</td><td>Underground flush and hydros; dry / pre-action air test; pump start-up by the manufacturer's rep; program loaded; 100% point-to-point</td></tr><tr><td>L4</td><td>Functional performance test (FPT)</td><td>Each system runs every sequence, including failure and degraded modes, against the Basis of Design</td><td>Pump acceptance test; pre-action trip with water delivery time; clean agent sequence with abort and manual release; door fan; ASD transport time; gas detector calibration and outputs</td></tr><tr><td>L5</td><td>Integrated systems test (IST)</td><td>All systems work together under simulated load and utility failure, the way Ops will live with them</td><td>Fire alarm through a utility failure onto generator; release signals to BMS / EPMS; detection behavior with load banks running; battery off-gas → BMS trip → exhaust; NFPA 4 integrated test</td></tr></tbody></table></div>
<p>Some owners add an L0 for design review (OPR, BOD, Cx specs). L1–L5 is an industry convention, not a code, so definitions vary — ask which ladder Fluidstack uses. That's a good question in itself.</p>
<p><strong>The documents.</strong> Owner's Project Requirements (OPR) say what the owner needs; the Basis of Design (BOD) says how the design meets it; the Cx plan says who tests what, when. NFPA 3 (2024) is the commissioning standard for fire and life safety systems and names the Fire Commissioning Agent (FCxA); NFPA 4 (2024) covers integrated testing and names the Integrated Testing Agent (ITa) — one person can hold both. NFPA 4 leaves retest frequency to the integrated test plan; the IFC sets 10 years for high-rise and smoke control integrated tests unless the plan says otherwise.</p>
<p><strong>Script development — what a good fire FPT script contains.</strong></p>
<ol><li>Purpose, system, and the code / BOD sections each acceptance criterion comes from.</li><li>Prerequisites: prior level signed off, AHJ notified, central station on test, impairment logged, fire watch in place if the system goes out of service.</li><li>Safety isolation: actuators and solenoids replaced by test lamps or simulators, agent cylinders disconnected, shutdown circuits verified before you trip anything.</li><li>Steps with an expected result, an actual result, pass/fail and initials on every line.</li><li>Failure modes: open and ground faults on releasing circuits, loss of primary power, loss of air, abort and manual release behavior.</li><li>Return to normal — every isolation reversed and verified. The most dangerous outcome of a test is a system left disabled.</li></ol>
<p><strong>IST matrix — the document the posting says you'll review.</strong> Every input against every output, with the expected state. Each filled cell becomes a test step; the blank cells get tested too, because proving an output does <em>not</em> happen is half the job. Example only — the BOD decides every cell.</p>
<div class="table-wrap"><table><thead><tr><th>Input ↓ · Output →</th><th>Building alarm</th><th>Central station</th><th>Release / trip</th><th>HVAC and dampers</th><th>BMS / EPMS</th><th>Elevator</th></tr></thead><tbody><tr><td>ASD Alert / Action, Hall 1</td><td>—</td><td>—</td><td>—</td><td>—</td><td>Ops alert</td><td>—</td></tr><tr><td>ASD Fire 1, Hall 1</td><td>●</td><td>●</td><td>—</td><td>Per BOD — halls often keep cooling running</td><td>●</td><td>—</td></tr><tr><td>ASD Fire 2 or 2nd detector, Hall 1</td><td>●</td><td>●</td><td>Pre-action solenoid (valve trips only on loss of air)</td><td>Per BOD</td><td>●</td><td>—</td></tr><tr><td>Pre-action waterflow, Hall 1</td><td>●</td><td>●</td><td>—</td><td>Per BOD</td><td>●</td><td>—</td></tr><tr><td>Clean agent release, electrical room</td><td>●</td><td>●</td><td>Agent</td><td>Room HVAC off, dampers close</td><td>Power-down per BOD</td><td>—</td></tr><tr><td>Duct smoke detector, AHU</td><td>Supervisory</td><td>Supervisory</td><td>—</td><td>AHU off</td><td>●</td><td>—</td></tr><tr><td>Li-ion off-gas, UPS room</td><td>—</td><td>—</td><td>BMS trips the string</td><td>Exhaust on</td><td>●</td><td>—</td></tr><tr><td>Elevator lobby or machine room detector</td><td>●</td><td>●</td><td>Shunt trip (machine room heat)</td><td>—</td><td>●</td><td>Recall</td></tr><tr><td>Utility failure</td><td>—</td><td>Trouble if a panel loses AC</td><td>—</td><td>Smoke control fans restart</td><td>●</td><td>—</td></tr></tbody></table></div>
<p><strong>Running an AHJ witness test</strong></p>
<ul><li>Pre-test the whole script first. The witness test should repeat a test you've already passed.</li><li>Send the script ahead; agree the witness points and sample size before the day.</li><li>One voice: you run the test, contractors execute, the AHJ observes.</li><li>Log every AHJ comment on the issues log on the spot. Don't argue code in the room — cite the section and resolve it after.</li><li>Leave with the signed acceptance and any conditions on a temporary certificate of occupancy in writing.</li></ul>
<p><strong>Load bank strategy — the fire protection angle.</strong> Rack and air-heater load banks simulate IT heat for cooling tests. New load banks burn off coatings and can drive ASD into Alert or Action. Agree thresholds and fire watch with the Cx lead in advance — never just disable a hall. Temporary cabling adds fuel load. After load banks leave, re-run the ASD learn on clean air with real airflow; a learn done in construction dust sets a desensitized baseline.</p>
<p><strong>Issues log, punch and turnover.</strong> Every finding gets an ID, system, level found, severity (life safety first), owner, due date and closure evidence. Life-safety issues close before turnover; anything else carried into operations needs a documented risk acceptance. The turnover package: Record of Completion (NFPA 72), Contractor's Material and Test Certificates (NFPA 13 / 24), pump acceptance report (NFPA 20), clean agent acceptance with door fan report (NFPA 2001), battery calcs, program backups, spare sprinklers and agent recharge plan, ITM schedule loaded into the CMMS, impairment procedure, and recorded Ops training.</p>
<h2 id="g-sprinkler-and-underground">Sprinkler and underground</h2>
<p>Sprinkler acceptance proves the water gets there: a clean underground, tight piping, a supply that meets demand with margin, and alarms that report flow — all recorded on the Contractor's Material and Test Certificates.</p>
<p><strong>Governing:</strong> NFPA 13 (acceptance is Chapter 29 in the 2022 edition; it was Chapter 28 in 2019), NFPA 24 for underground, NFPA 72 for waterflow signaling, NFPA 25 for the baseline you hand to Ops.</p>
<div class="table-wrap"><table><thead><tr><th>Test</th><th>Requirement</th><th>Reference</th></tr></thead><tbody><tr><td>Underground flush</td><td>Not less than one of: system demand including hose; the 10 ft/s table flow (4 in. 390 · 6 in. 880 · 8 in. 1,560 · 10 in. 2,440 · 12 in. 3,520 gpm); or the maximum flow available</td><td>NFPA 24 Table 10.10.2.1.3</td></tr><tr><td>Underground hydro</td><td>200 psi, or 50 psi above static where static exceeds 150 psi, for 2 h; makeup allowance L = S·D·√P / 148,000 gph</td><td>NFPA 24</td></tr><tr><td>Aboveground hydro</td><td>200 psi for 2 h, or 50 psi above working pressure where it exceeds 150 psi; no gauge drop and no visible leakage; on pump systems, set from pump shutoff pressure</td><td>NFPA 13-2022 §29.2.1</td></tr><tr><td>Dry and double-interlock air test</td><td>40 psi for 24 h, loss ≤ 1.5 psi</td><td>NFPA 13 §29.2.2</td></tr><tr><td>Air supply</td><td>Restores normal air pressure within 30 min (60 min for refrigerated spaces below 5 °F)</td><td>NFPA 13 §8.2.6.3</td></tr><tr><td>Waterflow alarm</td><td>Initiating device within 90 s of one-sprinkler flow (NFPA 72); electrical alarm within 100 s and mechanical within 5 min (NFPA 13 §7.7)</td><td>NFPA 72 / NFPA 13</td></tr><tr><td>Backflow preventer</td><td>Forward-flow test at system demand, including hose where applicable</td><td>NFPA 13 / NFPA 24</td></tr><tr><td>Hose allowance</td><td>Light 100 gpm / 30 min · Ordinary 250 gpm / 60–90 min · Extra 500 gpm / 90–120 min</td><td>NFPA 13 Table 19.2.3.1.2</td></tr></tbody></table></div>
<p><strong>Acceptance sequence</strong></p>
<ol><li><strong>L2 — install vs design.</strong> Sprinkler type, K-factor, temperature rating, orientation and coverage; obstructions from containment panels, cable tray, busway and ductwork; hangers and seismic bracing; FDC; hydraulic nameplate at the riser; spare sprinkler cabinet (6 spares under 300 sprinklers, 12 for 300–1,000, 24 above 1,000) with a wrench for each type.</li><li><strong>L3 — prove the pipe.</strong> Witness the underground flush before it connects to the riser, then both hydros. Signed certificates for underground and aboveground.</li><li><strong>L4 — prove the system.</strong> Inspector's test: time to alarm. Valve tamper switches report within two turns of the handwheel or one-fifth of stem travel. Main drain test (record static and residual — that's the NFPA 25 baseline). Backflow forward-flow test. On dry systems, trip test: time to trip and time to water at the test connection.</li><li><strong>L5 — prove it in the building.</strong> Waterflow reaches the FACP, central station and BMS on normal and generator power; fire pump (if any) starts and carries the demand.</li><li><strong>Turnover:</strong> certificates, as-builts, the calc, main drain and pump baselines, spare sprinklers, and the NFPA 25 schedule loaded into the CMMS.</li></ol>
<p><strong>Data center points to make</strong></p>
<ul><li>Hazard classification is set by the owner's and insurer's standard (FM Data Sheet 5-32 wants sprinklers throughout; gaseous systems are a supplement).</li><li>Hot-aisle containment is an obstruction problem first: panels listed to drop away on heat, or sprinklers inside the contained aisle.</li><li>A field reroute that adds fittings changes the calc. The commissioning answer is a recalc against the supply test, not a judgment call on the ladder.</li></ul>
<p><strong>Likely question:</strong> &quot;What's on your sprinkler acceptance checklist?&quot; Flush → hydros → air test if dry → inspector's test and tamper timing → main drain baseline → backflow forward flow → signals to central station → certificates.</p>
<h2 id="g-pre-action">Pre-action</h2>
<p>Pre-action acceptance proves two opposite things: the system holds water back until the right conditions occur, and then delivers it fast enough. So you test the interlock logic and the water delivery time, not just the trip.</p>
<div class="table-wrap"><table><thead><tr><th>Type</th><th>Valve opens on</th><th>Size and delivery rules</th></tr></thead><tbody><tr><td>Non-interlock</td><td>Detection <strong>or</strong> sprinkler operation (loss of air)</td><td>Up to 1,000 sprinklers per valve</td></tr><tr><td>Single-interlock</td><td>Detection</td><td>Up to 1,000 sprinklers per valve</td></tr><tr><td>Double-interlock</td><td>Detection <strong>and</strong> loss of air</td><td>Sized like dry pipe; 30% design-area increase</td></tr></tbody></table></div>
<p>Automatic air supervision is required above 20 sprinklers. Double-interlock systems take the 40 psi, 24-hour air test (≤1.5 psi loss), and the air supply must restore normal pressure within 30 minutes.</p>
<p><strong>Dry-pipe sizing rules</strong> (NFPA 13-2022 §8.2.3; consolidated into §8.2.4 in 2025). A system is acceptable by any one of: 500 gal or less without a quick-opening device; 750 gal or less with one; water at the inspector's test connection within 60 s by test; calculated delivery meeting the table; or a manifold functional test. The 500 and 750 gal figures are exemptions from the delivery-time rule, not size limits. Double-interlock gets only the 500 gal exemption: above that, prove water at the test connection within 60 s — starting from normal air pressure, with detection activated and the test connection opened at the same moment — or by calculation (NFPA 13 §8.3.2.3).</p>
<div class="table-wrap"><table><thead><tr><th>Hazard</th><th>Sprinklers assumed open</th><th>Max time to water</th></tr></thead><tbody><tr><td>Dwelling unit</td><td>1</td><td>15 s</td></tr><tr><td>Light</td><td>1</td><td>60 s</td></tr><tr><td>Ordinary</td><td>2</td><td>50 s</td></tr><tr><td>Extra</td><td>4</td><td>45 s</td></tr><tr><td>High-piled storage</td><td>4</td><td>40 s</td></tr></tbody></table></div>
<p><strong>Releasing panel power.</strong> NFPA 72 requires 24 h standby plus 5 min alarm. FM Approval Standard 1011 requires 90 h standby plus 10 min for deluge and pre-action releasing — ask whether the owner or insurer specifies FM. Solenoid and panel must be listed as compatible.</p>
<p><strong>Sample L4 script — double-interlock (the Day 12 exercise)</strong></p>
<ol><li><strong>Prerequisites:</strong> hydro and air test passed; panel programmed; central station on test; gauges calibrated; drain path ready.</li><li><strong>Detection only</strong> (one zone, then the cross-zone or Fire 2 input): alarms annunciate, valve stays shut.</li><li><strong>Loss of air only</strong> (open the inspector's test): low-air supervisory, valve stays shut.</li><li><strong>Both:</strong> detection plus open test connection — valve trips, waterflow pressure switch alarms; record time to trip and time to water at the test connection against the table or calc.</li><li><strong>Manual release</strong> per the design.</li><li><strong>Faults:</strong> open and short on the solenoid circuit, detection circuit faults, low and high air, compressor or nitrogen generator failure, tamper, panel AC loss — each one annunciates correctly.</li><li><strong>Restore:</strong> drain, reset the valve per the manufacturer (clapper, priming water), restore air, panel normal, sign-off.</li></ol>
<p><strong>Test-day details an interviewer will probe</strong></p>
<ul><li><strong>What you record on a trip test:</strong> starting air pressure, air pressure at trip, time to trip, time to water at the test connection, and water pressure there once flow is steady.</li><li><strong>The test connection</strong> has an orifice matching the smallest K-factor on the system; on dry systems it sits at the most remote end of the top branch line.</li><li><strong>Common acceptance failures:</strong> air leaks at grooved couplings and threaded joints; a compressor too small to restore air in 30 minutes; missing or unlabeled low-point drains; trapped sections that hold water in a dry system.</li><li><strong>The NFPA 25 baseline you're setting:</strong> dry and pre-action valves get a partial trip test every year and a full-flow trip test every 3 years. A main drain reading more than 10% below acceptance has to be investigated — so record yours carefully.</li><li><strong>A failed delivery time is a code failure, not a punch item.</strong> Fixes: split the system onto another valve, adjust air pressure within the valve's listed range, or re-run the calc — then retest.</li></ul>
<p><strong>Data center points to make</strong></p>
<ul><li>Double-interlock is common in data halls because one false detection signal or one damaged sprinkler alone can't put water on IT. The cost is delivery time, the area increase and complexity — FM Data Sheet 5-32 cautions that double-interlock can delay control.</li><li>Nitrogen inerting fights corrosion in the dry pipe; it also puts an oxygen-depletion detector in the generator room.</li><li>ASD Fire 2 (or a second detector) is the usual release input.</li></ul>
<p><strong>Likely question:</strong> &quot;Why double-interlock in a data hall, and what does it cost you?&quot; Protection against a single false signal or mechanical damage, paid for in delivery time, design area and complexity — and you prove the delivery time at acceptance, not assume it.</p>
<h2 id="g-fire-pump">Fire pump</h2>
<p>The field acceptance test proves the installed pump reproduces its certified shop curve at churn, 100% and 150% of rated flow, and that the controller and driver start it every time, on every power source.</p>
<p><strong>Governing:</strong> NFPA 20 Chapter 14 (field acceptance), NEC 695, NFPA 25 for the baseline. The pump, engine (if supplied), controller and transfer switch manufacturers or their authorized reps must be present.</p>
<div class="table-wrap"><table><thead><tr><th>Item</th><th>Requirement</th></tr></thead><tbody><tr><td>Suction flush</td><td>NFPA 20 Table 14.1.1.1 at about 15 ft/s: 4 in. 590 · 6 in. 1,320 · 8 in. 2,350 · 10 in. 3,670 · 12 in. 5,290 gpm. If unavailable: at least 150% of rated pump flow; otherwise the greater of 100% rated or maximum system demand</td></tr><tr><td>Hydrostatic</td><td>200 psi or 50 psi above maximum pressure, whichever is greater, for 2 h</td></tr><tr><td>Churn</td><td>No more than 140% of rated pressure</td></tr><tr><td>150% flow</td><td>At least 65% of rated pressure</td></tr><tr><td>Curve match</td><td>Field results match the certified shop curve within the accuracy of the test equipment. The 95% / 5% figure is NFPA 25's annual test — not acceptance</td></tr><tr><td>Starts</td><td>6 automatic + 6 manual, each run at least 5 min at full speed. Diesel: starts split across both battery sets; no 5-min run needed between starts until cumulative cranking reaches 45 s</td></tr><tr><td>Run time</td><td>At least 1 h cumulative during the test</td></tr><tr><td>Electric motor</td><td>Starting: no more than 15% below rated at the controller line terminals. Running at 115% of full-load current: no more than 5% below rated at the motor terminals. Amps ≤ FLA × service factor</td></tr><tr><td>Alternate power</td><td>Simulate loss of normal power at peak load; transfer to the alternate source and back without opening overcurrent devices; at least half the starts on the alternate source</td></tr><tr><td>Minimum run timer</td><td>Electric 10 min after an automatic start (diesel 30 min)</td></tr><tr><td>Pressure settings</td><td>Jockey stop = churn + minimum static; jockey start at least 10 psi below stop; fire pump start 5 psi below jockey start; each additional pump 10 psi lower (NFPA 20 Annex)</td></tr><tr><td>NFPA 25 churn tests</td><td>Diesel weekly for 30 min; electric monthly for 10 min — weekly where the pump serves a high-rise beyond fire department pumping, has a limited-service controller, is vertical turbine, or takes suction from a ground-level tank or a source with no useful pressure</td></tr></tbody></table></div>
<p><strong>Formulas</strong></p>
<div class="math" data-tex="\frac{Q_2}{Q_1} = \frac{N_2}{N_1} \qquad \frac{P_2}{P_1} = \left(\frac{N_2}{N_1}\right)^2 \qquad P_{net} = P_{discharge} - P_{suction}"><span class="tex-frac"><span class="tex-num">Q<sub>2</sub></span><span class="tex-den">Q<sub>1</sub></span></span> = <span class="tex-frac"><span class="tex-num">N<sub>2</sub></span><span class="tex-den">N<sub>1</sub></span></span>    <span class="tex-frac"><span class="tex-num">P<sub>2</sub></span><span class="tex-den">P<sub>1</sub></span></span> = (<span class="tex-frac"><span class="tex-num">N<sub>2</sub></span><span class="tex-den">N<sub>1</sub></span></span>)<sup>2</sup>    P<sub>net</sub> = P<sub>discharge</sub> - P<sub>suction</sub></div>
<p>Correct every test point to rated speed with the affinity laws before you compare it to the shop curve. Plot net pressure, not discharge pressure.</p>
<p><strong>Acceptance sequence</strong></p>
<ol><li><strong>L1:</strong> certified shop test curve on file.</li><li><strong>L2:</strong> alignment on horizontal split-case pumps (checked by the manufacturer's rep); rotation; no elbow or tee in a plane parallel to the shaft within 10 pipe diameters of the suction flange; relief valve and test header as designed.</li><li><strong>L3:</strong> suction flush and hydro; controller settings; jockey and fire pump start / stop pressures.</li><li><strong>L4:</strong> field acceptance test — churn, 100%, 150% with speed, suction, discharge, flow, volts and amps at each point; all starts; alternate-source transfer.</li><li><strong>L5:</strong> pump runs on generator at system demand; signals reach the FACP — pump running, loss of phase or phase reversal, controller trouble; for diesel, engine running, controller trouble, and switch off-automatic.</li></ol>
<p><strong>Data center points to make:</strong> on an islanded-power campus the pump's &quot;alternate source&quot; is part of a microgrid, not a utility feed plus a generator — what counts as a reliable source and how transfer is proven is a real conversation with the electrical team and the AHJ.</p>
<p><strong>Likely question:</strong> &quot;The pump misses the 150% point — what do you check?&quot; See question 11 in the last section: test setup first, then suction conditions, then the pump.</p>
<h2 id="g-emergency-power-interface">Emergency power interface</h2>
<p>This IST proves every life-safety load rides through a utility failure (or, on an islanded campus, a generation-block trip), is back within code time, and returns to normal without anyone touching it. It's named in the Cx posting and it's the heart of a data center IST.</p>
<p><strong>Governing:</strong> NEC 700 (emergency — available within 10 s), NEC 701 (legally required standby — 60 s), NEC 695 (fire pumps), NFPA 110 (generators and transfer equipment), NFPA 72 Chapter 10 (fire alarm power), NFPA 20 (pump alternate power).</p>
<div class="table-wrap"><table><thead><tr><th>Load</th><th>What you prove</th></tr></thead><tbody><tr><td>Fire alarm, voice evacuation, releasing panels</td><td>Ride through on their own batteries; no lost points or trouble storms; an alarm in progress keeps sounding</td></tr><tr><td>Egress lighting and exit signs</td><td>Lit within 10 s</td></tr><tr><td>Fire pump</td><td>Transfers to the alternate source and carries demand (see Fire pump)</td></tr><tr><td>Smoke control fans and dampers</td><td>Restart and return to their smoke-control state; the firefighter's panel shows true status</td></tr><tr><td>Pre-action compressors or nitrogen generators</td><td>Air restored within 30 min once power returns</td></tr><tr><td>Gas detection and battery-room exhaust</td><td>Exhaust keeps running; detection stays powered</td></tr><tr><td>Elevator recall and shunt trip</td><td>Recall still works; shunt-trip power stays supervised</td></tr></tbody></table></div>
<p><strong>Generator numbers (NFPA 110 — confirm sections in your edition)</strong></p>
<ul><li>Level 1 = failure could cost lives; Type 10 = power within 10 s; Class = hours of fuel at rated load.</li><li>Acceptance: cold start and transfer within 10 s; a building load test; and a <a href="https://www.columbus.gov/files/sharedassets/city/v/3/building-and-zoning/cic-21-level-1-emergency-power-supply-system-testing-2026.pdf" target="_blank" rel="noopener">2-hour full-load test</a>, with results on file before occupancy.</li><li>Periodic: monthly 30 min at 30% or more of nameplate (or the manufacturer's minimum exhaust temperature); an annual load-bank test where monthly runs can't reach 30%; Level 1 systems run 4 h every 36 months.</li></ul>
<p><strong>Fire alarm secondary power:</strong> 24 h standby + 5 min alarm on batteries, or an automatic-starting generator plus dedicated batteries with 4 h of capacity (<a href="https://www.meyerfire.com/daily/dual-electrical-feeds-meet-fa-secondary-power" target="_blank" rel="noopener">NFPA 72-2019 §10.6.7.3.1</a>; renumbered in 2025).</p>
<p><strong>The L5 pull-the-plug test</strong></p>
<ol><li>Halls at load-bank heat; fire alarm normal. Then repeat with a fire scenario already in alarm.</li><li>Open the utility main — or trip a generation block on an islanded campus.</li><li>Time the transfer and walk every load in the table.</li><li>Repeat with one generator failed (N+1) and with the fire pump running.</li><li>Restore normal power. Every system should return to normal without a manual reset; log any that don't.</li></ol>
<p><strong>Signals to check at the FACP and BMS:</strong> generator running and fault (NFPA 110 remote annunciator), low fuel, ATS position, fire pump power status (loss of phase, phase reversal, transfer switch position).</p>
<p><strong>Data center points to make</strong></p>
<ul><li>If the site elects NEC 645, an EPO exists and its fire alarm interface goes in the IST matrix. Many sites choose not to.</li><li>Clean agent: if more than 480 V stays energized after discharge, NFPA 2001's prescriptive concentrations no longer apply. The power-down output is a design decision, not a detail.</li><li>With islanded power and no utility, &quot;normal&quot; and &quot;alternate&quot; sources have to be defined with the AHJ before you can write the transfer test.</li></ul>
<p><strong>Likely question:</strong> &quot;How do you test fire alarm through a utility failure?&quot; The five steps above, plus what you'd log if a panel throws troubles on transfer.</p>
<h2 id="g-smoke-control">Smoke control</h2>
<p>Smoke control acceptance proves the system makes the design pressure differences or exhaust rates in every fire zone without making doors impossible to open. A special inspector witnesses it, and the firefighter's smoke control panel (FSCP) must override everything.</p>
<p><strong>Governing:</strong> IBC 909; NFPA 92; IFC for testing and maintenance; UL 864 smoke control listing for the controls; IBC Chapter 17 special inspection.</p>
<div class="table-wrap"><table><thead><tr><th>Item</th><th>Requirement</th></tr></thead><tbody><tr><td>Pressure difference, sprinklered space (NFPA 92)</td><td>≥ 0.05 in. w.c.</td></tr><tr><td>Stair pressurization (IBC smokeproof enclosures)</td><td>0.10–0.35 in. w.c., doors closed</td></tr><tr><td>Elevator hoistway pressurization (IBC)</td><td>0.10–0.25 in. w.c.</td></tr><tr><td>Door opening force</td><td>≤ 30 lbf</td></tr><tr><td>Airflow toward a fire (atrium makeup air)</td><td>≤ 200 ft/min</td></tr><tr><td>Duct leakage test</td><td>1.5 × maximum design pressure; leakage ≤ 5% of design flow</td></tr><tr><td>Control verification</td><td>Positive confirmation from each component (airflow or position, not just a command); weekly automatic self-test of dedicated systems</td></tr><tr><td>Periodic testing</td><td>Dedicated systems semiannually; nondedicated annually</td></tr><tr><td>Integrated retest</td><td>Every 10 years (IFC 901.6.2.2) unless the integrated test plan says otherwise</td></tr></tbody></table></div>
<p>IBC values above are from a <a href="https://www.commissioning.org/wp-content/uploads/2019/12/Norris_Testing-Smoke-Control-Systems.pdf" target="_blank" rel="noopener">BCA smoke control testing presentation</a> citing the 2012 IBC; confirm them in the edition your site uses.</p>
<p><strong>Acceptance sequence</strong></p>
<ol><li><strong>L0 — design review:</strong> rational analysis, sequence of operations per zone, fan and damper schedule, FSCP graphics.</li><li><strong>L2:</strong> witness duct leak tests; dampers accessible with the right actuators; belt-driven fans with at least two belts (1.5 × design duty); wiring in raceway; makeup air intakes at least 20 ft from exhaust.</li><li><strong>L3:</strong> the test-and-balance contractor balances to design airflow; each fan and damper proven on its own from the FSCP and from automatic inputs.</li><li><strong>L4:</strong> zone by zone — trigger each fire zone; time each component to its smoke-control state; measure pressure across every barrier and every door force; verify end-to-end confirmation; prove FSCP priority over the BMS, freezestats and duct detectors.</li><li><strong>L5:</strong> repeat on standby power (see Emergency power interface) and with cooling in its real operating modes.</li><li><strong>Close-out:</strong> special inspector's report to the AHJ; the as-tested values become the baseline for periodic tests.</li></ol>
<p><strong>Data center points to make</strong></p>
<ul><li>Data halls rarely have a code-required smoke control system; you'll find it in stairs, atriums and office blocks. But smoke-control-like sequences are everywhere — HVAC shutdown on detection, dampers for clean agent rooms, post-discharge exhaust — and the IST matrix tests them the same way.</li><li>High-airflow cooling can fight pressurization, so test with CRAHs in every mode.</li></ul>
<p><strong>Likely question:</strong> &quot;Stair pressurization reads high with all doors closed — what do you check?&quot; Barometric relief or relief damper, the fan's VFD setpoint, sensor location, and a stair tighter than designed. Then run the open-door case before retuning: too high fails door force, too low lets smoke in.</p>
<h2 id="g-clean-agent-and-co2">Clean agent and CO2</h2>
<p>Clean agent acceptance proves the system can reach and hold concentration without discharging it: tight, clear piping; the right quantity; a room that holds the agent at least 10 minutes; and a release sequence proven with simulated actuators. CO2 is the exception — NFPA 12 requires a full discharge test.</p>
<p><strong>Governing:</strong> NFPA 2001 and NFPA 12; the manufacturer's listed design manual and the vendor's flow calc; NFPA 72 for the releasing panel.</p>
<div class="table-wrap"><table><thead><tr><th>Item</th><th>Halocarbon (HFC-227ea, FK-5-1-12)</th><th>Inert gas (IG-541, IG-55, IG-100)</th><th>CO2</th></tr></thead><tbody><tr><td>Discharge</td><td>95% of minimum design concentration in ≤10 s</td><td>≤60 s for Class B; ≤120 s for Class A surface and Class C</td><td>Surface fires: design concentration within 1 min</td></tr><tr><td>Design concentration</td><td>Extinguishing × 1.2 (A), 1.3 (B), 1.35 (C)</td><td>Same factors; check whether your edition applies 1.35 to inert gas</td><td>34% minimum</td></tr><tr><td>People</td><td>NOAEL: HFC-227ea 9%, FK-5-1-12 10%</td><td>≤43% → 5 min; 43–52% → 3 min; 52–62% → 30 s, unoccupied only</td><td>Lethal at design concentration; new total flooding barred from normally occupied spaces</td></tr><tr><td>Piping proof</td><td>40 psi closed-circuit pneumatic test, 10 min, ≤20% loss; nitrogen flow test proves nozzles clear</td><td>Same</td><td>Per NFPA 12</td></tr><tr><td>Room proof</td><td>Door fan: ≥10 min hold at the highest combustible level (85% of adjusted minimum design concentration retained)</td><td>Same</td><td>Full discharge test required</td></tr></tbody></table></div>
<p><strong>Quantity formulas</strong> (V = volume, s = specific vapor volume at temperature, C = design concentration %, Vs = specific volume at 70 °F)</p>
<div class="math" data-tex="W_{halocarbon} = \frac{V}{s}\left(\frac{C}{100 - C}\right) \qquad s = k_1 + k_2 T">W<sub>halocarbon</sub> = <span class="tex-frac"><span class="tex-num">V</span><span class="tex-den">s</span></span>(<span class="tex-frac"><span class="tex-num">C</span><span class="tex-den">100 - C</span></span>)    s = k<sub>1</sub> + k<sub>2</sub> T</div>
<div class="math" data-tex="X_{inert} = 2.303\,\frac{V_s}{s}\,\log_{10}\left(\frac{100}{100 - C}\right) \quad \text{(volume of agent per volume of room, then} \times V)">X<sub>inert</sub> = 2.303 <span class="tex-frac"><span class="tex-num">V<sub>s</sub></span><span class="tex-den">s</span></span> log<sub>10</sub>(<span class="tex-frac"><span class="tex-num">100</span><span class="tex-den">100 - C</span></span>)   (volume of agent per volume of room, then × V)</div>
<p><strong>Acceptance sequence</strong></p>
<ol><li><strong>L2 — as-built vs calc.</strong> Cylinder agent weight, pressure and serials; nozzle models, orifice codes and locations; pipe sizes and lengths within the vendor's calc limits (re-run the calc if routing changed); nozzles anchored for discharge reaction; pressure relief vent installed and sized (inert gas over-pressure; halocarbons can swing negative, then positive); room volume including raised-floor and ceiling voids; signage, manual release and abort locations.</li><li><strong>L3 — piping.</strong> Pneumatic test of closed sections; nitrogen flow test through every nozzle. Program the releasing panel.</li><li><strong>L4 — room.</strong> Door fan per NFPA 2001 Annex C. A fail sends you leak-hunting under depressurization — cable and conduit penetrations, raised floor, ceiling plenum, dampers — not adding agent.</li><li><strong>L4 — sequence, actuators removed.</strong> Detection (cross-zoned or ASD Fire 2) → first alarm → second input → pre-discharge alarm and time delay → release output. Abort in its selected mode; manual release overrides abort; HVAC off, dampers closed, door holders released; open and short faults on the release circuit; low cylinder pressure and maintenance-lockout supervisory; secondary power.</li><li><strong>Reconnect</strong> actuators under a written procedure — panel normal, no active outputs, second-person verification.</li><li><strong>L5:</strong> release output drives the BMS / EPMS responses (CRAH shutdown in the room, dampers, any power-down the BOD calls for) on normal and generator power.</li></ol>
<p><strong>CO2 specifics (NFPA 12).</strong> A supervised lockout valve is required on all systems unless people can't physically enter, and wherever CO2 could migrate. A pneumatic time delay and pre-discharge alarm are mandatory, with the delay sized to evacuation. Wintergreen odorizer is a recognized safeguard. On a data center campus CO2 shows up in engine or turbine enclosures, not data halls.</p>
<p><strong>Data center points to make</strong></p>
<ul><li>FM Data Sheet 5-32 treats gaseous systems as a supplement to sprinklers, not a substitute; FM guidance does not accept clean agent or mist as primary protection for lithium-ion racks.</li><li>Agent supply is a design risk now: 3M stopped making Novec 1230 at the end of 2025; FK-5-1-12 is made by others, but recharge only with agent covered by that system's listing. US rules require recycled HFC-227ea for servicing from 2026 and for new installs from 2030 (<a href="https://www.epa.gov/system/files/documents/2026-02/er-r-fact-sheet-fire-suppression-2026-02-09_1.pdf" target="_blank" rel="noopener">EPA</a>).</li><li>At gigawatt scale, holding concentration in a hall with containment and high-airflow cooling is impractical. That's a first-principles answer to &quot;why not clean agent everywhere?&quot;</li></ul>
<p><strong>Likely question:</strong> &quot;Is clean agent right for a data hall at this scale?&quot; No as primary: sprinklers plus very early detection, with clean agent reserved for spaces where the owner's risk case justifies it — and the supply and regulatory picture argues against standardizing on it.</p>
<h2 id="g-condensed-aerosol">Condensed aerosol</h2>
<p>You can't discharge an aerosol system at acceptance — generators are single-use pyrotechnic devices — so acceptance proves the design quantity, the placement and clearances, an enclosure tight enough to hold the aerosol, and the release circuit, using simulated actuators.</p>
<p><strong>Governing:</strong> NFPA 2010; the manufacturer's listed design, installation and maintenance manual; NFPA 72 for the releasing panel.</p>
<p><strong>How it works:</strong> a solid compound (typically potassium-based) ignites and produces fine solid particles and gas that break the flame's chain reaction chemically. It does not depend on oxygen depletion, but it obscures visibility, discharges hot, and leaves residue that has to be cleaned.</p>
<p><strong>Where you'll see it on a campus:</strong> unoccupied enclosures — generator and turbine enclosures, electrical cabinets, some battery cabinets per listing. NFPA 2010 restricts use in normally occupied spaces; confirm the edition's wording before an interviewer asks.</p>
<p><strong>Acceptance sequence</strong></p>
<ol><li><strong>L2 — quantity and placement.</strong> Generator models and count match the design, which is the listed design density × net protected volume × the required safety factor, adjusted for openings. Check orientation, mounting, the listed clearances to people and combustibles (the discharge is hot), nothing blocking the discharge path, and manufacture / service-life dates.</li><li><strong>L2 — enclosure.</strong> Openings match the design's leakage assumptions; dampers close; doors self-close; signage posted.</li><li><strong>L3 — circuit.</strong> Releasing panel and actuators are listed as compatible. Wiring follows the listing (series or parallel); measure circuit values with the manufacturer's approved low-current tester only.</li><li><strong>L4 — sequence with generators disconnected.</strong> Replace every generator with a listed test device or simulator, then verify: detection → pre-discharge alarm → time delay → release output; abort; manual release; HVAC and damper shutdown; open and short faults on the release circuit report trouble.</li><li><strong>Reconnection — the riskiest step.</strong> Panel in normal with no active outputs, verified by a second person, before generators reconnect. Final check with the approved tester.</li><li><strong>L5:</strong> release signal drives the integrated shutdowns (enclosure fans, fuel valves, BMS points) on normal and generator power.</li></ol>
<p><strong>Traps:</strong> never megger or continuity-test with a meter that can push enough current to fire a generator; plan residue cleanup and post-discharge ventilation in the EOP; a hot discharge near cabling or plastics is a design defect, not a field fix.</p>
<p><strong>Likely question:</strong> &quot;How do you commission a system you can't discharge?&quot; Prove the inputs to the design (volume, openings, quantity, clearances), prove the sequence with simulators, and treat reconnection as a controlled procedure.</p>
<h2 id="g-water-mist">Water mist</h2>
<p>Mist is designed to a fire-test listing, not a density, so acceptance proves two things: a small-orifice, high-pressure network that is clean and tight, and an installation that matches every parameter the listing was tested at.</p>
<p><strong>Governing:</strong> NFPA 750; the system's listing or approval from fire tests (for example FM 5560); the manufacturer's design, installation and maintenance manual.</p>
<div class="table-wrap"><table><thead><tr><th>Pressure class</th><th>Operating pressure</th><th>Hydrostatic acceptance test</th></tr></thead><tbody><tr><td>Low</td><td>≤ 175 psi</td><td>200 psi for 2 h (working pressure + 50 psi where working pressure exceeds 150 psi)</td></tr><tr><td>Intermediate</td><td>&gt; 175 to &lt; 500 psi</td><td>1.5 × working pressure for 10 min, then working pressure for 110 min, no loss</td></tr><tr><td>High</td><td>≥ 500 psi</td><td>Same as intermediate</td></tr></tbody></table></div>
<p>Mist is defined by droplet size: Dv0.99 below 1,000 µm at minimum design operating pressure. Dry or pre-action mist systems also get the 40 psi, 24-hour air test. Intermediate and high-pressure calcs use Darcy-Weisbach, not Hazen-Williams.</p>
<p><strong>Acceptance sequence</strong></p>
<ol><li><strong>L2 — install vs listing.</strong> Pipe and fitting materials per the listing (usually stainless with compression fittings); nozzle model, orientation, spacing and height within listed limits; strainers and filters in place; pump unit or gas cylinders as designed; water supply volume for the listed duration; water quality per the manufacturer.</li><li><strong>L3 — clean and tight.</strong> Flush before nozzles go in — small orifices clog, and debris is the most common mist failure. Then the hydrostatic test for the pressure class.</li><li><strong>L4 — performance.</strong> Pump unit start and stop, pressure maintenance, flow through the test valve at design pressure, and pressure at the remote test connection against the calc. On open-nozzle systems: detection opens the section valve. Ventilation shuts down (moving air strips mist out of a room). Supervisory signals for low tank level, low gas pressure and pump trouble.</li><li><strong>Discharge test</strong> where the listing or owner requires it — mist uses little water, so a real discharge is often practical.</li><li><strong>L5:</strong> pump unit on generator power; interlocks to BMS and enclosure ventilation.</li></ol>
<p><strong>Data center points to make:</strong> mist appears in some white spaces and in engine and turbine enclosures on islanded-power sites. FM guidance doesn't accept it as primary protection for lithium-ion racks. Listings are narrow — an enclosure taller or leakier than the tested one is outside the listing, which is a design-review finding before it's a commissioning one.</p>
<p><strong>Likely question:</strong> &quot;How is commissioning mist different from sprinklers?&quot; The listing replaces the density, cleanliness is critical, the pressure tests are higher, the calc method differs, and ventilation shutdown is part of the protection.</p>
<h2 id="g-aspirating-smoke-detection-asd">Aspirating smoke detection (ASD)</h2>
<p>ASD acceptance proves the as-built pipe network matches the design calc: every hole draws air, and smoke from the farthest hole reaches the detector within the calculated transport time — never more than 120 seconds (NFPA 72).</p>
<p><strong>Governing:</strong> NFPA 72 air-sampling provisions (each sampling hole is treated as a spot-type smoke detector for spacing) and Chapter 14 test methods (since 2019 it also requires computer-calculated pipe designs and an airflow trouble signal); the manufacturer's design software (Xtralis ASPIRE / PipeIQ); NFPA 75 and 76 for IT and telecom spaces.</p>
<p><strong>Acceptance sequence</strong></p>
<ol><li><strong>L2 — install vs calc.</strong> Pipe lengths, bends, hole sizes and locations, capillary drops and end caps all match the design calc. Sampling holes labeled; pipe marked. Detector exhaust returned to the sampled zone if it sits in a different pressure zone (under-floor, duct, plenum).</li><li><strong>L3 — configure.</strong> Load thresholds (Alert, Action, Fire 1, Fire 2) per the BOD. Normalize airflow only after pipes are clean and HVAC runs in its normal mode. Run the learn period under real operating conditions, not construction dust.</li><li><strong>L4 — prove it.</strong> Smoke at the end-cap or most remote hole of every pipe; time to response vs the calc and vs 120 s. Verify each pipe's flow reading, then force low-flow (block the inlet) and high-flow (break the pipe) faults. Confirm each alarm level and trouble reaches the FACP as its own point and drives its output.</li><li><strong>L5 — prove it in the building.</strong> Re-check flow with CRAHs in every mode, including one unit failed. Smoke-test inside hot-aisle containment with load banks running.</li></ol>
<p><strong>High airflow cuts spacing (NFPA 72 — confirm table number in your edition).</strong></p>
<div class="table-wrap"><table><thead><tr><th>Air changes / hour</th><th>ft² per detector or hole</th></tr></thead><tbody><tr><td>60</td><td>125</td></tr><tr><td>30</td><td>250</td></tr><tr><td>20</td><td>375</td></tr><tr><td>15</td><td>500</td></tr><tr><td>12</td><td>625</td></tr><tr><td>10</td><td>750</td></tr><tr><td>8.6</td><td>875</td></tr><tr><td>7.5 or fewer</td><td>900</td></tr></tbody></table></div>
<p><strong>Data center points to make</strong></p>
<ul><li>Supply air is clean and diluted; sample where smoke goes — CRAH returns, hot-aisle containment, ceiling return plenum — plus area coverage.</li><li>Alarm philosophy: Alert and Action call Ops to investigate; Fire 1 is the building alarm; Fire 2 (or a second detector) is the pre-action or clean agent release input.</li><li>Pressure-zone mismatch between sampling and exhaust is the most common source of flow faults.</li><li>A learn done during construction sets a dirty baseline and desensitizes the system. Re-learn after final clean and after load banks leave.</li></ul>
<p><strong>Likely question:</strong> &quot;How would you commission VESDA in a contained data hall?&quot; Answer in four beats: verify install against the calc; set thresholds to the alarm philosophy; transport-time test every pipe with a pass criterion; re-verify flow with cooling in failure modes at IST.</p>
<h2 id="g-gas-detection">Gas detection</h2>
<p>Gas detection acceptance proves each sensor reads its target gas accurately at its setpoints, and that every alarm level drives its outputs — exhaust, alarm, shutdown — with failures reported as trouble.</p>
<p><strong>Where it lives on a data center campus</strong></p>
<div class="table-wrap"><table><thead><tr><th>Space</th><th>Gas</th><th>Mount</th><th>Typical action</th></tr></thead><tbody><tr><td>VRLA / flooded UPS battery rooms</td><td>Hydrogen</td><td>High, near ceiling</td><td>Exhaust holding ≤ 25% LFL (H2 LFL is 4%, so about 1% by volume), or continuous ≥ 1 cfm/ft², supervised</td></tr><tr><td>Li-ion battery rooms, BESS containers</td><td>Electrolyte off-gas; also H2, CO</td><td>Per manufacturer</td><td>BMS trip of the affected string, exhaust, alarm</td></tr><tr><td>Chiller plant (machinery room)</td><td>Refrigerant</td><td>Low for heavier-than-air refrigerants, per manufacturer</td><td>Alarm at or below the refrigerant's OEL (≤ 25% LFL for flammable refrigerants); emergency exhaust per ASHRAE 15 / IMC 1105</td></tr><tr><td>CRAH / DX units with A2L refrigerants</td><td>Refrigerant (mildly flammable)</td><td>Per unit listing</td><td>Mitigation (fans on, isolation) at about 25% LFL within seconds (UL 60335-2-40)</td></tr><tr><td>Nitrogen generator rooms (pre-action N2 inerting)</td><td>Oxygen depletion</td><td>Breathing zone</td><td>Alarm at 19.5% O2</td></tr><tr><td>Generator rooms, docks</td><td>CO / NO2</td><td>Breathing zone</td><td>Ventilation, alarm</td></tr><tr><td>Gas turbines, recips, fuel cells</td><td>Natural gas</td><td>High</td><td>Shut fuel valve, alarm</td></tr></tbody></table></div>
<p><strong>Acceptance sequence</strong></p>
<ol><li><strong>L2:</strong> Right sensor for the target gas; mounting height follows gas density; reachable for calibration; away from supply diffusers.</li><li><strong>L3:</strong> Warm-up and stabilization time per the manufacturer (some sensors need 24 hours); zero in clean air.</li><li><strong>L4:</strong> Span-calibrate with certified, in-date, traceable cal gas; record as-found and as-left. Check response time against the manufacturer's spec. Then walk every level: low alarm starts exhaust and the fan's airflow switch proves flow; high alarm sounds and shuts down what the BOD says; pull the sensor and confirm trouble at the controller, the FACP or BMS; fail the fan and confirm the alarm.</li><li><strong>L5:</strong> Repeat the sequence on generator power — exhaust fans must be on a source that survives the event.</li><li><strong>Turnover:</strong> Setpoint table, cal certificates, recalibration interval and sensor replacement dates loaded into the CMMS.</li></ol>
<p><strong>Traps an interviewer may probe</strong></p>
<ul><li>Calibrating with a surrogate gas needs the manufacturer's correction factor — note it on the sheet.</li><li>Catalytic bead sensors are poisoned by silicones; electrochemical cells drift and expire.</li><li>Setpoints come from the BOD and the governing code (IFC, ASHRAE 15, NFPA 855) — confirm each against its source in the script, not from memory.</li></ul>
<p><strong>Likely question:</strong> &quot;How do you prove a hydrogen detector protects the room?&quot; Calibrated reading → alarm at setpoint → exhaust starts and airflow is proven → detector or fan failure is annunciated → all of it works on generator power.</p>
<h2 id="g-battery-and-bess">Battery and BESS</h2>
<p>Battery fire protection commissioning proves a layered defense works in order: off-gas detection catches a failing cell, the BMS isolates it, exhaust keeps vent gas below 25% LFL, explosion control handles what exhaust can't, and water controls the fire — all under an approved commissioning plan.</p>
<p><strong>Governing:</strong> NFPA 855 (2023, with a 2026 edition out); IFC / CFC 1207; UL 9540 (the system listing) and UL 9540A (the fire test method behind the design); NFPA 68 and 69; NFPA 72 and 13; NFPA 75-2024, which moved its lithium-ion rules to NFPA 855 and added off-gas detection; FM Data Sheet 5-33.</p>
<p><strong>When it applies.</strong> Lithium-ion above 20 kWh triggers IFC 1207 (Table 1207.1.3 in IFC 2024; Table 1207.1 in 2021), aggregated per fire area — AHJ interpretations vary. There's no blanket UPS exemption, so a data center Li-ion UPS above the threshold is an ESS. Exceptions are narrow (for example, UL 1778 lead-acid UPS is exempt from explosion control).</p>
<p><strong>The commissioning plan (IFC 1207.2.1).</strong> Required and approved before work, with 12 items — including the OPR and BOD, integrated fire and safety testing, ventilation testing, training and a decommissioning plan — and a report to the fire code official. NFPA 855-2026 has explosion control commissioned per NFPA 3 and tested per NFPA 4.</p>
<div class="table-wrap"><table><thead><tr><th>Layer</th><th>What you prove at L4</th></tr></thead><tbody><tr><td>Off-gas detection (e.g., Li-ion Tamer)</td><td>Installed per the manufacturer; test-gas response; outputs isolate the affected string, start ventilation and alarm. Typically 2–30 min of warning before thermal runaway</td></tr><tr><td>BMS</td><td>Trips on off-gas, over-temperature and voltage faults; contactors open; E-stop works; status reaches the FACP or BMS</td></tr><tr><td>Smoke / heat detection</td><td>NFPA 72 acceptance; ASD where specified</td></tr><tr><td>Ventilation</td><td>Gas detection starts exhaust sized to hold ≤ 25% LFL (or continuous ≥ 1 cfm/ft², supervised); airflow proven; fan failure alarms; on standby power</td></tr><tr><td>Explosion control</td><td>NFPA 69 prevention verified against its design calc; NFPA 68 vents installed per design, unobstructed, discharging somewhere safe. Check the published 2026 text — it may require both</td></tr><tr><td>Suppression</td><td>Sprinklers at 0.3 gpm/ft² over the room or 2,500 ft², whichever is smaller (IFC 1207.5.5), unless large-scale fire testing justifies less. Clean agent and mist aren't accepted as primary protection for Li-ion racks in FM guidance</td></tr></tbody></table></div>
<p><strong>L5 scenario:</strong> off-gas alarm → BMS isolates the string → exhaust starts and proves flow → alarm to Ops → if smoke or heat follows, building alarm and sprinklers → drop utility mid-event and confirm detection, BMS and exhaust stay powered.</p>
<p><strong>Data center points to make</strong></p>
<ul><li>Fluidstack's islanded-power campuses use BESS at grid scale, and their BESS lead is expected to drive NFPA 855 compliance with the AHJ and insurer — commissioning is where that gets proven.</li><li>UL 9540 says the system is listed. UL 9540A tells you how it fails: cell-to-module-to-unit propagation and vent gas composition and volume, which feed the explosion control calc, spacing and any sprinkler density relief.</li><li>Water is the answer for Li-ion fires because it cools; agent doesn't, and the cell re-ignites once concentration decays.</li></ul>
<p><strong>Likely question:</strong> &quot;What does UL 9540A tell you that UL 9540 doesn't?&quot; See above — and say which design decisions each 9540A result feeds.</p>
<h2 id="g-fpe-refresher-fire-alarm-and-fire-dynamics">FPE refresher: fire alarm and fire dynamics</h2>
<p>These are the PE-exam formulas most likely to come up as &quot;walk me through how you'd size or check that.&quot; Know each one well enough to explain what drives the answer, not just plug numbers.</p>
<h3 id="g-fire-alarm">Fire alarm</h3>
<p><strong>Secondary power</strong> — NFPA 72: 24 h standby plus 5 min alarm (15 min for in-building voice evacuation). Add the 20% margin most manufacturers and AHJs require.</p>
<div class="math" data-tex="Ah = \left[ I_{standby}(24\,h) + I_{alarm}\left(\tfrac{5}{60}\,h\right) \right] \times 1.2">Ah = [ I<sub>standby</sub>(24 h) + I<sub>alarm</sub>(<span class="tex-frac"><span class="tex-num">5</span><span class="tex-den">60</span></span> h) ] × 1.2</div>
<p><strong>NAC voltage drop</strong> — start from end-of-life battery voltage (20.4 V = 85% of 24 V); the far device must stay above its listed minimum (16 V for most &quot;regulated 24&quot; devices).</p>
<div class="math" data-tex="V_{drop} = I \times \frac{2 L \, R_{1000}}{1000}">V<sub>drop</sub> = I × <span class="tex-frac"><span class="tex-num">2 L   R<sub>1000</sub></span><span class="tex-den">1000</span></span></div>
<p>Copper, Ω per 1,000 ft (NEC Ch. 9 Table 8, solid): 18 AWG 7.77 · 16 AWG 4.89 · 14 AWG 3.07 · 12 AWG 1.93.</p>
<p><strong>Audibility</strong> — public mode at least 15 dB over average ambient, or 5 dB over the maximum sound level lasting 60 s or more, whichever is greater; 110 dBA maximum. Sleeping areas also need 75 dBA at the pillow and 520 Hz low-frequency tone.</p>
<div class="math" data-tex="L_2 = L_1 - 20\log_{10}\left(\frac{d_2}{d_1}\right) \qquad L_{total} = 10\log_{10}\sum 10^{L_i/10}">L<sub>2</sub> = L<sub>1</sub> - 20log<sub>10</sub>(<span class="tex-frac"><span class="tex-num">d<sub>2</sub></span><span class="tex-den">d<sub>1</sub></span></span>)    L<sub>total</sub> = 10log<sub>10</sub>∑ 10<sup>L<sub>i</sub>/10</sup></div>
<p>Doubling distance loses 6 dB; two equal sources add 3 dB.</p>
<p><strong>Visible</strong> — wall-mount room sizing: 20×20 ft → 15 cd, 28×28 → 30 cd, 40×40 → 60 cd. Corridors up to 20 ft wide: within 15 ft of each end, no more than 100 ft apart. Voice intelligibility target: STI ≥ 0.50 (CIS ≥ 0.70).</p>
<p><strong>Spacing</strong> — smoke detectors: 30 ft nominal, every point within 0.7 S (21 ft). Heat detectors: listed spacing reduced above 10 ft ceilings, from ×0.91 at 10–12 ft down to ×0.34 at 28–30 ft. High-airflow reductions are in the ASD section.</p>
<h3 id="g-fire-dynamics-si-kw-m-s">Fire dynamics (SI: kW, m, s)</h3>
<p><strong>t² growth</strong> — α = 0.00293 (slow), 0.01172 (medium), 0.0469 (fast), 0.1876 (ultrafast) kW/s²; reaching 1,055 kW at 600, 300, 150, 75 s.</p>
<div class="math" data-tex="\dot{Q} = \alpha t^2">Q̇ = α t<sup>2</sup></div>
<p><strong>Heskestad flame height</strong></p>
<div class="math" data-tex="L = 0.235\,\dot{Q}^{2/5} - 1.02\,D">L = 0.235 Q̇<sup>2/5</sup> - 1.02 D</div>
<p><strong>Alpert ceiling jet</strong> (H = ceiling height above fuel, r = radial distance)</p>

<h2 id="g-hydraulic-calculations">Hydraulic calculations</h2>
<p>As a commissioning FPE you use hydraulics to answer two questions: did field changes break the calc, and does the supply test still clear the demand with the owner's margin? Know these formulas well enough to do that on a whiteboard.</p>
<h3 id="g-core-formulas-us-units-gpm-psi-in-ft">Core formulas (US units: gpm, psi, in., ft)</h3>
<p><strong>Sprinkler discharge</strong> — minimum 7 psi at any sprinkler unless the listing says otherwise.</p>
<div class="math" data-tex="Q = K\sqrt{P}">Q = K√<span class="tex-sqrt">P</span></div>
<p><strong>Hazen-Williams friction loss</strong> (psi per ft; d = actual internal diameter) — the default for water-based systems.</p>
<div class="math" data-tex="p = \frac{4.52\,Q^{1.85}}{C^{1.85}\,d^{4.87}}">p = <span class="tex-frac"><span class="tex-num">4.52 Q<sup>1.85</sup></span><span class="tex-den">C<sup>1.85</sup> d<sup>4.87</sup></span></span></div>
<p>C: 120 for black steel wet and galvanized; 100 for black steel dry and pre-action; 140 for cement-lined iron; 150 for copper, stainless and listed CPVC. Equivalent-length multipliers when C ≠ 120: C100 ×0.713 · C130 ×1.16 · C140 ×1.33 · C150 ×1.51.</p>
<p><strong>Darcy-Weisbach</strong> — used where Hazen-Williams doesn't hold: antifreeze systems and intermediate / high-pressure water mist.</p>
<div class="math" data-tex="\Delta P = 0.000216\,\frac{f\,L\,\rho\,Q^2}{d^5}">Δ P = 0.000216 <span class="tex-frac"><span class="tex-num">f L ρ Q<sup>2</sup></span><span class="tex-den">d<sup>5</sup></span></span></div>
<p><strong>Elevation</strong> 0.433 psi per ft · <strong>head</strong> 1 psi = 2.31 ft · <strong>velocity</strong> v = 0.4085 Q / d² (ft/s)</p>
<p><strong>Velocity pressure</strong> — normal pressure Pn = total Pt − Pv.</p>
<div class="math" data-tex="P_v = \frac{0.001123\,Q^2}{d^4}">P<sub>v</sub> = <span class="tex-frac"><span class="tex-num">0.001123 Q<sup>2</sup></span><span class="tex-den">d<sup>4</sup></span></span></div>
<p><strong>Balancing at a junction</strong> — raise the lower-pressure path's flow to match the higher pressure.</p>
<div class="math" data-tex="Q_{adj} = Q_{low}\sqrt{\frac{P_{high}}{P_{low}}}">Q<sub>adj</sub> = Q<sub>low</sub>√<span class="tex-sqrt"><span class="tex-frac"><span class="tex-num">P<sub>high</sub></span><span class="tex-den">P<sub>low</sub></span></span></span></div>
<p><strong>Design area</strong> — sprinklers in the area = A / As (round up); sprinklers on the branch line:</p>
<div class="math" data-tex="n_{branch} = \frac{1.2\sqrt{A}}{S}">n<sub>branch</sub> = <span class="tex-frac"><span class="tex-num">1.2√<span class="tex-sqrt">A</span></span><span class="tex-den">S</span></span></div>
<p><strong>Water supply curve</strong> — pressure available at flow Q, from a test with static S and residual R at flow QR:</p>
<div class="math" data-tex="P_Q = S - (S - R)\left(\frac{Q}{Q_R}\right)^{1.85} \qquad Q_2 = Q_1\left(\frac{S - P_2}{S - P_1}\right)^{0.54}">P<sub>Q</sub> = S - (S - R)(<span class="tex-frac"><span class="tex-num">Q</span><span class="tex-den">Q<sub>R</sub></span></span>)<sup>1.85</sup>    Q<sub>2</sub> = Q<sub>1</sub>(<span class="tex-frac"><span class="tex-num">S - P<sub>2</sub></span><span class="tex-den">S - P<sub>1</sub></span></span>)<sup>0.54</sup></div>
<p><strong>Hydrant (pitot) flow</strong> — c ≈ 0.9 for a smooth outlet.</p>
<div class="math" data-tex="Q = 29.83\,c\,d^2\sqrt{P_{pitot}}">Q = 29.83 c d<sup>2</sup>√<span class="tex-sqrt">P<sub>pitot</sub></span></div>
<p><strong>Pump power</strong> — water HP, then divide by efficiency.</p>
<div class="math" data-tex="WHP = \frac{Q \times P}{1714}">WHP = <span class="tex-frac"><span class="tex-num">Q × P</span><span class="tex-den">1714</span></span></div>
<h3 id="g-worked-example-three-heads-on-a-branch-line">Worked example: three heads on a branch line</h3>
<p>Ordinary Hazard Group 1: 0.15 gpm/ft² over 1,500 ft². K 5.6 sprinklers at 12 ft × 10 ft (As = 120 ft²). 1-in. Schedule 40 branch (ID 1.049 in.), C = 120. Fittings and elevation ignored to keep it clean.</p>
<ul><li>Sprinklers in the area: 1,500 / 120 = 12.5 → <strong>13</strong>. On the branch line: 1.2 × √1,500 / 12 = 3.87 → <strong>4</strong>.</li><li>Most remote sprinkler: Q = 0.15 × 120 = <strong>18.0 gpm</strong>; P = (18 / 5.6)² = <strong>10.33 psi</strong> (above the 7 psi minimum).</li></ul>
<div class="table-wrap"><table><thead><tr><th>Point</th><th>Flow in pipe (gpm)</th><th>Friction (psi/ft)</th><th>Loss over 12 ft (psi)</th><th>Pressure (psi)</th><th>Sprinkler flow (gpm)</th></tr></thead><tbody><tr><td>Head 1</td><td>—</td><td>—</td><td>—</td><td>10.33</td><td>18.00</td></tr><tr><td>Pipe 1→2</td><td>18.00</td><td>0.107</td><td>1.29</td><td>—</td><td>—</td></tr><tr><td>Head 2</td><td>—</td><td>—</td><td>—</td><td>11.62</td><td>19.09</td></tr><tr><td>Pipe 2→3</td><td>37.09</td><td>0.408</td><td>4.89</td><td>—</td><td>—</td></tr><tr><td>Head 3</td><td>—</td><td>—</td><td>—</td><td>16.51</td><td>22.76</td></tr></tbody></table></div>
<p>Velocity in the 1→2 segment is 6.7 ft/s; velocity pressure in the 2→3 segment is 1.28 psi — small enough that most calcs carry total pressure.</p>
<h3 id="g-worked-example-supply-check">Worked example: supply check</h3>
<ul><li><strong>Hydrant test:</strong> 2½-in. outlet, pitot 16 psi → Q = 29.83 × 0.9 × 2.5² × √16 = <strong>671 gpm</strong>, with static 70 psi and residual 50 psi. Flow available at 20 psi residual: 671 × (50/20)^0.54 = <strong>1,101 gpm</strong>.</li><li><strong>Supply at demand:</strong> static 80 psi, residual 60 psi at 1,000 gpm. At 600 gpm: 80 − 20 × (0.6)^1.85 = <strong>72.2 psi</strong>. If system demand plus hose is 600 gpm at 62 psi, the margin is 10.2 psi — just over the 10 psi many owners and insurers require. That is the commissioning conversation: a field reroute that adds 3 psi of loss breaks the owner's margin even though it still &quot;works.&quot;</li><li><strong>Pump power:</strong> 1,000 gpm at 100 psi net → 1,000 × 100 / 1,714 = <strong>58.3 water HP</strong>; at 70% efficiency ≈ 83 brake HP.</li></ul>
<h2 id="g-likely-questions-and-day-of-checklist">Likely questions and day-of checklist</h2>
<p>Expect three to five questions in 30–45 minutes, so each answer runs 90 seconds to 2 minutes, then stops. Their guide says they will follow up if they want more.</p>
<h3 id="g-values-and-judgment-the-65">Values and judgment (the 65%)</h3>
<ol><li><strong>&quot;Something you owned end to end, including what went wrong.&quot;</strong> → Story 1. End on what you changed afterward.</li><li><strong>&quot;A decision you made without complete information.&quot;</strong> → Story 2. Name the unknown, why waiting was worse, and how you contained the risk.</li><li><strong>&quot;A time you rejected a standard approach.&quot;</strong> → Story 3. Show the reasoning chain, not the rebellion.</li><li><strong>&quot;A mistake you made.&quot;</strong> → Story 4. Own your part first.</li><li><strong>&quot;The schedule says skip or compress a test. What do you do?&quot;</strong> → Sort it three ways: life-safety and code-required tests are not negotiable; tests that can run in parallel get re-sequenced; anything deferred gets a documented risk acceptance, an impairment entry and a fire watch. &quot;Velocity is knowing which unknowns actually block you&quot; — their words, your method.</li><li><strong>&quot;Tell me about a disagreement with a contractor or another trade during testing.&quot;</strong> → Facts in the script, criteria from the BOD, escalate on the issues log, never in the hallway.</li><li><strong>&quot;Why Fluidstack?&quot;</strong> → Story 5 plus the research in the playbook.</li></ol>
<h3 id="g-commissioning-technical-the-35">Commissioning technical (the 35%)</h3>
<ol><li><strong>&quot;Walk me through the Cx levels for a pre-action system.&quot;</strong> → Use the L1–L5 table; end on IST.</li><li><strong>&quot;Write the IST fire scenario for a data hall.&quot;</strong> → Halls at full load-bank heat on normal power → ASD Fire 1, then Fire 2 or a second detector → pre-action valve trips → inspector's test simulates a fused head → verify notification, central station, valve trip and water delivery time, BMS / EPMS responses, cooling stays up → drop utility mid-event → fire alarm on secondary power, pumps on generator, controllers transfer → restore and verify every isolation reversed.</li><li><strong>&quot;A clean agent room fails its door fan test a week before turnover.&quot;</strong> → Find leaks under depressurization (smoke pencil, thermal camera): cable and conduit penetrations, raised floor, ceiling plenum, dampers. Seal and retest. Never just add agent — that changes concentration against NOAEL and the overpressure vent sizing. If turnover proceeds, document the risk acceptance.</li><li><strong>&quot;The fire pump misses the 150% point at acceptance.&quot;</strong> → Check the test first: calibrated gauges, pitot readings, nozzle sizes, measured speed with affinity correction. Then suction: a partly closed valve, strainer debris, air entrainment. Then the pump: rotation, impeller debris. Compare to the certified shop curve. Genuine shortfall = manufacturer claim and an impairment plan.</li><li><strong>&quot;Why not clean agent on a lithium-ion battery fire?&quot;</strong> → Agent does not cool cells in thermal runaway; re-ignition follows once concentration decays. Water cools. Off-gas detection buys minutes. Vent gas is flammable, so explosion control matters.</li><li><strong>&quot;What are the failure modes in a pre-action release sequence?&quot;</strong> → Releasing solenoid open or ground fault, detection zone fault, loss of supervisory air, compressor or nitrogen generator failure, priming water lost, panel power, manual release path. Each one gets a line in your script.</li><li><strong>&quot;How do sprinklers work with hot-aisle containment?&quot;</strong> → Containment panels either drop away on heat (listed) or sprinklers go inside the contained aisle; it is an obstruction question first.</li></ol>
<h3 id="g-day-of-checklist">Day-of checklist</h3>
<ul><li class="task"><input type="checkbox" disabled> Google Meet, camera and audio tested from the room you'll use</li><li class="task"><input type="checkbox" disabled> One page beside the camera: three to five impact numbers, five story titles, four questions</li><li class="task"><input type="checkbox" disabled> Glass of water; phone silenced; notifications off</li><li class="task"><input type="checkbox" disabled> First answer rehearsed: your 60-second intro</li><li class="task"><input type="checkbox" disabled> Close with your strongest question and a one-line restatement of why you fit</li></ul>

<template id="doc-scripts"><h1 id="s-interview-story-scripts-90-120-second-answers">Interview Story Scripts — 90–120 Second Answers</h1>
<p>Oct 21, 2026 · @Brandon</p>
<p>Each script below runs 80–115 seconds spoken at a normal pace (about 145 words a minute). Learn the five beats under each one, not the words; the script is there so you hear what good sounds like.</p>
<h2 id="s-how-to-deliver-them">How to deliver them</h2>
<ol><li><strong>Hook (1 line).</strong> What was at stake, in plain words.</li><li><strong>Situation (2 sentences max).</strong> Site, system, size — one number.</li><li><strong>What I did (3 beats).</strong> Say &quot;I&quot;, not &quot;we&quot;. Each beat is a decision and the reason for it — that is what the 65% EQ score is listening for.</li><li><strong>Result (a number).</strong> Pause right after it.</li><li><strong>Lesson tied to their work.</strong> One sentence, then stop and let them ask.</li></ol>
<ul><li>Say every number exactly as written. If you can't recall one, say &quot;about&quot; rather than invent it.</li><li>Practice with a timer: under 90 seconds means you skipped a decision; over 120 means you're narrating instead of choosing.</li><li>Brackets [like this] are details still to confirm — see the last section. Don't say a bracketed line until it's filled.</li><li>Each story has short follow-up answers. Interviewers at Fluidstack go deep on real work, so expect two follow-ups per story.</li></ul>
<h2 id="s-which-story-answers-which-question">Which story answers which question</h2>
<p>Rico used the older value names; current postings use the newer ones. Use his words, and say &quot;barrel&quot; once at most.</p>
