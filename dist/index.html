 in Texas and New York, coming online through 2026.","4. Lake Mariner in New York is about 360 MW — live commissioning now; Barber Lake, Texas, is 207 MW.","5. The 1 GW campus in France is the flagship — the biggest site in the pipeline.","6. $830M Series A at $7.5B; a $1.5B Jane Street-led round at over $18B reported in Sep 2026.","7. Cameron County, Texas: its own campus, $4B first phase, up to 1.5 GW; site work began Sep 2026."],"defectIndex":4,"codeRef":null,"explanation":"Line 5 — the France 1 GW project was dropped in Mar 2026; don't cite it as current. The 1.5 GW ceiling belongs to Cameron County, Texas."},"hook":"France dropped in March; the gigawatt-and-a-half is Cameron County.","source":"Why Fluidstack › Facts to know cold › Dropped","par":40,"confirmInEdition":false},{"id":"I9-scn-01","topicId":"I9","type":"scenario","prompt":"Their values were renamed. Name the current ones, say what a barrel is, and say which names you use in the room.","interviewerPhrasing":"Which of our values do you connect with most?","answer":{"beats":["Be a barrel","Insane urgency","Reason from first principles","Love of the game","plus \"Build something that actually matters\"","A barrel is someone who takes an initiative from start to finish on their own","Rico used the older names — use his, and drop \"barrel\" once only if it fits naturally"],"requiresNumber":false,"codeRef":null,"explanation":"Postings since June 2026 use Be a barrel, Insane urgency, Reason from first principles and Love of the game, plus \"Build something that actually matters.\" A barrel takes an initiative from start to finish on their own. Rico used the older names, so use his — \"barrel\" once at most."},"hook":"Barrel · urgency · first principles · love of the game — Rico's names in the room, \"barrel\" once.","source":"Why Fluidstack › Their values were renamed.","par":60,"confirmInEdition":false},{"id":"I9-scn-02","topicId":"I9","type":"scenario","prompt":"How Fluidstack builds, and why it matters to fire protection.","interviewerPhrasing":"What do you know about how we build?","answer":{"beats":["Factory modules with robotic welding","Islanded power from engines, turbines, fuel cells, solar and BESS","So gas detection, engine and turbine enclosure suppression, and NFPA 855 all matter","Anthropic's $50B program: custom data centers in Texas and New York, coming online through 2026; Google deploys its TPUs and backstops several leases"],"requiresNumber":true,"codeRef":null,"explanation":"Factory modules with robotic welding; islanded power from engines, turbines, fuel cells, solar and BESS — so gas detection, engine and turbine enclosure suppression, and NFPA 855 all matter. Anthropic's $50B program (Texas and New York, through 2026); Google deploys TPUs and backstops several leases."},"hook":"Robots weld the modules; engines, turbines, fuel cells, solar and BESS power them — $50B from Anthropic.","source":"Why Fluidstack › Facts to know cold","par":60,"confirmInEdition":false},{"id":"I10-ord-01","topicId":"I10","type":"order","prompt":"\"Win this role first\" — the four points, in the guide's order.","answer":{"steps":["Go all-in on the Cx role — no email to Rico about the FPE roles (mid-process it reads as hedging)","Sell the bridge, not the switch: you design it, program it and commission it — say that, with examples","Bring up your playbooks inside your answers; then one question opens the door — does the R&D team see what fails in the field?","Close with one line, then stop — save any direct ask for Stage 2 or the offer"],"codeRef":null,"explanation":"1 all-in on the Cx role, no hedging email; 2 sell the bridge, not the switch; 3 playbooks inside the answers, then the question that opens the door; 4 close with one line, then stop."},"hook":"All-in · bridge · playbooks then the door · one line and stop.","source":"Read this first › Win this role first; mention R&D once, at the close.","par":45,"confirmInEdition":false},{"id":"I10-ord-02","topicId":"I10","type":"order","prompt":"The playbook sequence you bring up inside your answers, in order.","answer":{"steps":["Job walk","Design","Install","Pre-test","Commissioning"],"codeRef":null,"explanation":"Job walk → design → install → pre-test → commissioning. Bring the playbooks up earlier, inside your answers; then one question opens the door to R&D."},"hook":"Walk it, design it, install it, pre-test it, commission it.","source":"Read this first › Win this role first; mention R&D once, at the close.","par":30,"confirmInEdition":false},{"id":"I10-def-01","topicId":"I10","type":"defect","prompt":"One line of this close breaks a rule. Tap it.","answer":{"lines":["1. Before we wrap up, I have one line and then I'll stop.","2. I'm all-in on this role.","3. I also applied for the R&D fire protection role, so if the team ever sees a fit there, I'd welcome that conversation.","4. Could you pass my name to the R&D team this week and let me know what they think?","5. And my strongest question: how does commissioning feed back into the reference design — does the R&D team see what fails in the field?","6. One-line restatement: you design it, program it and commission it — that's the loop I've worked in for 18 years, and I want to do it where it's the whole business."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — close with one line, then stop. Save any direct ask for Stage 2 or the offer."},"hook":"One line about R&D, no ask — the ask is for Stage 2.","source":"Read this first › Win this role first; mention R&D once, at the close.","par":40,"confirmInEdition":false},{"id":"I10-num-01","topicId":"I10","type":"number","prompt":"Questions in the playbook list, how many you pick, and how many times you mention R&D.","answer":{"fields":[{"label":"questions in the list","value":5},{"label":"pick","value":4},{"label":"times you mention R&D","value":1}],"codeRef":null,"explanation":"Questions to ask: pick four of the five. Win this role first; mention R&D once, at the close."},"hook":"5 questions, pick 4; R&D once.","source":"Questions to ask (pick four)","par":20,"confirmInEdition":false},{"id":"I10-scn-01","topicId":"I10","type":"scenario","prompt":"Your questions for them — the five in the playbook (you'll pick four).","interviewerPhrasing":"Do you have any questions for us?","answer":{"beats":["Which commissioning level ladder do you use, and who owns fire protection L4 and L5 — your team or a third-party agent?","Your guide says unreliable capacity costs more than late capacity. Where has fire protection been the constraint on recent sites?","How does commissioning feed back into the reference design — does the R&D team see what fails in the field?","At these rack densities with liquid cooling, which fire protection assumptions have you already rederived — pre-action vs wet, clean agent in white space, battery separation?","With Lake Mariner energizing and Cameron County breaking ground, where does fire protection commissioning sit in the modular build — at the factory, or on site?"],"requiresNumber":false,"codeRef":null,"explanation":"Pick four: the level ladder and who owns L4/L5; where fire protection has been the constraint; does R&D see what fails in the field (the question that opens the door); which assumptions they've rederived at these densities; factory or on site for Lake Mariner and Cameron County."},"hook":"Ladder · constraint · feedback to R&D · rederived assumptions · factory or site — pick four.","source":"Questions to ask (pick four)","par":90,"confirmInEdition":false},{"id":"I10-scn-02","topicId":"I10","type":"scenario","prompt":"The R&D closing line — say it, then stop.","interviewerPhrasing":"Anything else before we wrap up?","answer":{"beats":["\"I'm all-in on this role.\"","\"I also applied for the R&D fire protection role, so if the team ever sees a fit there, I'd welcome that conversation.\"","Then stop","Save any direct ask for Stage 2 or the offer","Close with your strongest question and a one-line restatement of ans time on site in New York, Texas and beyond — Lake Mariner is live commissioning now, and Cameron County broke ground in Sep 2026.","3. The role owns fire life safety commissioning from test planning through occupancy.","4. If they ask about location, say you haven't decided yet and it can be sorted out at the offer stage.","5. Know your honest answer on travel and location before Stage 2.","6. Bonus certifications: CxP, BCxP, CxA, CCP, QCxP — if you register for one before the interview, say so."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — decide before they ask. Know your honest answer on travel and location before Stage 2."},"hook":"Decide before they ask — the location answer is ready before Stage 2.","source":"Questions to ask (pick four) › Decide before they ask","par":40,"confirmInEdition":false},{"id":"I11-scn-01","topicId":"I11","type":"scenario","prompt":"Travel and location: what the posting says, what commissioning means, and your answer — decided before they ask.","interviewerPhrasing":"The role is based in San Francisco, Austin or New York, and commissioning means time on site. How does that work for you?","answer":{"beats":["The posting lists San Francisco, Austin or New York","Commissioning means time on site in New York, Texas and beyond","Decide before they ask — know your honest answer before Stage 2",{"label":"Your honest answer on travel and location","fillIn":true}],"requiresNumber":false,"codeRef":null,"explanation":"The posting lists San Francisco, Austin or New York, and commissioning means time on site in New York, Texas and beyond. Know your honest answer on travel and location before Stage 2."},"hook":"SF, Austin or New York — and site time in NY, Texas and beyond. Decide first.","source":"Questions to ask (pick four) › Decide before they ask","par":60,"confirmInEdition":false},{"id":"I11-scn-02","topicId":"I11","type":"scenario","prompt":"What the Cx, QA & Field Engineer role owns, in the posting's words.","interviewerPhrasing":"What do you understand this role to own?","answer":{"beats":["Fire life safety commissioning from test planning through occupancy","FPT on fire alarm, smoke control, the emergency power interface and suppression","Pre-functionals and IST","AHJ inspections","Scripts and IST matrices","Closeout and punch"],"requiresNumber":false,"codeRef":null,"explanation":"It owns fire life safety commissioning from test planning through occupancy: FPT on fire alarm, smoke control, the emergency power interface and suppression; pre-functionals and IST; AHJ inspections; scripts and IST matrices; closeout and punch."},"hook":"Test planning to occupancy: FPT, IST, AHJ, scripts and matrices, closeout.","source":"Why Fluidstack › The role you're interviewing for","par":60,"confirmInEdition":false},{"id":"I11-scn-03","topicId":"I11","type":"scenario","prompt":"The bonus certifications in the posting, and what to say about them.","interviewerPhrasing":"Do you hold any commissioning certifications?","answer":{"beats":["The posting lists CxP, BCxP, CxA, CCP or QCxP as a bonus","If you register for one before the interview, say so","It backs the commissioning direction you already want"],"requiresNumber":false,"codeRef":null,"explanation":"CxP, BCxP, CxA, CCP or QCxP are a bonus in the posting. If you register for one before the interview, say so — it backs the commissioning direction you already want."},"hook":"CxP · BCxP · CxA · CCP · QCxP — register, then say so.","source":"Read this first › Certifications","par":45,"confirmInEdition":false}],"sample":[{"id":"P2-num-01","topicId":"P2","type":"number","prompt":"Dry and double-interlock air test — pressure, duration, allowed loss, and the section.","interviewerPhrasing":"The 24-hour air test lost 3 psi. What next?","answer":{"fields":[{"label":"psi","value":40,"tolerance":0},{"label":"hours","value":24,"tolerance":0},{"label":"max loss psi","value":1.5,"tolerance":0.01}],"codeRef":"NFPA 13 §29.2.2","codeRefAliases":["13 29.2.2","NFPA 13 29.2.2","13 §29.2.2","29.2.2"],"explanation":"40 psi for 24 h, loss ≤ 1.5 psi (NFPA 13 §29.2.2) — a 3 psi loss fails. Common leaks: grooved couplings and threaded joints."},"hook":"40 · 24 · 1.5 — forty for a day, lose a buck-fifty.","source":"Sprinkler and underground › table","par":25,"confirmInEdition":false},{"id":"S3-num-01","topicId":"S3","type":"number","prompt":"Waterflow alarm: initiating device within ___ s of one-sprinkler flow; electrical alarm within ___ s; mechanical within ___ min; a valve tamper switch reports within ___ turns of the handwheel. And the NFPA 13 section for the alarm times.","interviewerPhrasing":"How fast does the waterflow alarm have to come in, and when does a tamper switch have to report?","answer":{"fields":[{"label":"initiating device, s","value":90},{"label":"electrical alarm, s","value":100},{"label":"mechanical alarm, min","value":5},{"label":"tamper, handwheel turns","value":2}],"codeRef":"NFPA 13 §7.7","codeRefAliases":["13 7.7","NFPA 13 7.7","13 §7.7","7.7"],"explanation":"Initiating device within 90 s of one-sprinkler flow (NFPA 72); electrical alarm within 100 s and mechanical within 5 min (NFPA 13 §7.7). Tamper switches report within two turns of the handwheel or one-fifth of stem travel."},"hook":"90 · 100 · 5 — then two turns and the tamper talks.","source":"Sprinkler and underground › table","par":35,"confirmInEdition":false},{"id":"S2-num-01","topicId":"S2","type":"number","prompt":"Aboveground hydro: test pressure, duration, how far above working pressure once working pressure is high, the working pressure where that rule starts, and the section.","interviewerPhrasing":"What are the pass criteria on the aboveground hydro?","answer":{"fields":[{"label":"test psi","value":200},{"label":"hours","value":2},{"label":"psi above working pressure","value":50},{"label":"rule starts above, psi","value":150}],"codeRef":"NFPA 13 §29.2.1","codeRefAliases":["13 29.2.1","NFPA 13 29.2.1","NFPA 13-2022 29.2.1","13 §29.2.1","29.2.1"],"explanation":"200 psi for 2 h, or 50 psi above working pressure where it exceeds 150 psi; no gauge drop and no visible leakage; on pump systems, set from pump shutoff pressure (NFPA 13-2022 §29.2.1)."},"hook":"200 for 2 — or 50 over once you're past 150.","source":"Sprinkler and underground › table","par":35,"confirmInEdition":false},{"id":"S1-num-01","topicId":"S1","type":"number","prompt":"Underground flush at the 10 ft/s table flow: gpm for 6 in. pipe, gpm for 8 in. pipe, and the table.","interviewerPhrasing":"What flow do you need to see on a 6-inch underground flush?","answer":{"fields":[{"label":"6 in., gpm","value":880},{"label":"8 in., gpm","value":1560}],"codeRef":"NFPA 24 Table 10.10.2.1.3","codeRefAliases":["24 10.10.2.1.3","NFPA 24 10.10.2.1.3","Table 10.10.2.1.3","10.10.2.1.3"],"explanation":"Not less than one of: system demand including hose; the 10 ft/s table flow (4 in. 390 · 6 in. 880 · 8 in. 1,560 · 10 in. 2,440 · 12 in. 3,520 gpm); or the maximum flow available (NFPA 24 Table 10.10.2.1.3)."},"hook":"6 → 880, 8 → 1,560: the flush runs at 10 ft/s.","source":"Sprinkler and underground › table","par":30,"confirmInEdition":false},{"id":"C1-ord-01","topicId":"C1","type":"order","prompt":"Put the commissioning ladder in order, L1 first.","answer":{"steps":["Factory acceptance / factory witness test","Delivery and installation verification","Start-up / pre-functional","Functional performance test (FPT)","Integrated systems test (IST)"],"codeRef":null,"explanation":"L1 factory acceptance → L2 delivery and installation verification → L3 start-up / pre-functional → L4 FPT → L5 IST. L1–L5 is an industry convention, not a code."},"hook":"At L4 I prove the system. At L5 I prove the building.","source":"Data center commissioning language › table","par":40,"confirmInEdition":false},{"id":"P5-ord-01","topicId":"P5","type":"order","prompt":"Order the double-interlock L4 script, start to restore.","interviewerPhrasing":"Walk me through your L4 functional test on a double-interlock pre-action system.","answer":{"steps":["Prerequisites: hydro and air test passed, panel programmed, central station on test","Detection only: alarms annunciate, valve stays shut","Loss of air only: low-air supervisory, valve stays shut","Both: valve trips; record time to trip and time to water","Manual release per the design","Faults: solenoid and detection circuits, air, compressor, tamper, panel AC loss","Restore: drain, reset the valve, restore air, panel normal, sign-off"],"codeRef":null,"explanation":"Prerequisites → detection only (valve stays shut) → loss of air only (valve stays shut) → both: valve trips, record time to trip and time to water at the test connection → manual release → faults → restore."},"hook":"7 steps: prereqs, one input, the other, both, by hand, break it, put it back.","source":"Pre-action › Sample L4 script — double-interlock (the Day 12 exercise)","par":60,"confirmInEdition":false},{"id":"C4-mat-01","topicId":"C4","type":"matrix","prompt":"Data Hall 1 IST matrix: for each input, does each output happen (●), must it not happen (—), or is it per BOD?","interviewerPhrasing":"Turn this IST matrix into test steps — which outputs must not happen?","answer":{"grid":{"inputs":["ASD Alert / Action, Hall 1","ASD Fire 1, Hall 1","ASD Fire 2 or 2nd detector, Hall 1","Pre-action waterflow, Hall 1"],"outputs":["Building alarm","Central station","Release / trip","HVAC and dampers"],"cells":[["—","—","—","—"],["●","●","—","per BOD"],["●","●","●","per BOD"],["●","●","—","per BOD"]],"notes":[["","","",""],["","","","Per BOD — halls often keep cooling running"],["","","Pre-action solenoid (valve trips only on loss of air)","Per BOD"],["","","","Per BOD"]]},"codeRef":null,"explanation":"ASD Alert / Action is an Ops alert only; Fire 1 alarms and reports but releases nothing; Fire 2 or a second detector opens the pre-action solenoid — the valve trips only on loss of air. Example only — the BOD decides every cell."},"hook":"Fire 1 talks, Fire 2 opens the solenoid, loss of air lets the water in.","source":"Data center commissioning language › IST matrix — the document the posting says you'll review.","par":75,"confirmInEdition":false},{"id":"C3-def-01","topicId":"C3","type":"defect","prompt":"One line in this FPT script excerpt breaks a rule. Tap it.","answer":{"lines":["1. Purpose and system; each acceptance criterion cites its code / BOD section.","2. Prerequisites: prior level signed off, AHJ notified, central station on test, impairment logged.","3. Safety isolation: actuators and solenoids replaced by test lamps or simulators; agent cylinders disconnected.","4. Shutdown circuits verified before anything is tripped.","5. Steps: expected result, actual result, pass/fail and initials on every line.","6. Return to normal: panel reset; test lamps stay in place for the next test.","7. Failure modes: open and ground faults on releasing circuits, loss of primary power, abort and manual release."],"defectIndex":5,"codeRef":null,"explanation":"Line 6 — return to normal means every isolation reversed and verified. The most dangerous outcome of a test is a system left disabled."},"hook":"Step 6 is put-it-all-back: every isolation reversed, every one verified.","source":"Data center commissioning language › Script development — what a good fire FPT script contains.","par":40,"confirmInEdition":false},{"id":"P8-scn-01","topicId":"P8","type":"scenario","prompt":"Why double-interlock in a data hall, and what does it cost you?","interviewerPhrasing":"Why double-interlock in a data hall, and what does it cost you?","answer":{"beats":["One false detection signal alone can't put water on IT","One damaged sprinkler alone can't either (mechanical damage)","Cost: delivery time","Cost: design area — the 30% increase","Cost: complexity","You prove the delivery time at acceptance, not assume it"],"requiresNumber":true,"codeRef":"FM Data Sheet 5-32","codeRefAliases":["FM 5-32","FM DS 5-32","DS 5-32","5-32"],"explanation":"Protection against a single false signal or mechanical damage, paid for in delivery time, design area and complexity — and you prove the delivery time at acceptance, not assume it. FM Data Sheet 5-32 cautions that double-interlock can delay control."},"hook":"Two keys to open, 30% more area to pay — and you time the water.","source":"Pre-action › Data center points to make","par":90,"confirmInEdition":false},{"id":"I3-sty-01","topicId":"I3","type":"story","prompt":"Something you owned end to end, including what went wrong.","interviewerPhrasing":"Tell me about something you owned end to end, including what went wrong.","answer":{"script":"Three occupied high-rise towers had to lose their fire alarm for a few hours, and my job was to make that window as short and as safe as possible. It's a campus in Hawaii I'm finishing right now, fifteen to sixteen floors a tower. We're replacing the legacy fire alarm, bringing it to code and moving it onto a new fiber backbone, sixteen nodes and about fifteen hundred devices. I own it end to end, from the job walk and design through programming, and I'm leading a crew of twelve through cutover and testing.\n\nTwo things could have sunk it before we started. A month before cutover I flew out and built every panel on site. That caught four parts critical to the install that the warehouse had missed, early enough to get them shipped to the island. Then the fiber: the contractor pulled the runs but never jumpered the cassettes and left no redlines. Nobody owned that gap, so I did. A coworker and I went panel by panel with a light source, found every missing jumper and labeled every run end to end.\n\nFor cutover I gave the twelve defined roles and a schedule, and I set the bar for sending the crew home before we started: every waterflow and tamper, elevator recall and shunt trip, audibility, the sequence for every device type on every floor, and all manual paging. Proven, not sampled.\n\nThe result: three occupied towers were impaired for under eight hours, shutdown to waterflow back in service, with fire watch the whole time.\n\n[Result after Oct 30: we cut over on ___, ___ devices tested, ___ punch items open, most of the crew home on ___.]\n\nThe lesson I keep: ownership starts a month before the outage. That's where you buy the eight-hour window.","beats":[{"label":"Hook","kind":"hook","quote":"Three occupied high-rise towers had to lose their fire alarm for a few hours, and my job was to make that window as short and as safe as possible."},{"label":"Decision with reason","kind":"decision","quote":"A month before cutover I flew out and built every panel on site. That caught four parts critical to the install that the warehouse had missed, early enough to get them shipped to the island."},{"label":"A number","kind":"number","quote":"The result: three occupied towers were impaired for under eight hours, shutdown to waterflow back in service, with fire watch the whole time."},{"label":"Lesson","kind":"lesson","quote":"The lesson I keep: ownership starts a month before the outage. That's where you buy the eight-hour window."}],"codeRef":null,"explanation":"Hook: three occupied towers lose their fire alarm for a few hours → built every panel on site a month early, 4 missing parts caught → under 8 hours impaired, fire watch throughout → ownership starts a month before the outage."},"hook":"3 towers · 16 nodes · 1,500 devices · 12 people, then 1 month · 4 parts · under 8 hours.","source":"Story 1 — Three occupied towers, one cutover","par":120,"confirmInEdition":false}],"mock":{"decks":[{"id":"mock-1","title":"Mock 1","questions":[{"id":"mock-1-q1","kind":"values","prompt":"Something you owned end to end, including what went wrong.","followUp":"What would you do differently?","par":120,"beats":["Hook: three occupied towers lose their fire alarm for a few hours · 16 nodes · ~1,500 devices · crew of 12 · I own it end to end","Built every panel on site a month early → 4 missing critical parts caught in time to ship","Fiber never jumpered, no redlines → light source, panel by panel, every run labeled","Defined roles · bar for going home set before we started: proven, not sampled","Result: under 8 hours impaired, fire watch throughout → ownership starts a month before the outage","End on what you changed afterward (the radios)"],"source":"Likely questions and day-of checklist › Values and judgment (the 65%)","topicId":"I3","cardId":"I3-sty-01"},{"id":"mock-1-q2","kind":"technical","prompt":"Walk me through the Cx levels for a pre-action system.","followUp":"Which level proves the water delivery time, and what do you record there?","par":105,"beats":["L1 factory acceptance: releasing panel factory test — equipment meets spec before it ships","L2 delivery and installation verification: what arrived matches the submittal and is installed per design and listing","L3 start-up / pre-functional: dry / pre-action air test; program loaded; 100% point-to-point","L4 FPT: pre-action trip with water delivery time, every sequence including failure and degraded modes, against the BOD","L5 IST: fire alarm through a utility failure onto generator; release signals to BMS / EPMS; NFPA 4 integrated test","End on IST: \"At L4 I prove the system. At L5 I prove the building.\""],"source":"Likely questions and day-of checklist › Commissioning technical (the 35%)","topicId":"C1"},{"id":"mock-1-q3","kind":"values","prompt":"A decision you made without complete information.","followUp":"Why not wait for drawings?","par":120,"beats":["Name the unknown: 8 COLOs · 20 VESDAs · no drawings — waiting wasn't an option","Pulled data first: all 20 at factory defaults","Counted holes, paced runs → only 4 pipe variations → 4 designs, not 20 (80% less)","Thresholds, airflow, transport time on every pipe; damaged pipe found and fixed","Cause and effect caught a wrong-COLO release → every inherited system is unverified","Why waiting was worse, and how you contained the risk"],"source":"Likely questions and day-of checklist › Values and judgment (the 65%)","topicId":"I4","cardId":"I4-sty-01"},{"id":"mock-1-q4","kind":"technical","prompt":"How do sprinklers work with hot-aisle containment?","followUp":"A field reroute adds fittings to get around the containment — what then?","par":90,"beats":["It is an obstruction question first","Containment panels listed to drop away on heat","or sprinklers inside the contained aisle","Hazard classification is set by the owner's and insurer's standard — FM Data Sheet 5-32 wants sprinklers throughout","A reroute that adds fittings changes the calc: recalc against the supply test, not a judgment call on the ladder"],"source":"Likely questions and day-of checklist › Commissioning technical (the 35%)","topicId":"S7"},{"id":"mock-1-q5","kind":"values","prompt":"Why Fluidstack?","followUp":"You're a design engineer today — why move into commissioning?","par":90,"beats":["The loop: you build capacity in months and run what you build — 18 years in that loop on fire systems","Productizing the data center moves fire protection commissioning left: L1 scripts at the factory, the site tests interfaces","I build fire protection tools with frontier models; Fluidstack builds the infrastructure those models run on","Story 5 plus the research in the playbook","Follow-up: sell the bridge, not the switch — you design it, program it and commission it"],"source":"Likely questions and day-of checklist › Values and judgment (the 65%)","topicId":"I2","cardId":"I2-sty-01"}]},{"id":"mock-2","title":"Mock 2 · technical deep dive","questions":[{"id":"mock-2-q1","kind":"technical","prompt":"Write the IST fire scenario for a data hall.","followUp":"What do you log if a panel throws troubles on transfer?","par":120,"beats":["Halls at full load-bank heat on normal power","ASD Fire 1, then Fire 2 or a second detector → pre-action valve trips","Inspector's test simulates a fused head","Verify notification, central station, valve trip and water delivery time, BMS / EPMS responses, cooling stays up","Drop utility mid-event → fire alarm on secondary power, pumps on generator, controllers transfer","Restore and verify every isolation reversed"],"source":"Likely questions and day-of checklist › Commissioning technical (the 35%)","topicId":"A3"},{"id":"mock-2-q2","kind":"values","prompt":"A time you rejected a standard approach.","followUp":"Explain the physics.","par":120,"beats":["Texas BESS · 20 flame detectors · fault appears past ~7 connected","Measured, didn't hunt: 0.5–4 V induced per leg → ~7 modules sum past 0.4 V","Shielded, untwisted: a shield blocks electric fields, twisting cancels magnetic","Client tried cheaper fixes → I proved it with twisted cable laid on the ground","Re-pull ~2 weeks, commissioned → check cable data sheets at submittal","Show the reasoning chain, not the rebellion"],"source":"Likely questions and day-of checklist › Values and judgment (the 65%)","topicId":"I5","cardId":"I5-sty-01"},{"id":"mock-2-q3","kind":"technical","prompt":"The fire pump misses the 150% point at acceptance.","followUp":"The test setup checks out and it still misses — what then?","par":105,"beats":["Check the test first: calibrated gauges, pitot readings, nozzle sizes, measured speed with affinity correction","Then suction: a partly closed valve, strainer debris, air entrainment","Then the pump: rotation, impeller debris","Compare to the certified shop curve","Genuine shortfall = manufacturer claim and an impairment plan"],"source":"Likely questions and day-of checklist › Commissioning technical (the 35%)","topicId":"F8"},{"id":"mock-2-q4","kind":"values","prompt":"The schedule says skip or compress a test. What do you do?","followUp":"What did that cost the schedule, and who signed the risk acceptance?","par":90,"beats":["Sort it three ways","Life-safety and code-required tests are not negotiable","Tests that can run in parallel get re-sequenced","Anything deferred gets a documented risk acceptance, an impairment entry and a fire watch","\"Velocity is knowing which unknowns actually block you\" — their words, your method"],"source":"Likely questions and day-of checklist › Values and judgment (the 65%)","topicId":"C7"},{"id":"mock-2-q5","kind":"values","prompt":"Tell me about working with a third-party commissioning agent or an AHJ.","followUp":"What makes a test day go right?","par":90,"beats":["High-rise lab: ran the subs, programmed the fire alarm, contractor's liaison to the third-party Cx FPE — on the receiving end of every Cx script","Tested smoke control and the generator backup for the emergency circuits; main troubleshooter on fan and damper monitoring","Ran the AHJ inspection and trained the owners before turnover","A script they've seen in advance, a pre-test that has already passed, one person running the room","That's how I'd run it from the commissioning seat"],"source":"Backup scripts (45–70 seconds)","topicId":"I8","cardId":"I8-sty-01"}]},{"id":"mock-3","title":"Mock 3","questions":[{"id":"mock-3-q1","kind":"values","prompt":"A mistake you made.","followUp":"What would you do differently in the moment?","par":90,"beats":["Own your part first: 7 months in · SF data center · dirty head","No test mode, didn't pull the head, canned air from under the floor","Alarm → evacuation → fire department at rush hour","Didn't reset; confirmed, silenced, met the trucks and owned it","On test first · isolation-to-return-to-normal scripts · vacuum, don't blow → nobody learns about your test from an evacuation"],"source":"Likely questions and day-of checklist › Values and judgment (the 65%)","topicId":"I6","cardId":"I6-sty-01"},{"id":"mock-3-q2","kind":"technical","prompt":"A clean agent room fails its door fan test a week before turnover.","followUp":"Turnover is going ahead anyway — what do you document?","par":105,"beats":["Find leaks under depressurization (smoke pencil, thermal camera)","Cable and conduit penetrations, raised floor, ceiling plenum, dampers","Seal and retest","Never jus       slot,
      h('p', { class: 'b-final num' }, `${score}`),
      h('p', { class: 'center' }, `knew it on ${score} of ${seen} · best ${Math.max(best, score)}${newBest ? ' · new best' : ''}`),

      h('span', { class: `slot-kind s-${slot.slot}` }, SLOT_LABEL[slot.slot] || slot.slot),
      t ? h('span', { class: 'slot-topic' }, h('b', {}, t.id), ` ${t.topic}`) : h('span', { class: 'slot-topic' }, card.topicId),
      t ? pill(t.rating) : null,
    ),
    view,
  );
  const first = view.querySelector('input, button.step, button.cell, button.line, button.chip, button.primary');
  if (first && first.tagName === 'INPUT') first.focus();
}

function onGraded(idx, card, response, seconds) {
  const shift = app.state.currentShift;
  const rated = shift.mode !== 'interview';
  const grade = gradeCard(card, response);
  const rec = recordResult(app.state, { card, grade, seconds, date: app.today, mode: shift.kind === 'daily' ? shift.mode : shift.kind, rated, cards: app.bank });
  app.state = rec.state;
  const next = afterResult(shift, idx, { topics: app.state.topics, cards: app.bank, history: app.state.history, today: app.today });
  app.state.currentShift = { ...shift, ...next, energizedDuring: [...(shift.energizedDuring || []), ...rec.newlyEnergized] };
  persist();
  if (grade.result === 'clean') {
    vibrate(app.state.settings.haptics);
    chime(app.state.settings.sound);
  }
  const remaining = app.state.currentShift.slots.filter((s) => !s.done).length;
  releaseAudio();
  app.audioUrl = response.audioUrl || null;
  window.scrollTo(0, 0);
  mount(
    app.root,
    shiftProgress(app.state.currentShift, idx),
    renderResult({
      card,
      grade,
      seconds,
      response,
      audioUrl: app.audioUrl,
      topicBefore: rec.topicBefore,
      topicAfter: rec.topicAfter,
      xp: rec.xp,
      rated,
      onNext: () => go('shift'),
      onSource: (src) => go('browse', { source: src, back: 'shift' }),
      nextLabel: remaining ? 'Next card' : 'Finish',
    }),
  );
}

function finishShift() {
  const shift = app.state.currentShift;
  if (shift.kind === 'daily') app.state = completeShift(app.state, app.today);
  app.state.currentShift = null;
  persist();
  app.pendingCelebrate = [...new Set(shift.energizedDuring || [])].filter((id) => app.state.energized.includes(id));
  if (shift.mode === 'interview') return go('final', { after: false });

  const touched = [...new Set(shift.slots.filter((s) => s.done && !s.skipped).map((s) => s.topicId))];
  const topicsAfter = touched.map((id) => app.state.topics.find((t) => t.id === id)).filter(Boolean);
  const worstSource = (id) => {
    const todays = app.state.history.filter((x) => x.topicId === id && x.date === app.today);
    const rank = { missed: 0, slipped: 1, clean: 2 };
    todays.sort((a, b) => rank[a.result] - rank[b.result]);
    return todays.length ? app.cardById.get(todays[0].cardId)?.source : null;
  };
  // Weakest = topics that did not get a clean session today.
  const weakest = [...topicsAfter]
    .filter((t) => t.streak === 0)
    .sort((a, b) => POINTS[a.rating] - POINTS[b.rating] || ['Core', 'Support', 'Light'].indexOf(a.weight) - ['Core', 'Support', 'Light'].indexOf(b.weight))
    .slice(0, 3)
    .map((t) => ({ topic: t, source: worstSource(t.id) }));
  const more = keepGoing({ topics: app.state.topics, cards: app.bank, history: app.state.history, today: app.today });
  mount(
    app.root,
    topBar(),
    debriefScreen({
      headline: shiftHeadline(topicsAfter),
      before: shift.readinessBefore,
      after: readiness(app.state.topics),
      weakest,
      planRow: app.data.plan.find((p) => p.date === app.today),
      energized: (shift.energizedDuring || []).map((id) => BUILDINGS.find((b) => b.id === id)).filter(Boolean),
      kind: shift.kind,
      moreAvailable: more.slots.length > 0,
      onKeepGoing: () => startShift('keep'),
      onHome: () => go('home'),
      onSource: (src) => go('browse', { source: src, back: 'home' }),
      onBlitz: () => go('blitz'),
      onStory: () => go('stories'),
    }),
  );
}

// ---------- other screens ----------

function building(id) {
  const b = BUILDINGS.find((x) => x.id === id);
  if (!b) return go('home');
  const status = campusStatus(app.state.topics).find((x) => x.id === b.id);
  mount(app.root, topBar(), buildingScreen({ building: b, status, topics: app.state.topics, cardCount: (tid) => app.countByTopic[tid] || 0, onDrill: (topicId) => startShift('drill', { topicId }), onBack: () => go('home') }));
}

function browse(arg = {}) {
  const docs = ensureDocIndex();
  const target = arg.source ? findSource(arg.source, docs) : null;
  mount(app.root, browseScreen({ docs, target, onBack: () => go(['shift', 'mock'].includes(arg.back) ? arg.back : 'home') }));
}

function settings() {
  mount(
    app.root,
    settingsScreen({
      settings: app.state.settings,
      storageOk: app.storageOk,
      pwa: {
        served: app.pwa.served,
        standalone: app.pwa.standalone,
        canInstall: !!app.pwa.installPrompt,
        onInstall: () => promptInstall(app.pwa).then(() => settings()),
      },
      buildInfo: `Build ${app.data.build.time} · v${app.data.build.version || '?'} · ${app.bank.length} cards (${app.usingSample ? 'sample deck' : 'questions.json'})`,
      onSetting: (k, v) => {
        app.state.settings = { ...app.state.settings, [k]: v };
        persist();
      },
      onImport: (text) => {
        const r = importJson(app.state, text);
        app.state = r.state;
        persist();
        return r.kind === 'topics' ? `Imported ${r.state.topics.length} topics — ratings carried over.` : `Restored state: ${r.state.history.length} card results, ${r.state.xp} XP.`;
      },
      onExport: (kind) => {
        const text = kind === 'topics' ? exportTopics(app.state) : exportState(app.state);
        download(`energize-${kind}-${app.today}.json`, text);
        return text;
      },
      onReset: () => {
        clear(app.storage);
        app.state = createState(app.data.topics, { today: app.today });
        persist();
        go('home');
      },
      onBack: () => go('home'),
    }),
  );
}

function download(name, text) {
  try {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = h('a', { href: url, download: name });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {
    console.warn('download failed; use the text box', e);
  }
}

function blitz() {
  const deck = blitzDeck({ topics: app.state.topics, cards: app.bank });
  mount(
    app.root,
    blitzScreen({
      deck,
      best: app.state.blitzBest || 0,
      onTick: (stop) => (app.stopBlitz = stop),
      onDone: (score) => {
        app.state = setBlitzScore(app.state, score);
        persist();
        go('home');
      },
      onBack: () => go('home'),
    }),
  );
}

function stories() {
  mount(app.root, storyListScreen({ cards: app.bank, topics: app.state.topics, onPick: (card) => startShift('single', { card }), onBack: () => go('home') }));
}

function mock() {
  const planRow = app.data.plan.find((x) => x.date === app.today);
  const m = planRow && /Mock interview\s*(\d)/i.exec(planRow.interview || '');
  mount(
    app.root,
    mockScreen({
      mock: app.data.mock,
      todaysDeck: m ? Number(m[1]) : null,
      onBack: () => go('home'),
      onSource: (src) => go('browse', { source: src, back: 'mock' }),
      onCard: (cardId) => {
        const card = app.cardById.get(cardId);
        if (card) startShift('single', { card });
      },
    }),
  );
}

function final(arg = {}) {
  const rd = readiness(app.state.topics);
  const stats = `${app.state.history.length} cards answered · ${app.state.xp} XP · best Blitz ${app.state.blitzBest || 0}`;
  const map = arg.after ? campusMap({ status: campusStatus(app.state.topics), buildings: BUILDINGS, interactive: false }) : null;
  // After Nov 2 the gear stays so state can still be exported; on Nov 2 nothing else is offered.
  mount(app.root, topBar({ settingsButton: !!arg.after }), finalScreen({ checklist: app.data.checklist, rd, stats, after: !!arg.after, map }));
}

function start() {
  try {
    boot();
  } catch (e) {
    console.error(e);
    const el = document.getElementById('app');
    if (el) el.textContent = `ENERGIZE failed to start: ${e && e.message}`;
  }
}
