below the jockey start, not above it. Set above, the fire pump would start before the jockey on every small leak."},"hook":"The jockey starts first, the fire pump 5 psi later — below, never above.","source":"Fire pump › table","par":40,"confirmInEdition":false},{"id":"F5-num-01","topicId":"F5","type":"number","prompt":"Pressure settings: jockey start at least ___ psi below jockey stop; fire pump start ___ psi below jockey start; each additional pump ___ psi lower. Where in NFPA 20?","interviewerPhrasing":"How do you set the jockey and fire pump start pressures?","answer":{"fields":[{"label":"jockey start below jockey stop, psi","value":10},{"label":"fire pump start below jockey start, psi","value":5},{"label":"each additional pump lower, psi","value":10}],"codeRef":"NFPA 20 Annex","codeRefAliases":["NFPA 20 annex","20 annex","annex","NFPA 20 Annex A","the annex"],"explanation":"Jockey stop = churn + minimum static; jockey start at least 10 psi below stop; fire pump start 5 psi below jockey start; each additional pump 10 psi lower (NFPA 20 Annex)."},"hook":"Stop at churn-plus-static, jockey starts 10 under, the pump 5 under that, the next pump 10 more.","source":"Fire pump › table","par":30,"confirmInEdition":false},{"id":"F5-num-02","topicId":"F5","type":"number","prompt":"Minimum run timer after an automatic start: electric ___ min; diesel ___ min.","interviewerPhrasing":"How long does the controller keep the pump running after an automatic start?","answer":{"fields":[{"label":"electric, min","value":10},{"label":"diesel, min","value":30}],"codeRef":null,"explanation":"Minimum run timer: electric 10 min after an automatic start, diesel 30 min."},"hook":"Electric 10, diesel 30 — the engine runs three times longer before it's allowed to stop.","source":"Fire pump › table","par":20,"confirmInEdition":false},{"id":"F5-num-03","topicId":"F5","type":"number","prompt":"Jockey pump stop pressure = ___ pressure + ___ pressure.","answer":{"fields":[{"label":"first term","value":"churn","aliases":["churn pressure","pump churn","shutoff","shutoff pressure","pump shutoff","pump churn pressure"]},{"label":"second term","value":"minimum static","aliases":["minimum static pressure","min static","static","static pressure","minimum static suction","minimum static suction pressure","lowest static"]}],"codeRef":"NFPA 20 Annex","codeRefAliases":["NFPA 20 annex","20 annex","annex","NFPA 20 Annex A"],"explanation":"Jockey stop = churn + minimum static (NFPA 20 Annex); jockey start at least 10 psi below stop; fire pump start 5 psi below jockey start."},"hook":"Jockey stop = churn + minimum static: the pressure the system sits at when the pump idles on the quietest supply day.","source":"Fire pump › table","par":30,"confirmInEdition":false},{"id":"F5-scn-01","topicId":"F5","type":"scenario","prompt":"Explain the controller pressure settings you verify at L3, from the jockey stop down.","interviewerPhrasing":"The controller settings are blank on the submittal. What should they be?","answer":{"beats":["Jockey stop = churn + minimum static","Jockey start at least 10 psi below stop","Fire pump start 5 psi below jockey start","Each additional pump 10 psi lower","Minimum run timer: electric 10 min after an automatic start, diesel 30 min"],"requiresNumber":true,"codeRef":"NFPA 20 Annex","codeRefAliases":["20 annex","annex","NFPA 20 Annex A"],"explanation":"Jockey stop = churn + minimum static; jockey start at least 10 psi below stop; fire pump start 5 psi below jockey start; each additional pump 10 psi lower (NFPA 20 Annex). Minimum run timer electric 10 min, diesel 30 min."},"hook":"Churn-plus-static, minus 10, minus 5, minus 10 again — then 10 or 30 minutes before it stops.","source":"Fire pump › table","par":90,"confirmInEdition":false},{"id":"F6-num-01","topicId":"F6","type":"number","prompt":"Affinity laws in words: flow (Q2/Q1) varies with the ___; pressure (P2/P1) varies with the ___; net pressure = ___.","interviewerPhrasing":"The pump ran above rated speed on the test. How do you correct the readings?","answer":{"fields":[{"label":"flow varies with the…","value":"speed ratio","aliases":["ratio of speeds","n2/n1","speed","linear","first power","speed ratio to the first power","rpm ratio","ratio of the speeds","n2 over n1","speed linearly"]},{"label":"pressure varies with the…","value":"speed ratio squared","aliases":["squared","square of the speed ratio","(n2/n1)^2","(n2/n1)2","second power","speed ratio to the second power","speed squared","square of speed ratio","n2/n1 squared","rpm ratio squared","speed ratio 2"]},{"label":"net pressure =","value":"discharge minus suction","aliases":["discharge - suction","discharge pressure minus suction pressure","pd - ps","discharge pressure - suction pressure","discharge less suction","p discharge minus p suction","pdischarge - psuction","pdischarge minus psuction"]}],"codeRef":null,"explanation":"Q2/Q1 = N2/N1; P2/P1 = (N2/N1)²; P_net = P_discharge − P_suction. Correct every test point to rated speed with the affinity laws before you compare it to the shop curve, and plot net pressure, not discharge pressure."},"hook":"Flow goes with speed, pressure with speed squared — and you plot discharge minus suction.","source":"Fire pump › Formulas","par":40,"confirmInEdition":false},{"id":"F6-num-02","topicId":"F6","type":"number","prompt":"Affinity laws: pressure scales with the speed ratio to the power ___; flow scales with the speed ratio to the power ___.","answer":{"fields":[{"label":"pressure: exponent on N2/N1","value":2},{"label":"flow: exponent on N2/N1","value":1}],"codeRef":null,"explanation":"P2/P1 = (N2/N1)² and Q2/Q1 = N2/N1 — pressure with the square of the speed ratio, flow with the speed ratio itself. Correct every test point to rated speed before comparing to the shop curve."},"hook":"Pressure squares the speed; flow just follows it.","source":"Fire pump › Formulas","par":20,"confirmInEdition":false},{"id":"F6-def-01","topicId":"F6","type":"defect","prompt":"One line in this data-reduction procedure breaks a rule. Tap it.","answer":{"lines":["1. At each test point record speed, suction pressure, discharge pressure, flow, volts and amps.","2. Net pressure = discharge pressure − suction pressure.","3. Correct flow to rated speed: Q × (N rated / N measured).","4. Correct pressure to rated speed: P × (N rated / N measured).","5. Plot corrected net pressure against corrected flow.","6. Compare to the certified shop curve within the accuracy of the test equipment."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — pressure corrects with the square of the speed ratio: P2/P1 = (N2/N1)². Only flow corrects with the ratio itself."},"hook":"Flow once, pressure twice — the speed ratio gets squared for psi.","source":"Fire pump › Formulas","par":40,"confirmInEdition":false},{"id":"F6-scn-01","topicId":"F6","type":"scenario","prompt":"The test speed wasn't rated speed. What do you do with the readings before comparing them to the shop curve?","interviewerPhrasing":"Your test points don't sit on the shop curve. Before you blame the pump, what do you check about the data?","answer":{"beats":["Correct every test point to rated speed with the affinity laws","Flow scales with the speed ratio (Q2/Q1 = N2/N1)","Pressure scales with the speed ratio squared (P2/P1 = (N2/N1)²)","Plot net pressure — discharge minus suction — not discharge pressure","Then compare to the certified shop curve"],"requiresNumber":false,"codeRef":null,"explanation":"Correct every test point to rated speed with the affinity laws before you compare it to the shop curve: Q2/Q1 = N2/N1, P2/P1 = (N2/N1)². Plot net pressure (discharge − suction), not discharge pressure."},"hook":"Speed-correct first, net pressure second, shop curve third — then you may blame the pump.","source":"Fire pump › Formulas","par":90,"confirmInEdition":false},{"id":"F7-num-01","topicId":"F7","type":"number","prompt":"Suction flush at about ___ ft/s: 6 in. pipe ___ gpm; 8 in. pipe ___ gpm. Which table?","interviewerPhrasing":"What flow do you need to see on the pump suction flush?","answer":{"fields":[{"label":"flush velocity, ft/s","value":15},{"label":"6 in., gpm","value":1320},{"label":"8 in., gpm","value":2350}],"codeRef":"NFPA 20 Table 14.1.1.1","codeRefAliases":["20 14.1.1.1","Table 14.1.1.1","14.1.1.1","NFPA 20 14.1.1.1","NFPA 20 Table 14.1.1.1"],"explanation":"NFPA 20 Table 14.1.1.1 at about 15 ft/s: 4 in. 590 · 6 in. 1,320 · 8 in. 2,350 · 10 in. 3,670 · 12 in. 5,290 gpm."},"hook":"Pump suction flushes at 15 ft/s — half again the underground's 10 — so 6 in. needs 1,320, 8 in. 2,350.","source":"Fire pump › table","par":30,"confirmInEdition":false},{"id":"F7-num-02","topicId":"F7","type":"number","prompt":"If the table flush flow is unavailable: at least ___% of rated pump flow; otherwise the greater of ___% of rated or maximum system demand. Table?","answer":{"fields":[{"label":"fallback: % of rated pump flow","value":150},{"label":"last resort: greater of …% rated or max demand","value":100}],"codeRef":"NFPA 20 Table 14.1.1.1","codeRefAliases":["20 14.1.1.1","Table 14.1.1.1","14.1.1.1","NFPA 20 14.1.1.1"],"explanation":"If the Table 14.1.1.1 flow is unavailable: at least 150% of rated pump flow; otherwise the greater of 100% rated or maximum system demand."},"hook":"Table first, 150% second, then 100% or the demand — whichever is bigger.","source":"Fire pump › table","par":25,"confirmInEdition":false},{"id":"F7-num-03","topicId":"F7","type":"number","prompt":"Pump piping hydrostatic test: ___ psi or ___ psi above maximum pressure, whichever is greater, for ___ h.","answer":{"fields":[{"label":"test pressure, psi","value":200},{"label":"or … psi above maximum pressure","value":50},{"label":"duration, h","value":2}],"codeRef":null,"explanation":"Hydrostatic: 200 psi or 50 psi above maximum pressure, whichever is greater, for 2 h."},"hook":"200 or max-plus-50, whichever is greater, two hours — same shape as the sprinkler hydro.","source":"Fire pump › table","par":25,"confirmInEdition":false},{"id":"F8-num-01","topicId":"F8","type":"number","prompt":"The point you're chasing: at 150% of rated flow the pump must hold at least ___% of rated pressure. Suction piping rule from L2: no elbow or tee parallel to the shaft within ___ pipe diameters of the suction flange. Chapter for field acceptance?","answer":{"fields":[{"label":"min % of rated pressure at 150% flow","value":65},{"label":"pipe diameters clear of the suction flange","value":10}],"codeRef":"NFPA 20 Chapter 14","codeRefAliases":["20 14","NFPA 20 Ch. 14","Chapter 14","20 Chapter 14"],"explanation":"150% flow: at least 65% of rated pressure (NFPA 20 Chapter 14). At L2: no elbow or tee in a plane parallel to the shaft within 10 pipe diameters of the suction flange."},"hook":"65 at 150 — and ten diameters of straight pipe before the suction flange.","source":"Fire pump › Acceptance sequence","par":30,"confirmInEdition":false},{"id":"F8-ord-01","topicId":"F8","type":"order","prompt":"The pump misses the 150% point. Put the checks in the guide's order.","interviewerPhrasing":"The fire pump misses the 150% point at acceptance. What do you check, in what order?","answer":{"steps":["Test setup: calibrated gauges, pitot readings, nozzle sizes","Measured speed with affinity correction","Suction: a partly closed valve, strainer debris, air entrainment","The pump: rotation, impeller debris","Compare to the certified shop curve","Genuine shortfall: manufacturer claim and an impairment plan"],"codeRef":null,"explanation":"Check the test first: calibrated gauges, pitot readings, nozzle sizes, measured speed with affinity correction. Then suction: a partly closed valve, strainer debris, air entrainment. Then the pump: rotation, impeller debris. Compare to the certified shop curve. Genuine shortfall = manufacturer claim and an impairment plan."},"hook":"Test setup → suction → pump. Blame the gauges before the impeller.","source":"Likely questions and day-of checklist › Commissioning technical (the 35%) › 11","par":50,"confirmInEdition":false},{"id":"F8-mat-01","topicId":"F8","type":"matrix","prompt":"Sort the 150%-point checks into their tier: ● = belongs to that tier, — = does not.","answer":{"grid":{"inputs":["Test setup (first)","Suction (second)","The pump (third)"],"outputs":["Calibrated gauges, pitot, nozzle sizes","Speed with affinity correction","Partly closed valve","Strainer debris, air entrainment","Rotation","Impeller debris"],"cells":[["●","●","—","—","—","—"],["—","—","●","●","—","—"],["—","—","—","—","●","●"]]},"codeRef":null,"explanation":"Test first: calibrated gauges, pitot readings, nozzle sizes, measured speed with affinity correction. Then suction: a partly closed valve, strainer debris, air entrainment. Then the pump: rotation, impeller debris."},"hook":"Gauges and speed are the test; valve and strainer are suction; rotation and impeller are the pump.","source":"Likely questions and day-of checklist › Commissioning technical (the 35%) › 11","par":75,"confirmInEdition":false},{"id":"F8-def-01","topicId":"F8","type":"defect","prompt":"One line in this troubleshooting plan breaks a rule from the guide. Tap it.","answer":{"lines":["1. The 150% point reads below 65% of rated pressure; stop and troubleshoot before calling the pump deficient.","2. Test setup first: gauge calibration, pitot readings, nozzle sizes on the test header.","3. Measure speed and correct the point to rated speed with the affinity laws.","4. Suction: valve fully open, strainer clear, no air entrainment.","5. The pump: rotation, impeller debris.","6. Compare the corrected net pressure to the certified shop curve.","7. Genuine shortfall: log it as a punch item and release the pump for turnover."],"defectIndex":6,"codeRef":null,"explanation":"Line 7 — a genuine shortfall is a manufacturer claim and an impairment plan, not a punch item. The pump is not proven, so the building is impaired until it is."},"hook":"A pump that can't make 150% isn't a punch item — it's a claim and an impairment.","source":"Likely questions and day-of checklist › Commissioning technical (the 35%) › 11","par":45,"confirmInEdition":false},{"id":"F8-scn-01","topicId":"F8","type":"scenario","prompt":"The fire pump misses the 150% point at acceptance. What do you do?","interviewerPhrasing":"The fire pump misses the 150% point at acceptance.","answer":{"beats":["Check the test first: calibrated gauges, pitot readings, nozzle sizes","Measured speed with affinity correction","Then suction: a partly closed valve, strainer debris, air entrainment","Then the pump: rotation, impeller debris","Compare to the certified shop curve","Genuine shortfall = manufacturer claim and an impairment plan"],"requiresNumber":true,"codeRef":null,"explanation":"Check the test first: calibrated gauges, pitot readings, nozzle sizes, measured speed with affinity correction. Then suction: a partly closed valve, strainer debris, air entrainment. Then the pump: rotation, impeller debris. Compare to the certified shop curve. Genuine shortfall = manufacturer claim and an impairment plan."},"hook":"At 150% you need 65% — check the test, then the suction, then the pump, then call the factory.","source":"Likely questions and day-of checklist › Commissioning technical (the 35%) › 11","par":90,"confirmInEdition":false},{"id":"F8-scn-02","topicId":"F8","type":"scenario","prompt":"When does a short 150% point become a claim against the pump manufacturer, and what happens to the building meanwhile?","interviewerPhrasing":"At what point do you stop troubleshooting and call it a bad pump?","answer":{"beats":["Only after the test setup, suction and pump checks are exhausted","The speed-corrected net pressure still falls short of the certified shop curve","Genuine shortfall = a manufacturer claim","And an impairment plan for the building while it's unresolved"],"requiresNumber":false,"codeRef":null,"explanation":"Compare the corrected points to the certified shop curve after checking the test setup, suction and pump. Genuine shortfall = manufacturer claim and an impairment plan."},"hook":"A real shortfall gets two documents: a claim to the factory and an impairment plan for the building.","source":"Likely questions and day-of checklist › Commissioning technical (the 35%) › 11","par":75,"confirmInEdition":false},{"id":"F9-num-01","topicId":"F9","type":"number","prompt":"NFPA 25 churn tests: diesel weekly for ___ min; electric for ___ min, how often (___)? Which standard?","interviewerPhrasing":"What churn test schedule do you hand to Ops?","answer":{"fields":[{"label":"diesel weekly run, min","value":30},{"label":"electric run, min","value":10},{"label":"electric: how often","value":"monthly","aliases":["every month","once a month","month","1/month","each month","per month"]}],"codeRef":"NFPA 25","codeRefAliases":["25","NFPA25","NFPA 25 churn","NFPA 25 ITM"],"explanation":"NFPA 25 churn tests: diesel weekly for 30 min; electric monthly for 10 min — weekly where the pump serves a high-rise beyond fire department pumping, has a limited-service controller, is vertical turbine, or takes suction from a ground-level tank or a source with no useful pressure."},"hook":"Diesel: every week, 30 minutes. Electric: every month, 10 minutes — unless it's one of the weekly exceptions.","source":"Fire pump › table","par":30,"confirmInEdition":false},{"id":"F9-scn-01","topicId":"F9","type":"scenario","prompt":"When does an electric fire pump get a weekly churn test instead of monthly?","interviewerPhrasing":"Ops wants to run the electric pump monthly. When is that not enough?","answer":{"beats":["The pump serves a high-rise beyond fire department pumping","It has a limited-service controller","It is a vertical turbine pump","It takes suction from a ground-level tank or a source with no useful pressure"],"requiresNumber":false,"codeRef":"NFPA 25","codeRefAliases":["25","NFPA25"],"explanation":"Electric pumps churn monthly for 10 min, but weekly where the pump serves a high-rise beyond fire department pumping, has a limited-service controller, is vertical turbine, or takes suction from a ground-level tank or a source with no useful pressure (NFPA 25)."},"hook":"High-rise, limited-service, vertical turbine, ground tank — four reasons an electric pump churns weekly.","source":"Fire pump › table","par":75,"confirmInEdition":false},{"id":"E1-num-01","topicId":"E1","type":"number","prompt":"Emergency systems are available within ___ s; legally required standby within ___ s. Which NEC article covers emergency systems?","interviewerPhrasing":"After a utility failure, how fast does the emergency power have to be back?","answer":{"fields":[{"label":"emergency: available within, s","value":10},{"label":"legally required standby: within, s","value":60}],"codeRef":"NEC 700","codeRefAliases":["700","Article 700","NEC Article 700","NFPA 70 700","NFPA 70 Article 700"],"explanation":"NEC 700 (emergency — available within 10 s), NEC 701 (legally required standby — 60 s). Egress lighting and exit signs lit within 10 s."},"hook":"700 → 10 seconds. 701 → 60 seconds. One article up, six times slower.","source":"Emergency power interface › Governing","par":25,"confirmInEdition":false},{"id":"E1-num-02","topicId":"E1","type":"number","prompt":"Articles and standards: NEC ___ emergency systems; NEC ___ legally required standby; NEC ___ fire pumps; NFPA ___ generators and transfer equipment.","answer":{"fields":[{"label":"NEC emergency","value":700},{"label":"NEC legally required standby","value":701},{"label":"NEC fire pumps","value":695},{"label":"NFPA generators and transfer equipment","value":110}],"codeRef":null,"explanation":"NEC 700 (emergency, 10 s), NEC 701 (legally required standby, 60 s), NEC 695 (fire pumps), NFPA 110 (generators and transfer equipment); also NFPA 72 Chapter 10 (fire alarm power) and NFPA 20 (pump alternate power)."},"hook":"700, 701, 695 in the NEC; 110 for the generator — four numbers, one IST.","source":"Emergency power interface › Governing","par":30,"confirmInEdition":false},{"id":"E1-num-03","topicId":"E1","type":"number","prompt":"NFPA 110 vocabulary: Type ___ = power within ___ s; Level ___ = failure could cost lives; Class = hours of ___ at rated load. Which standard (name only — confirm sections in your edition)?","interviewerPhrasing":"What do Level, Type and Class mean on a generator spec?","answer":{"fields":[{"label":"Type number","value":10},{"label":"power within, s","value":10},{"label":"Level number where failure could cost lives","value":1},{"label":"Class = hours of … at rated load","value":"fuel","aliases":["fuel supply","fuel on site","run time","fuel hours","hours of fuel","runtime","fuel at rated load"]}],"codeRef":"NFPA 110","codeRefAliases":["110","NFPA110","NFPA 110 EPSS"],"explanation":"NFPA 110: Level 1 = failure could cost lives; Type 10 = power within 10 s; Class = hours of fuel at rated load (confirm sections in your edition)."},"hook":"Level 1 lives, Type 10 seconds, Class hours of fuel.","source":"Emergency power interface › Generator numbers (NFPA 110 — confirm sections in your edition)","par":30,"confirmInEdition":true},{"id":"E1-num-04","topicId":"E1","type":"number","prompt":"Generator acceptance: cold start and transfer within ___ s; a building load test; a ___-hour full-load test with results on file before occupancy. Periodic: monthly ___ min at ___% or more of nameplate. Standard?","answer":{"fields":[{"label":"cold start and transfer within, s","value":10},{"label":"full-load acceptance test, h","value":2},{"label":"monthly run, min","value":30},{"label":"monthly load, % of nameplate (min)","value":30}],"codeRef":"NFPA 110","codeRefAliases":["110","NFPA110","nfpa 110"],"explanation":"Acceptance: cold start and transfer within 10 s; a building load test; and a 2-hour full-load test, results on file before occupancy. Periodic: monthly 30 min at 30% or more of nameplate (or the manufacturer's minimum exhaust temperature). Confirm sections in your edition."},"hook":"10 seconds to start, 2 hours at full load to accept, then 30 minutes at 30% every month.","source":"Emergency power interface › Generator numbers (NFPA 110 — confirm sections in your edition)","par":35,"confirmInEdition":true},{"id":"E1-num-05","topicId":"E1","type":"number","prompt":"Periodic generator testing: Level 1 systems run ___ h every ___ months; where monthly runs can't reach 30%, an annual ___ test. Standard?","answer":{"fields":[{"label":"Level 1 extended run, h","value":4},{"label":"every … months","value":36},{"label":"annual test when 30% can't be reached","value":"load bank","aliases":["load-bank","loadbank","load bank test","annual load bank","load banks","load-bank test"]}],"codeRef":"NFPA 110","codeRefAliases":["110","NFPA110","nfpa 110"],"explanation":"Periodic: monthly 30 min at 30% or more of nameplate; an annual load-bank test where monthly runs can't reach 30%; Level 1 systems run 4 h every 36 months (NFPA 110 — confirm sections in your edition)."},"hook":"Can't hit 30%? Load bank once a year. Level 1? Four hours every three years.","source":"Emergency power interface › Generator numbers (NFPA 110 — confirm sections in your edition)","par":30,"confirmInEdition":true},{"id":"E1-def-01","topicId":"E1","type":"defect","prompt":"One line in this generator acceptance script breaks a rule. Tap it.","answer":{"lines":["1. Prerequisites: generator start-up by the manufacturer's rep complete; fuel at the Class hours the design calls for; ATS in automatic; central station on test.","2. Cold start: open the normal source; the generator starts and the ATS transfers within 10 s.","3. Egress lighting and exit signs lit within 10 s; legally required standby loads within 60 s.","4. Building load test with the halls at load-bank heat.","5. Full-load test: 30 minutes at 30% of nameplate; results on file before occupancy.","6. Restore normal power; the ATS retransfers; the generator cools down and stops.","7. Return to normal: ATS in automatic, central station off test."],"defectIndex":4,"codeRef":"NFPA 110","explanation":"Line 5 — acceptance takes a 2-hour full-load test with results on file before occupancy. Thirty minutes at 30% is the monthly periodic run, not acceptance (NFPA 110 — confirm sections in your edition)."},"hook":"Acceptance is 2 hours at full load; 30 min at 30% is what Ops does every month afterward.","source":"Emergency power interface › Generator numbers (NFPA 110 — confirm sections in your edition)","par":45,"confirmInEdition":true},{"id":"E1-scn-01","topicId":"E1","type":"scenario","prompt":"After a utility failure, what has to be back, and how fast? Name the code behind each one.","interviewerPhrasing":"The utility drops. What has to come back, and how fast?","answer":{"beats":["Emergency loads within 10 s (NEC 700) — egress lighting and exit signs lit within 10 s","Legally required standby within 60 s (NEC 701)","Fire pump transfers to the alternate source and carries demand (NEC 695, NFPA 20)","Fire alarm and releasing panels ride through on their own batteries (NFPA 72 Chapter 10)","Generator and transfer equipment per NFPA 110 — Type 10 means power within 10 s","Everything returns to normal without anyone touching it"],"requiresNumber":true,"codeRef":"NEC 700","codeRefAliases":["700","Article 700","NEC Article 700"],"explanation":"NEC 700 emergency within 10 s, NEC 701 legally required standby within 60 s, NEC 695 fire pumps, NFPA 110 generators and transfer equipment, NFPA 72 Chapter 10 fire alarm power, NFPA 20 pump alternate power. The IST proves every life-safety load rides through, is back within code time, and returns to normal without anyone touching it."},"hook":"10 seconds for 700, 60 for 701, the pump on 695, the panels on their batteries — and nobody touches a reset.","source":"Emergency power interface","par":90,"confirmInEdition":false},{"id":"E2-ord-01","topicId":"E2","type":"order","prompt":"Order the L5 pull-the-plug test.","interviewerPhrasing":"How do you test fire alarm through a utility failure?","answer":{"steps":["Halls at load-bank heat; fire alarm normal — then repeat with a fire scenario already in alarm","Open the utility main — or trip a generation block on an islanded campus","Time the transfer and walk every load in the table","Repeat with one generator failed (N+1) and with the fire pump running","Restore normal power: every system returns to normal without a manual reset; log any that don't"],"codeRef":null,"explanation":"Halls at load-bank heat, fire alarm normal (then repeat in alarm) → open the utility main or trip a generation block → time the transfer and walk every load → repeat with one generator failed and the pump running → restore; everything returns to normal without a manual reset."},"hook":"Load it, pull it, time it, break a generator, put it back — and nobody touches a reset.","source":"Emergency power interface › The L5 pull-the-plug test","par":50,"confirmInEdition":false},{"id":"E2-mat-01","topicId":"E2","type":"matrix","prompt":"Pull-the-plug: what do you prove for each load? ● = that's the proof for this load, — = not this one.","answer":{"grid":{"inputs":["Fire alarm, voice evacuation, releasing panels","Egress lighting and exit signs","Pre-action compressors or nitrogen generators","Smoke control fans and dampers"],"outputs":["Lit / back within 10 s","Rides through on its own batteries","Air restored within 30 min once power returns","Restarts and returns to its smoke-control state"],"cells":[["—","●","—","—"],["●","—","—","—"],["—","—","●","—"],["—","—","—","●"]],"notes":[["","No lost points or trouble storms; an alarm in progress keeps sounding","",""],["","","",""],["","","",""],["","","","The firefighter's panel shows true status"]]},"codeRef":null,"explanation":"Fire alarm and releasing panels ride through on their own batteries; egress lighting lit within 10 s; pre-action compressors restore air within 30 min once power returns; smoke control fans and dampers restart and return to their smoke-control state."},"hook":"Batteries for the panels, 10 s for the lights, 30 min for the air, fans back to their smoke state.","source":"Emergency power interface › table","par":75,"confirmInEdition":false},{"id":"E2-def-01","topicId":"E2","type":"defect","prompt":"One line in this pull-the-plug script breaks a rule. Tap it.","answer":{"lines":["1. Prerequisites: load banks running in the halls; fire alarm normal; central station on test; generator and ATS reps present.","2. Open the utility main.","3. Time the transfer: egress lighting within 10 s; fire alarm panels ride through on batteries with no lost points.","4. Walk every load: pump on the alternate source; smoke control fans back in their smoke-control state; exhaust running.","5. Repeat with one generator failed and with the fire pump running.","6. Restore normal power and manually reset each panel and ATS to clear the transfer troubles.","7. Repeat the whole sequence with a fire scenario already in alarm."],"defectIndex":5,"codeRef":null,"explanation":"Line 6 — every system should return to normal without a manual reset; log any that don't. Resetting panels by hand hides exactly the failures the IST exists to find."},"hook":"Return to normal is automatic or it's a finding — your hand on the reset button erases the evidence.","source":"Emergency power interface › The L5 pull-the-plug test","par":45,"confirmInEdition":false},{"id":"E2-num-01","topicId":"E2","type":"number","prompt":"Numbers you watch during the pull-the-plug test: egress lighting lit within ___ s; pre-action air restored within ___ min once power returns; repeat the test with ___ generator failed.","answer":{"fields":[{"label":"egress lighting lit within, s","value":10},{"label":"air restored within, min","value":30},{"label":"generators failed on the repeat","value":1}],"codeRef":null,"explanation":"Egress lighting and exit signs lit within 10 s; pre-action compressors or nitrogen generators restore air within 30 min once power returns; repeat with one generator failed (N+1) and with the fire pump running."},"hook":"10 seconds of dark, 30 minutes of low air, one generator down — all still a pass.","source":"Emergency power interface › table","par":25,"confirmInEdition":false},{"id":"E2-scn-01","topicId":"E2","type":"scenario","prompt":"How do you test fire alarm through a utility failure?","interviewerPhrasing":"How do you test fire alarm through a utility failure?","answer":{"beats":["Halls at load-bank heat, fire alarm normal; then repeat with a fire scenario already in alarm","Open the utility main — or trip a generation block on an islanded campus","Time the transfer and walk every load in the table","Repeat with one generator failed (N+1) and with the fire pump running","Restore normal power; every system returns to normal without a manual reset; log any that don't","Log what the panels throw on transfer: no lost points or trouble storms; an alarm in progress keeps sounding"],"requiresNumber":true,"codeRef":null,"explanation":"The five pull-the-plug steps — load-bank heat and fire alarm normal (then in alarm), open the utility main, time the transfer and walk every load, repeat N+1 and with the pump running, restore without a manual reset — plus what you'd log if a panel throws troubles on transfer: no lost points or trouble storms, an alarm in progress keeps sounding."},"hook":"Five steps, two passes (normal, then in alarm), and the panels must ride through with no lost points.","source":"Emergency power interface › The L5 pull-the-plug test","par":90,"confirmInEdition":false},{"id":"E2-scn-02","topicId":"E2","type":"scenario","prompt":"What signals do you check at the FACP and BMS during the transfer?","interviewerPhrasing":"While the generator is carrying the building, what are you watching on the fire alarm panel and the BMS?","answer":{"beats":["Generator running and fault (NFPA 110 remote annunciator)","Low fuel","ATS position","Fire pump power status: loss of phase, phase reversal, transfer switch position"],"requiresNumber":false,"codeRef":"NFPA 110","codeRefAliases":["110","NFPA110"],"explanation":"Signals to check at the FACP and BMS: generator running and fault (NFPA 110 remote annunciator), low fuel, ATS position, fire pump power status (loss of phase, phase reversal, transfer switch position)."},"hook":"Generator running and fault, low fuel, ATS position, pump phase and transfer — five things on two screens.","source":"Emergency power interface › Signals to check at the FACP and BMS","par":60,"confirmInEdition":false},{"id":"E3-num-01","topicId":"E3","type":"number","prompt":"Fire alarm secondary power: ___ h standby + ___ min alarm on batteries, or an automatic-starting generator plus dedicated batteries with ___ h of capacity. Section?","interviewerPhrasing":"On an islanded campus, can the generator count as the fire alarm's secondary power?","answer":{"fields":[{"label":"standby, h","value":24},{"label":"alarm, min","value":5},{"label":"dedicated batteries with a generator, h","value":4}],"codeRef":"NFPA 72-2019 §10.6.7.3.1","codeRefAliases":["72 10.6.7.3.1","10.6.7.3.1","NFPA 72 10.6.7.3.1","NFPA 72 §10.6.7.3.1","NFPA 72-2019 10.6.7.3.1"],"explanation":"24 h standby + 5 min alarm on batteries, or an automatic-starting generator plus dedicated batteries with 4 h of capacity (NFPA 72-2019 §10.6.7.3.1; renumbered in 2025)."},"hook":"24 and 5 on batteries alone — or a generator that starts itself plus 4 hours of its own batteries.","source":"Emergency power interface › Fire alarm secondary power","par":30,"confirmInEdition":false},{"id":"E3-num-02","topicId":"E3","type":"number","prompt":"Clean agent and power: if more than ___ V stays energized after discharge, which standard's prescriptive concentrations no longer apply? And the EPO exists only if the site elects NEC Article ___.","interviewerPhrasing":"Why is the power-down output on a clean agent room a design decision, not a detail?","answer":{"fields":[{"label":"voltage threshold, V","value":480},{"label":"NEC article for the EPO (if elected)","value":645}],"codeRef":"NFPA 2001","codeRefAliases":["2001","NFPA2001","NFPA 2001 clean agent"],"explanation":"If more than 480 V stays energized after discharge, NFPA 2001's prescriptive concentrations no longer apply — the power-down output is a design decision, not a detail. If the site elects NEC 645, an EPO exists and its fire alarm interface goes in the IST matrix; many sites choose not to."},"hook":"Over 480 V still live after discharge and the 2001 concentration tables stop applying; 645 is the EPO article most sites skip.","source":"Emergency power interface › Data center points to make","par":30,"confirmInEdition":false},{"id":"E3-num-03","topicId":"E3","type":"number","prompt":"Power standards on the fire side: fire alarm power is NFPA 72 Chapter ___; the pump's alternate power is NFPA ___; generators and transfer equipment are NFPA ___.","answer":{"fields":[{"label":"NFPA 72 chapter for fire alarm power","value":10},{"label":"NFPA standard for pump alternate power","value":20},{"label":"NFPA standard for generators and transfer equipment","value":110}],"codeRef":null,"explanation":"NFPA 72 Chapter 10 (fire alarm power), NFPA 20 (pump alternate power), NFPA 110 (generators and transfer equipment) — alongside NEC 700, 701 and 695."},"hook":"72-10 for the panel, 20 for the pump, 110 for the generator.","source":"Emergency power interface › Governing","par":25,"confirmInEdition":false},{"id":"E3-def-01","topicId":"E3","type":"defect","prompt":"One line in this fire alarm secondary-power test breaks a rule. Tap it.","answer":{"lines":["1. Prerequisites: fire alarm and releasing panels normal; battery calcs on file; central station on test.","2. Open the panels' normal AC source as part of the utility-failure step.","3. Each panel reports AC loss as a trouble and keeps running on batteries: no lost points, no trouble storm.","4. With an alarm in progress, notification keeps sounding through the transfer.","5. Because the generator is automatic-starting, the panels need no dedicated batteries.","6. Restore AC; each panel returns to normal without a manual reset; log any that don't."],"defectIndex":4,"codeRef":"NFPA 72-2019 §10.6.7.3.1","explanation":"Line 5 — the generator option is an automatic-starting generator plus dedicated batteries with 4 h of capacity (NFPA 72-2019 §10.6.7.3.1). The generator never replaces the batteries entirely."},"hook":"Generator plus 4 hours of batteries — the generator buys down the 24, it never buys out the batteries.","source":"Emergency power interface › Fire alarm secondary power","par":40,"confirmInEdition":false},{"id":"E3-scn-01","topicId":"E3","type":"scenario","prompt":"The campus has no utility. How do you define the fire alarm's secondary power and the transfer test?","interviewerPhrasing":"With islanded power and no utility, how do you prove fire alarm power?","answer":{"beats":["Panels ride through on their own batteries: 24 h standby + 5 min alarm","Or an automatic-starting generator plus dedicated batteries with 4 h of capacity","Normal and alternate sources have to be defined with the AHJ before you can write the transfer test","What you watch on transfer: no lost points or trouble storms; an alarm in progress keeps sounding","The releasing panels are on the same list as the fire alarm"],"requiresNumber":true,"codeRef":"NFPA 72-2019 §10.6.7.3.1","codeRefAliases":["72 10.6.7.3.1","10.6.7.3.1","NFPA 72 10.6.7.3.1"],"explanation":"Fire alarm, voice evacuation and releasing panels ride through on their own batteries (24 h + 5 min, or an automatic-starting generator plus 4 h dedicated batteries, NFPA 72-2019 §10.6.7.3.1). With islanded power and no utility, normal and alternate sources have to be defined with the AHJ before you can write the transfer test."},"hook":"Define normal and alternate with the AHJ first; then prove 24 + 5 — or generator + 4 — with no lost points.","source":"Emergency power interface › Data center points to make","par":90,"confirmInEdition":false},{"id":"K1-def-01","topicId":"K1","type":"defect","prompt":"One line in this stair pressurization test breaks a rule. Tap it.","answer":{"lines":["1. Prerequisites: TAB report on file; FSCP graphics verified; special inspector present; central station on test.","2. Trigger the stair pressurization zone from the automatic input; time the fan to its smoke-control state.","3. With all stair doors closed, measure the pressure difference at every level against the design range.","4. Measure door opening force at each stair door: not more than 30 lbf.","5. Open the design number of doors and re-measure; the remaining doors hold above the minimum.","6. Record 0.03 in. w.c. at the top landing as a pass, since the stair is sprinklered.","7. Return to normal: fan back to automatic, FSCP normal, central station off test."],"defectIndex":5,"codeRef":"NFPA 92","explanation":"Line 6 — the minimum pressure difference in a sprinklered space is 0.05 in. w.c. (NFPA 92). 0.03 is a failure, sprinklered or not."},"hook":"Sprinklers buy you 0.05, not 0.03 — a hundredth short of the minimum is still too little to hold smoke.","source":"Smoke control › table","par":45,"confirmInEdition":false},{"id":"K1-num-01","topicId":"K1","type":"number","prompt":"NFPA 92 acceptance: minimum pressure difference across a smoke barrier in a sprinklered space ___ in. w.c.; door opening force no more than ___ lbf. Standard for the pressure difference?","interviewerPhrasing":"What pressure difference and door force do you accept on a sprinklered smoke control test?","answer":{"fields":[{"label":"min pressure difference, sprinklered, in. w.c.","value":0.05,"tolerance":0.001},{"label":"max door opening force, lbf","value":30}],"codeRef":"NFPA 92","codeRefAliases":["92","NFPA92","NFPA 92 smoke control"],"explanation":"Pressure difference in a sprinklered space ≥ 0.05 in. w.c. (NFPA 92); door opening force ≤ 30 lbf. The system has to make the design pressure differences without making doors impossible to open."},"hook":"Five hundredths of an inch to hold the smoke, 30 pounds to open the door.","source":"Smoke control › table","par":25,"confirmInEdition":false},{"id":"K1-num-02","topicId":"K1","type":"number","prompt":"IBC values (confirm in your site's edition): stair pressurization ___ to ___ in. w.c. with doors closed; elevator hoistway pressurization ___ to ___ in. w.c. Which code?","interviewerPhrasing":"What range do you expect across a pressurized stair door?","answer":{"fields":[{"label":"stair, low, in. w.c.","value":0.1,"tolerance":0.001},{"label":"stair, high, in. w.c.","value":0.35,"tolerance":0.001},{"label":"hoistway, low, in. w.c.","value":0.1,"tolerance":0.001},{"label":"hoistway, high, in. w.c.","value":0.25,"tolerance":0.001}],"codeRef":"IBC","codeRefAliases":["International Building Code","IBC smokeproof enclosures","IBC 2012","the IBC"],"explanation":"Stair pressurization (IBC smokeproof enclosures) 0.10–0.35 in. w.c., doors closed; elevator hoistway pressurization (IBC) 0.10–0.25 in. w.c. These IBC values come from a presentation citing the 2012 IBC — confirm them in the edition your site uses."},"hook":"Stairs 0.10 to 0.35, hoistways 0.10 to 0.25 — same floor, lower ceiling for the elevator.","source":"Smoke control › table","par":35,"confirmInEdition":true},{"id":"K1-num-03","topicId":"K1","type":"number","prompt":"Airflow toward a fire (atrium makeup air) no more than ___ ft/min; duct leakage test at ___ × maximum design pressure with leakage no more than ___% of design flow.","answer":{"fields":[{"label":"makeup air velocity, ft/min (max)","value":200},{"label":"duct leakage test, × max design pressure","value":1.5,"tolerance":0.01},{"label":"leakage, % of design flow (max)","value":5}],"codeRef":null,"explanation":"Airflow toward a fire (atrium makeup air) ≤ 200 ft/min; duct leakage test at 1.5 × maximum design pressure, leakage ≤ 5% of design flow."},"hook":"200 feet a minute toward the fire, 1.5 × on the duct, 5% allowed to leak.","source":"Smoke control › table","par":30,"confirmInEdition":false},{"id":"K1-num-04","topicId":"K1","type":"number","prompt":"Door opening force formula (US units): F = F_dc + ___ × W × A × ΔP / (2 (W − d)); leakage flow Q = ___ × A × √ΔP. Door force limit ___ lbf.","answer":{"fields":[{"label":"door force constant","value":5.2,"tolerance":0.01},{"label":"leakage flow constant","value":2610},{"label":"max door force, lbf","value":30}],"codeRef":null,"explanation":"F = F_dc + 5.20 W A ΔP / (2 (W − d)), 30 lbf maximum; leakage Q = 2610 A √ΔP (cfm, ft², in. w.c.). Minimum stair pressure difference in a sprinklered building: 0.05 in. w.c."},"hook":"5.20 pushes the door, 2610 leaks the air, 30 is the most a firefighter pulls.","source":"FPE refresher: fire alarm and fire dynamics › Fire dynamics (SI: kW, m, s) › Door opening force (US units)","par":35,"confirmInEdition":false},{"id":"K1-scn-01","topicId":"K1","type":"scenario","prompt":"Stair pressurization reads high with all doors closed — what do you check?","interviewerPhrasing":"Stair pressurization reads high with all doors closed — what do you check?","answer":{"beats":["Barometric relief or relief damper","The fan's VFD setpoint","Sensor location","A stair tighter than designed","Then run the open-door case before retuning","Too high fails door force (30 lbf); too low lets smoke in"],"requiresNumber":true,"codeRef":null,"explanation":"Barometric relief or relief damper, the fan's VFD setpoint, sensor location, and a stair tighter than designed. Then run the open-door case before retuning: too high fails door force, too low lets smoke in."},"hook":"Relief, VFD, sensor, tight stair — then open a door before you touch the setpoint.","source":"Smoke control › Likely question","par":90,"confirmInEdition":false},{"id":"K2-num-01","topicId":"K2","type":"number","prompt":"L2 smoke control checks: belt-driven fans with at least ___ belts rated ___ × design duty; makeup air intakes at least ___ ft from exhaust.","answer":{"fields":[{"label":"belts per fan (min)","value":2},{"label":"belt rating, × design duty","value":1.5,"tolerance":0.01},{"label":"intake-to-exhaust separation, ft (min)","value":20}],"codeRef":null,"explanation":"L2: witness duct leak tests; dampers accessible with the right actuators; belt-driven fans with at least two belts (1.5 × design duty); wiring in raceway; makeup air intakes at least 20 ft from exhaust."},"hook":"Two belts at one-and-a-half duty, twenty feet between intake and exhaust.","source":"Smoke control › Acceptance sequence","par":25,"confirmInEdition":false},{"id":"K2-num-02","topicId":"K2","type":"number","prompt":"Governing smoke control documents: IBC section ___; NFPA ___; UL ___ smoke control listing for the controls; IBC Chapter ___ special inspection.","interviewerPhrasing":"What governs the smoke control acceptance test?","answer":{"fields":[{"label":"IBC smoke control section","value":909},{"label":"NFPA standard","value":92},{"label":"UL listing for the controls","value":864},{"label":"IBC special inspection chapter","value":17}],"codeRef":null,"explanation":"IBC 909; NFPA 92; IFC for testing and maintenance; UL 864 smoke control listing for the controls; IBC Chapter 17 special inspection. A special inspector witnesses it."},"hook":"909 · 92 · 864 · 17 — the IBC section, the NFPA standard, the UL listing, the inspector's chapter.","source":"Smoke control › Governing","par":30,"confirmInEdition":false},{"id":"K2-ord-01","topicId":"K2","type":"order","prompt":"Order the smoke control acceptance sequence, design review to close-out.","interviewerPhrasing":"Walk me through smoke control acceptance from design review to close-out.","answer":{"steps":["L0 — design review: rational analysis, sequence per zone, fan and damper schedule, FSCP graphics","L2 — witness duct leak tests; dampers accessible with the right actuators; two belts at 1.5 × duty; intakes 20 ft from exhaust","L3 — TAB balances to design airflow; each fan and damper proven on its own from the FSCP and from automatic inputs","L4 — zone by zone: trigger, time, measure pressure and door force, verify confirmation, prove FSCP priority","L5 — repeat on standby power and with cooling in its real operating modes","Close-out — special inspector's report to the AHJ; as-tested values become the periodic baseline"],"codeRef":null,"explanation":"L0 design review → L2 duct leak tests and installation checks → L3 balance and prove each fan and damper alone → L4 zone by zone with pressures, door forces, confirmation and FSCP priority → L5 on standby power and real cooling modes → close-out with the special inspector's report."},"hook":"Review, leak-test, balance, zone-by-zone, standby power, report — six rungs to a lit stair.","source":"Smoke control › Acceptance sequence","par":60,"confirmInEdition":false},{"id":"K2-ord-02","topicId":"K2","type":"order","prompt":"Order the L4 steps for one smoke control zone.","answer":{"steps":["Trigger the fire zone","Time each component to its smoke-control state","Measure pressure across every barrier and every door force","Verify end-to-end confirmation","Prove FSCP priority over the BMS, freezestats and duct detectors"],"codeRef":null,"explanation":"L4: zone by zone — trigger each fire zone; time each component to its smoke-control state; measure pressure across every barrier and every door force; verify end-to-end confirmation; prove FSCP priority over the BMS, freezestats and duct detectors."},"hook":"Trigger, time, measure, confirm, override — then the next zone.","source":"Smoke control › Acceptance sequence","par":45,"confirmInEdition":false},{"id":"K2-def-01","topicId":"K2","type":"defect","prompt":"One line in this smoke control FPT breaks a rule. Tap it.","answer":{"lines":["1. Prerequisites: TAB complete; duct leakage tests witnessed; FSCP graphics match the sequence; special inspector present.","2. L3: prove each fan and damper on its own from the FSCP and from an automatic input.","3. L4: trigger each fire zone; time each component to its smoke-control state.","4. Confirmation: a component passes when the FSCP shows its command was sent.","5. Measure pressure across every barrier and door force at every door.","6. Prove FSCP priority over the BMS, freezestats and duct detectors.","7. L5: repeat on standby power with CRAHs in every operating mode; special inspector's report to the AHJ."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — control verification needs positive confirmation from each component: airflow or position, not just a command."},"hook":"A sent command proves the wire; airflow or position proves the damper.","source":"Smoke control › table","par":45,"confirmInEdition":false},{"id":"K2-scn-01","topicId":"K2","type":"scenario","prompt":"What does the firefighter's smoke control panel have to prove at acceptance?","interviewerPhrasing":"What are you proving about the FSCP?","answer":{"beats":["The FSCP overrides everything: priority over the BMS, freezestats and duct detectors","Positive confirmation from each component — airflow or position, not just a command","At L3 each fan and damper is proven on its own from the FSCP and from automatic inputs","On standby power the FSCP shows true status","Dedicated systems get a weekly automatic self-test"],"requiresNumber":false,"codeRef":null,"explanation":"The firefighter's smoke control panel (FSCP) must override everything — prove FSCP priority over the BMS, freezestats and duct detectors — with positive confirmation from each component (airflow or position, not just a command), and true status on standby power."},"hook":"The FSCP wins every argument, and a command sent is not a damper moved — confirm position or flow.","source":"Smoke control › table","par":90,"confirmInEdition":false},{"id":"K2-scn-02","topicId":"K2","type":"scenario","prompt":"Where does smoke control show up on a data center campus, and how does that change the testing?","interviewerPhrasing":"Do data halls even have smoke control?","answer":{"beats":["Data halls rarely have a code-required smoke control system — it's in stairs, atriums and office blocks","Smoke-control-like sequences are everywhere: HVAC shutdown on detection, dampers for clean agent rooms, post-discharge exhaust","The IST matrix tests them the same way","High-airflow cooling can fight pressurization, so test with CRAHs in every mode"],"requiresNumber":false,"codeRef":null,"explanation":"Data halls rarely have a code-required smoke control system; you'll find it in stairs, atriums and office blocks. But smoke-control-like sequences are everywhere and the IST matrix tests them the same way; high-airflow cooling can fight pressurization, so test with CRAHs in every mode."},"hook":"No smoke control in the hall, but smoke-control sequences everywhere — and the CRAHs are the wind you test against.","source":"Smoke control › Data center points to make","par":90,"confirmInEdition":false},{"id":"K3-ord-01","topicId":"K3","type":"order","prompt":"Place the fire alarm on the commissioning ladder: order these from L1 to L5.","interviewerPhrasing":"Walk me through the Cx levels for a fire alarm system.","answer":{"steps":["L1: releasing panel factory test","L2: what arrived matches the submittal and is installed per design and listing","L3: program loaded; 100% point-to-point","L4: every sequence, including failure and degraded modes, against the Basis of Design","L5: fire alarm through a utility failure onto generator; release signals to BMS / EPMS"],"codeRef":null,"explanation":"L1 releasing panel factory test → L2 delivery and installation verification → L3 program loaded, 100% point-to-point → L4 FPT of every sequence including failure and degraded modes → L5 fire alarm through a utility failure onto generator."},"hook":"Factory, delivery, point-to-point, every sequence, then pull the utility — at L4 I prove the system, at L5 the building.","source":"Data center commissioning language › table","par":50,"confirmInEdition":false},{"id":"K3-mat-01","topicId":"K3","type":"matrix","prompt":"Sequence-of-operations review: for each input, what happens at each output? ● = happens, — = must not happen, Supervisory = a supervisory signal.","interviewerPhrasing":"Read me the duct detector and elevator rows of this IST matrix as test steps.","answer":{"grid":{"inputs":["Duct smoke detector, AHU","Clean agent release, electrical room","Elevator lobby or machine room detector"],"outputs":["Building alarm","Central station","Release / trip","HVAC and dampers","Elevator"],"cells":[["Supervisory","Supervisory","—","●","—"],["●","●","●","●","—"],["●","●","●","—","●"]],"options":["●","—","Supervisory"],"notes":[["","","","AHU off",""],["","","Agent","Room HVAC off, dampers close",""],["","","Shunt trip (machine room heat)","","Recall"]]},"codeRef":null,"explanation":"Duct smoke detector: supervisory to the building and central station, AHU off, no release. Clean agent release: alarm, central station, agent, room HVAC off and dampers close. Elevator lobby or machine room detector: alarm, central station, shunt trip (machine room heat), recall. Example only — the BOD decides every cell."},"hook":"Duct detector whispers (supervisory) and kills the AHU; the elevator detector recalls the car and trips the shunt.","source":"Data center commissioning language › IST matrix — the document the posting says you'll review.","par":90,"confirmInEdition":false},{"id":"K3-def-01","topicId":"K3","type":"defect","prompt":"One line in this fire alarm FPT script breaks a rule. Tap it.","answer":{"lines":["1. Prerequisites: L3 complete with 100% point-to-point; AHJ notified; central station on test; impairment logged.","2. Releasing outputs isolated: solenoids replaced by test lamps before any input is tripped.","3. Run every input in the matrix against every output, including the outputs that must not happen.","4. Failure modes: open and ground fault on each releasing circuit; loss of primary AC — the panel runs on batteries with no lost points.","5. Audibility: public mode at least 5 dB over average ambient.","6. Elevator recall and shunt trip proven from the lobby and machine room detectors.","7. Return to normal: test lamps out, solenoids reconnected and verified, central station off test, panel normal."],"defectIndex":4,"codeRef":null,"explanation":"Line 5 — public mode audibility is at least 15 dB over average ambient, or 5 dB over the maximum sound level lasting 60 s or more, whichever is greater. 5 dB over the average fails."},"hook":"5 dB is only over the peak; over the average you need 15.","source":"FPE refresher: fire alarm and fire dynamics › Fire alarm › Audibility","par":45,"confirmInEdition":false},{"id":"K3-num-01","topicId":"K3","type":"number","prompt":"Fire alarm secondary power for the battery calc: ___ h standby + ___ min alarm (___ min for in-building voice evacuation), then a ___% margin. Standard?","interviewerPhrasing":"How do you check the battery calc on the fire alarm submittal?","answer":{"fields":[{"label":"standby, h","value":24},{"label":"alarm, min","value":5},{"label":"alarm with voice evacuation, min","value":15},{"label":"margin, %","value":20}],"codeRef":"NFPA 72","codeRefAliases":["72","NFPA72","NFPA 72 secondary power"],"explanation":"NFPA 72: 24 h standby plus 5 min alarm (15 min for in-building voice evacuation). Add the 20% margin most manufacturers and AHJs require: Ah = [I_standby × 24 + I_alarm × 5/60] × 1.2."},"hook":"24 hours quiet, 5 minutes loud (15 with voice), then ×1.2.","source":"FPE refresher: fire alarm and fire dynamics › Fire alarm › Secondary power","par":30,"confirmInEdition":false},{"id":"K3-num-02","topicId":"K3","type":"number","prompt":"Audibility you measure on the FPT: public mode at least ___ dB over average ambient, or ___ dB over the maximum sound lasting 60 s or more; ___ dBA maximum; sleeping areas ___ dBA at the pillow with a ___ Hz tone.","interviewerPhrasing":"What audibility readings pass on a fire alarm FPT?","answer":{"fields":[{"label":"dB over average ambient (min)","value":15},{"label":"dB over the 60-s maximum (min)","value":5},{"label":"maximum, dBA","value":110},{"label":"at the pillow, dBA","value":75},{"label":"low-frequency tone, Hz","value":520}],"codeRef":null,"explanation":"Public mode at least 15 dB over average ambient, or 5 dB over the maximum sound level lasting 60 s or more, whichever is greater; 110 dBA maximum. Sleeping areas also need 75 dBA at the pillow and a 520 Hz low-frequency tone."},"hook":"15 over the average or 5 over the peak, never past 110 — and 75 at the pillow at 520 Hz.","source":"FPE refresher: fire alarm and fire dynamics › Fire alarm › Audibility","par":40,"confirmInEdition":false},{"id":"K3-num-03","topicId":"K3","type":"number","prompt":"Wall-mount visible notification: a 20×20 ft room needs ___ cd; 28×28 → ___ cd; 40×40 → ___ cd. Corridors: within ___ ft of each end and no more than ___ ft apart.","answer":{"fields":[{"label":"20×20 ft, cd","value":15},{"label":"28×28 ft, cd","value":30},{"label":"40×40 ft, cd","value":60},{"label":"corridor: within … ft of each end","value":15},{"label":"corridor: no more than … ft apart","value":100}],"codeRef":null,"explanation":"Wall-mount room sizing: 20×20 ft → 15 cd, 28×28 → 30 cd, 40×40 → 60 cd. Corridors up to 20 ft wide: within 15 ft of each end, no more than 100 ft apart."},"hook":"15, 30, 60 candela as the room doubles — and strobes every 100 ft down the hall, 15 ft from the ends.","source":"FPE refresher: fire alarm and fire dynamics › Fire alarm › Visible","par":40,"confirmInEdition":false},{"id":"K3-num-04","topicId":"K3","type":"number","prompt":"Smoke detector spacing ___ ft nominal, every point within 0.7 S = ___ ft; voice intelligibility STI ≥ ___ (CIS ≥ ___).","answer":{"fields":[{"label":"nominal spacing, ft","value":30},{"label":"0.7 S, ft","value":21},{"label":"STI (min)","value":0.5,"tolerance":0.001},{"label":"CIS (min)","value":0.7,"tolerance":0.001}],"codeRef":null,"explanation":"Smoke detectors: 30 ft nominal, every point within 0.7 S (21 ft). Voice intelligibility target: STI ≥ 0.50 (CIS ≥ 0.70). High-airflow reductions are in the ASD section."},"hook":"30 ft nominal, 21 ft to any point; half a point of STI, seven tenths of CIS.","source":"FPE refresher: fire alarm and fire dynamics › Fire alarm › Spacing","par":30,"confirmInEdition":false},{"id":"K3-scn-01","topicId":"K3","type":"scenario","prompt":"How do you run a fire alarm FPT against the sequence of operations?","interviewerPhrasing":"The fire alarm contractor says every device tested fine. Why isn't that your FPT?","answer":{"beats":["Test cause and effect against the sequence of operations, not just the devices","Every input against every output from the IST matrix — the blank cells get tested too","100% point-to-point at L3 before the L4 sequences","Failure modes: open and ground faults on releasing circuits, loss of primary power","Through a utility failure: ride through on batteries, no lost points or trouble storms, an alarm in progress keeps sounding","Return to normal: every isolation reversed and verified"],"requiresNumber":true,"codeRef":null,"explanation":"Test cause and effect against the sequence of operations, not just the devices: every input against every output (blank cells too), 100% point-to-point at L3, failure modes and loss of primary power at L4, ride-through on batteries at L5, and a verified return to normal."},"hook":"Devices prove the wiring; cause and effect proves the sequence — 100% of points, then every cell in the matrix.","source":"Data center commissioning language › Script development — what a good fire FPT script contains.","par":90,"confirmInEdition":false},{"id":"K4-num-01","topicId":"K4","type":"number","prompt":"Smoke control after acceptance: integrated retest every ___ years unless the integrated test plan says otherwise; dedicated systems run an automatic self-test how often (___)? IFC section for the retest?","interviewerPhrasing":"How often does a smoke control system get retested after acceptance?","answer":{"fields":[{"label":"integrated retest, years","value":10},{"label":"dedicated system self-test: how often","value":"weekly","aliases":["every week","once a week","week","1/week","each week","per week"]}],"codeRef":"IFC 901.6.2.2","codeRefAliases":["901.6.2.2","IFC 901.6.2.2","IFC section 901.6.2.2","901.6.2.2 IFC"],"explanation":"Integrated retest every 10 years (IFC 901.6.2.2) unless the integrated test plan says otherwise; dedicated systems get a weekly automatic self-test."},"hook":"Weekly self-test for dedicated, a full integrated retest every 10 years — 901.6.2.2.","source":"Smoke control › table","par":30,"confirmInEdition":false},{"id":"K4-num-02","topicId":"K4","type":"number","prompt":"Periodic smoke control testing: dedicated systems every ___ months; nondedicated every ___ months.","answer":{"fields":[{"label":"dedicated, months","value":6},{"label":"nondedicated, months","value":12}],"codeRef":null,"explanation":"Periodic testing: dedicated systems semiannually; nondedicated annually."},"hook":"Dedicated twice a year, nondedicated once — the system that does nothing else gets checked more.","source":"Smoke control › table","par":20,"confirmInEdition":false},{"id":"K4-num-03","topicId":"K4","type":"number","prompt":"Retest frequency: NFPA ___ leaves it to the integrated test plan; the IFC sets ___ years for high-rise and smoke control integrated tests unless the plan says otherwise.","answer":{"fields":[{"label":"NFPA standard for integrated testing","value":4},{"label":"IFC default interval, years","value":10}],"codeRef":null,"explanation":"NFPA 4 leaves retest frequency to the integrated test plan; the IFC sets 10 years for high-rise and smoke control integrated tests unless the plan says otherwise."},"hook":"NFPA 4 says \"your plan decides\"; the IFC says \"then 10 years\".","source":"Data center commissioning language › The documents","par":25,"confirmInEdition":false},{"id":"K4-def-01","topicId":"K4","type":"defect","prompt":"One line in this smoke control close-out breaks a rule. Tap it.","answer":{"lines":["1. Close-out: special inspector's report to the AHJ; as-tested values become the baseline for periodic tests.","2. Dedicated systems: weekly automatic self-test enabled and verified at the FSCP.","3. Periodic test schedule loaded into the CMMS: dedicated systems semiannually.","4. Nondedicated systems: quarterly.","5. Integrated retest every 10 years per IFC 901.6.2.2 unless the integrated test plan says otherwise.","6. Ops training recorded; impairment procedure on file."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — nondedicated systems are tested annually; dedicated systems semiannually."},"hook":"Dedicated: semiannual. Nondedicated: annual. Quarterly isn't on the list.","source":"Smoke control › table","par":40,"confirmInEdition":false},{"id":"K4-scn-01","topicId":"K4","type":"scenario","prompt":"What's the difference between a dedicated and a nondedicated smoke control system once the building is occupied?","interviewerPhrasing":"What testing schedule do you hand Ops for smoke control?","answer":{"beats":["Dedicated systems get a weekly automatic self-test","Periodic testing: dedicated semiannually, nondedicated annually","Integrated retest every 10 years (IFC 901.6.2.2) unless the integrated test plan says otherwise","NFPA 4 leaves the retest frequency to the integrated test plan","The as-tested acceptance values are the baseline for every periodic test"],"requiresNumber":true,"codeRef":"IFC 901.6.2.2","codeRefAliases":["901.6.2.2","IFC 901.6.2.2"],"explanation":"Dedicated systems: weekly automatic self-test and semiannual periodic testing; nondedicated annually; integrated retest every 10 years (IFC 901.6.2.2) unless the integrated test plan says otherwise. The as-tested values from acceptance become the baseline."},"hook":"Weekly, semiannual, annual, decade — self-test, dedicated, nondedicated, integrated.","source":"Smoke control › table","par":90,"confirmInEdition":false},{"id":"G1-ord-01","topicId":"G1","type":"order","prompt":"Order the clean agent acceptance sequence, L2 to L5.","interviewerPhrasing":"Walk me through accepting a clean agent system without discharging it.","answer":{"steps":["L2 — as-built vs calc: cylinder weight, pressure and serials; nozzles; pipe within the calc limits; relief vent; room volume; signage","L3 — piping: pneumatic test of closed sections; nitrogen flow test through every nozzle; program the releasing panel","L4 — room: door fan per NFPA 2001 Annex C","L4 — sequence with actuators removed: detection → pre-discharge → release; abort; manual release; faults; secondary power","Reconnect actuators under a written procedure: panel normal, no active outputs, second-person verification","L5 — release output drives the BMS / EPMS responses on normal and generator power"],"codeRef":null,"explanation":"L2 as-built vs calc → L3 piping → L4 room (door fan) → L4 sequence with actuators removed → reconnect under a written procedure → L5 release output drives CRAH shutdown, dampers and any power-down the BOD calls for, on normal and generator power."},"hook":"Check it, pressurize it, hold it, sequence it, reconnect it, integrate it.","source":"Clean agent and CO2 › Acceptance sequence","par":60,"confirmInEdition":false},{"id":"G1-ord-02","topicId":"G1","type":"order","prompt":"Order the release chain you prove at L4 with the actuators removed.","answer":{"steps":["Detection: cross-zoned or ASD Fire 2","First alarm","Second input","Pre-discharge alarm and time delay","Release output"],"codeRef":null,"explanation":"Detection (cross-zoned or ASD Fire 2) → first alarm → second input → pre-discharge alarm and time delay → release output. Then abort in its selected mode; manual release overrides abort."},"hook":"Two inputs, a warning, a wait — then the release lamp lights.","source":"Clean agent and CO2 › Acceptance sequence","par":40,"confirmInEdition":false},{"id":"G1-def-01","topicId":"G1","type":"defect","prompt":"L4 sequence test, FK-5-1-12 system, electrical room. One line breaks a rule. Tap it.","answer":{"lines":["1. Prerequisites: L3 pneumatic and nitrogen flow tests signed; releasing panel programmed; central station on test; impairment logged.","2. Disconnect the actuators from every cylinder and fit listed test lamps or simulators; verify no active outputs.","3. Cross-zoned detection: first zone → first alarm; second zone → pre-discharge alarm and time delay → release output on the test lamp.","4. Abort during the delay in its selected mode: no release output; manual release overrides abort.","5. On release output: HVAC off, dampers closed, door holders released.","6. Open and short faults on the release circuit; low cylinder pressure and maintenance-lockout supervisory; secondary power.","7. Reconnect the actuators while the panel is still in alarm so the release circuit can be confirmed live, then reset.","8. Return to normal: panel normal verified; central station off test; impairment closed."],"defectIndex":6,"codeRef":null,"explanation":"Line 7 — reconnect actuators under a written procedure: panel normal, no active outputs, second-person verification. With the panel in alarm the release output is active."},"hook":"Actuators go back on only when the panel is normal, nothing is active, and a second person says so.","source":"Clean agent and CO2 › Acceptance sequence","par":45,"confirmInEdition":false},{"id":"G1-num-01","topicId":"G1","type":"number","prompt":"Discharge times: a halocarbon reaches 95% of minimum design concentration in ≤ ___ s; inert gas discharges in ≤ ___ s for Class B and ≤ ___ s for Class A surface and Class C. And the standard.","interviewerPhrasing":"How long does a clean agent discharge get, and does inert gas get the same?","answer":{"fields":[{"label":"halocarbon, s","value":10},{"label":"inert gas Class B, s","value":60},{"label":"inert gas Class A surface and Class C, s","value":120}],"codeRef":"NFPA 2001","codeRefAliases":["2001","NFPA2001","nfpa 2001"],"explanation":"Halocarbon: 95% of minimum design concentration in ≤10 s. Inert gas: ≤60 s for Class B; ≤120 s for Class A surface and Class C (NFPA 2001). CO2 surface fires: design concentration within 1 min."},"hook":"10 · 60 · 120 — halocarbon in ten, inert gets a minute, two minutes for Class A and C.","source":"Clean agent and CO2 › table","par":30,"confirmInEdition":false},{"id":"G1-num-02","topicId":"G1","type":"number","prompt":"Piping proof without a discharge: closed-circuit pneumatic test at ___ psi for ___ min with loss ≤ ___ %. Standard?","answer":{"fields":[{"label":"psi","value":40},{"label":"minutes","value":10},{"label":"max loss, %","value":20}],"codeRef":"NFPA 2001","codeRefAliases":["2001","NFPA2001","nfpa 2001"],"explanation":"40 psi closed-circuit pneumatic test, 10 min, ≤20% loss; then a nitrogen flow test proves the nozzles are clear (NFPA 2001). Same for inert gas; CO2 per NFPA 12."},"hook":"40 for 10, lose a fifth — then blow nitrogen through every nozzle.","source":"Clean agent and CO2 › table","par":30,"confirmInEdition":false},{"id":"G1-num-03","topicId":"G1","type":"number","prompt":"Halocarbon design concentration = extinguishing concentration × ___ (Class A), × ___ (Class B), × ___ (Class C). NOAEL: HFC-227ea ___ %, FK-5-1-12 ___ %. Standard?","answer":{"fields":[{"label":"Class A factor","value":1.2,"tolerance":0.005},{"label":"Class B factor","value":1.3,"tolerance":0.005},{"label":"Class C factor","value":1.35,"tolerance":0.005},{"label":"NOAEL HFC-227ea, %","value":9},{"label":"NOAEL FK-5-1-12, %","value":10}],"codeRef":"NFPA 2001","codeRefAliases":["2001","NFPA2001","nfpa 2001"],"explanation":"Design concentration = extinguishing × 1.2 (A), 1.3 (B), 1.35 (C); inert gas uses the same factors — check whether your edition applies 1.35 to inert gas. NOAEL: HFC-227ea 9%, FK-5-1-12 10% (NFPA 2001)."},"hook":"1.2 · 1.3 · 1.35 climbs with the class; people stop at 9 and 10.","source":"Clean agent and CO2 › table","par":40,"confirmInEdition":false},{"id":"G1-num-04","topicId":"G1","type":"number","prompt":"Clean agent and energized equipment: if more than ___ V stays energized after discharge, the prescriptive concentrations no longer apply. Which standard's concentrations?","answer":{"fields":[{"label":"volts","value":480}],"codeRef":"NFPA 2001","codeRefAliases":["2001","NFPA2001","nfpa 2001"],"explanation":"If more than 480 V stays energized after discharge, NFPA 2001's prescriptive concentrations no longer apply. The power-down output is a design decision, not a detail."},"hook":"Past 480 volts the book's concentrations walk away — decide the power-down in the BOD.","source":"Emergency power interface › Data center points to make","par":25,"confirmInEdition":false},{"id":"G1-scn-01","topicId":"G1","type":"scenario","prompt":"Is clean agent right for a data hall at this scale?","interviewerPhrasing":"Is clean agent right for a data hall at this scale?","answer":{"beats":["No as primary: sprinklers plus very early detection","Clean agent reserved for spaces where the owner's risk case justifies it","At gigawatt scale, holding concentration in a hall with containment and high-airflow cooling is impractical","FM Data Sheet 5-32 treats gaseous systems as a supplement to sprinklers, not a substitute","Supply risk: 3M stopped making Novec 1230 at the end of 2025; recharge only with agent covered by the listing","Regulatory picture: recycled HFC-227ea for servicing from 2026 and for new installs from 2030"],"requiresNumber":true,"codeRef":"FM Data Sheet 5-32","codeRefAliases":["FM 5-32","DS 5-32","5-32","FM DS 5-32"],"explanation":"No as primary: sprinklers plus very early detection, with clean agent reserved for spaces where the owner's risk case justifies it — and the supply and regulatory picture argues against standardizing on it. FM Data Sheet 5-32 treats gaseous systems as a supplement."},"hook":"Sprinklers first, agent where the risk case says so — Novec gone end of 2025, recycled 227 by 2030.","source":"Clean agent and CO2 › Likely question","par":90,"confirmInEdition":false},{"id":"G1-scn-02","topicId":"G1","type":"scenario","prompt":"Actuators are off. Walk the L4 sequence test: what do you prove, in what order, and which faults and overrides?","interviewerPhrasing":"What does your clean agent functional test actually exercise once the cylinders are isolated?","answer":{"beats":["Detection (cross-zoned or ASD Fire 2) → first alarm → second input → pre-discharge alarm and time delay → release output","Abort in its selected mode; manual release overrides abort","HVAC off, dampers closed, door holders released","Open and short faults on the release circuit","Low cylinder pressure and maintenance-lockout supervisory","Secondary power"],"requiresNumber":false,"codeRef":null,"explanation":"Detection → first alarm → second input → pre-discharge alarm and time delay → release output; abort in its selected mode with manual release overriding it; HVAC off, dampers closed, door holders released; open and short release-circuit faults; low cylinder pressure and maintenance-lockout supervisory; secondary power."},"hook":"Two inputs, delay, release — then abort, override, shutdowns, faults, supervisories, batteries.","source":"Clean agent and CO2 › Acceptance sequence","par":90,"confirmInEdition":false},{"id":"G2-num-01","topicId":"G2","type":"number","prompt":"Door fan pass: the room holds the agent at least ___ min at the highest combustible level, with ___ % of the adjusted minimum design concentration retained. Reference?","interviewerPhrasing":"What does a passing door fan test look like?","answer":{"fields":[{"label":"hold, min","value":10},{"label":"retained, %","value":85}],"codeRef":"NFPA 2001 Annex C","codeRefAliases":["NFPA 2001","2001","Annex C","2001 Annex C"],"explanation":"Door fan per NFPA 2001 Annex C: ≥10 min hold at the highest combustible level, 85% of the adjusted minimum design concentration retained. A fail sends you leak-hunting, not adding agent."},"hook":"Ten minutes, 85% — the room has to keep what it was given.","source":"Clean agent and CO2 › table","par":30,"confirmInEdition":false},{"id":"G2-num-02","topicId":"G2","type":"number","prompt":"The pressure relief vent at L2: inert gas pushes the room into ___-pressure; halocarbons can swing ___, then ___.","answer":{"fields":[{"label":"inert gas","value":"over-pressure","aliases":["overpressure","over pressure","positive","positive pressure","over"]},{"label":"halocarbons, first","value":"negative","aliases":["negative pressure","under-pressure","underpressure","under pressure","vacuum"]},{"label":"halocarbons, then","value":"positive","aliases":["positive pressure","over-pressure","overpressure","over pressure"]}],"codeRef":null,"explanation":"Pressure relief vent installed and sized: inert gas over-pressure; halocarbons can swing negative, then positive. Room volume includes raised-floor and ceiling voids."},"hook":"Inert pushes, halocarbon sucks then pushes — size the vent for the swing.","source":"Clean agent and CO2 › Acceptance sequence","par":30,"confirmInEdition":false},{"id":"G2-ord-01","topicId":"G2","type":"order","prompt":"A clean agent room fails its door fan test a week before turnover. Order what you do.","answer":{"steps":["Find leaks under depressurization — smoke pencil, thermal camera","Look at cable and conduit penetrations, raised floor, ceiling plenum, dampers","Seal and retest","Never just add agent — it changes concentration against NOAEL and the overpressure vent sizing","If turnover proceeds, document the risk acceptance"],"codeRef":null,"explanation":"Find leaks under depressurization (smoke pencil, thermal camera): cable and conduit penetrations, raised floor, ceiling plenum, dampers. Seal and retest. Never just add agent. If turnover proceeds, document the risk acceptance."},"hook":"Hunt, seal, retest — more agent is a new design, not a fix.","source":"Commissioning technical (the 35%) › 10","par":45,"confirmInEdition":false},{"id":"G2-def-01","topicId":"G2","type":"defect","prompt":"Door fan test script, FK-5-1-12 electrical room. One line breaks a rule. Tap it.","answer":{"lines":["1. Prerequisites: room construction complete; volume measured including raised-floor and ceiling voids; releasing panel on test.","2. Record the highest combustible level and the adjusted minimum design concentration from the vendor calc.","3. Run the door fan per NFPA 2001 Annex C; record leakage and the predicted hold time.","4. Pass: at least 85% of the adjusted minimum design concentration retained at the highest combustible level for 10 minutes.","5. Fail: increase the agent quantity to recover the hold time, then retest.","6. Verify the pressure relief vent is installed and sized for the agent (inert over-pressure; halocarbons swing negative, then positive).","7. File the door fan report with the clean agent acceptance in the turnover package."],"defectIndex":4,"codeRef":null,"explanation":"Line 5 — a fail sends you leak-hunting under depressurization (cable and conduit penetrations, raised floor, ceiling plenum, dampers), not adding agent: more agent changes concentration against NOAEL and the overpressure vent sizing."},"hook":"A leaky room gets sealed, not refilled — 10 minutes at 85% or hunt again.","source":"Clean agent and CO2 › Acceptance sequence","par":40,"confirmInEdition":false},{"id":"G2-scn-01","topicId":"G2","type":"scenario","prompt":"A clean agent room fails its door fan test a week before turnover. What do you do?","interviewerPhrasing":"A clean agent room fails its door fan test a week before turnover.","answer":{"beats":["Find leaks under depressurization (smoke pencil, thermal camera)","Where: cable and conduit penetrations, raised floor, ceiling plenum, dampers","Seal and retest","Never just add agent — that changes concentration against NOAEL and the overpressure vent sizing","If turnover proceeds, document the risk acceptance"],"requiresNumber":true,"codeRef":null,"explanation":"Find leaks under depressurization (smoke pencil, thermal camera): cable and conduit penetrations, raised floor, ceiling plenum, dampers. Seal and retest. Never just add agent — it changes concentration against NOAEL and the overpressure vent sizing. If turnover proceeds, document the risk acceptance."},"hook":"Penetrations, floor, plenum, dampers — seal, retest, 10 minutes at 85%.","source":"Commissioning technical (the 35%) › 10","par":90,"confirmInEdition":false},{"id":"G2-scn-02","topicId":"G2","type":"scenario","prompt":"What does the door fan test prove, and what does a fail tell you?","interviewerPhrasing":"Explain the door fan test to me like I'm the owner's rep.","answer":{"beats":["The room holds the agent at least 10 minutes at the highest combustible level","85% of the adjusted minimum design concentration retained","Run per NFPA 2001 Annex C at L4, before the sequence test","A fail means leaks — hunt under depressurization: cable and conduit penetrations, raised floor, ceiling plenum, dampers","Not adding agent"],"requiresNumber":true,"codeRef":"NFPA 2001 Annex C","codeRefAliases":["NFPA 2001","2001","Annex C","2001 Annex C"],"explanation":"Door fan per NFPA 2001 Annex C proves the room holds the agent ≥10 min with 85% of the adjusted minimum design concentration retained at the highest combustible level. A fail sends you leak-hunting under depressurization — not adding agent."},"hook":"Annex C, 10 minutes, 85% — the fan finds the holes the agent would.","source":"Clean agent and CO2 › Acceptance sequence","par":90,"confirmInEdition":false},{"id":"G2-scn-03","topicId":"G2","type":"scenario","prompt":"The contractor's fix for the door-fan fail is to add a cylinder. Why not?","interviewerPhrasing":"Why can't you just add agent when the room leaks?","answer":{"beats":["More agent changes concentration against NOAEL — HFC-227ea
