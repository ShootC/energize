<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#121417">
<meta name="description" content="ENERGIZE — daily fire-protection commissioning drills for the Fluidstack interview. Runs offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ENERGIZE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ENERGIZE</title>
<style>
/* ENERGIZE — styles.
   A dark campus coming online: one amber accent for "coming up", warm white
   for "energized", red only for Not Ready. 390×844 first; fine on desktop.
   No external fonts or images. */

/* ---------- 1 · design tokens ---------- */
:root {
  /* surfaces, back to front */
  --bg: #0c0e11;
  --bg-2: #101317;
  --panel: #161a1f;
  --panel-2: #1d2128;
  --sunken: #0a0c0f;
  --line: #262b33;
  --line-2: #343a45;

  /* text */
  --text: #ece7de;
  --muted: #9ca2ab;
  --faint: #6c727c;

  /* signal — the whole palette */
  --amber: #f2a93b;            /* accent: coming up, Minor Refresh, slipped */
  --amber-ink: #1b1306;        /* text on amber */
  --amber-soft: rgba(242, 169, 59, 0.14);
  --amber-line: rgba(242, 169, 59, 0.45);
  --amber-dim: #b9853f;        /* Needs Improvement: framework right, a piece missing */
  --lit: #fff3d6;              /* energized, Locked In, clean */
  --lit-soft: rgba(255, 243, 214, 0.1);
  --lit-glow: rgba(255, 236, 190, 0.55);
  --red: #e5534b;              /* Not Ready — nothing else is red */
  --red-soft: rgba(229, 83, 75, 0.14);

  /* type */
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs: 17px;
  --fs-small: 15px;
  --fs-tiny: 13px;
  --fs-h1: 1.55rem;
  --fs-h2: 1.25rem;
  --fs-h3: 1.06rem;
  --lh: 1.45;

  /* shape and space */
  --r-s: 8px;
  --r-m: 12px;
  --r-l: 16px;
  --r-pill: 999px;
  --tap: 48px;
  --gap: 12px;
  --page: 640px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);

  /* motion */
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --fast: 140ms;
  --slow: 420ms;

  color-scheme: dark;
}

/* ---------- 2 · base ---------- */
*,
*::before,
*::after { box-sizing: border-box; }

html {
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background:
    radial-gradient(120% 60% at 50% -10%, #151a22 0%, rgba(21, 26, 34, 0) 70%),
    var(--bg);
  color: var(--text);
  font: var(--fs) / var(--lh) var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

#app {
  max-width: var(--page);
  margin: 0 auto;
  padding:
    calc(12px + var(--safe-t))
    max(16px, var(--safe-r))
    calc(28px + var(--safe-b))
    max(16px, var(--safe-l));
}

h1, h2, h3 { line-height: 1.25; letter-spacing: -0.005em; font-weight: 650; }
h1 { font-size: var(--fs-h1); margin: 0.4em 0 0.3em; }
h2 { font-size: var(--fs-h2); margin: 0.7em 0 0.4em; }
h3 { font-size: var(--fs-h3); margin: 1.1em 0 0.45em; color: var(--text); }
p { margin: 0.5em 0; }
a { color: var(--amber); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 2px;
}
small, .hint, .meta { color: var(--muted); font-size: var(--fs-small); }
.tiny { font-size: var(--fs-tiny); color: var(--faint); }
.num { font-variant-numeric: tabular-nums; }
mark { background: transparent; color: var(--lit); font-weight: 700; }
hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
[hidden] { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- 3 · buttons ---------- */
.btn {
  -webkit-appearance: none;
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--tap);
  padding: 10px 16px;
  margin: 0;
  font: inherit;
  font-weight: 560;
  color: var(--text);
  background: var(--panel-2);
  border: 1px solid var(--line-2);
  border-radius: var(--r-m);
  cursor: pointer;
  text-align: center;
  touch-action: manipulation;
  transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease), transform var(--fast) var(--ease), opacity var(--fast);
}
.btn:hover:not(:disabled) { border-color: var(--faint); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(0.995); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary {
  background: var(--amber);
  color: var(--amber-ink);
  border-color: var(--amber);
  font-weight: 700;
}
.btn.primary:hover:not(:disabled) { border-color: var(--lit); }
.btn.primary:disabled { opacity: 1; background: var(--panel-2); border-color: var(--line-2); color: var(--faint); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--text); border-color: var(--line-2); }
.btn.quiet { background: transparent; }
.btn.big { width: 100%; margin-top: 14px; min-height: 56px; font-size: 1.05rem; }
.btn.huge { width: 100%; min-height: 64px; font-size: 1.12rem; border-radius: var(--r-l); }
.btn.small { min-height: 40px; padding: 6px 12px; font-size: var(--fs-small); }
.btn.back { padding-left: 10px; color: var(--muted); background: transparent; border-color: transparent; }
.btn.back:hover:not(:disabled) { color: var(--text); }
.btn.on { border-color: var(--amber); color: var(--amber); background: var(--amber-soft); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.actions .btn { flex: 1 1 auto; }

/* ---------- 4 · forms ---------- */
.field, select, textarea {
  width: 100%;
  min-height: var(--tap);
  padding: 10px 12px;
  font: inherit;
  font-size: max(16px, 1rem); /* ≥16px keeps iOS from zooming */
  color: var(--text);
  background: var(--sunken);
  border: 1px solid var(--line-2);
  border-radius: var(--r-s);
  transition: border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
}
.field:focus, select:focus, textarea:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
.field::placeholder, textarea::placeholder { color: var(--faint); }
textarea { min-height: 96px; font-family: var(--mono); font-size: 14px; line-height: 1.4; resize: vertical; }
select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--amber); flex: none; margin: 0; }
.row { display: grid; gap: 6px; margin: 10px 0; }
.row > span { color: var(--muted); font-size: var(--fs-small); }
.row-check { display: flex; gap: 12px; align-items: center; min-height: var(--tap); cursor: pointer; }
.msg { min-height: 1.4em; font-size: var(--fs-small); color: var(--muted); }
.msg.bad { color: var(--amber); }
.msg.bad::before { content: "⚠ "; }

/* ---------- 5 · surfaces ---------- */
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  padding: 16px;
}
.panel + .panel { margin-top: 12px; }
.panel > .section-title:first-child { margin-top: 0; }
section.panel { margin-top: 12px; }
.section-title {
  margin: 22px 0 10px;
  font-size: var(--fs-tiny);
  font-weight: 700;
  color: var(--faint);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

/* ---------- 6 · rating pills (the ladder's colours) ---------- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 10px;
  min-height: 24px;
  border-radius: var(--r-pill);
  font-size: var(--fs-tiny);
  font-weight: 650;
  letter-spacing: 0.01em;
  white-space: nowrap;
  border: 1px solid transparent;
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.r-locked-in { color: var(--lit); background: var(--lit-soft); border-color: rgba(255, 243, 214, 0.25); }
.pill.r-minor-refresh { color: var(--amber); background: var(--amber-soft); }
.pill.r-needs-improvement { color: var(--amber-dim); border-color: rgba(185, 133, 63, 0.45); }
.pill.r-not-ready { color: var(--red); background: var(--red-soft); }
.pill.r-not-tested { color: var(--faint); border-color: var(--line-2); }
.pill.plain::before { display: none; }

/* ---------- 7 · header ---------- */
header.top { margin-bottom: 14px; }
.top-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: var(--tap);
}
.top-line .date { font-weight: 680; font-size: 1.08rem; display: flex; align-items: center; flex-wrap: wrap; }
.top-line .days { color: var(--muted); font-size: var(--fs-small); }
.top-line .xp { color: var(--muted); font-size: var(--fs-small); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.flame { width: 14px; height: 16px; vertical-align: -2px; }
.flame path { fill: var(--faint); }
.flame.on path { fill: var(--amber); }
.badge.dev { margin-left: 8px; padding: 1px 7px; border-radius: 6px; border: 1px dashed var(--amber-line); color: var(--amber); font-size: var(--fs-tiny); font-weight: 600; }
.readiness { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 10px 0 6px; }
.stat {
  position: relative;
  padding: 10px 12px 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  overflow: hidden;
}
.stat b { display: block; font-size: 1.3rem; line-height: 1.15; font-weight: 700; color: var(--lit); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat span { display: block; margin-top: 3px; color: var(--muted); font-size: var(--fs-tiny); }
.stat .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--line); }
.stat .bar i { display: block; height: 100%; background: var(--amber); border-radius: 0 2px 2px 0; transition: width var(--slow) var(--ease); }
.stat .bar.full i { background: var(--lit); }
.stat .target { position: absolute; bottom: 0; width: 2px; height: 7px; background: var(--lit); opacity: 0.7; }
.top-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: var(--fs-small); }
.mode, .deck-note {
  margin-top: 10px;
  padding: 8px 12px;
  border-radius: var(--r-s);
  border: 1px solid var(--amber-line);
  background: var(--amber-soft);
  color: var(--amber);
  font-size: var(--fs-small);
  font-weight: 600;
}
.deck-note { border-style: dashed; background: transparent; }

.top-right { display: inline-flex; align-items: center; gap: 4px; }
.icon-btn { min-width: var(--tap); padding: 0; }
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; }

/* ---------- 8 · campus map ---------- */
.campus { margin: 4px 0 0; }
.map { display: block; width: 100%; height: auto; overflow: visible; }
.map .ground { fill: #10141a; stroke: #1b2028; stroke-width: 1; }
.map .grid { stroke: #151a21; stroke-width: 0.6; }
.map .face { stroke: #0b0d10; stroke-width: 0.5; stroke-linejoin: round; transition: fill var(--fast) var(--ease); }
.map .face.top { fill: #2a3038; }
.map .face.lf { fill: #1f242c; }
.map .face.rf { fill: #171b21; }
.map .face.top.detail { fill: #343a44; }
.map .face.lf.detail { fill: #262b33; }
.map .face.rf.detail { fill: #1c2026; }
.map .face.top.pad { fill: #161a20; stroke: #222831; stroke-dasharray: 2 2; }
.map .face.lf.pad, .map .face.rf.pad { fill: #12161b; }
.map .win { fill: #0a0c0f; transition: fill var(--slow) var(--ease); }
.map .win.on { fill: var(--amber); }
.map .bld.warm .face.top.block { stroke: rgba(242, 169, 59, 0.35); }
.map .bld.energized .face.top.block { fill: #353127; stroke: rgba(255, 243, 214, 0.6); }
.map .bld.energized .face.lf.block { fill: #29261f; }
.map .bld.energized .face.rf.block { fill: #201e19; }
.map .bld.energized .win.on { fill: var(--lit); }
.map .label { font: 700 7.2px var(--font); letter-spacing: 0.09em; fill: var(--faint); text-anchor: middle; pointer-events: none; }
.map .bld.warm .label { fill: #c99247; }
.map .bld.energized .label { fill: var(--lit); }
.map .hit { fill: transparent; }
.map.interactive .bld { cursor: pointer; outline: none; }
.map.interactive .bld:hover .face.top.block,
.map.interactive .bld:focus-visible .face.top.block { fill: #3a414c; stroke: var(--amber); stroke-width: 1.1; }
.map .halo { opacity: 0.85; pointer-events: none; }
.map.art { max-height: 170px; margin: 6px auto 4px; }

/* the energize light-up: windows flick on one by one, then the glow rises */
.map .bld.celebrate .win.on { animation: win-on 520ms var(--ease) both; animation-delay: calc(var(--i, 0) * 38ms + 250ms); }
.map .bld.celebrate .halo { animation: halo-in 1600ms var(--ease) both; animation-delay: 600ms; }
.map .bld.celebrate .label { animation: label-in 900ms var(--ease) both; animation-delay: 900ms; }
@keyframes win-on {
  0% { fill: #0a0c0f; }
  55% { fill: #ffffff; }
  100% { fill: var(--lit); }
}
@keyframes halo-in {
  0% { opacity: 0; }
  60% { opacity: 1; }
  100% { opacity: 0.85; }
}
@keyframes label-in {
  from { fill: var(--faint); }
  to { fill: var(--lit); }
}

.campus figcaption { margin-top: 2px; }
.legend { display: flex; justify-content: center; gap: 16px; color: var(--faint); font-size: var(--fs-tiny); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.sw.dark { background: #1f242c; box-shadow: inset 0 0 0 1px #343a45; }
.sw.warm { background: var(--amber); }
.sw.lit { background: var(--lit); box-shadow: 0 0 8px var(--lit-glow); }
.energized-note {
  margin: 6px 0 0;
  padding: 10px 14px;
  border-radius: var(--r-m);
  background: var(--lit-soft);
  border: 1px solid rgba(255, 243, 214, 0.25);
  color: var(--lit);
  animation: rise 600ms var(--ease) both 900ms;
}
.energized-note p { margin: 0.2em 0; font-size: var(--fs-small); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- 9 · home ---------- */
.primary-actions { margin-top: 14px; }
.hint.center { text-align: center; margin-top: 8px; }
.done {
  margin: 0;
  padding: 16px;
  text-align: center;
  border-radius: var(--r-l);
  border: 1px dashed var(--line-2);
  color: var(--muted);
}
nav.secondary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.btn.nav { min-height: 52px; }
.bld-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.bld-row {
  -webkit-appearance: none;
  appearance: none;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 10px;
  width: 100%;
  min-height: 60px;
  padding: 10px 14px 12px;
  font: inherit;
  text-align: left;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.bld-row:hover { border-color: var(--line-2); }
.bld-name { font-weight: 620; }
.bld-pct { color: var(--muted); font-size: var(--fs-small); align-self: center; }
.bld-area { grid-column: 1 / -1; color: var(--faint); font-size: var(--fs-tiny); }
.bld-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--line); }
.bld-bar i { display: block; height: 100%; background: var(--amber); }
.bld-row.warm .bld-pct { color: var(--amber); }
.bld-row.energized { border-color: rgba(255, 243, 214, 0.3); background: linear-gradient(0deg, var(--lit-soft), transparent 70%), var(--panel); }
.bld-row.energized .bld-pct { color: var(--lit); font-weight: 650; }
.bld-row.energized .bld-bar i { background: var(--lit); box-shadow: 0 0 8px var(--lit-glow); }
.buildings .tiny { margin-top: 10px; }

/* ---------- 10 · shift chrome ---------- */
.progress { margin: 0 0 12px; }
.progress-top { display: flex; align-items: center; justify-content: space-between; min-height: 40px; }
.progress-label { color: var(--muted); font-size: var(--fs-small); }
/* One row always: dots shrink instead of wrapping when follow-ups extend the shift, so the card never moves. */
.dots { display: flex; flex-wrap: nowrap; align-items: center; gap: 5px; height: 16px; }
.dot { flex: 0 1 10px; min-width: 0; width: 10px; aspect-ratio: 1 / 1; height: auto; border-radius: 50%; background: var(--line-2); transition: background var(--fast) var(--ease); }
.dot.follow { flex-basis: 7px; width: 7px; }
.dot.is-done { background: var(--amber); }
.dot.now { background: var(--lit); box-shadow: 0 0 0 3px rgba(255, 243, 214, 0.18); }
/* Fixed height (kind + pill on one row, the topic clamped to two lines) so every card starts at the same y. */
.slot-label { display: grid; grid-template-columns: 1fr auto; grid-template-rows: 26px auto; align-items: center; gap: 4px 10px; margin: 0 0 10px; height: 72px; color: var(--muted); font-size: var(--fs-small); }
.slot-label .pill { grid-column: 2; grid-row: 1; }
.slot-kind { grid-column: 1; grid-row: 1; justify-self: start; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line-2); color: var(--text); font-size: var(--fs-tiny); font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; }
.slot-kind.s-redo { border-color: var(--amber-line); color: var(--amber); }
.slot-kind.s-followup { border-style: dashed; }
.slot-topic { grid-column: 1 / -1; grid-row: 2; align-self: start; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; max-height: 2.7em; }

/* ---------- 11 · cards ---------- */
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  padding: 16px 16px 18px;
  animation: card-in 260ms var(--ease) both;
}
@keyframes card-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card-type { color: var(--amber); font-size: var(--fs-tiny); font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; }
.card-meta { color: var(--faint); font-size: var(--fs-tiny); }
.interviewer { margin: 12px 0 4px; padding-left: 12px; border-left: 2px solid var(--amber-line); color: var(--lit); font-style: italic; }
.prompt { margin: 10px 0 6px; font-size: 1.18rem; line-height: 1.35; font-weight: 640; }
.card-body .hint { margin: 6px 0 12px; }
.blank-count { margin: 14px 0 0; color: var(--amber); font-size: var(--fs-small); font-weight: 600; }
.blank-count.full { color: var(--lit); }

/* number */
.fields { display: grid; gap: 10px; }
.field-row { display: grid; gap: 4px; }
.field-label { color: var(--muted); font-size: var(--fs-small); }
.field-row.code { margin-top: 6px; padding-top: 12px; border-top: 1px dashed var(--line-2); }
.field-row.code .field-label { color: var(--amber); }
.field.filled { border-color: var(--line-2); background: #0e1115; }

/* order */
.placed { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
.slot { display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 8px; min-height: var(--tap); }
.slot-n { color: var(--faint); font-size: var(--fs-small); text-align: right; }
.slot.ghost::after { content: ""; height: 40px; border: 1px dashed var(--line-2); border-radius: var(--r-s); }
.placed-step {
  -webkit-appearance: none; appearance: none;
  width: 100%; min-height: var(--tap); padding: 10px 12px;
  font: inherit; text-align: left; color: var(--text);
  background: var(--amber-soft); border: 1px solid var(--amber-line); border-radius: var(--r-s);
  cursor: pointer;
  animation: pop 180ms var(--ease) both;
}
@keyframes pop { from { transform: scale(0.97); opacity: 0.4; } to { transform: none; opacity: 1; } }
.slot.filled .slot-n { color: var(--amber); }
.pool { display: grid; gap: 8px; }
.btn.step { width: 100%; justify-content: flex-start; text-align: left; font-weight: 450; padding: 12px 14px; }

/* matrix */
.mx-input { margin: 0 0 10px; padding: 10px 12px 4px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--bg-2); }
.mx-title { margin: 0 0 6px; font-size: var(--fs-small); font-weight: 680; color: var(--lit); }
.mx-cells { list-style: none; margin: 0; padding: 0; }
.mx-cells li { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; border-top: 1px solid var(--line); }
.mx-cells li:first-child { border-top: 0; }
.mx-out { font-size: var(--fs-small); color: var(--text); }
.cell {
  -webkit-appearance: none; appearance: none;
  flex: none; min-width: 84px; min-height: 44px; padding: 6px 10px;
  font: inherit; font-weight: 700; color: var(--faint);
  background: var(--sunken); border: 1px dashed var(--line-2); border-radius: var(--r-s);
  cursor: pointer;
}
.cell.v-dot { color: var(--amber-ink); background: var(--amber); border: 1px solid var(--amber); font-size: 1.35rem; line-height: 1; }
.cell.v-dash { color: var(--text); background: var(--panel-2); border: 1px solid var(--line-2); }
.cell.v-word { color: var(--amber); background: var(--amber-soft); border: 1px solid var(--amber-line); font-size: var(--fs-small); }
.cell:disabled { opacity: 0.75; cursor: default; }

/* scenario */
.type-instead { margin: 6px 0 0; }
.type-instead summary { min-height: var(--tap); display: flex; align-items: center; color: var(--muted); cursor: pointer; }
.type-instead textarea { font-family: var(--font); font-size: 16px; }
.typed { margin: 8px 0; padding: 8px 12px; border-left: 2px solid var(--line-2); color: var(--muted); white-space: pre-wrap; }
.beats { list-style: none; margin: 4px 0; padding: 0; display: grid; gap: 6px; }
.beat label {
  display: flex; gap: 12px; align-items: flex-start;
  min-height: var(--tap); padding: 12px;
  border: 1px solid var(--line); border-radius: var(--r-s); background: var(--bg-2);
  cursor: pointer;
}
.beat label input { margin-top: 1px; }
.beat label:has(input:checked) { border-color: var(--amber-line); background: var(--amber-soft); }
.beat.fill { padding: 6px 0; }
.row-check.extra { padding: 4px 12px; border-radius: var(--r-s); }
.row-check.extra:has(input:checked) { background: var(--amber-soft); }

/* timers */
.timer { position: relative; height: 34px; margin: 6px 0 10px; background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r-s); overflow: hidden; }
.timer-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--amber); opacity: 0.32; transition: width 250ms linear; }
.timer-band { position: absolute; top: 0; bottom: 0; background: rgba(255, 243, 214, 0.08); border-left: 1px dashed rgba(255, 243, 214, 0.35); border-right: 1px dashed rgba(255, 243, 214, 0.35); }
.timer-limit { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--lit); opacity: 0.5; }
.timer-label { position: relative; display: block; text-align: center; line-height: 32px; font-size: var(--fs-small); font-weight: 600; }
.timer.over .timer-fill, .timer[data-state="over"] .timer-fill { opacity: 0.6; }
.timer.over .timer-label, .timer[data-state="over"] .timer-label, .timer[data-state="ramble"] .timer-label { color: var(--amber); }
.timer[data-state="in"] .timer-fill { background: var(--lit); opacity: 0.22; }
.timer[data-state="in"] .timer-label { color: var(--lit); }

/* story */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 6px; }
.chip {
  -webkit-appearance: none; appearance: none;
  min-height: var(--tap); padding: 8px 16px;
  font: inherit; font-weight: 560; color: var(--text);
  background: var(--sunken); border: 1px solid var(--line-2); border-radius: var(--r-pill);
  cursor: pointer;
  transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
}
.chip.on { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); }
.chip.k-lesson.on { background: var(--lit); border-color: var(--lit); }
.chip.fill-in { cursor: default; }
.fill-in { display: inline-block; border: 1px dashed var(--amber-line); border-radius: 6px; padding: 0 6px; color: var(--amber); background: transparent; font-size: var(--fs-small); }
.chip.fill-in { border-radius: var(--r-pill); padding: 8px 14px; opacity: 0.8; }
.rec-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 10px; }
.btn.rec { gap: 10px; }
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); }
.btn.rec.on { border-color: var(--amber); color: var(--amber); }
.btn.rec.on .rec-dot { background: var(--amber); animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.rec-status { color: var(--muted); font-size: var(--fs-small); }

/* defect */
.lines { display: grid; gap: 6px; }
.line {
  -webkit-appearance: none; appearance: none;
  width: 100%; min-height: var(--tap); padding: 10px 12px;
  font: inherit; font-size: var(--fs-small); line-height: 1.4; text-align: left; color: var(--text);
  background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-s);
  cursor: pointer;
}
.line:hover { border-color: var(--line-2); }
.line.on { border-color: var(--amber); background: var(--amber-soft); box-shadow: inset 3px 0 0 var(--amber); }

/* ---------- 12 · result ---------- */
.result {
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 5px solid var(--line-2);
  border-radius: var(--r-l);
  padding: 14px 16px 18px;
  animation: card-in 240ms var(--ease) both;
}
.result.lvl-clean { border-left-color: var(--lit); }
.result.lvl-minor { border-left-color: var(--amber); }
.result.lvl-ni { border-left-color: var(--amber-dim); }
.result.lvl-nr { border-left-color: var(--red); }
.result-head { display: flex; align-items: center; gap: 10px; }
.result-head h2 { margin: 0; flex: 1; font-size: 1.35rem; }
.result-head h2 small { font-size: var(--fs-small); font-weight: 500; color: var(--muted); }
.lvl-clean .result-head h2 { color: var(--lit); }
.lvl-minor .result-head h2 { color: var(--amber); }
.lvl-ni .result-head h2 { color: var(--amber-dim); }
.lvl-nr .result-head h2 { color: var(--red); }
.xp-gain { color: var(--amber); font-weight: 700; font-size: var(--fs-small); }
.check { width: 28px; height: 28px; flex: none; }
.check path { fill: none; stroke: var(--lit); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw 420ms var(--ease) 80ms forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.result-meta { margin: 2px 0 8px; color: var(--faint); font-size: var(--fs-tiny); }
.note { color: var(--muted); font-size: var(--fs-small); }
.label { display: block; margin-bottom: 2px; color: var(--faint); font-size: var(--fs-tiny); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
.correction { margin: 10px 0; padding: 10px 12px; border-radius: var(--r-m); background: var(--bg-2); border: 1px solid var(--line); }
.explanation { margin: 0; line-height: 1.5; }
.hook { margin: 10px 0; padding: 10px 12px; border-radius: var(--r-m); border: 1px dashed var(--amber-line); color: var(--amber); }
.hook .label { color: var(--amber); opacity: 0.8; }
.confirm { color: var(--amber); font-size: var(--fs-small); }
.answer-list { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 4px; font-size: var(--fs-small); }
.answer-list li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: 8px 10px; border-radius: var(--r-s); background: var(--bg-2); }
.answer-list li.bad { box-shadow: inset 3px 0 0 var(--amber); }
.mk { width: 16px; flex: none; font-weight: 800; }
.mk.ok { color: var(--lit); }
.mk.bad { color: var(--amber); }
.al-label { color: var(--muted); }
.al-value { color: var(--lit); }
.al-you { color: var(--amber); font-size: var(--fs-tiny); }
.answer-list.steps li { counter-increment: step; }
.answer-list .quote { color: var(--muted); }
.answer-list.beats-result li, .answer-list.steps li { display: grid; grid-template-columns: 18px 1fr; gap: 2px 8px; }
.answer-list.beats-result li.fill { display: block; }
.answer-list.steps .al-you { grid-column: 2; }
.answer-list li.fill { background: transparent; padding: 4px 0; }
.lines-result li { display: block; }
.lines-result li.defect { box-shadow: inset 3px 0 0 var(--amber); background: var(--amber-soft); }
.lines-result li.mine { opacity: 0.75; text-decoration: line-through; text-decoration-color: var(--faint); }
.lines-result .tag { display: inline-block; margin-right: 8px; padding: 0 6px; border-radius: 4px; font-size: var(--fs-tiny); font-weight: 700; color: var(--amber-ink); background: var(--amber); }
.lines-result li.mine .tag { background: var(--line-2); color: var(--text); }
.mx-result { margin: 12px 0; }
.mx-result li { min-height: 44px; padding: 6px 0; }
.mx-result li.bad .mx-out { color: var(--amber); }
.mx-note { display: block; color: var(--faint); font-size: var(--fs-tiny); }
.mx-val { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.mx-val b.v-dot, .mx-val b.v-dash, .mx-val b.v-word { color: var(--lit); }
details.script { margin: 12px 0; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--bg-2); }
details.script summary { min-height: var(--tap); display: flex; align-items: center; padding: 0 12px; color: var(--muted); cursor: pointer; }
.script-text { padding: 0 14px 6px; line-height: 1.6; }
.playback { margin: 12px 0; }
.playback audio { width: 100%; }
.topic-change { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0 4px; color: var(--muted); font-size: var(--fs-small); }
.tc-meta { color: var(--faint); }
.reread { margin: 6px 0 0; font-size: var(--fs-small); }

/* ---------- 13 · building view ---------- */
.building-hero { margin: 4px -4px 0; padding: 6px 0 2px; border-radius: var(--r-l); background: radial-gradient(70% 80% at 50% 70%, rgba(242, 169, 59, 0.06), transparent 70%); }
.building-hero.energized { background: radial-gradient(70% 80% at 50% 70%, rgba(255, 236, 190, 0.14), transparent 70%); }
.building-view h1 { margin-top: 4px; }
.b-sub { color: var(--muted); margin-top: 0; }
.rule { padding: 10px 12px; border-radius: var(--r-m); background: var(--bg-2); border: 1px solid var(--line); font-size: var(--fs-small); color: var(--muted); }
.rule b { color: var(--text); }
.rule.met { border-color: rgba(255, 243, 214, 0.3); background: var(--lit-soft); color: var(--lit); }
.rule.met b { color: var(--lit); }
blockquote.quote { margin: 14px 0; padding: 4px 0 4px 14px; border-left: 2px solid var(--amber-line); color: var(--text); font-style: italic; }
blockquote.quote cite { display: block; margin-top: 4px; font-style: normal; color: var(--faint); font-size: var(--fs-tiny); }
.topic-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.topic { padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-m); }
.topic.r-not-ready { border-left: 3px solid var(--red); }
.topic.r-locked-in { border-left: 3px solid var(--lit); }
.topic-head { display: flex; gap: 8px; align-items: baseline; }
.topic-id { color: var(--amber); font-variant-numeric: tabular-nums; }
.topic-name { font-weight: 560; }
.topic-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 8px; color: var(--faint); font-size: var(--fs-tiny); }
.topic-last { margin: 8px 0 0; color: var(--muted); font-size: var(--fs-small); }
.btn.drill { margin-top: 10px; width: 100%; }

/* ---------- 14 · debrief and final ---------- */
.debrief h1, .stories h1, .settings h1, .blitz h1, .mock h1 { margin-top: 6px; }
.headline { margin: 4px 0 12px; font-size: 1.2rem; font-weight: 680; color: var(--lit); line-height: 1.35; }
.delta-tile em { font-style: normal; font-weight: 700; }
.delta-tile em.up { color: var(--amber); }
.delta-tile em.flat { color: var(--faint); }
.delta { color: var(--faint); font-size: var(--fs-tiny); }
.energized-note.static { animation: none; margin: 12px 0; }
.reread-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.reread-list li { display: grid; gap: 4px; font-size: var(--fs-small); }
.reread-list .btn { justify-self: start; }
.rr-topic { color: var(--muted); }
.actions.stack { flex-direction: column; align-items: stretch; }
.actions.stack .btn.big { margin-top: 0; }
.final { text-align: left; }
.final .go { font-size: 2rem; line-height: 1.15; color: var(--lit); margin: 18px 0 12px; text-shadow: 0 0 24px rgba(255, 236, 190, 0.25); animation: rise 700ms var(--ease) both; }
.final.after h1 { color: var(--lit); }
.final-stats { color: var(--muted); }
.checklist { list-style: none; margin: 0; padding: 0; }
.checklist .row-check { align-items: flex-start; padding: 6px 0; }
.checklist .row-check input { margin-top: 2px; }
.checklist .row-check:has(input:checked) span { color: var(--faint); text-decoration: line-through; }

/* ---------- 15 · stories ---------- */
.story-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.story-row {
  -webkit-appearance: none; appearance: none;
  display: grid; grid-template-columns: 1fr auto; gap: 6px 10px;
  width: 100%; min-height: 64px; padding: 12px 14px;
  font: inherit; text-align: left; color: var(--text);
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-m);
  cursor: pointer;
}
.story-row:hover { border-color: var(--line-2); }
.sr-title { font-weight: 620; }
.sr-time { color: var(--amber); font-size: var(--fs-small); }
.sr-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--faint); font-size: var(--fs-tiny); }

/* ---------- 16 · Number Blitz ---------- */
.blitz-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.b-best { color: var(--muted); font-size: var(--fs-small); white-space: nowrap; }
.b-score { color: var(--amber); font-weight: 800; }
.blitz-card { margin-top: 8px; padding: 16px; min-height: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-l); animation: card-in 200ms var(--ease) both; }
.b-prompt { font-size: 1.1rem; font-weight: 600; line-height: 1.4; }
.b-answer ul { list-style: none; margin: 12px 0; padding: 0; display: grid; gap: 4px; }
.b-answer li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border-radius: var(--r-s); background: var(--bg-2); font-size: var(--fs-small); }
.b-answer li b { color: var(--lit); text-align: right; }
.b-final { margin: 18px 0 4px; text-align: center; font-size: 3.4rem; font-weight: 800; color: var(--lit); line-height: 1; }
.center { text-align: center; }

/* ---------- 17 · settings ---------- */
.settings .panel { margin-top: 12px; }
.settings .section-title { margin-top: 0; }
.settings textarea { margin: 8px 0; }
.toggle small.block { display: block; color: var(--faint); font-size: var(--fs-tiny); }
.file { width: 100%; margin: 6px 0; color: var(--muted); font-size: var(--fs-small); }
.file::file-selector-button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: var(--r-s); min-height: 44px; padding: 0 12px; margin-right: 10px; cursor: pointer; }
.build { margin-top: 18px; text-align: center; }

/* ---------- 18 · browse and the rendered guide ---------- */
.browse-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.tabs { display: flex; gap: 6px; }
.btn.tab { min-height: 40px; padding: 6px 12px; font-size: var(--fs-small); }
.browse #browse-search { margin-bottom: 8px; }
.search-results { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
.search-results li { padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-s); }
.search-results a { display: block; min-height: 24px; font-weight: 600; text-decoration: none; }
.search-results .snip { margin: 4px 0 0; color: var(--muted); font-size: var(--fs-small); }
.search-results .none { color: var(--muted); }
mark.hit { color: var(--amber-ink); background: var(--amber); border-radius: 3px; padding: 0 2px; font-weight: 600; }
.toc { margin: 0 0 8px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--panel); }
.toc summary { min-height: var(--tap); display: flex; align-items: center; padding: 0 14px; color: var(--muted); cursor: pointer; }
.toc ol { list-style: none; margin: 0; padding: 0 14px 10px; max-height: 50vh; overflow-y: auto; }
.toc li a { display: block; padding: 7px 0; text-decoration: none; color: var(--text); }
.toc li.lv3 a { padding-left: 16px; color: var(--muted); font-size: var(--fs-small); }
.doc { margin-top: 6px; overflow-wrap: anywhere; line-height: 1.55; }
.doc h1 { font-size: 1.4rem; }
.doc h2 { margin-top: 1.6em; padding-top: 0.6em; border-top: 1px solid var(--line); font-size: 1.22rem; scroll-margin-top: 12px; }
.doc h3 { color: var(--amber); scroll-margin-top: 12px; }
.doc h2.flash, .doc h3.flash, .doc h4.flash { animation: flash 1600ms var(--ease); border-radius: 6px; }
@keyframes flash { 0%, 30% { background: var(--amber-soft); box-shadow: 0 0 0 6px var(--amber-soft); } 100% { background: transparent; box-shadow: 0 0 0 6px transparent; } }
.doc strong { color: var(--lit); font-weight: 650; }
.doc ul, .doc ol { padding-left: 1.3em; }
.doc li { margin: 0.25em 0; }
.doc code { font-family: var(--mono); font-size: 0.9em; padding: 0 4px; border-radius: 4px; background: var(--panel-2); }
.doc .table-wrap { overflow-x: auto; margin: 10px 0; border: 1px solid var(--line); border-radius: var(--r-s); }
.doc table { border-collapse: collapse; font-size: var(--fs-tiny); min-width: 100%; }
.doc th, .doc td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
.doc th { color: var(--muted); font-weight: 650; background: var(--panel); }
.doc tr:last-child td { border-bottom: 0; }
.doc .math { overflow-x: auto; padding: 10px 12px; margin: 10px 0; background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r-s); font-family: "Cambria Math", "STIX Two Math", "Latin Modern Math", serif; font-size: 1.05rem; color: var(--lit); }
.tex-frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 2px; }
.tex-num { border-bottom: 1px solid currentColor; padding: 0 2px; }
.tex-den { padding: 0 2px; }
.tex-sqrt { border-top: 1px solid currentColor; }
.doc li.task { list-style: none; }

/* ---------- 19 · mock interview ---------- */
.deck-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.deck-row {
  -webkit-appearance: none; appearance: none;
  display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
  width: 100%; min-height: 72px; padding: 14px 16px;
  font: inherit; text-align: left; color: var(--text);
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-m);
  cursor: pointer;
}
.deck-row:hover { border-color: var(--line-2); }
.deck-row.today { border-color: var(--amber-line); background: linear-gradient(0deg, var(--amber-soft), transparent), var(--panel); }
.dr-title { font-weight: 680; }
.dr-time { color: var(--muted); font-size: var(--fs-small); }
.dr-qs { grid-column: 1 / -1; color: var(--faint); font-size: var(--fs-tiny); letter-spacing: 0.08em; }
.dr-today { grid-column: 1 / -1; color: var(--amber); font-size: var(--fs-tiny); font-weight: 700; }
.mock-head { margin-bottom: 10px; }
.mock-kind { display: flex; align-items: center; gap: 10px; margin: 10px 0 0; }
.kind { padding: 1px 8px; border-radius: 6px; font-size: var(--fs-tiny); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; border: 1px solid var(--line-2); }
.kind.k-technical { color: var(--amber); border-color: var(--amber-line); }
.kind.k-values { color: var(--lit); border-color: rgba(255, 243, 214, 0.3); }
.stage { color: var(--muted); font-size: var(--fs-small); }
.mock-q { margin: 8px 0 12px; font-size: 1.2rem; line-height: 1.4; font-weight: 600; color: var(--lit); font-style: italic; }
.mock-q.small { font-size: 1rem; }
.mock-results { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
.mock-results li { display: grid; grid-template-columns: 70px 1fr; gap: 2px 10px; padding: 10px 12px; border-radius: var(--r-s); background: var(--panel); border: 1px solid var(--line); font-size: var(--fs-small); }
.mr-word { font-weight: 750; grid-row: span 2; }
.mr-clean .mr-word { color: var(--lit); }
.mr-slipped .mr-word { color: var(--amber); }
.mr-missed .mr-word { color: var(--amber-dim); }
.mr-missed.nr .mr-word { color: var(--red); }
.mr-note { color: var(--faint); font-size: var(--fs-tiny); }

/* ---------- 20 · wider screens ---------- */
@media (min-width: 720px) {

<h3 id="g-story-drafts-star-under-2-minutes-each">Story drafts (STAR, under 2 minutes each)</h3>
<p><strong>Story 1 — Extreme ownership: three occupied towers, one cutover</strong></p>
<ul><li><strong>S:</strong> Three occupied high-rise towers on a Hawaii campus, 15–16 floors each. The legacy fire alarm had to be replaced, brought to code and moved onto a new fiber backbone: 16 nodes, about 1,500 devices.</li><li><strong>T:</strong> I owned it end to end — job walk, design, install, programming and testing — and led a crew of 12 to cut over and commission it far enough that most of the crew could fly home and the local team could finish.</li><li><strong>A:</strong><ul><li>A month before cutover I flew out and built every panel on site. That caught 4 parts critical to the install that the warehouse had missed, early enough to get them shipped to Hawaii.</li><li>The fiber contractor pulled the runs but never jumpered the cassettes and left no redlines. A coworker and I went panel by panel with a fiber light source, found every missing jumper and labeled each run end to end.</li><li>I broke the 12 into defined roles and a schedule.</li><li>We held the shutdown-to-waterflow window under 8 hours, with security on fire watch.</li><li>My bar for sending the crew home: waterflows, tampers, elevator recall and shunt trip, audibility, the sequence for every device type on every floor, and all manual paging — every programmed sequence proven.</li></ul></li><li><strong>R:</strong> [Fill in after Oct 30: on schedule? devices tested? punch items left? the date most of the crew flew home.]</li><li><strong>If they ask what you'd do differently:</strong> the radios (see Backups).</li></ul>
<p><strong>Story 2 — Velocity: a data center with no drawings</strong></p>
<ul><li><strong>S:</strong> A colocation data center — 8 COLOs, roughly 300,000–400,000 ft². We were upgrading 20 VESDA units (VLP to VESDA-E VEU) and the fire alarm, with no existing drawings.</li><li><strong>T:</strong> Recommission detection the data center could rely on, without waiting for as-builts that didn't exist.</li><li><strong>A:</strong><ul><li>Pulled the data from all 20 detectors. Every one was still at factory defaults — not viable for very early warning in a data hall.</li><li>Counted every sampling hole and paced each pipe run. The above-ceiling and CRAC networks came in only 4 variations, so I designed 4 networks in ASPIRE instead of 20.</li><li>Set new thresholds (defaults were Fire 1 2 %/ft and Fire 2 4 %/ft; set to Fire 1 0.0625 %/ft and Fire 2 1 %/ft for very early detection), normalized airflow and measured transport time on every pipe. High-flow faults turned out to be damaged pipe above the ceiling, which we repaired.</li><li>During cause-and-effect testing, a pre-action release tripped the wrong COLO's valve. It was double interlock, so the system primed but never filled. The releases for two COLOs were swapped, so in a real fire the COLO that needed water wouldn't have gotten it. I verified the relay for every system and corrected the programming to the sequence of operations.</li></ul></li><li><strong>R:</strong> 20 detectors re-engineered from 4 designs — 80% less design work. The wrong-COLO release was found in a test, not a fire. The whole job took about two weeks.</li><li><strong>End on what you changed, not on who missed it:</strong> &quot;Since then I treat every inherited system as unverified. I test cause and effect against the sequence of operations, not just the devices.&quot;</li></ul>
<p><strong>Story 3 — First principles: ground faults nobody could ground out</strong></p>
<ul><li><strong>S:</strong> A BESS site in Texas. I reviewed the design and the BACnet sequence-of-operations matrix, ran the crew installing 20 flame detectors, and programmed the panel and the BACnet link to the client's control house.</li><li><strong>T:</strong> Once more than about 7 detectors were connected, the panel showed a ground fault on the SLC.</li><li><strong>A:</strong><ul><li>Measured 0.5–4 V induced on each leg of the detector circuits. Each monitor module passed a fraction of it onto the SLC, and about 7 of them added up past the panel's 0.4 V ground-fault threshold. We diagnosed induction the same day.</li><li>The client had bought shielded, untwisted cable. A shield stops electric-field pickup, not magnetic pickup, so textbook grounding — shield landed at one end, carried through and taped — couldn't fix it. Twisting the pair is what cancels magnetic pickup.</li><li>The client wanted to try everything short of a re-pull, and each attempt failed. So I laid the replacement twisted cable on the ground out to the detectors, and the faults cleared.</li></ul></li><li><strong>R:</strong> Every run from the control house was re-pulled — about 2 weeks to pull and retest — and the system was commissioned. [Zero faults after the re-pull?]</li><li><strong>Lesson:</strong> I check cable data sheets at submittal review, not at start-up. The cable was approved before anyone read its sheet — tell that as a process gap, not blame.</li><li><strong>If they push on the physics:</strong> induced voltage scales with the loop area between the conductors; twisting makes each half-twist's pickup cancel the next.</li></ul>
<p><strong>Story 4 — Own the failure: canned air at a data center</strong></p>
<ul><li><strong>S:</strong> Seven months into my career, I was sent to a San Francisco data center for a smoke detector trouble.</li><li><strong>T:</strong> The head was dirty, and I needed to clean it.</li><li><strong>A:</strong> I didn't put the system on test and didn't pull the head. I blew it out with canned air from under the floor. It was cross-zoned, so it went to alarm: the building evacuated and the fire department rolled in rush-hour traffic. I didn't reset the panel. I confirmed the alarm was mine, silenced it, and waited for the trucks to tell them it was me.</li><li><strong>R:</strong> From that day, if I'm touching a panel or a device, the system is on test first. Every script I write starts with isolation and ends with a verified return to normal. And heads get vacuumed, not blown out.</li><li><strong>Delivery:</strong> tell it straight and short — the lesson is the point. It's early-career, so keep the radios story ready if they ask for something recent.</li></ul>

<p><strong>The role you're interviewing for</strong> is most likely <a href="https://jobs.dukecapitalpartners.duke.edu/companies/fluidstack/jobs/80683904-cx-qa-field-engineer-fire-protection" target="_blank" rel="noopener">Cx, QA &amp; Field Engineer, Fire Protection</a> on the Commissioning team — San Francisco, Austin or New York; posted at $220–300k plus equity. It owns fire life safety commissioning from test planning through occupancy: FPT on fire alarm, smoke control, the emergency power interface and suppression; pre-functionals and IST; AHJ inspections; scripts and IST matrices; closeout and punch. Bonus certifications: CxP, BCxP, CxA, CCP, QCxP. Smoke control and the emergency power interface now have their own sections (Days 3 and 4).</p>
