<template id="doc-guide"><h1 id="g-fluidstack-interview-cram-14-day-plan-study-guide">Fluidstack Interview Cram — 14-Day Plan &amp; Study Guide</h1>
<p>Oct 20, 2026 · @Brandon</p>
<h2 id="g-read-this-first">Read this first</h2>
<p>Your stories carry 65% of this round, so the plan spends about 40% of your time on them. The code numbers get you in the door; the stories win the score.</p>
<p><strong>How Stage 1 is scored.</strong> 30–45 minutes on Google Meet with the organization's hiring manager, weighted 35% technical and 65% EQ (judgment, ownership, communication). They go deep on work you have actually done, not trivia, and follow your answers into what you decided, what constrained you, and what you would do differently.</p>
<p><strong>What that means for ~35 hours of study.</strong></p>
<ul><li>Split it roughly 60% technical, 40% stories and delivery practice. A perfect NFPA 20 answer delivered as a ramble scores below a solid one delivered in 90 seconds with a number in it.</li><li>Your gaps are not fire alarm. They are: data center commissioning language (L1–L5, FPT vs IST, load banks, issue logs, turnover); the water side at acceptance-test level (sprinkler, pre-action, fire pump); smoke control and the emergency power interface, both named in the posting; and the newer hazards (BESS, mist, aerosol). Hydraulics drops to a light refresh — this role runs the tests, it doesn't own the calcs. Clean agent releasing, ASD and gas detection you already do — those days are refresh, not relearn.</li><li>Their own guide scores &quot;I don't know — here's how I'd find out&quot; above a guess. For a number you can't recall, name the section you'd check before writing the script.</li></ul>
<p><strong>Win this role first; mention R&amp;D once, at the close.</strong></p>
<ol><li>Go all-in on the Cx role. No email to Rico about the FPE roles — mid-process it reads as hedging.</li><li>In the interview, sell the bridge, not the switch. Their Extreme Ownership value describes carrying a system from design intent through installation, commissioning and operation. You design it, program it and commission it — say that, with examples.</li><li>Bring up your playbooks earlier, inside your answers (job walk → design → install → pre-test → commissioning). Then one question opens the door: &quot;How does commissioning feed back into the reference design — does the R&amp;D team see what fails in the field?&quot;</li><li>Close with one line, then stop: &quot;I'm all-in on this role. I also applied for the R&amp;D fire protection role, so if the team ever sees a fit there, I'd welcome that conversation.&quot; Save any direct ask for Stage 2 or the offer.</li></ol>
<p><strong>Certifications:</strong> the posting lists CxP, BCxP, CxA, CCP or QCxP as a bonus. If you register for one before the interview, say so — it backs the commissioning direction you already want.</p>
<p><strong>Interview date:</strong> Rico asked about Oct 26; you've asked for Nov 2. The plan finishes every technical topic by Sun Oct 25, so either date works.</p>

<h2 id="g-interview-playbook">Interview playbook</h2>
<p>Win the 65% with five stories, each built on one of their values and a number you can defend. The drafts come from your answers; the [brackets] are details still worth confirming. Say each one out loud until it fits in 2 minutes.</p>
<h3 id="g-values-stories">Values → stories</h3>
<div class="table-wrap"><table><thead><tr><th>Value</th><th>Story</th><th>Numbers to bring</th></tr></thead><tbody><tr><td>Extreme ownership</td><td>1 · Three occupied towers, one cutover</td><td>~1,500 devices, 16 nodes, 12 people, under 8 h impaired, 4 shortages caught a month early</td></tr><tr><td>Velocity</td><td>2 · A data center with no drawings</td><td>20 detectors from 4 designs (80% less design work); wrong-COLO release caught in test</td></tr><tr><td>First principles</td><td>3 · Ground faults nobody could ground out</td><td>~7 modules summed past a 0.4 V threshold; diagnosed the same day; proved before the re-pull</td></tr><tr><td>Own the failure</td><td>4 · Canned air at a data center</td><td>One evacuation; system on test ever since</td></tr><tr><td>Love of the game</td><td>5 · Playbooks, thermal imaging, tools</td><td>4 playbooks in company use; far fewer go-backs</td></tr></tbody></table></div>
<h3 id="g-story-drafts-star-under-2-minutes-each">Story drafts (STAR, under 2 minutes each)</h3>
<p><strong>Story 1 — Extreme ownership: three occupied towers, one cutover</strong></p>
<ul><li><strong>S:</strong> Three occupied high-rise towers on a Hawaii campus, 15–16 floors each. The legacy fire alarm had to be replaced, brought to code and moved onto a new fiber backbone: 16 nodes, about 1,500 devices.</li><li><strong>T:</strong> I owned it end to end — job walk, design, install, programming and testing — and led a crew of 12 to cut over and commission it far enough that most of the crew could fly home and the local team could finish.</li><li><strong>A:</strong><ul><li>A month before cutover I flew out and built every panel on site. That caught 4 parts critical to the install that the warehouse had missed, early enough to get them shipped to Hawaii.</li><li>The fiber contractor pulled the runs but never jumpered the cassettes and left no redlines. A coworker and I went panel by panel with a fiber light source, found every missing jumper and labeled each run end to end.</li><li>I broke the 12 into defined roles and a schedule.</li><li>We held the shutdown-to-waterflow window under 8 hours, with security on fire watch.</li><li>My bar for sending the crew home: waterflows, tampers, elevator recall and shunt trip, audibility, the sequence for every device type on every floor, and all manual paging — every programmed sequence proven.</li></ul></li><li><strong>R:</strong> [Fill in after Oct 30: on schedule? devices tested? punch items left? the date most of the crew flew home.]</li><li><strong>If they ask what you'd do differently:</strong> the radios (see Backups).</li></ul>
<p><strong>Story 2 — Velocity: a data center with no drawings</strong></p>
<ul><li><strong>S:</strong> A colocation data center — 8 COLOs, roughly 300,000–400,000 ft². We were upgrading 20 VESDA units (VLP to VESDA-E VEU) and the fire alarm, with no existing drawings.</li><li><strong>T:</strong> Recommission detection the data center could rely on, without waiting for as-builts that didn't exist.</li><li><strong>A:</strong><ul><li>Pulled the data from all 20 detectors. Every one was still at factory defaults — not viable for very early warning in a data hall.</li><li>Counted every sampling hole and paced each pipe run. The above-ceiling and CRAC networks came in only 4 variations, so I designed 4 networks in ASPIRE instead of 20.</li><li>Set new thresholds (defaults were Fire 1 2 %/ft and Fire 2 4 %/ft; set to Fire 1 0.0625 %/ft and Fire 2 1 %/ft for very early detection), normalized airflow and measured transport time on every pipe. High-flow faults turned out to be damaged pipe above the ceiling, which we repaired.</li><li>During cause-and-effect testing, a pre-action release tripped the wrong COLO's valve. It was double interlock, so the system primed but never filled. The releases for two COLOs were swapped, so in a real fire the COLO that needed water wouldn't have gotten it. I verified the relay for every system and corrected the programming to the sequence of operations.</li></ul></li><li><strong>R:</strong> 20 detectors re-engineered from 4 designs — 80% less design work. The wrong-COLO release was found in a test, not a fire. The whole job took about two weeks.</li><li><strong>End on what you changed, not on who missed it:</strong> &quot;Since then I treat every inherited system as unverified. I test cause and effect against the sequence of operations, not just the devices.&quot;</li></ul>
<p><strong>Story 3 — First principles: ground faults nobody could ground out</strong></p>
<ul><li><strong>S:</strong> A BESS site in Texas. I reviewed the design and the BACnet sequence-of-operations matrix, ran the crew installing 20 flame detectors, and programmed the panel and the BACnet link to the client's control house.</li><li><strong>T:</strong> Once more than about 7 detectors were connected, the panel showed a ground fault on the SLC.</li><li><strong>A:</strong><ul><li>Measured 0.5–4 V induced on each leg of the detector circuits. Each monitor module passed a fraction of it onto the SLC, and about 7 of them added up past the panel's 0.4 V ground-fault threshold. We diagnosed induction the same day.</li><li>The client had bought shielded, untwisted cable. A shield stops electric-field pickup, not magnetic pickup, so textbook grounding — shield landed at one end, carried through and taped — couldn't fix it. Twisting the pair is what cancels magnetic pickup.</li><li>The client wanted to try everything short of a re-pull, and each attempt failed. So I laid the replacement twisted cable on the ground out to the detectors, and the faults cleared.</li></ul></li><li><strong>R:</strong> Every run from the control house was re-pulled — about 2 weeks to pull and retest — and the system was commissioned. [Zero faults after the re-pull?]</li><li><strong>Lesson:</strong> I check cable data sheets at submittal review, not at start-up. The cable was approved before anyone read its sheet — tell that as a process gap, not blame.</li><li><strong>If they push on the physics:</strong> induced voltage scales with the loop area between the conductors; twisting makes each half-twist's pickup cancel the next.</li></ul>
<p><strong>Story 4 — Own the failure: canned air at a data center</strong></p>
<ul><li><strong>S:</strong> Seven months into my career, I was sent to a San Francisco data center for a smoke detector trouble.</li><li><strong>T:</strong> The head was dirty, and I needed to clean it.</li><li><strong>A:</strong> I didn't put the system on test and didn't pull the head. I blew it out with canned air from under the floor. It was cross-zoned, so it went to alarm: the building evacuated and the fire department rolled in rush-hour traffic. I didn't reset the panel. I confirmed the alarm was mine, silenced it, and waited for the trucks to tell them it was me.</li><li><strong>R:</strong> From that day, if I'm touching a panel or a device, the system is on test first. Every script I write starts with isolation and ends with a verified return to normal. And heads get vacuumed, not blown out.</li><li><strong>Delivery:</strong> tell it straight and short — the lesson is the point. It's early-career, so keep the radios story ready if they ask for something recent.</li></ul>
<p><strong>Story 5 — Love of the game: turning field lessons into something others can repeat</strong></p>
<ul><li>I've written 4 playbooks my company uses: linear heat detection in ASRS, thermal imaging for photovoltaic sites, BESS flame detection, and EST migrations. Result: far fewer go-backs, and those jobs no longer depend on a select few — many more techs can be sent. [Rough numbers: go-backs before vs. after? techs qualified then vs. now?]</li><li>I work with the UL-listed thermal detection manufacturer on their training programs, and I built my own camera placement tool around lens angle, obstructions and commodity type. I do design and design review for BESS, ASRS and PV.</li><li>At night I build software for fire protection: a tool that turns an EST3 program into a priced EST4 upgrade BOM, and a panel-capture app that checks devices off the points list during testing.</li><li><strong>Closing line:</strong> &quot;Productizing a data center is the same job: turn what one expert knows into something the next person can repeat. I've been doing that on my own time for years.&quot;</li></ul>
<h3 id="g-backups">Backups</h3>
<ul><li><strong>Technical deep dive — lab with smoke control and a third-party Cx FPE.</strong> I ran the subs and programmed the fire alarm for a high-rise lab; was the liaison with the third-party commissioning FPE; tested smoke control and generator backup for emergency circuits; was the main troubleshooter on damper and fan monitoring; ran the AHJ inspection; and trained the owners. The angle: &quot;I've been on the contractor side of a Cx script, so I know what makes a test day go right.&quot; [Still open: zones, fans and dampers; the hardest problem; first-time AHJ pass?]</li><li><strong>First principles, alternate — FM Global live burn.</strong> ASD vs. linear heat in a flash freezer's exhaust. I verified the ASD install; it alarmed about 15–20 s after a 1 ft² pan fire was lit, in very high airflow [confirm: about 60 air changes per minute or per hour?]. The linear heat was mounted behind steel beams; I flagged it so the comparison was fair. They retested separately and never reported results.</li><li><strong>Recent miss — the radios.</strong> On the Hawaii job I was late ordering radios. A coworker suggested a push-to-talk phone app; I bought licenses, the client let us use the site Wi-Fi, and it worked for less than radios would have cost.</li></ul>
<h3 id="g-your-60-second-intro">Your 60-second intro</h3>
<p>&quot;I'm a fire protection engineer — PE, NICET IV fire alarm — with 18 years taking fire alarm and special hazard systems from design through programming, installation and commissioning: high-rises, campuses, labs, clean agent, BESS, ASRS, hangars, cold storage. Today I'm on Everon's national technical team doing performance-based design and PE-level review, and I'm the liaison for our AI design tool. I build software that takes the hours out of design and estimating — [one number]. I want to do this where reliability is the product, at a scale where it matters. That's why I'm here.&quot;</p>
<h3 id="g-why-fluidstack">Why Fluidstack</h3>
<p>Your answer has three beats: the loop you've always worked in, the fire protection problem their factory-built model creates, and the AI tools you build on the kind of infrastructure they deliver.</p>
<p><strong>Say it in 45 seconds</strong></p>
<ol><li>&quot;You build capacity in months and run what you build. I've spent 18 years in that loop on fire systems — design, program, commission, then take the call when it misbehaves. I want to work where that loop is the whole business.&quot;</li><li>&quot;You're productizing the data center — modules built in a factory. That moves fire protection commissioning left: L1 scripts at the factory, so the site tests interfaces instead of re-testing every device. That's a problem I want to solve.&quot;</li><li>&quot;I use frontier models every night to build fire protection tools — including a panel-capture app that checks devices off the points list during testing. Fluidstack builds the infrastructure those models run on. I want to help make it reliable.&quot;</li></ol>
<p><strong>The role you're interviewing for</strong> is most likely <a href="https://jobs.dukecapitalpartners.duke.edu/companies/fluidstack/jobs/80683904-cx-qa-field-engineer-fire-protection" target="_blank" rel="noopener">Cx, QA &amp; Field Engineer, Fire Protection</a> on the Commissioning team — San Francisco, Austin or New York; posted at $220–300k plus equity. It owns fire life safety commissioning from test planning through occupancy: FPT on fire alarm, smoke control, the emergency power interface and suppression; pre-functionals and IST; AHJ inspections; scripts and IST matrices; closeout and punch. Bonus certifications: CxP, BCxP, CxA, CCP, QCxP. Smoke control and the emergency power interface now have their own sections (Days 3 and 4).</p>
<p><strong>The FPE roles, for your closing line only</strong></p>

<p><strong>Facts to know cold</strong></p>
