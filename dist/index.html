<h2 id="s-story-1-three-occupied-towers-one-cutover">Story 1 — Three occupied towers, one cutover</h2>
<p><strong>Value:</strong> Extreme ownership / Be a barrel · <strong>Length:</strong> 251 words, about 105 s, about 115 s once the result line is in.</p>
<p><strong>Script</strong></p>
<p>Three occupied high-rise towers had to lose their fire alarm for a few hours, and my job was to make that window as short and as safe as possible. It's a campus in Hawaii I'm finishing right now, fifteen to sixteen floors a tower. We're replacing the legacy fire alarm, bringing it to code and moving it onto a new fiber backbone, sixteen nodes and about fifteen hundred devices. I own it end to end, from the job walk and design through programming, and I'm leading a crew of twelve through cutover and testing.</p>
<p>Two things could have sunk it before we started. A month before cutover I flew out and built every panel on site. That caught four parts critical to the install that the warehouse had missed, early enough to get them shipped to the island. Then the fiber: the contractor pulled the runs but never jumpered the cassettes and left no redlines. Nobody owned that gap, so I did. A coworker and I went panel by panel with a light source, found every missing jumper and labeled every run end to end.</p>
<p>For cutover I gave the twelve defined roles and a schedule, and I set the bar for sending the crew home before we started: every waterflow and tamper, elevator recall and shunt trip, audibility, the sequence for every device type on every floor, and all manual paging. Proven, not sampled.</p>
<p>The result: three occupied towers were impaired for under eight hours, shutdown to waterflow back in service, with fire watch the whole time.</p>
<p>[Result after Oct 30: we cut over on ___, ___ devices tested, ___ punch items open, most of the crew home on ___.]</p>
<p>The lesson I keep: ownership starts a month before the outage. That's where you buy the eight-hour window.</p>
<p><strong>Beats to memorize</strong></p>
<ol><li>Hook: three occupied towers lose their fire alarm for a few hours; my job is to make that short and safe · 16 nodes · ~1,500 devices · crew of 12 · I own it end to end</li><li>Built every panel on site a month early → 4 missing critical parts caught in time to ship</li><li>Fiber never jumpered, no redlines → light source, panel by panel, every run labeled</li><li>Defined roles · bar for going home set before we started: proven, not sampled</li><li>Result: under 8 hours impaired, fire watch throughout. Pause. → &quot;ownership starts a month before the outage&quot;</li></ol>
<p><strong>Number spine:</strong> 3 towers · 16 nodes · 1,500 devices · 12 people, then 1 month · 4 parts · under 8 hours. The setup numbers come first; the action numbers count up 1, 4, 8. The 8 opens the story (hook), lands it (result) and closes it (lesson).</p>
<p><strong>Follow-ups, 15 seconds each</strong></p>
<ul><li><em>How did you split the twelve?</em> [Fill in: crews per tower, test team, programmer, who ran each morning.]</li><li><em>What would you do differently?</em> The radios: I ordered them late. A coworker suggested a push-to-talk phone app; I bought licenses, the client let us on site Wi-Fi, and it cost less than radios. [Confirm what you do now — e.g. comms goes on the mobilization list with the same lead time as materials.]</li><li><em>Why build the panels a month out?</em> On an island, a shortage found at cutover is a slipped date. A month gave shipping time, and it found four.</li><li><em>How did you prove the fiber?</em> A light source at each panel, run by run, and a label on both ends, since there were no redlines to trust.</li></ul>
<p><strong>If the cutover isn't closed out when they ask:</strong> &quot;We cut over this week. Everything we tested was proven to a standard that needed no fire watch, and most of the crew flies home once the sequences are proven.&quot;</p>
<p><strong>Keep out:</strong> any blame on the warehouse or the fiber contractor. State what was missing and what you did.</p>
<h2 id="s-story-2-a-data-center-with-no-drawings">Story 2 — A data center with no drawings</h2>
<p><strong>Value:</strong> Velocity / Insane urgency · <strong>Length:</strong> 235 words, about 100 s.</p>
<p><strong>Script</strong></p>
<p>A colocation data center: eight COLOs, three to four hundred thousand square feet. We were upgrading twenty VESDA units, VLP to VESDA-E, plus the fire alarm, and there were no drawings. Waiting for as-builts that didn't exist wasn't an option.</p>
<p>So I started with the data. I pulled the configuration from all twenty detectors, and every one was still at factory defaults. That's not something you rely on for very early warning in a data hall. Then I walked it: counted every sampling hole and paced every pipe run. That's where the speed came from. The above-ceiling and CRAC networks only came in four variations, so I modeled four networks in ASPIRE instead of twenty, about eighty percent less design work. We set new thresholds, normalized airflow and measured transport time on every pipe. The high-flow faults turned out to be damaged pipe above the ceiling, which we repaired.</p>
<p>Cause-and-effect testing then found the thing that mattered most. A pre-action release was tripping the wrong COLO's valve. It was double interlock, so that system primed but never filled. The releases for two COLOs were swapped, so in a real fire the COLO that needed water wouldn't have gotten it. I verified the release relay for every system and corrected the programming to the sequence of operations.</p>
<p>The whole job took about two weeks, end to end. Twenty detectors recommissioned from four designs, and a wrong-room release found in a test instead of a fire. Since then I treat every inherited system as unverified until I've tested cause and effect against the sequence, not just the devices.</p>
<p><strong>Beats to memorize</strong></p>
<ol><li>8 COLOs · 20 VESDAs · no drawings — waiting wasn't an option</li><li>Pulled data first: all 20 at factory defaults</li><li>Counted holes, paced runs → only 4 pipe variations → 4 designs, not 20 (80% less)</li><li>Thresholds, airflow, transport time on every pipe; damaged pipe found and fixed</li><li>Cause and effect caught a wrong-COLO release → &quot;every inherited system is unverified&quot;</li></ol>
<p><strong>Follow-ups, 15 seconds each</strong></p>
<ul><li><em>What thresholds did you set, and why?</em> The factory defaults were Fire 1 at 2 %/ft and Fire 2 at 4 %/ft, no more sensitive than a spot photoelectric detector (roughly 0.5–4 %/ft). We set Fire 1 to 0.0625 %/ft and Fire 2 to 1 %/ft for very early detection. Tie the new settings to the alarm philosophy: Alert and Action call Ops, Fire 1 is the building alarm, Fire 2 releases.</li><li><em>How did you test transport time?</em> Smoke at the end cap of every pipe, timed against the ASPIRE calc and NFPA 72's 120-second limit. [Add your worst measured time if you remember it.]</li><li><em>How did you catch the wrong-COLO release?</em> Running cause and effect zone by zone against the sequence of operations, watching which valve actually operated, not just that a release output went active.</li><li><em>Why not wait for drawings?</em> None existed, and the detectors were at defaults, so the risk was in leaving it as it was.</li></ul>
<p><strong>Keep out:</strong> who programmed the release wrong. End on what you changed.</p>
<h2 id="s-story-3-ground-faults-nobody-could-ground-out">Story 3 — Ground faults nobody could ground out</h2>
<p><strong>Value:</strong> First principles / Reason from first principles · <strong>Length:</strong> 250 words, about 105 s.</p>
<p><strong>Script</strong></p>
<p>A battery storage site in Texas. I'd reviewed the design and the BACnet sequence matrix, ran the crew installing twenty flame detectors, and programmed the panel and the BACnet link to the client's control house. Once more than about seven detectors were connected, the panel threw a ground fault on the SLC.</p>
<p>The usual move with a ground fault is to hunt for a nicked wire. I measured instead. There was half a volt to four volts induced on each leg of the detector circuits. Each monitor module passed a fraction of that onto the SLC, and around seven of them added up past the panel's 0.4-volt ground-fault threshold. That explained the seven-detector pattern, and we had induction diagnosed the same day.</p>
<p>The root cause was the cable. It was shielded but not twisted. A shield stops electric-field pickup; it does nothing for magnetic pickup. Twisting the pair is what cancels that. So no amount of textbook shield grounding was going to fix it.</p>
<p>The client understandably wanted to try everything short of a re-pull, and each attempt failed. So rather than argue, I proved it. I laid twisted replacement cable on the ground out to the detectors, and the faults cleared. That made the decision easy. We re-pulled every run from the control house, about two weeks to pull and retest, and commissioned the system.</p>
<p>What changed for me: I check cable data sheets at submittal review, not at start-up. The cheapest place to catch physics is on paper.</p>
<p><strong>Beats to memorize</strong></p>
<ol><li>Texas BESS · 20 flame detectors · fault appears past ~7 connected</li><li>Measured, didn't hunt: 0.5–4 V induced per leg → ~7 modules sum past 0.4 V</li><li>Shielded, untwisted: a shield blocks electric fields, twisting cancels magnetic</li><li>Client tried cheaper fixes → I proved it with twisted cable laid on the ground</li><li>Re-pull ~2 weeks, commissioned → &quot;check cable data sheets at submittal&quot;</li></ol>
<p><strong>Follow-ups, 15 seconds each</strong></p>
<ul><li><em>Explain the physics.</em> Induced voltage scales with the loop area between the two conductors. Twisting makes each half-twist's pickup cancel the next, so the net loop area goes to nearly zero. A grounded foil shield drains capacitive pickup but magnetic flux passes right through it.</li><li><em>How did you handle the client pushing back?</em> I let them try their options, because each was cheaper than a re-pull if it worked. When they didn't, I put the proof on the ground in front of them instead of arguing.</li><li><em>Who approved that cable?</em> Treat it as a process gap: the cable was approved before anyone read its data sheet. My fix is reading cable sheets at submittal, every job.</li><li><em>Did it stay clean after the re-pull?</em> [Confirm: zero ground faults through commissioning?]</li></ul>
<p><strong>Keep out:</strong> that the designer approved the cable without reading the sheet. It's a process story, not a blame story.</p>
<h2 id="s-story-4-canned-air-at-a-data-center">Story 4 — Canned air at a data center</h2>
<p><strong>Value:</strong> Owning the failure · <strong>Length:</strong> 191 words, about 80 s. It's short on purpose: tell it straight, land the lesson, stop.</p>
<p><strong>Script</strong></p>
<p>Seven months into my career, I was sent to a data center in San Francisco for a smoke detector trouble. The head was dirty and needed cleaning. I didn't put the system on test, and I didn't pull the head. I blew it out with canned air from under the raised floor.</p>
<p>It went to alarm. The building evacuated, and the fire department came through rush-hour traffic.</p>
<p>What I did next is the part that mattered. I didn't reset the panel to make it go away. I confirmed the alarm was mine, silenced it, and waited for the trucks so I could tell them myself that it was me and exactly what happened.</p>
<p>That day set three habits I still run on. If I'm touching a panel or a device, the system is on test first. Every test script I write starts with isolation and ends with a verified return to normal, because the worst outcomes of a test are an unplanned alarm and a system left disabled. And heads get vacuumed, not blown out.</p>
<p>In commissioning that's the whole job: nobody should ever learn about your test from an evacuation.</p>
<p><strong>Beats to memorize</strong></p>
<ol><li>7 months in · SF data center · dirty head</li><li>No test mode, didn't pull the head, canned air from under the floor</li><li>Alarm → evacuation → fire department at rush hour</li><li>Didn't reset; confirmed, silenced, met the trucks and owned it</li><li>On test first · isolation-to-return-to-normal scripts · vacuum, don't blow → &quot;nobody learns about your test from an evacuation&quot;</li></ol>
<p><strong>Follow-ups, 15 seconds each</strong></p>
<ul><li><em>What would you do differently in the moment?</em> Call central station, put the system on test with outputs disabled, pull the head and clean it away from the base, then restore and confirm normal before leaving.</li><li><em>Did anything release?</em> [Confirm: was any suppression or pre-action zone tied to that detector? Did the canned air reach two cross-zoned detectors?]</li><li><em>How did the customer react?</em> [Fill in, one line.]</li><li><em>Something more recent?</em> Go to the radios backup.</li></ul>
<p><strong>Keep out:</strong> jokes or minimizing. The calm, specific telling is what scores.</p>
<h2 id="s-story-5-turning-field-lessons-into-something-others-can-repeat">Story 5 — Turning field lessons into something others can repeat</h2>
<p><strong>Value:</strong> Love of the game · <strong>Length:</strong> 235 words, about 100 s.</p>
<p><strong>Script</strong></p>
<p>For me, the best part of this work is turning what one expert knows into something the next person can repeat.</p>
<p>When I solve something hard in the field, I write it down so the next crew doesn't have to solve it again. That's become four playbooks my company uses: linear heat detection in automated storage, thermal imaging for solar sites, flame detection for battery storage, and EST panel migrations. The result is far fewer go-backs, and those jobs no longer depend on a select few people. We can send a lot more techs. [Number: go-backs before and after, or techs qualified then and now.]</p>
<p>It goes past the playbooks. I work with a UL-listed thermal detection manufacturer on their training programs, and I built my own camera placement tool around lens angle, obstructions and commodity type.</p>
<p>At night I build fire protection software with frontier models. One tool turns an existing EST3 program into a priced EST4 upgrade bill of materials. Another captures panel output during testing and checks devices off the points list as they come in. That's commissioning automation, the same problem your team has at scale.</p>
<p>Nobody asked me to do any of it. A lesson that lives only in my head doesn't help the next crew. Productizing a data center is the same job: turn expertise into something repeatable. I've been doing that on my own time for years, and I want to do it where the scale makes it matter.</p>
<p><strong>Beats to memorize</strong></p>
<ol><li>&quot;Turn what one expert knows into something the next person can repeat&quot;</li><li>4 playbooks in company use → fewer go-backs, more techs can go</li><li>Thermal detection training with the manufacturer + my own camera placement tool</li><li>Night tools: EST3→EST4 priced BOM; panel capture that checks off the points list</li><li>&quot;Productizing a data center is the same job&quot;</li></ol>
<p><strong>Follow-ups, 15 seconds each</strong></p>
<ul><li><em>Which tool matters most for this role?</em> The panel-capture app: it records what the panel reports during testing and marks each device off the points list, so the test record builds itself. [Add one number: devices per day, or hours saved per test.]</li><li><em>How do you use AI in your work today?</em> I build these tools with frontier models, and I'm the liaison for my company's AI design tool, so I see both sides: what the model gets right and where an engineer has to check it.</li><li><em>Won't side projects pull focus?</em> Every tool starts as a field problem I hit on a job. The work feeds the tools, not the other way around.</li></ul>
<p><strong>Keep out:</strong> pricing or business details of the tools. Keep it about the work they make repeatable.</p>
<h2 id="s-backup-scripts-45-70-seconds">Backup scripts (45–70 seconds)</h2>
<p>Shorter on purpose: these come out when a follow-up asks for a second example.</p>
<p><strong>Lab with smoke control and a third-party Cx FPE</strong> — for questions about a commissioning agent, the AHJ or smoke control.</p>
<p>On a high-rise lab I ran the subs and programmed the fire alarm, and I was the contractor's liaison to the third-party commissioning FPE, so I was on the receiving end of every Cx script. We tested smoke control and the generator backup for the emergency circuits, and I was the main troubleshooter on fan and damper monitoring. [The hardest one was ___, and the cause was ___.] I ran the AHJ inspection [result: ___] and trained the owners before turnover. It taught me what makes a test day go right from the contractor's side: a script they've seen in advance, a pre-test that has already passed, and one person running the room. That's how I'd run it from the commissioning seat.</p>
<p><strong>FM Global live burn</strong> — for questions about testing fairly or data integrity.</p>
<p>FM Global ran a live burn comparing aspirating smoke detection with linear heat in a flash freezer's exhaust, in very high airflow [about ___ air changes per hour]. I verified the ASD install beforehand. A one-square-foot pan fire was lit, and the ASD alarmed in about fifteen to twenty seconds. I'd noticed the linear heat was mounted behind steel beams, so I flagged it; otherwise the comparison would have measured the installation, not the technology. They retested it separately, and I never saw those results. A test only proves something if the setup is fair to every system in it.</p>
<p><strong>The radios</strong> — for &quot;a recent mistake&quot;.</p>
<p>On the Hawaii job I was late ordering radios for a crew of twelve. A coworker suggested a push-to-talk app on our phones. I bought the licenses, got the client's OK to use the site Wi-Fi, and we ran on it for less than radios would have cost. [Confirm what you do now — e.g. comms goes on my mobilization list with the same lead time as materials.] On a cutover, communication is part of the safety plan, not an afterthought.</p>

OPR says what the owner needs","BOD says how the design meets it","Cx plan says who tests what, when","NFPA 3 (2024) is the commissioning standard for fire and life safety systems and names the FCxA","NFPA 4 (2024) covers integrated testing and names the ITa — one person can hold both","NFPA 4 leaves retest frequency to the integrated test plan; the IFC sets 10 years for high-rise and smoke control unless the plan says otherwise"],"requiresNumber":true,"codeRef":null,"explanation":"OPR says what the owner needs; BOD says how the design meets it; the Cx plan says who tests what, when. NFPA 3 (2024) names the FCxA, NFPA 4 (2024) names the ITa — one person can hold both; retest frequency sits in the integrated test plan, with the IFC's 10 years as the default."},"hook":"OPR → BOD → Cx plan; 3 commissions, 4 integrates, 10 years unless the plan says otherwise.","source":"Data center commissioning language › The documents.","par":90,"confirmInEdition":false},{"id":"C3-num-01","topicId":"C3","type":"number","prompt":"Finish the two lines: “The most dangerous outcome of a test is a system left ___.” Every step line carries an expected result, an actual result, pass/fail and ___.","answer":{"fields":[{"label":"a system left …","value":"disabled","aliases":["disabled.","left disabled","disable"]},{"label":"pass/fail and …","value":"initials","aliases":["initial","the initials","initialed","initials on every line"]}],"codeRef":null,"explanation":"Return to normal — every isolation reversed and verified; the most dangerous outcome of a test is a system left disabled. Steps carry an expected result, an actual result, pass/fail and initials on every line."},"hook":"Four fields a line — expected, actual, pass/fail, initials — and nothing left disabled.","source":"Data center commissioning language › Script development — what a good fire FPT script contains.","par":25,"confirmInEdition":false},{"id":"C3-ord-01","topicId":"C3","type":"order","prompt":"Put the six parts of a good fire FPT script in order.","interviewerPhrasing":"What goes into one of your FPT scripts?","answer":{"steps":["Purpose, system, and the code / BOD sections each acceptance criterion comes from","Prerequisites: prior level signed off, AHJ notified, central station on test, impairment logged, fire watch","Safety isolation: actuators and solenoids replaced by test lamps or simulators, cylinders disconnected, shutdown circuits verified","Steps with an expected result, an actual result, pass/fail and initials on every line","Failure modes: open and ground faults on releasing circuits, loss of primary power, loss of air, abort and manual release","Return to normal — every isolation reversed and verified"],"codeRef":null,"explanation":"Purpose and criteria sources → prerequisites → safety isolation → steps with expected / actual / pass-fail / initials → failure modes → return to normal. The most dangerous outcome of a test is a system left disabled."},"hook":"Why, before, isolate, step, break, restore — six parts, and the last one is the one that keeps people alive.","source":"Data center commissioning language › Script development — what a good fire FPT script contains.","par":55,"confirmInEdition":false},{"id":"C3-def-01","topicId":"C3","type":"defect","prompt":"One line in this FPT script excerpt breaks a rule. Tap it.","answer":{"lines":["1. Purpose and system; each acceptance criterion cites its code / BOD section.","2. Prerequisites: prior level signed off, AHJ notified, central station on test, impairment logged.","3. Safety isolation: actuators and solenoids replaced by test lamps or simulators; agent cylinders disconnected.","4. Shutdown circuits verified before anything is tripped.","5. Steps: expected result, actual result, pass/fail and initials on every line.","6. Failure modes: open and ground faults on releasing circuits, loss of primary power, abort and manual release.","7. Return to normal: panel reset; test lamps stay in place for the next test."],"defectIndex":6,"codeRef":null,"explanation":"Line 7 — return to normal means every isolation reversed and verified. The most dangerous outcome of a test is a system left disabled."},"hook":"The last step is put-it-all-back: every isolation reversed, every one verified.","source":"Data center commissioning language › Script development — what a good fire FPT script contains.","par":40,"confirmInEdition":false},{"id":"C3-def-02","topicId":"C3","type":"defect","prompt":"A clean agent L4 script. One line sets up the test unsafely. Tap it.","answer":{"lines":["1. Purpose: L4 FPT, clean agent system, Electrical Room 2; acceptance criteria cite NFPA 2001 and the BOD section for each one.","2. Prerequisites: L3 signed off, AHJ notified, central station on test, impairment logged.","3. Safety isolation: test lamps on the releasing circuit; agent cylinders left connected so the discharge pressure switch can be proven.","4. Shutdown circuits verified before any input is tripped.","5. Each step: expected result, actual result, pass/fail, initials.","6. Failure modes: open and ground fault on the releasing circuit, loss of primary power, abort and manual release.","7. Return to normal: every isolation reversed and verified."],"defectIndex":2,"codeRef":null,"explanation":"Line 3 — safety isolation means actuators and solenoids replaced by test lamps or simulators and agent cylinders disconnected before you trip anything."},"hook":"Lamps on the circuit, cylinders off the pipe — nothing that can fire stays connected.","source":"Data center commissioning language › Script development — what a good fire FPT script contains.","par":40,"confirmInEdition":false},{"id":"C3-def-03","topicId":"C3","type":"defect","prompt":"A wet sprinkler L4 script. One prerequisite line is wrong. Tap it.","answer":{"lines":["1. Purpose: L4 FPT, wet sprinkler riser 1; criteria cite NFPA 13 Chapter 29 and the BOD.","2. Prerequisites: L3 hydro certificates signed, AHJ notified, impairment logged — central station left live so the dispatch path gets proven.","3. Safety isolation: shutdown circuits verified before any device is tripped.","4. Inspector's test: expected alarm within 90 s of flow; actual ___; pass/fail; initials.","5. Tamper: expected signal within two turns of the handwheel; actual ___; pass/fail; initials.","6. Failure modes: loss of primary power at the FACP; open and ground fault on the waterflow circuit.","7. Return to normal: inspector's test closed, valves open and tamper normal, panel reset, central station off test, verified."],"defectIndex":1,"codeRef":null,"explanation":"Line 2 — prerequisites: prior level signed off, AHJ notified, central station on test, impairment logged, fire watch in place if the system goes out of service."},"hook":"Before the first step: signed off, AHJ told, central station on test, impairment logged.","source":"Data center commissioning language › Script development — what a good fire FPT script contains.","par":40,"confirmInEdition":false},{"id":"C3-scn-01","topicId":"C3","type":"scenario","prompt":"What goes in a fire FPT script?","interviewerPhrasing":"Walk me through what's in one of your FPT scripts.","answer":{"beats":["Purpose, system, and the code / BOD sections each acceptance criterion comes from","Prerequisites: prior level signed off, AHJ notified, central station on test, impairment logged, fire watch in place if the system goes out of service","Safety isolation: actuators and solenoids replaced by test lamps or simulators, agent cylinders disconnected, shutdown circuits verified before you trip anything","Steps with an expected result, an actual result, pass/fail and initials on every line","Failure modes: open and ground faults on releasing circuits, loss of primary power, loss of air, abort and manual release behavior","Return to normal — every isolation reversed and verified; the most dangerous outcome of a test is a system left disabled"],"requiresNumber":false,"codeRef":null,"explanation":"Purpose and criteria sources; prerequisites (prior level signed off, AHJ notified, central station on test, impairment logged, fire watch); safety isolation; steps with expected / actual / pass-fail / initials; failure modes; return to normal — every isolation reversed and verified."},"hook":"Six parts — and the script ends with every isolation reversed, not with the last pass.","source":"Data center commissioning language › Script development — what a good fire FPT script contains.","par":90,"confirmInEdition":false},{"id":"C3-scn-02","topicId":"C3","type":"scenario","prompt":"Which failure modes does a releasing-system FPT script have to exercise?","interviewerPhrasing":"What failure modes do you put in a releasing script?","answer":{"beats":["Open faults on the releasing circuits","Ground faults on the releasing circuits","Loss of primary power","Loss of air","Abort behavior","Manual release behavior"],"requiresNumber":false,"codeRef":null,"explanation":"Failure modes: open and ground faults on releasing circuits, loss of primary power, loss of air, abort and manual release behavior — each with an expected result and a line in the script."},"hook":"Open, ground, no power, no air, abort, by hand — six ways to break it on purpose.","source":"Data center commissioning language › Script development — what a good fire FPT script contains.","par":75,"confirmInEdition":false},{"id":"C4-ord-01","topicId":"C4","type":"order","prompt":"Order the data hall IST fire scenario, first step first.","answer":{"steps":["Halls at full load-bank heat on normal power","ASD Fire 1 in the hall","ASD Fire 2 or a second detector","Pre-action valve trips; the inspector's test simulates a fused head","Verify notification, central station, valve trip and water delivery time, BMS / EPMS responses, cooling stays up","Drop utility mid-event","Fire alarm on secondary power, pumps on generator, controllers transfer","Restore and verify every isolation reversed"],"codeRef":null,"explanation":"Load-bank heat on normal power → Fire 1 → Fire 2 or a second detector → valve trips, fused head simulated → verify every response and that cooling stays up → drop utility → fire alarm on secondary power, pumps on generator, controllers transfer → restore and verify every isolation reversed."},"hook":"Load, Fire 1, Fire 2, trip, verify, drop utility, ride it through, restore.","source":"Likely questions and day-of checklist › Commissioning technical (the 35%)","par":60,"confirmInEdition":false},{"id":"C4-mat-01","topicId":"C4","type":"matrix","prompt":"Data Hall 1 IST matrix: for each input, does each output happen (●), must it not happen (—), or is it per BOD?","interviewerPhrasing":"Turn this IST matrix into test steps — which outputs must not happen?","answer":{"grid":{"inputs":["ASD Alert / Action, Hall 1","ASD Fire 1, Hall 1","ASD Fire 2 or 2nd detector, Hall 1","Pre-action waterflow, Hall 1"],"outputs":["Building alarm","Central station","Release / trip","HVAC and dampers"],"cells":[["—","—","—","—"],["●","●","—","per BOD"],["●","●","●","per BOD"],["●","●","—","per BOD"]],"notes":[["","","",""],["","","","Per BOD — halls often keep cooling running"],["","","Pre-action solenoid (valve trips only on loss of air)","Per BOD"],["","","","Per BOD"]]},"codeRef":null,"explanation":"ASD Alert / Action is an Ops alert only; Fire 1 alarms and reports but releases nothing; Fire 2 or a second detector opens the pre-action solenoid — the valve trips only on loss of air. Example only — the BOD decides every cell."},"hook":"Fire 1 talks, Fire 2 opens the solenoid, loss of air lets the water in.","source":"Data center commissioning language › IST matrix — the document the posting says you'll review.","par":75,"confirmInEdition":false},{"id":"C4-mat-02","topicId":"C4","type":"matrix","prompt":"Three more rows of the example IST matrix: for each input, which outputs happen (●), must not happen (—), are per BOD, or come in as a supervisory?","interviewerPhrasing":"Which of these inputs should NOT put the building into alarm?","answer":{"grid":{"inputs":["Clean agent release, electrical room","Duct smoke detector, AHU","Li-ion off-gas, UPS room"],"outputs":["Building alarm","Central station","Release / trip","HVAC and dampers","BMS / EPMS"],"options":["●","—","per BOD","Supervisory"],"cells":[["●","●","●","●","per BOD"],["Supervisory","Supervisory","—","●","●"],["—","—","●","●","●"]],"notes":[["","","Agent","Room HVAC off, dampers close","Power-down per BOD"],["","","","AHU off",""],["","","BMS trips the string","Exhaust on",""]]},"codeRef":null,"explanation":"Clean agent release: building alarm, central station, agent, room HVAC off and dampers closed, power-down per BOD. Duct smoke detector: supervisory to the panel and central station, AHU off, BMS. Li-ion off-gas: no building alarm — the BMS trips the string, exhaust on, BMS point. Example only — the BOD decides every cell."},"hook":"Agent kills the room's air, duct smoke only whispers (supervisory), off-gas goes to the BMS, not the horns.","source":"Data center commissioning language › IST matrix — the document the posting says you'll review.","par":90,"confirmInEdition":false},{"id":"C4-mat-03","topicId":"C4","type":"matrix","prompt":"Elevator and utility-failure rows of the example IST matrix: what happens (●), what must not (—), what is per BOD — and where does a utility failure come in only as Trouble?","answer":{"grid":{"inputs":["Elevator lobby or machine room detector","Utility failure"],"outputs":["Building alarm","Central station","Release / trip","HVAC and dampers","BMS / EPMS","Elevator"],"cells":[["●","●","●","—","●","●"],["—","Trouble","—","●","●","—"]],"notes":[["","","Shunt trip (machine room heat)","","","Recall"],["","Trouble if a panel loses AC","","Smoke control fans restart","",""]],"options":["●","—","per BOD","Trouble"]},"codeRef":null,"explanation":"Elevator lobby or machine room detector: alarm, central station, recall, shunt trip on the machine room heat, BMS — no HVAC action. Utility failure: no alarm and no release; central station gets a trouble if a panel loses AC; smoke control fans restart; BMS / EPMS sees it."},"hook":"Lobby smoke recalls the car, machine-room heat trips the shunt; a utility failure is a trouble, never an alarm.","source":"Data center commissioning language › IST matrix — the document the posting says you'll review.","par":80,"confirmInEdition":false},{"id":"C4-def-01","topicId":"C4","type":"defect","prompt":"An IST script built from the matrix. One line skips half the job. Tap it.","answer":{"lines":["1. Input: ASD Fire 1, Hall 1 — expected: building alarm, central station, BMS alert.","2. Expected not to happen on Fire 1: pre-action release — no step needed, nothing to record.","3. Input: ASD Fire 2, Hall 1 — expected: pre-action solenoid opens; valve stays shut until loss of air.","4. HVAC and dampers on Fire 1: per BOD — hall cooling keeps running; record the BOD section.","5. Input: pre-action waterflow, Hall 1 — expected: building alarm, central station, BMS.","6. Input: duct smoke detector, AHU — expected: supervisory at the panel and central station; AHU off.","7. Return to normal after each scenario: every isolation reversed and verified."],"defectIndex":1,"codeRef":null,"explanation":"Line 2 — the blank cells get tested too: proving an output does not happen is half the job, so “no release on Fire 1” is a step with an expected and an actual result."},"hook":"A blank cell is a test step with the word “no” in it.","source":"Data center commissioning language › IST matrix — the document the posting says you'll review.","par":45,"confirmInEdition":false},{"id":"C4-scn-01","topicId":"C4","type":"scenario","prompt":"Write the IST fire scenario for a data hall.","interviewerPhrasing":"Write the IST fire scenario for a data hall.","answer":{"beats":["Halls at full load-bank heat on normal power","ASD Fire 1, then Fire 2 or a second detector","Pre-action valve trips; the inspector's test simulates a fused head","Verify notification, central station, valve trip and water delivery time, BMS / EPMS responses — cooling stays up","Drop utility mid-event: fire alarm on secondary power, pumps on generator, controllers transfer","Restore and verify every isolation reversed"],"requiresNumber":true,"codeRef":null,"explanation":"Halls at full load-bank heat on normal power → ASD Fire 1, then Fire 2 or a second detector → pre-action valve trips, inspector's test simulates a fused head → verify notification, central station, valve trip and water delivery time, BMS / EPMS responses, cooling stays up → drop utility mid-event → restore and verify every isolation reversed."},"hook":"Heat, smoke, smoke, water, check, kill the power, put it all back.","source":"Likely questions and day-of checklist › Commissioning technical (the 35%)","par":120,"confirmInEdition":false},{"id":"C4-scn-02","topicId":"C4","type":"scenario","prompt":"You're handed an IST matrix. How do you turn it into test steps?","interviewerPhrasing":"What do you do with the blank cells in an IST matrix?","answer":{"beats":["Every input against every output, with the expected state","Each filled cell becomes a test step","The blank cells get tested too — proving an output does not happen is half the job","Example only: the BOD decides every cell"],"requiresNumber":false,"codeRef":null,"explanation":"Every input against every output with the expected state; each filled cell becomes a test step, and the blank cells get tested too, because proving an output does not happen is half the job. The BOD decides every cell."},"hook":"Filled cells are steps; blank cells are steps too — “no water” has to be proven.","source":"Data center commissioning language › IST matrix — the document the posting says you'll review.","par":90,"confirmInEdition":false},{"id":"C5-num-01","topicId":"C5","type":"number","prompt":"One voice on witness day: ___ run the test, ___ execute, ___ observe.","answer":{"fields":[{"label":"runs the test","value":"you","aliases":["me","i","the cx engineer","cx","commissioning","the commissioning engineer"]},{"label":"executes","value":"contractors","aliases":["contractor","the contractors","subs","the subs","the contractor"]},{"label":"observes","value":"AHJ","aliases":["the ahj","the inspector","inspector","ahj observes"]}],"codeRef":null,"explanation":"One voice: you run the test, contractors execute, the AHJ observes. Log every AHJ comment on the issues log on the spot."},"hook":"One voice: you run it, they execute, the AHJ watches.","source":"Data center commissioning language › Running an AHJ witness test","par":25,"confirmInEdition":false},{"id":"C5-ord-01","topicId":"C5","type":"order","prompt":"Running an AHJ witness test: put the guide's five moves in order, first to last.","answer":{"steps":["Pre-test the whole script first — the witness test repeats a test you've already passed","Send the script ahead; agree the witness points and sample size before the day","One voice: you run the test, contractors execute, the AHJ observes","Log every AHJ comment on the issues log on the spot; cite the section, resolve after","Leave with the signed acceptance and any TCO conditions in writing"],"codeRef":null,"explanation":"Pre-test the whole script → send it ahead and agree witness points and sample size → one voice on the day → every comment on the issues log on the spot, no code arguments in the room → leave with the signed acceptance and any temporary certificate of occupancy conditions in writing."},"hook":"Rehearse, send, one voice, log it, sign it.","source":"Data center commissioning language › Running an AHJ witness test","par":50,"confirmInEdition":false},{"id":"C5-def-01","topicId":"C5","type":"defect","prompt":"A witness-day plan. One line breaks the first rule of AHJ tests. Tap it.","answer":{"lines":["1. Script sent to the AHJ ahead of time; witness points and sample size agreed in writing.","2. Full script pre-tested by the Cx team; every step passed.","3. Witness day: the Cx lead runs the test; contractors execute; the AHJ observes.","4. The stair pressurization door-force step is run for the first time with the AHJ present, to save a day.","5. AHJ comments are logged on the issues log as they are made.","6. Code disagreements: cite the section, resolve after the test.","7. Close: signed acceptance and TCO conditions collected in writing."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — pre-test the whole script first; the witness test should repeat a test you've already passed."},"hook":"Nothing happens for the first time in front of the AHJ.","source":"Data center commissioning language › Running an AHJ witness test","par":40,"confirmInEdition":false},{"id":"C5-def-02","topicId":"C5","type":"defect","prompt":"Witness-test notes. One line is how you lose the room. Tap it.","answer":{"lines":["1. Prerequisites: L4 pre-test complete and passed; central station on test; AHJ scheduled.","2. Script and witness points sent ahead; sample size agreed before the day.","3. One voice: the commissioning engineer runs the test, contractors execute.","4. Each AHJ comment entered on the issues log on the spot, with an owner.","5. A code question on the tamper timing is argued to a conclusion in the riser room before moving on.","6. Signed acceptance obtained before leaving.","7. TCO conditions recorded in writing on the acceptance."],"defectIndex":4,"codeRef":null,"explanation":"Line 5 — don't argue code in the room: cite the section and resolve it after; the comment goes on the issues log on the spot."},"hook":"Cite, log, move on — the riser room is not a courtroom.","source":"Data center commissioning language › Running an AHJ witness test","par":40,"confirmInEdition":false},{"id":"C5-scn-01","topicId":"C5","type":"scenario","prompt":"How do you run an AHJ witness test?","interviewerPhrasing":"Tell me how you'd run an AHJ witness test on a new data hall.","answer":{"beats":["Pre-test the whole script first — the witness test should repeat a test you've already passed","Send the script ahead; agree the witness points and sample size before the day","One voice: you run the test, contractors execute, the AHJ observes","Log every AHJ comment on the issues log on the spot","Don't argue code in the room — cite the section and resolve it after","Leave with the signed acceptance and any conditions on a temporary certificate of occupancy in writing"],"requiresNumber":false,"codeRef":null,"explanation":"Pre-test the whole script first; send it ahead and agree witness points and sample size; one voice on the day; every comment on the issues log on the spot, code questions resolved after; leave with the signed acceptance and any TCO conditions in writing."},"hook":"A witness test is a rerun: rehearsed, pre-agreed, one voice, logged, signed.","source":"Data center commissioning language › Running an AHJ witness test","par":90,"confirmInEdition":false},{"id":"C5-scn-02","topicId":"C5","type":"scenario","prompt":"The AHJ challenges a code point in the middle of the witness test. What do you do?","interviewerPhrasing":"The inspector disagrees with you on a section number halfway through the test. Then what?","answer":{"beats":["Log the comment on the issues log on the spot","Don't argue code in the room","Cite the section and resolve it after the test","Still leave with the signed acceptance and any conditions in writing"],"requiresNumber":false,"codeRef":null,"explanation":"Log every AHJ comment on the issues log on the spot. Don't argue code in the room — cite the section and resolve it after. Leave with the signed acceptance and any conditions on a temporary certificate of occupancy in writing."},"hook":"Log it, cite it, settle it later — never in the room.","source":"Data center commissioning language › Running an AHJ witness test","par":75,"confirmInEdition":false},{"id":"C5-scn-03","topicId":"C5","type":"scenario","prompt":"What do you walk out of an AHJ witness test with?","interviewerPhrasing":"What's in your hand when you leave the witness test?","answer":{"beats":["The signed acceptance","Any conditions on a temporary certificate of occupancy, in writing","Every AHJ comment already on the issues log"],"requiresNumber":false,"codeRef":null,"explanation":"Leave with the signed acceptance and any conditions on a temporary certificate of occupancy in writing; every AHJ comment went on the issues log on the spot."},"hook":"Signature, TCO conditions on paper, comments on the log — nothing verbal.","source":"Data center commissioning language › Running an AHJ witness test","par":60,"confirmInEdition":false},{"id":"C6-ord-01","topicId":"C6","type":"order","prompt":"Load banks and ASD: put the fire protection moves in the order they happen.","answer":{"steps":["Agree thresholds and fire watch with the Cx lead in advance","Load banks run: new banks burn off coatings and can drive ASD into Alert or Action","Load banks leave","Re-run the ASD learn on clean air with real airflow"],"codeRef":null,"explanation":"Agree thresholds and fire watch with the Cx lead before the banks start; expect Alert or Action from burn-off; after the load banks leave, re-run the ASD learn on clean air with real airflow."},"hook":"Agree first, burn off, pull out, relearn.","source":"Data center commissioning language › Load bank strategy — the fire protection angle.","par":40,"confirmInEdition":false},{"id":"C6-def-01","topicId":"C6","type":"defect","prompt":"A load bank test plan. One line is exactly what the guide says never to do. Tap it.","answer":{"lines":["1. Load bank test, Hall 2: rack and air-heater load banks simulate IT heat for the cooling test.","2. Thresholds for Alert and Action agreed with the Cx lead before the banks start.","3. Fire watch posted for the burn-off period; temporary cabling logged as added fuel load.","4. Hall 2 ASD detectors isolated at the panel for the duration so burn-off smoke can't trip an alarm.","5. Alert and Action events during burn-off recorded with time and level.","6. After the load banks leave: ASD learn re-run on clean air with real airflow.","7. Return to normal: thresholds verified, fire watch stood down, impairment closed."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — agree thresholds and fire watch with the Cx lead in advance; never just disable a hall."},"hook":"Thresholds and a fire watch, not a disabled hall.","source":"Data center commissioning language › Load bank strategy — the fire protection angle.","par":40,"confirmInEdition":false},{"id":"C6-num-01","topicId":"C6","type":"number","prompt":"New load banks burn off coatings and can drive ASD into ___ or ___. A learn done in construction dust sets a ___ baseline.","answer":{"fields":[{"label":"ASD level 1","value":"Alert","aliases":["alert level","alerts"]},{"label":"ASD level 2","value":"Action","aliases":["action level","actions"]},{"label":"a … baseline","value":"desensitized","aliases":["desensitised","desensitized baseline","dirty","a dirty baseline"]}],"codeRef":null,"explanation":"New load banks burn off coatings and can drive ASD into Alert or Action; a learn done in construction dust sets a desensitized baseline, so re-run the learn on clean air with real airflow after they leave."},"hook":"Alert, Action, and a learn in the dust that leaves the hall half-deaf.","source":"Data center commissioning language › Load bank strategy — the fire protection angle.","par":30,"confirmInEdition":false},{"id":"C6-scn-01","topicId":"C6","type":"scenario","prompt":"Load banks are coming into Hall 2 next week. What's the fire protection plan?","interviewerPhrasing":"How do you handle ASD while the load banks run?","answer":{"beats":["New load banks burn off coatings and can drive ASD into Alert or Action","Agree thresholds and fire watch with the Cx lead in advance","Never just disable a hall","Temporary cabling adds fuel load","After load banks leave, re-run the ASD learn on clean air with real airflow"],"requiresNumber":false,"codeRef":null,"explanation":"New load banks burn off coatings and can drive ASD into Alert or Action — agree thresholds and fire watch with the Cx lead in advance, never just disable a hall; temporary cabling adds fuel load; after load banks leave, re-run the ASD learn on clean air with real airflow."},"hook":"Burn-off smokes, cabling burns — agree the thresholds, post the watch, relearn after.","source":"Data center commissioning language › Load bank strategy — the fire protection angle.","par":90,"confirmInEdition":false},{"id":"C6-scn-02","topicId":"C6","type":"scenario","prompt":"Why re-run the ASD learn after the load banks leave?","answer":{"beats":["A learn done in construction dust sets a desensitized baseline","Re-run it on clean air","…with real airflow"],"requiresNumber":false,"codeRef":null,"explanation":"After load banks leave, re-run the ASD learn on clean air with real airflow; a learn done in construction dust sets a desensitized baseline."},"hook":"A dusty learn is a deaf detector — relearn on clean air with the fans running.","source":"Data center commissioning language › Load bank strategy — the fire protection angle.","par":60,"confirmInEdition":false},{"id":"C7-num-01","topicId":"C7","type":"number","prompt":"Which standard goes with each turnover document? Record of Completion: NFPA ___. Contractor's Material and Test Certificates: NFPA ___ (sprinkler) and NFPA ___ (underground). Pump acceptance report: NFPA ___. Clean agent acceptance with door fan report: NFPA ___.","answer":{"fields":[{"label":"Record of Completion, NFPA","value":72},{"label":"Material and Test Certificates (sprinkler), NFPA","value":13},{"label":"Material and Test Certificates (underground), NFPA","value":24},{"label":"pump acceptance report, NFPA","value":20},{"label":"clean agent acceptance with door fan report, NFPA","value":2001}],"codeRef":null,"explanation":"Record of Completion (NFPA 72), Contractor's Material and Test Certificates (NFPA 13 / 24), pump acceptance report (NFPA 20), clean agent acceptance with door fan report (NFPA 2001) — plus battery calcs, program backups, spares and recharge plan, ITM schedule in the CMMS, impairment procedure and recorded Ops training."},"hook":"72 · 13/24 · 20 · 2001 — the paper that proves the campus.","source":"Data center commissioning language › Issues log, punch and turnover.","par":40,"confirmInEdition":false},{"id":"C7-num-02","topicId":"C7","type":"number","prompt":"Severity on the issues log is ranked with ___ first. Anything non-life-safety carried into operations needs a documented ___.","answer":{"fields":[{"label":"… first","value":"life safety","aliases":["life-safety","life safety first","life safety issues"]},{"label":"a documented …","value":"risk acceptance","aliases":["documented risk acceptance","risk acceptance form","signed risk acceptance","risk-acceptance"]}],"codeRef":null,"explanation":"Severity: life safety first. Life-safety issues close before turnover; anything else carried into operations needs a documented risk acceptance."},"hook":"Life safety first; everything else that stays open gets a signature.","source":"Data center commissioning language › Issues log, punch and turnover.","par":25,"confirmInEdition":false},{"id":"C7-def-01","topicId":"C7","type":"defect","prompt":"A closeout review. One line carries the wrong thing into operations. Tap it.","answer":{"lines":["1. Issue: the Hall 1 pre-action valve's delivery time is over the limit — severity life safety, owner sprinkler contractor, due before turnover.","2. Each entry carries ID, system, level found, severity, owner, due date and closure evidence.","3. Severity ranking: life safety first.","4. The delivery-time issue is reclassified to punch and carried into operations under a risk acceptance so the TCO date holds.","5. Non-life-safety items carried into operations get a documented risk acceptance.","6. Turnover package: Record of Completion, Material and Test Certificates, pump acceptance report, door fan report, program backups.","7. ITM schedule loaded into the CMMS; impairment procedure issued; Ops training recorded."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — life-safety issues close before turnover; only non-life-safety items carried into operations get a documented risk acceptance."},"hook":"A risk acceptance covers punch, never a life-safety failure.","source":"Data center commissioning language › Issues log, punch and turnover.","par":45,"confirmInEdition":false},{"id":"C7-scn-01","topicId":"C7","type":"scenario","prompt":"What does every entry on your issues log carry, and what has to close before turnover?","interviewerPhrasing":"How do you run the issues log through to turnover?","answer":{"beats":["Every finding gets an ID, system and level found","Severity — life safety first","Owner and due date","Closure evidence","Life-safety issues close before turnover","Anything else carried into operations needs a documented risk acceptance"],"requiresNumber":false,"codeRef":null,"explanation":"Every finding gets an ID, system, level found, severity (life safety first), owner, due date and closure evidence. Life-safety issues close before turnover; anything else carried into operations needs a documented risk acceptance."},"hook":"ID, system, level, severity, owner, due, evidence — life safety closes, the rest gets a signed risk acceptance.","source":"Data center commissioning language › Issues log, punch and turnover.","par":90,"confirmInEdition":false},{"id":"C7-scn-02","topicId":"C7","type":"scenario","prompt":"Tell me about a disagreement with a contractor or another trade during testing.","interviewerPhrasing":"Tell me about a disagreement with a contractor or another trade during testing.","answer":{"beats":["Facts in the script","Criteria from the BOD","Escalate on the issues log","Never in the hallway"],"requiresNumber":false,"codeRef":null,"explanation":"Facts in the script, criteria from the BOD, escalate on the issues log, never in the hallway."},"hook":"Script for facts, BOD for criteria, issues log for the fight — not the hallway.","source":"Likely questions and day-of checklist › Values and judgment (the 65%)","par":120,"confirmInEdition":false},{"id":"C7-scn-03","topicId":"C7","type":"scenario","prompt":"What's in your turnover package?","interviewerPhrasing":"What do you hand Ops at turnover?","answer":{"beats":["Record of Completion (NFPA 72)","Contractor's Material and Test Certificates (NFPA 13 / 24)","Pump acceptance report (NFPA 20)","Clean agent acceptance with door fan report (NFPA 2001)","Battery calcs and program backups","Spare sprinklers and agent recharge plan","ITM schedule loaded into the CMMS, impairment procedure, and recorded Ops training"],"requiresNumber":true,"codeRef":null,"explanation":"Record of Completion (NFPA 72), Contractor's Material and Test Certificates (NFPA 13 / 24), pump acceptance report (NFPA 20), clean agent acceptance with door fan report (NFPA 2001), battery calcs, program backups, spare sprinklers and agent recharge plan, ITM schedule in the CMMS, impairment procedure, and recorded Ops training."},"hook":"72 · 13/24 · 20 · 2001, then calcs, backups, spares, the CMMS, impairment, training.","source":"Data center commissioning language › Issues log, punch and turnover.","par":90,"confirmInEdition":false},{"id":"S1-ord-01","topicId":"S1","type":"order","prompt":"L3 — prove the pipe, then into L4. Put the steps in order.","answer":{"steps":["Witness the underground flush before it connects to the riser","Then both hydros — underground and aboveground","Signed certificates for underground and aboveground","L4 — inspector’s test: time to alarm"],"codeRef":null,"explanation":"L3 — prove the pipe: witness the underground flush before it connects to the riser, then both hydros, then signed certificates for underground and aboveground. L4 — prove the system — opens with the inspector’s test: time to alarm."},"hook":"Flush it, squeeze it twice, sign twice — then time the alarm.","source":"Sprinkler and underground › Acceptance sequence","par":40,"confirmInEdition":false},{"id":"S1-def-01","topicId":"S1","type":"defect","prompt":"An underground flush script. One line gets the sequence wrong. Tap it.","answer":{"lines":["1. Prerequisites: underground complete; discharge path to a safe point ready; Cx engineer present to witness.","2. Flush flow set to the 10 ft/s table value for 8 in. pipe: 1,560 gpm.","3. Flush witnessed and recorded on the Contractor's Material and Test Certificate (underground).","4. Underground connected to the riser first so the flush can discharge through the main drain.","5. Flow verified at the outlet; discharge observed.","6. Underground hydro follows the flush: 200 psi for 2 h.","7. Certificates signed for the underground before the aboveground hydro."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — witness the underground flush before it connects to the riser, then both hydros."},"hook":"The dirt leaves through the open end, never through the riser.","source":"Sprinkler and underground › Acceptance sequence","par":40,"confirmInEdition":false},{"id":"S1-num-01","topicId":"S1","type":"number","prompt":"Underground flush at the 10 ft/s table flow: ___ gpm for 6 in. pipe, ___ gpm for 8 in. pipe, and the table.","interviewerPhrasing":"What flow do you need to see on a 6-inch underground flush?","answer":{"fields":[{"label":"6 in., gpm","value":880},{"label":"8 in., gpm","value":1560}],"codeRef":"NFPA 24 Table 10.10.2.1.3","codeRefAliases":["24 10.10.2.1.3","NFPA 24 10.10.2.1.3","Table 10.10.2.1.3","10.10.2.1.3"],"explanation":"Not less than one of: system demand including hose; the 10 ft/s table flow (4 in. 390 · 6 in. 880 · 8 in. 1,560 · 10 in. 2,440 · 12 in. 3,520 gpm); or the maximum flow available (NFPA 24 Table 10.10.2.1.3)."},"hook":"6 → 880, 8 → 1,560: the flush runs at 10 ft/s.","source":"Sprinkler and underground › table","par":30,"confirmInEdition":false},{"id":"S1-num-02","topicId":"S1","type":"number","prompt":"Underground flush at the table flow: ___ gpm for 4 in., ___ gpm for 10 in., ___ gpm for 12 in. — and the velocity the table is built on, ___ ft/s. Which table?","answer":{"fields":[{"label":"4 in., gpm","value":390},{"label":"10 in., gpm","value":2440},{"label":"12 in., gpm","value":3520},{"label":"table velocity, ft/s","value":10}],"codeRef":"NFPA 24 Table 10.10.2.1.3","codeRefAliases":["24 10.10.2.1.3","NFPA 24 10.10.2.1.3","Table 10.10.2.1.3","10.10.2.1.3"],"explanation":"4 in. 390 · 6 in. 880 · 8 in. 1,560 · 10 in. 2,440 · 12 in. 3,520 gpm at 10 ft/s (NFPA 24 Table 10.10.2.1.3) — or system demand including hose, or the maximum flow available."},"hook":"390 · 880 · 1,560 · 2,440 · 3,520 — ten feet a second through 4 to 12 inches.","source":"Sprinkler and underground › table","par":35,"confirmInEdition":false},{"id":"S1-scn-01","topicId":"S1","type":"scenario","prompt":"What flow do you need for the underground flush, and when do you witness it?","interviewerPhrasing":"How do you decide the flush flow on the underground?","answer":{"beats":["Not less than one of: system demand including hose","…or the 10 ft/s table flow (NFPA 24 Table 10.10.2.1.3)","…or the maximum flow available","Witness the flush at L3, before the underground connects to the riser — then both hydros","Signed Contractor's Material and Test Certificate for the underground"],"requiresNumber":true,"codeRef":"NFPA 24 Table 10.10.2.1.3","codeRefAliases":["24 10.10.2.1.3","NFPA 24 10.10.2.1.3","Table 10.10.2.1.3","10.10.2.1.3"],"explanation":"Not less than one of: system demand including hose; the 10 ft/s table flow; or the maximum flow available (NFPA 24 Table 10.10.2.1.3). Witness the underground flush before it connects to the riser, then both hydros."},"hook":"Demand-plus-hose, the 10 ft/s table, or all you've got — and watch it before it meets the riser.","source":"Sprinkler and underground › Acceptance sequence","par":90,"confirmInEdition":false},{"id":"S2-num-01","topicId":"S2","type":"number","prompt":"Aboveground hydro: test pressure, duration, how far above working pressure once working pressure is high, the working pressure where that rule starts, and the section.","interviewerPhrasing":"What are the pass criteria on the aboveground hydro?","answer":{"fields":[{"label":"test psi","value":200},{"label":"hours","value":2},{"label":"psi above working pressure","value":50},{"label":"rule starts above, psi","value":150}],"codeRef":"NFPA 13 §29.2.1","codeRefAliases":["13 29.2.1","NFPA 13 29.2.1","NFPA 13-2022 29.2.1","13 §29.2.1","29.2.1"],"explanation":"200 psi for 2 h, or 50 psi above working pressure where it exceeds 150 psi; no gauge drop and no visible leakage; on pump systems, set from pump shutoff pressure (NFPA 13-2022 §29.2.1)."},"hook":"200 for 2 — or 50 over once you're past 150.","source":"Sprinkler and underground › table","par":35,"confirmInEdition":false},{"id":"S2-num-02","topicId":"S2","type":"number","prompt":"Underground hydro: ___ psi, or ___ psi above static where static exceeds ___ psi, for ___ h. Which standard?","answer":{"fields":[{"label":"test psi","value":200},{"label":"psi above static","value":50},{"label":"where static exceeds, psi","value":150},{"label":"hours","value":2}],"codeRef":"NFPA 24","codeRefAliases":["24","NFPA-24","NFPA 24 underground"],"explanation":"200 psi, or 50 psi above static where static exceeds 150 psi, for 2 h; makeup allowance L = S·D·√P / 148,000 gph (NFPA 24)."},"hook":"Same 200-for-2 as above ground — but underground it's 50 over STATIC past 150.","source":"Sprinkler and underground › table","par":35,"confirmInEdition":false},{"id":"S2-num-03","topicId":"S2","type":"number","prompt":"Underground makeup allowance: L = S·D·√P divided by ___, with L in units of ___. Which standard?","answer":{"fields":[{"label":"divisor","value":148000},{"label":"units of L","value":"gph","aliases":["gallons per hour","gal/h","gal per hour","gal/hr","gallons/hour","gallons an hour"]}],"codeRef":"NFPA 24","codeRefAliases":["24","NFPA-24","NFPA 24 underground"],"explanation":"Makeup allowance L = S·D·√P / 148,000 gph on the underground hydro (NFPA 24)."},"hook":"S·D·root-P over 148,000 — the gallons an hour you're allowed to add.","source":"Sprinkler and underground › table","par":30,"confirmInEdition":false},{"id":"S2-def-01","topicId":"S2","type":"defect","prompt":"Aboveground hydro on a pump system. One line sets the test wrong. Tap it.","answer":{"lines":["1. Prerequisites: underground flush witnessed and certificate signed; aboveground piping complete; gauges calibrated.","2. Test pressure: 200 psi, or 50 psi above working pressure where working pressure exceeds 150 psi.","3. On this pump system the working pressure is taken from the jockey pump stop pressure.","4. Duration: 2 h.","5. Pass: no gauge drop and no visible leakage.","6. Record on the Contractor's Material and Test Certificate (aboveground).","7. Return to normal: test pressure released, system at normal supply pressure, drains closed."],"defectIndex":2,"codeRef":null,"explanation":"Line 3 — on pump systems the aboveground hydro is set from pump shutoff pressure (NFPA 13-2022 §29.2.1)."},"hook":"Pump job: the hydro starts from shutoff, not the jockey.","source":"Sprinkler and underground › table","par":40,"confirmInEdition":false},{"id":"S2-def-02","topicId":"S2","type":"defect","prompt":"Underground hydro script. One number is wrong. Tap the line.","answer":{"lines":["1. Underground flush witnessed before connection to the riser; certificate signed.","2. Underground hydro: 200 psi, or 50 psi above static where static exceeds 150 psi.","3. Duration: 1 h, gauge read at the start and the end.","4. Makeup water measured and compared with L = S·D·√P / 148,000 gph.","5. Pass recorded on the underground Contractor's Material and Test Certificate.","6. Aboveground hydro follows: 200 psi for 2 h, no gauge drop, no visible leakage."],"defectIndex":2,"codeRef":null,"explanation":"Line 3 — the underground hydro runs 2 h (200 psi, or 50 psi above static where static exceeds 150 psi), NFPA 24."},"hook":"Two hours, above ground and below.","source":"Sprinkler and underground › table","par":35,"confirmInEdition":false},{"id":"S2-scn-01","topicId":"S2","type":"scenario","prompt":"What are the pass criteria on the aboveground hydro, and what changes on a pump system?","interviewerPhrasing":"Walk me through the aboveground hydro — pressure, time, and what pass looks like.","answer":{"beats":["200 psi for 2 h","…or 50 psi above working pressure where it exceeds 150 psi","No gauge drop","No visible leakage","On pump systems, set from pump shutoff pressure","NFPA 13-2022 §29.2.1 — acceptance is Chapter 29 in 2022, Chapter 28 in 2019"],"requiresNumber":true,"codeRef":"NFPA 13-2022 §29.2.1","codeRefAliases":["13 29.2.1","NFPA 13 29.2.1","13 §29.2.1","29.2.1","NFPA 13 §29.2.1"],"explanation":"200 psi for 2 h, or 50 psi above working pressure where it exceeds 150 psi; no gauge drop and no visible leakage; on pump systems, set from pump shutoff pressure (NFPA 13-2022 §29.2.1)."},"hook":"200 for 2, no drop, no drip — and on a pump job, start from shutoff.","source":"Sprinkler and underground › table","par":90,"confirmInEdition":false},{"id":"S2-scn-02","topicId":"S2","type":"scenario","prompt":"Underground hydro versus aboveground hydro — what's the same and what's different?","interviewerPhrasing":"How does the underground hydro differ from the aboveground one?","answer":{"beats":["Both: 200 psi for 2 h","Underground: 50 psi above static where static exceeds 150 psi (NFPA 24)","Underground: makeup allowance L = S·D·√P / 148,000 gph","Aboveground: 50 psi above working pressure where it exceeds 150 psi (NFPA 13-2022 §29.2.1)","Aboveground: no gauge drop and no visible leakage","On pump systems the aboveground test is set from pump shutoff pressure"],"requiresNumber":true,"codeRef":null,"explanation":"Both run 200 psi for 2 h. Underground: 50 psi above static where static exceeds 150 psi, with a makeup allowance of L = S·D·√P / 148,000 gph (NFPA 24). Aboveground: 50 psi above working pressure where it exceeds 150 psi, no gauge drop and no visible leakage, set from pump shutoff pressure on pump systems (NFPA 13-2022 §29.2.1)."},"hook":"Underground gets an allowance (148,000); aboveground gets none — no drop, no leak.","source":"Sprinkler and underground › table","par":90,"confirmInEdition":false},{"id":"S3-def-01","topicId":"S3","type":"defect","prompt":"Inspector's test script. One line has the alarm limits backwards. Tap it.","answer":{"lines":["1. Prerequisites: hydro passed and certificates signed; central station on test; FACP programmed.","2. Open the inspector's test connection (one-sprinkler flow).","3. Expected: waterflow initiating device operates within 90 s of flow.","4. Expected: electrical alarm within 5 min; mechanical alarm within 100 s.","5. Close the inspector's test; verify the alarm clears and the panel resets.","6. Tamper: close the control valve; expected signal within two turns of the handwheel or one-fifth of stem travel.","7. Reopen the valve fully; tamper normal; central station off test; verified."],"defectIndex":3,"codeRef":null,"explanation":"Line 4 — electrical alarm within 100 s and mechanical within 5 min (NFPA 13 §7.7); initiating device within 90 s (NFPA 72)."},"hook":"Electric is fast (100 s); the water gong gets the five minutes.","source":"Sprinkler and underground › table","par":40,"confirmInEdition":false},{"id":"S3-num-01","topicId":"S3","type":"number","prompt":"Waterflow alarm: initiating device within ___ s of one-sprinkler flow; electrical alarm within ___ s; mechanical within ___ min; a valve tamper switch reports within ___ turns of the handwheel. And the NFPA 13 section for the alarm times.","interviewerPhrasing":"How fast does the waterflow alarm have to come in, and when does a tamper switch have to report?","answer":{"fields":[{"label":"initiating device, s","value":90},{"label":"electrical alarm, s","value":100},{"label":"mechanical alarm, min","value":5},{"label":"tamper, handwheel turns","value":2}],"codeRef":"NFPA 13 §7.7","codeRefAliases":["13 7.7","NFPA 13 7.7","13 §7.7","7.7"],"explanation":"Initiating device within 90 s of one-sprinkler flow (NFPA 72); electrical alarm within 100 s and mechanical within 5 min (NFPA 13 §7.7). Tamper switches report within two turns of the handwheel or one-fifth of stem travel."},"hook":"90 · 100 · 5 — then two turns and the tamper talks.","source":"Sprinkler and underground › table","par":35,"confirmInEdition":false},{"id":"S3-num-02","topicId":"S3","type":"number","prompt":"The waterflow initiating device has to operate within ___ s of one-sprinkler flow. Which standard sets that one?","answer":{"fields":[{"label":"seconds","value":90}],"codeRef":"NFPA 72","codeRefAliases":["72","NFPA-72","NFPA 72 waterflow"],"explanation":"Initiating device within 90 s of one-sprinkler flow is NFPA 72; the 100 s electrical and 5 min mechanical alarm limits are NFPA 13 §7.7."},"hook":"Ninety seconds is the fire alarm standard's number, not the sprinkler standard's.","source":"Sprinkler and underground › table","par":20,"confirmInEdition":false},{"id":"S3-num-03","topicId":"S3","type":"number","prompt":"A valve tamper switch has to report within ___ turns of the handwheel, or ___ of stem travel.","answer":{"fields":[{"label":"handwheel turns","value":2},{"label":"fraction of stem travel","value":"one-fifth","aliases":["1/5","fifth","a fifth","one fifth","20%","one-fifth of stem travel"]}],"codeRef":null,"explanation":"Valve tamper switches report within two turns of the handwheel or one-fifth of stem travel — proven at L4 with the inspector's test and main drain."},"hook":"Two turns or a fifth of the stem — the tamper can't wait for the valve to close.","source":"Sprinkler and underground › Acceptance sequence","par":25,"confirmInEdition":false},{"id":"S3-scn-01","topicId":"S3","type":"scenario","prompt":"How fast does the waterflow alarm have to come in, and when does a tamper switch have to report?","interviewerPhrasing":"How fast does the waterflow alarm have to come in, and when does a tamper switch have to report?","answer":{"beats":["Initiating device within 90 s of one-sprinkler flow (NFPA 72)","Electrical alarm within 100 s (NFPA 13 §7.7)","Mechanical alarm within 5 min","Tamper reports within two turns of the handwheel or one-fifth of stem travel","Proven at L4 with the inspector's test — time to alarm — and recorded"],"requiresNumber":true,"codeRef":"NFPA 13 §7.7","codeRefAliases":["13 7.7","NFPA 13 7.7","13 §7.7","7.7"],"explanation":"Initiating device within 90 s of one-sprinkler flow (NFPA 72); electrical alarm within 100 s and mechanical within 5 min (NFPA 13 §7.7); tamper within two turns of the handwheel or one-fifth of stem travel."},"hook":"90 to the switch, 100 to the horn, 5 minutes to the gong, 2 turns to the tamper.","source":"Sprinkler and underground › table","par":90,"confirmInEdition":false},{"id":"S3-scn-02","topicId":"S3","type":"scenario","prompt":"The inspector's test ran and the electrical alarm came in at 130 seconds. Pass or fail, and against what?","interviewerPhrasing":"Your inspector's test alarm took over two minutes. Is that a pass?","answer":{"beats":["Fail — the electrical alarm limit is 100 s (NFPA 13 §7.7)","The initiating device itself must operate within 90 s of one-sprinkler flow (NFPA 72)","The mechanical alarm is the one with 5 min","It's an L4 item: inspector's test, time to alarm, recorded on the script"],"requiresNumber":true,"codeRef":"NFPA 13 §7.7","codeRefAliases":["13 7.7","NFPA 13 7.7","13 §7.7","7.7"],"explanation":"Electrical alarm within 100 s and mechanical within 5 min (NFPA 13 §7.7); initiating device within 90 s of one-sprinkler flow (NFPA 72). 130 s fails the electrical limit."},"hook":"Past 100 seconds the horn is late; only the gong gets five minutes.","source":"Sprinkler and underground › table","par":75,"confirmInEdition":false},{"id":"S4-num-01","topicId":"S4","type":"number","prompt":"Main drain test at acceptance: record ___ and ___ pressure. Later, a reading more than ___% below acceptance has to be investigated. Which standard owns that baseline?","interviewerPhrasing":"What do you record on the main drain test, and why does Ops care?","answer":{"fields":[{"label":"first reading","value":"static","aliases":["static pressure","static psi","the static"]},{"label":"second reading","value":"residual","aliases":["residual pressure","residual psi","the residual"]},{"label":"investigate when more than, %","value":10}],"codeRef":"NFPA 25","codeRefAliases":["25","NFPA-25","NFPA 25 baseline"],"explanation":"Record static and residual — that's the NFPA 25 baseline you hand to Ops; a main drain reading more than 10% below acceptance has to be investigated, so record yours carefully."},"hook":"Static, residual, and the ten-percent line Ops will hold you to.","source":"Sprinkler and underground › Acceptance sequence","par":30,"confirmInEdition":false},{"id":"S4-num-02","topicId":"S4","type":"number","prompt":"The NFPA 25 baseline you're setting: dry and pre-action valves get a partial trip test every ___ year(s) and a full-flow trip test every ___ years; a main drain reading more than ___% below acceptance gets investigated. Standard?","answer":{"fields":[{"label":"partial trip test, every … year(s)","value":1},{"label":"full-flow trip test, every … years","value":3},{"label":"main drain, more than … % below acceptance","value":10}],"codeRef":"NFPA 25","codeRefAliases":["25","NFPA-25","NFPA 25 baseline"],"explanation":"Dry and pre-action valves: partial trip test every year, full-flow trip test every 3 years; a main drain reading more than 10% below acceptance has to be investigated (NFPA 25)."},"hook":"Partial yearly, full-flow on three, and ten percent is the alarm bell.","source":"Pre-action › Test-day details an interviewer will probe","par":30,"confirmInEdition":false},{"id":"S4-def-01","topicId":"S4","type":"defect","prompt":"Main drain test script. One line throws away half the baseline. Tap it.","answer":{"lines":["1. Prerequisites: hydro passed; control valve open; drain path to a safe discharge.","2. Record static pressure at the riser gauge with no flow.","3. Open the main drain fully; let the gauge settle.","4. Record the residual pressure while flowing.","5. Close the main drain slowly; confirm the gauge returns to static.","6. Enter the residual reading alone as the NFPA 25 baseline; the static is not needed for later comparison.","7. Baseline copied into the turnover package beside the pump baseline."],"defectIndex":5,"codeRef":null,"explanation":"Line 6 — record static and residual; that pair is the NFPA 25 baseline, and a later reading more than 10% below acceptance has to be investigated."},"hook":"Two numbers make a baseline; one makes a guess.","source":"Sprinkler and underground › Acceptance sequence","par":40,"confirmInEdition":false},{"id":"S4-scn-01","topicId":"S4","type":"scenario","prompt":"What is the main drain test for at acceptance?","interviewerPhrasing":"Why do you bother with a main drain test on a brand-new system?","answer":{"beats":["Record static and residual","That pair is the NFPA 25 baseline you hand to Ops","A later reading more than 10% below acceptance has to be investigated","The main drain and pump baselines go in the turnover package with the NFPA 25 schedule loaded into the CMMS"],"requiresNumber":true,"codeRef":"NFPA 25","codeRefAliases":["25","NFPA-25","NFPA 25 baseline"],"explanation":"Main drain test: record static and residual — that's the NFPA 25 baseline; a reading more than 10% below acceptance has to be investigated. The baselines go to Ops in the turnover package."},"hook":"You’re not testing the drain — you’re writing the number Ops compares against; more than 10% below it means investigate.","source":"Sprinkler and underground › Acceptance sequence","par":75,"confirmInEdition":false},{"id":"S4-scn-02","topicId":"S4","type":"scenario","prompt":"A year after turnover, Ops says the main drain residual is down from your baseline. What matters?","interviewerPhrasing":"Ops calls: the main drain reading dropped. What do you tell them?","answer":{"beats":["Compare against the acceptance baseline — the static and residual you recorded","More than 10% below acceptance has to be investigated (NFPA 25)","That's why you record the acceptance reading carefully"],"requiresNumber":true,"codeRef":"NFPA 25","codeRefAliases":["25","NFPA-25","NFPA 25 baseline"],"explanation":"A main drain reading more than 10% below acceptance has to be investigated — so the static and residual you recorded at acceptance are the reference."},"hook":"Ten percent under your number and somebody has to go look.","source":"Pre-action › Test-day details an interviewer will probe","par":60,"confirmInEdition":false},{"id":"S4-scn-03","topicId":"S4","type":"scenario","prompt":"Which baselines and records go to Ops at sprinkler turnover?","interviewerPhrasing":"What does the sprinkler turnover hand to the operations team?","answer":{"beats":["Certificates and as-builts","The calc","Main drain and pump baselines","Spare sprinklers","The NFPA 25 schedule loaded into the CMMS"],"requiresNumber":false,"codeRef":null,"explanation":"Turnover: certificates, as-builts, the calc, main drain and pump baselines, spare sprinklers, and the NFPA 25 schedule loaded into the CMMS."},"hook":"Paper, drawings, calc, two baselines, spares, and a schedule in the CMMS.","source":"Sprinkler and underground › Acceptance sequence","par":75,"confirmInEdition":false},{"id":"S5-def-01","topicId":"S5","type":"defect","prompt":"L2 sprinkler checklist. One count is wrong. Tap the line.","answer":{"lines":["1. L2 install vs design: sprinkler type, K-factor, temperature rating, orientation and coverage checked.","2. Obstructions from containment panels, cable tray, busway and ductwork reviewed.","3. Hangers and seismic bracing per design; FDC installed.","4. Hydraulic nameplate at the riser.","5. Spare sprinkler cabinet: 12 spares for a system above 1,000 sprinklers, with a wrench for each type.","6. L2 sign-off before the L3 flush and hydros."],"defectIndex":4,"codeRef":null,"explanation":"Line 5 — above 1,000 sprinklers the cabinet holds 24 spares (12 is the 300–1,000 count; 6 under 300)."},"hook":"Over a thousand heads means two dozen spares.","source":"Sprinkler and underground › Acceptance sequence","par":35,"confirmInEdition":false},{"id":"S5-num-01","topicId":"S5","type":"number","prompt":"Spare sprinkler cabinet: ___ spares under 300 sprinklers, ___ for 300–1,000, ___ above 1,000.","interviewerPhrasing":"How many spare sprinklers do you expect in the cabinet?","answer":{"fields":[{"label":"under 300 sprinklers","value":6},{"label":"300–1,000 sprinklers","value":12},{"label":"above 1,000 sprinklers","value":24}],"codeRef":null,"explanation":"Spare sprinkler cabinet: 6 spares under 300 sprinklers, 12 for 300–1,000, 24 above 1,000 — with a wrench for each type. Checked at L2."},"hook":"6 · 12 · 24 — the spares double as the system grows past 300 and 1,000.","source":"Sprinkler and underground › Acceptance sequence","par":25,"confirmInEdition":false},{"id":"S5-num-02","topicId":"S5","type":"number","prompt":"The spare cabinet steps up at ___ sprinklers and again at ___ sprinklers, and holds a ___ for each sprinkler type.","answer":{"fields":[{"label":"first threshold, sprinklers","value":300},{"label":"second threshold, sprinklers","value":1000},{"label":"one … for each type","value":"wrench","aliases":["a wrench","sprinkler wrench","wrenches"]}],"codeRef":null,"explanation":"6 spares under 300 sprinklers, 12 for 300–1,000, 24 above 1,000, with a wrench for each type."},"hook":"Break points at 300 and 1,000 — and a wrench for every head style.","source":"Sprinkler and underground › Acceptance sequence","par":25,"confirmInEdition":false},{"id":"S6-num-01","topicId":"S6","type":"number","prompt":"Backflow preventer: f
